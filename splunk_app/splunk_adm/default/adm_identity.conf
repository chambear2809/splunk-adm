[profile]
enabled = false
cluster = placeholder
environment = placeholder
scope = placeholder
producer_id = placeholder
interval_source = placeholder
span_source = placeholder
interval_index = adm_identity_intervals
span_index = adm_identity_spans
interval_sourcetype = adm:pod_ip_interval:v2
span_sourcetype = otel:traces
namespaces = placeholder

# Native observations remain opt-in. Profiles must attest exact source families,
# observer/domain authorities and their scopes; no wildcard or default scope.
# Frontends are bounded configured intent, never historical NAT/backend proof.
[network]
enabled = false
profiles_json = []
frontends_json = []

# Five-minute qualified graph summaries (ADM - Qualified graph rollup) in the
# version-2 summary index. Opt-in; see docs/DATA_LAYER.md. lateness is the
# accepted indexing delay (seconds) after a slice ends.
[summary]
enabled = false
index = adm_summary_v2
lateness = 90
