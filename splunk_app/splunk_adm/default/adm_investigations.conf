[persistence]
# No installed deployment is qualified by this local implementation.
# Single-head Enterprise only; source capture needs a separate opt-in below.
# Cloud and SHC are unsupported.
mode = disabled
platform = unqualified
# Requires separate local source/authorization qualification; never enables a schedule.
capture_mode = disabled

[capture_transport]
# Required for protected captures; missing trust leaves shared notes usable.
# Configure an exact HTTPS loopback management origin and its matching public CA.
management_uri = unconfigured
ca_file = unconfigured
