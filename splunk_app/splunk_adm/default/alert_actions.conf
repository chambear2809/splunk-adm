[adm_recovery]
# Automated assisted recovery is opt-in.  The action refuses to run unless
# enabled is also set in [recovery] in adm_recovery.conf.
is_custom = 1
payload_format = json
python.version = python3
python.required = 3.9,3.13
passSystemAuth = false
alert.execute.cmd = adm_recovery.py
maxtime = 25m
label = ADM automated assisted recovery
description = Administrator-only, opt-in recovery of missed ADM scheduler slots.

