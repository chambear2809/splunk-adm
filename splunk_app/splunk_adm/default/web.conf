[expose:adm_case_entries]
pattern = adm/investigations/cases/*/entries
methods = POST

[expose:adm_case_sharing]
pattern = adm/investigations/cases/*/share
methods = POST

[expose:adm_case_export]
pattern = adm/investigations/cases/*/export
methods = GET

[expose:adm_case_audit]
pattern = adm/investigations/cases/*/audit
methods = GET
