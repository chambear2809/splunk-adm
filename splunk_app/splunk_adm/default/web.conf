[expose:adm_deployment_settings]
pattern = adm/deployment-settings
methods = GET,POST

[expose:adm_macro_stanza_read]
pattern = configs/v1/conftypes/macros/stanzas:get
methods = POST

[expose:adm_case_capabilities]
pattern = adm/investigations/capabilities
methods = GET

[expose:adm_cases]
pattern = adm/investigations/cases
methods = GET,POST

[expose:adm_case_resources]
