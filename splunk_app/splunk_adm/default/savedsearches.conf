[ADM - Scheduler missed-slot alert]
description = Checks the four 5-minute builder/rollup targets (Identity builder, Service binding, Service backends, Conversation rollup) for missing scheduled slots strictly after each target's earliest visible scheduler__ success (reason=missed_slot), or one row without scheduled_time if no successful checkpoint exists (reason=no_successful_checkpoint). Disabled and unscheduled targets are excluded. Slots are checked after a 10-minute grace period (adm_missed_slot_grace), over the trailing adm_missed_slot_lookback (24h). A missed slot does not self-heal: continuous scheduling resumes on the next future slot without replaying the one that was missed, so a later healthy run does not mean the missed slot's data was processed. Shipped disabled; enabling it only raises a Splunk Triggered Alert when adm_health_missed_slots returns rows, it does not notify anyone by itself. Configure a notification action (email, webhook, etc.) in alert_actions.conf or the Alerts UI separately; this app ships no paging integration. Verified recovered slots are excluded; durable in-progress and uncertain claims remain visible, including while a target is paused. The separate adm_recovery action ships off and requires its own administrator opt-in. A firing alert is a signal to follow RECOVERY.md, not evidence that anything already recovered.
search = | `adm_health_missed_slots`
disabled = 1
enableSched = 1
cron_schedule = */5 * * * *
schedule_window = 0
realtime_schedule = 0
# 24-hour expected-slot lookback plus the preceding five-minute checkpoint.
# Keep in sync with adm_missed_slot_lookback when changing that macro.
dispatch.earliest_time = -1445m@m
dispatch.latest_time = now
dispatchAs = owner
is_visible = 1
counttype = number of events
relation = greater than
quantity = 0
alert_type = number of events
alert.severity = 4
alert.track = 1
# Separate opt-in; enabling detection does not enable recovery.
action.adm_recovery = 0

[ADM - Recovery abandoned-lease alert]
description = Administrator-only supervision of expired recovery claims on qualified standalone Splunk 10.6.0.5. Every expired target record is reported, including restored: successful recovery deletes its target record. Only recovered slot records are terminal. An incomplete paged read also raises an incident. Results create a tracked Splunk Triggered Alert; configure notifications separately. This search never changes claims or schedules and never retries or takes over recovery. Follow RECOVERY.md for manual reconciliation.
search = | `adm_kv_read_all(adm_recovery_state)` | where adm_page>=1 | appendpipe [| stats min(adm_complete) AS adm_complete | where adm_complete=0 | eval _key="supervisor_incomplete_read", incident="incomplete_recovery_state_read"] | eval expires_at=tonumber(expires_at) | where incident="incomplete_recovery_state_read" OR (expires_at<=now() AND (coalesce(record_type,"")!="slot" OR coalesce(state,"")!="recovered")) | eval incident=coalesce(incident,"abandoned_recovery_claim"), expired_seconds=now()-expires_at | table _key incident record_type name state owner expires_at expired_seconds scheduled_time sid reason updated
disabled = 1
enableSched = 1
cron_schedule = */5 * * * *
schedule_window = 0
realtime_schedule = 0
dispatch.earliest_time = -5m
dispatch.latest_time = now
dispatchAs = owner
is_visible = 1
counttype = number of events
relation = greater than
quantity = 0
alert_type = number of events
alert.severity = 4
alert.track = 1
action.adm_recovery = 0

[ADM - Application catalog]
description = Upserts the last completed hour of application observations at 15 past each hour (allowing rollup lag). Retained service bindings supply scope rows; distinct tuples and peers use scope-qualified temporal pod identities. Read-only viewers use catalog KV; only administrators may dispatch this owner search.
search = | `adm_catalog_build` | outputlookup append=true key_field=_key override_if_empty=false adm_app_catalog
disabled = 1
enableSched = 1
cron_schedule = 15 * * * *
schedule_window = 0
realtime_schedule = 0
dispatch.earliest_time = -1h@h
dispatch.latest_time = @h
dispatchAs = owner
is_visible = 1
