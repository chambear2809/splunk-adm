[ADM - Conversation rollup]
description = Writes summary rows (source adm:conversation, sourcetype stash) per conversation, 5-minute bucket and observer for flow records indexed in one 5-minute index-time slice; identical closed-slice retries are deduplicated by the graph using rollup_id.
search = | `adm_conversation_rollup` | collect index=`adm_summary_index_name` source="adm:conversation"
disabled = 1
enableSched = 1
cron_schedule = */5 * * * *
schedule_window = 0
realtime_schedule = 0
schedule_priority = higher
dispatch.earliest_time = -24h
dispatch.latest_time = +15m
# Cron fires on five-minute boundaries; Splunk snapping uses @m, not @5m.
dispatch.index_earliest = -10m@m
dispatch.index_latest = -5m@m
dispatchAs = owner
is_visible = 1

[ADM - Identity prune]
description = Maintenance-only; pause and drain all builders, back up collections, then enable adm_prune_maintenance. Removes adm_ip_identity rows whose validity ended before the retention period, only after a provably complete paged read.
search = | `adm_identity_prune`
disabled = 1
enableSched = 0
cron_schedule = 4 3 * * *
schedule_window = 0
dispatch.earliest_time = -1m
dispatch.latest_time = now
dispatchAs = owner
is_visible = 1

