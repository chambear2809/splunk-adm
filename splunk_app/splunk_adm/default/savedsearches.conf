[ADM - Scheduler missed-slot alert]
description = Checks the four 5-minute builder/rollup targets (Identity builder, Service binding, Service backends, Conversation rollup) for missing scheduled slots strictly after each target's earliest visible scheduler__ success (reason=missed_slot), or one row without scheduled_time if no successful checkpoint exists (reason=no_successful_checkpoint). Disabled and unscheduled targets are excluded. Slots are checked after a 10-minute grace period (adm_missed_slot_grace), over the trailing adm_missed_slot_lookback (24h). A missed slot does not self-heal: continuous scheduling resumes on the next future slot without replaying the one that was missed, so a later healthy run does not mean the missed slot's data was processed. Shipped disabled; enabling it only raises a Splunk Triggered Alert when adm_health_missed_slots returns rows, it does not notify anyone by itself. Configure a notification action (email, webhook, etc.) in alert_actions.conf or the Alerts UI separately; this app ships no paging integration. A firing alert is a signal to run the absolute-slice recovery procedure in RECOVERY.md, not evidence that anything already recovered.
search = | `adm_health_missed_slots`
disabled = 1
enableSched = 1
cron_schedule = */5 * * * *
schedule_window = 0
realtime_schedule = 0
# 24-hour expected-slot lookback plus the preceding five-minute checkpoint.
# Keep in sync with adm_missed_slot_lookback when changing that macro.
dispatch.earliest_time = -1445m@m
dispatch.latest_time = now
dispatchAs = owner
is_visible = 1
counttype = number of events
relation = greater than
quantity = 0
alert_type = number of events
alert.severity = 4
alert.track = 1
