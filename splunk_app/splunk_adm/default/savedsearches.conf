disabled = 1
enableSched = 1
cron_schedule = 1-56/5 * * * *
schedule_window = 0
realtime_schedule = 0
schedule_priority = higher
dispatch.earliest_time = -24h
dispatch.latest_time = +15m
dispatch.index_earliest = -10m@m
dispatch.index_latest = @m
