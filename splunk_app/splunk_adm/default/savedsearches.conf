# Shipped disabled. Set the index macros and populate the adm_observer_scope KV lookup, backfill, then enable.
# Builders select events by index time (dispatch.index_earliest/index_latest) and use continuous
# scheduling (realtime_schedule = 0), so delayed runs catch up instead of skipping periods.
# Event-time bounds (-24h .. +15m) are the accepted lateness and clock-skew limits.
# KV writes upsert by _key. Prunes require an explicit maintenance gate and complete read.
# Prune schedules stay disabled: offsets cannot serialize a prune against builders.

[ADM - Migrate network source scope]
description = One-time administrator migration from adm_network_source_scope.csv into the versioned source/domain mapping KV collection. Refuses blank or conflicting mappings; no default scope is inferred.
search = | inputlookup strict=true adm_network_source_scope.csv \
    | eval source=lower(trim(source)), source_authority=if(source=="stream_ipfix", lower(trim(source_authority)), trim(source_authority)), domain_kind=lower(trim(domain_kind)), observation_domain_present=if(lower(trim(observation_domain_present))=="true" OR trim(observation_domain_present)=="1", "1", "0"), observation_domain_id=coalesce(trim(observation_domain_id), ""), vpn_id=coalesce(trim(vpn_id), ""), routing_domain=coalesce(trim(routing_domain), ""), scope=trim(scope), cluster=coalesce(trim(cluster), ""), profile=lower(trim(profile)), mapping_status="mapped", \
        mapping_key=sha256(json_array(tostring(coalesce(source,"")),tostring(coalesce(source_authority,"")),tostring(coalesce(domain_kind,"")),tostring(coalesce(observation_domain_present,"")),tostring(coalesce(observation_domain_id,"")),tostring(coalesce(vpn_id,"")),tostring(coalesce(routing_domain,"")))) \
    | eventstats dc(scope) AS adm_scopes dc(cluster) AS adm_clusters dc(profile) AS adm_profiles count AS duplicate_count by mapping_key \
    | eval mapping_status=if(duplicate_count>1,"ambiguous","mapped"), _key=sha256(json_array(mapping_key, scope, cluster, profile, mapping_status)) \
    | lookup local=true adm_network_source_scope mapping_key OUTPUT _key AS adm_existing_key scope AS adm_existing_scope cluster AS adm_existing_cluster profile AS adm_existing_profile \
    | eval adm_invalid=if(len(source)==0 OR len(source_authority)==0 OR len(domain_kind)==0 OR len(profile)==0 OR len(trim(scope))==0 OR adm_scopes>1 OR adm_clusters>1 OR adm_profiles>1 OR (observation_domain_present=="1" AND len(observation_domain_id)==0) OR (isnotnull(adm_existing_key) AND (adm_existing_scope!=scope OR coalesce(adm_existing_cluster, "")!=cluster OR coalesce(adm_existing_profile, "")!=profile)), 1, 0) \
    | eventstats max(adm_invalid) AS adm_blocked \
    | dedup keepempty=true mapping_key scope cluster profile mapping_status \
    | appendpipe [| where adm_blocked==0 | fields _key mapping_key source source_authority domain_kind observation_domain_present observation_domain_id vpn_id routing_domain scope cluster mapping_status profile duplicate_count | outputlookup append=true key_field=_key override_if_empty=false adm_network_source_scope | where false()] \
    | stats count AS source_rows max(adm_blocked) AS blocked \
    | eval blocked=coalesce(blocked, 0), rows_written=if(blocked==0, source_rows, 0), warnings=case(blocked==1, "Source scope migration refused: invalid/conflicting source rows or an existing mapping differs. No rows written.", source_rows==0, "Source scope CSV is empty; no rows written.")
disabled = 1
enableSched = 0
dispatchAs = owner
dispatch.earliest_time = 0
dispatch.latest_time = now
is_visible = 1

[ADM - Migrate observer scope]
description = One-time administrator migration from the retained legacy CSV to scope KV. Refuses blank keys, conflicting source rows or changes to existing KV mappings. Never scheduled; see docs/UPGRADES.md.
search = | inputlookup strict=true adm_observer_scope.csv \
    | eval observer_kind=lower(observer_kind), observer=lower(observer), cluster=coalesce(cluster, ""), scope=coalesce(scope, ""), _key=sha256(json_array(observer_kind, observer)) \
    | eventstats dc(scope) AS adm_scopes dc(cluster) AS adm_clusters by observer_kind observer \
    | lookup local=true adm_observer_scope observer_kind observer OUTPUT _key AS adm_existing_key scope AS adm_existing_scope cluster AS adm_existing_cluster \
    | eval adm_invalid=if(len(trim(coalesce(observer_kind, "")))==0 OR len(trim(coalesce(observer, "")))==0 OR len(trim(scope))==0 OR adm_scopes>1 OR adm_clusters>1 OR (isnotnull(adm_existing_key) AND (adm_existing_key!=_key OR adm_existing_scope!=scope OR coalesce(adm_existing_cluster, "")!=cluster)), 1, 0) \
    | eventstats max(adm_invalid) AS adm_blocked \
    | dedup keepempty=true observer_kind observer \
    | appendpipe [| where adm_blocked==0 | fields _key observer_kind observer scope cluster | outputlookup append=true key_field=_key override_if_empty=false adm_observer_scope | where false()] \
    | stats count AS source_rows max(adm_blocked) AS blocked \
    | eval blocked=coalesce(blocked, 0), rows_written=if(blocked==0, source_rows, 0), warnings=case(blocked==1, "Scope migration refused: invalid or conflicting source rows, or an existing KV mapping differs. No rows written.", source_rows==0, "Legacy scope CSV is empty; no rows written.")
disabled = 1
enableSched = 0
dispatchAs = owner
dispatch.earliest_time = 0
dispatch.latest_time = now
is_visible = 1

