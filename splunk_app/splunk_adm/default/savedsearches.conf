# Shipped disabled. Set the index macros and adm_observer_scope.csv, backfill, then enable.
# Builders select events by index time (dispatch.index_earliest/index_latest) and use continuous
# scheduling (realtime_schedule = 0), so delayed runs catch up instead of skipping periods.
# Event-time bounds (-24h .. +15m) are the accepted lateness and clock-skew limits.
# KV writes upsert by _key. Prunes require an explicit maintenance gate and complete read.
# Prune schedules stay disabled: offsets cannot serialize a prune against builders.

[ADM - Identity builder]
description = Upserts adm_ip_identity from Kubernetes pod objects, ACI endpoints and Nexus Dashboard endpoints indexed in the last 10 minutes (overlapping runs are idempotent). Backfill once with index_earliest -7d.
search = `adm_identity_build`
disabled = 1
enableSched = 1
cron_schedule = 1-56/5 * * * *
schedule_window = 0
realtime_schedule = 0
schedule_priority = higher
dispatch.earliest_time = -24h
dispatch.latest_time = +15m
dispatch.index_earliest = -10m@m
dispatch.index_latest = @m
dispatchAs = owner
is_visible = 1

