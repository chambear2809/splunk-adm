# Shipped disabled. Set the index macros and adm_observer_scope.csv, backfill, then enable.
# Builders select events by index time (dispatch.index_earliest/index_latest) and use continuous
# scheduling (realtime_schedule = 0), so delayed runs catch up instead of skipping periods.
# Event-time bounds (-24h .. +15m) are the accepted lateness and clock-skew limits.
# KV store writes upsert by _key; only the prune searches rewrite a collection, after a complete paged read.

[ADM - Identity builder]
description = Upserts adm_ip_identity from Kubernetes pod objects, ACI endpoints and Nexus Dashboard endpoints indexed in the last 10 minutes (overlapping runs are idempotent). Backfill once with index_earliest -7d.
search = `adm_identity_build`
disabled = 1
enableSched = 1
cron_schedule = 1-56/5 * * * *
schedule_window = 0
realtime_schedule = 0
schedule_priority = higher
dispatch.earliest_time = -24h
dispatch.latest_time = +15m
dispatch.index_earliest = -10m@m
dispatch.index_latest = @m
dispatchAs = owner
is_visible = 1

[ADM - Service binding]
description = Upserts adm_service_workload (OTel service to pod UID) from spans indexed in the last 10 minutes.
search = `adm_service_binding_build`
disabled = 1
enableSched = 1
cron_schedule = 2-57/5 * * * *
schedule_window = 0
realtime_schedule = 0
dispatch.earliest_time = -24h
dispatch.latest_time = +15m
dispatch.index_earliest = -10m@m
dispatch.index_latest = @m
dispatchAs = owner
is_visible = 1

[ADM - Interface inventory]
description = Upserts adm_interfaces (NX-OS ifIndex to interface name) from CDP neighbor output indexed in the last two hours.
search = `adm_interfaces_build`
disabled = 1
enableSched = 1
cron_schedule = 7 * * * *
schedule_window = 10
realtime_schedule = 0
dispatch.earliest_time = -24h
dispatch.latest_time = +15m
dispatch.index_earliest = -2h@m
dispatch.index_latest = @m
dispatchAs = owner
is_visible = 1

[ADM - Conversation rollup]
description = Writes summary rows (source adm:conversation, sourcetype stash) per conversation, 5-minute bucket and observer for flow records indexed in one 5-minute index-time slice; each record is counted exactly once.
search = | `adm_conversation_rollup` | collect index=`adm_summary_index_name` source="adm:conversation"
disabled = 1
enableSched = 1
cron_schedule = */5 * * * *
schedule_window = 0
realtime_schedule = 0
schedule_priority = higher
dispatch.earliest_time = -24h
dispatch.latest_time = +15m
dispatch.index_earliest = -10m@5m
dispatch.index_latest = -5m@5m
dispatchAs = owner
is_visible = 1

[ADM - Identity prune]
description = Removes adm_ip_identity rows whose validity ended before the retention period, only after a provably complete paged read. Runs when no identity builder run is scheduled.
search = | `adm_identity_prune`
disabled = 1
enableSched = 1
cron_schedule = 4 3 * * *
schedule_window = 0
dispatch.earliest_time = -1m
dispatch.latest_time = now
dispatchAs = owner
is_visible = 1

[ADM - Service binding prune]
description = Removes adm_service_workload bindings last seen before the retention period, only after a provably complete paged read.
search = | `adm_service_binding_prune`
disabled = 1
enableSched = 1
cron_schedule = 9 3 * * *
schedule_window = 0
dispatch.earliest_time = -1m
dispatch.latest_time = now
dispatchAs = owner
is_visible = 1
