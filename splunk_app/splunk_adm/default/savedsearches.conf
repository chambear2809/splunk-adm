# Shipped disabled. Set the index macros and populate the adm_observer_scope KV lookup, backfill, then enable.
# Builders select events by index time (dispatch.index_earliest/index_latest) and use continuous
# scheduling (realtime_schedule = 0), so delayed runs catch up instead of skipping periods.
# Event-time bounds (-24h .. +15m) are the accepted lateness and clock-skew limits.
# KV writes upsert by _key. Prunes require an explicit maintenance gate and complete read.
# Prune schedules stay disabled: offsets cannot serialize a prune against builders.

[ADM - Migrate observer scope]
description = One-time administrator migration from the retained legacy CSV to scope KV. Refuses blank keys, conflicting source rows or changes to existing KV mappings. Never scheduled; see docs/UPGRADES.md.
search = | inputlookup strict=true adm_observer_scope.csv \
    | eval observer_kind=lower(observer_kind), observer=lower(observer), cluster=coalesce(cluster, ""), scope=coalesce(scope, ""), _key=sha256(json_array(observer_kind, observer)) \
    | eventstats dc(scope) AS adm_scopes dc(cluster) AS adm_clusters by observer_kind observer \
    | lookup local=true adm_observer_scope observer_kind observer OUTPUT _key AS adm_existing_key scope AS adm_existing_scope cluster AS adm_existing_cluster \
    | eval adm_invalid=if(len(trim(coalesce(observer_kind, "")))==0 OR len(trim(coalesce(observer, "")))==0 OR len(trim(scope))==0 OR adm_scopes>1 OR adm_clusters>1 OR (isnotnull(adm_existing_key) AND (adm_existing_key!=_key OR adm_existing_scope!=scope OR coalesce(adm_existing_cluster, "")!=cluster)), 1, 0) \
    | eventstats max(adm_invalid) AS adm_blocked \
    | dedup keepempty=true observer_kind observer \
    | appendpipe [| where adm_blocked==0 | fields _key observer_kind observer scope cluster | outputlookup append=true key_field=_key override_if_empty=false adm_observer_scope | where false()] \
    | stats count AS source_rows max(adm_blocked) AS blocked \
    | eval blocked=coalesce(blocked, 0), rows_written=if(blocked==0, source_rows, 0), warnings=case(blocked==1, "Scope migration refused: invalid or conflicting source rows, or an existing KV mapping differs. No rows written.", source_rows==0, "Legacy scope CSV is empty; no rows written.")
disabled = 1
enableSched = 0
dispatchAs = owner
dispatch.earliest_time = 0
dispatch.latest_time = now
is_visible = 1

[ADM - Identity builder]
