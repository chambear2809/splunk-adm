| eval adm_kind=coalesce(adm_kind, "binding"), \
    adm_pkey=if(adm_kind=="binding", json_array(cluster, namespace, pod_uid), adm_pkey), \
    adm_ref=if(adm_kind=="binding", json_object("service", service, "environment", coalesce(environment, ""), "cluster", coalesce(cluster, ""), "namespace", coalesce(namespace, ""), "last", tonumber(last_seen)), null()), \
    adm_binding_last=if(adm_kind=="binding", last_seen, null()), adm_binding_pod=if(adm_kind=="binding", pod_uid, null()) \
| fields adm_pkey adm_ref adm_binding_last adm_binding_pod adm_kind adm_catalog_invalid \
| where isnotnull(adm_pkey) \
| eventstats sum(eval(mvcount(adm_pkey))) AS adm_expand_expected \
| mvexpand adm_pkey \
| eventstats count AS adm_expand_actual max(adm_expand_expected) AS adm_expand_expected max(adm_catalog_invalid) AS adm_catalog_invalid \
| eval adm_catalog_invalid=if(isnull(adm_expand_expected) OR adm_expand_actual!=adm_expand_expected OR adm_catalog_invalid==1, 1, 0) \
| stats values(adm_ref) AS adm_refs values(adm_binding_pod) AS adm_binding_pods max(adm_binding_last) AS adm_binding_last \
    max(eval(if(adm_kind=="candidate" OR adm_kind=="identity", 1, 0))) AS adm_found max(adm_catalog_invalid) AS adm_catalog_invalid by adm_pkey \
| eventstats max(adm_catalog_invalid) AS adm_invalid \
| appendpipe [| where coalesce(adm_invalid, 0)==0 AND adm_found==1 AND isnotnull(adm_refs) \
    | eventstats sum(eval(mvcount(adm_refs))) AS adm_refs_expected \
    | mvexpand adm_refs | eventstats count AS adm_refs_actual max(adm_refs_expected) AS adm_refs_expected \
    | where adm_refs_actual==adm_refs_expected \
    | eval service=json_extract(adm_refs, "service"), environment=json_extract(adm_refs, "environment"), cluster=json_extract(adm_refs, "cluster"), namespace=json_extract(adm_refs, "namespace"), adm_binding_last=json_extract(adm_refs, "last") \
    | stats dc(adm_binding_pods) AS pods max(adm_binding_last) AS last_seen by service environment cluster namespace \
    | eval _key=sha256(json_array(service, environment, cluster, namespace)), last_seen=floor(last_seen), adm_kind="result"] \
| eventstats count(eval(adm_kind=="result")) AS adm_results \
| appendpipe [| where adm_invalid==1 OR (adm_found==1 AND isnotnull(adm_refs) AND adm_results==0) \
    | stats count | where count>0 | eval adm_kind="warning", warnings="Find could not read complete identity, binding or conversation evidence. Narrow the window or ask an administrator to check lookup/result limits."] \
| where adm_kind=="result" OR adm_kind=="warning" \
| fields _key service environment cluster namespace pods last_seen warnings \
| sort 0 service environment cluster namespace
description = Exact read-only IP/EPG/device Find in the dispatch window. Direct pod identities and observed flow neighbors map through (cluster, namespace, UID) bindings. Graph identity rules handle IP reuse and scopes; no missing owner is guessed. Complete inline KV reads and expansion guards return a warning on partial evidence rather than false no-match results.

[adm_find_network_client(1)]
args = query
validation = match(query, "^[A-Za-z0-9:.][A-Za-z0-9._:/@-]{0,254}\z")
errormsg = Find network client expects one exact IP, MAC or native client identifier.
definition = `adm_kv_read_all(adm_network_client_history)` \
| where adm_page>=1 \
| eventstats count AS history_rows BY source source_authority native_id \
| `adm_network_client_history_canonicalize` \
| addinfo \
| eval adm_identity_group=if(len(trim(coalesce(native_id,"")))>0,json_array(source,source_authority,native_id),_key), adm_evidence_time=if(source=="catalyst_client_snapshot",tonumber(received_time),tonumber(source_time)), adm_reference_time=min(now(),info_max_time) \
| eventstats dc(event_fingerprint) AS simultaneous_claims BY adm_identity_group adm_evidence_time \
| eval diagnostic_status=case(adm_complete!=1,"incomplete",history_rows>=`adm_identity_max_matches`,"incomplete",isnull(client_mac) OR isnull(source_time) OR isnull(received_time) OR mapping_status!="mapped" OR isnull(client_ip),"incomplete",simultaneous_claims>1,"conflict",source=="catalyst_client_snapshot" AND source_time>received_time+300,"clock_skew",source=="catalyst_client_snapshot" AND source_time<received_time-`adm_identity_retention`,"incomplete",(adm_evidence_time>=info_max_time OR adm_evidence_time>adm_reference_time),"outside_window",adm_reference_time>adm_evidence_time+if(source=="meraki_association",900,3600),"stale",true(),"evidence_only"), \
  diagnostic_reason=mvjoin(mvappend(if(adm_complete!=1,"History collection read is incomplete; matching observations may be omitted.",null()),if(history_rows>=`adm_identity_max_matches`,"Client history reaches the correlation lookup cap; narrow retention through administrator maintenance.",null()),if(mapping_status!="mapped","Configure one explicit source authority and routing-domain profile; this evidence has no correlation scope.",null()),if(isnull(client_mac),"A valid client MAC is unavailable; client identity cannot be correlated.",null()),if(isnull(source_time),"Source event time is unavailable.",null()),if(isnull(received_time),"Indexed receipt time is unavailable; snapshot eligibility cannot be established.",null()),if(isnull(client_ip),"Optional client IP is unavailable; this observation cannot attach an IP flow.",null()),if(simultaneous_claims>1,"Different observations claim the same client at the same effective time; attachment is unresolved.",null()),if(source=="catalyst_client_snapshot" AND source_time>received_time+300,"Catalyst source time is ahead of indexed receipt; clock consistency is unresolved.",null()),if(source=="catalyst_client_snapshot" AND source_time<received_time-3600,"Catalyst source record-update time is old; indexed receipt determines snapshot eligibility and does not establish collection time.",null()),if(source=="catalyst_client_snapshot" AND source_time<received_time-`adm_identity_retention`,"Source update age exceeds the configured retention horizon; original receipt or a replay from pruned history cannot be distinguished, so positive attachment is unresolved. It does not prove a collection outage.",null()),if(adm_evidence_time>=info_max_time OR adm_evidence_time>adm_reference_time,"Observation is outside the selected interval; Catalyst eligibility begins at indexed receipt and the interval end is exclusive.",null()),if(adm_reference_time>adm_evidence_time+if(source=="meraki_association",900,3600),"Evidence has expired at the selected window end; continuity across the gap is not established.",null()),if(isnull(attachment_device_id),"Optional attachment device identity is unavailable; no device or AP is inferred.",null()),if(source=="meraki_association" AND isnull(ssid_number),"Optional SSID number is unavailable; no SSID name is inferred.",null()))," ") \
| appendpipe [| stats min(adm_complete) AS complete | where complete==0 | eval row_type="warning", warning="Network client history could not be read completely; Find results may omit matching observations. Ask an administrator to inspect collection/query limits."] \
| where row_type=="warning" OR lower(coalesce(client_ip, ""))==lower("$query$") OR lower(coalesce(client_mac, ""))==lower("$query$") OR tostring(native_id)=="$query$" \
| eval row_type=coalesce(row_type,"network_client"), access_platform=case(source=="meraki_association", "wireless", source=="catalyst_client_snapshot", "wired", true(), "unknown"), \
  source_time_status=case(source!="catalyst_client_snapshot",null(),isnull(source_time),"missing",source_time>received_time+300,"ahead",source_time<received_time-3600,"stale",true(),"current"), history_coverage=case(source!="catalyst_client_snapshot",null(),isnull(source_time) OR isnull(received_time),"unconfirmed",source_time<received_time-`adm_identity_retention`,"unconfirmed",true(),"retained_evidence"), \
  attachment_event_time=if(source=="meraki_association", source_time, null()), attachment_received_time=received_time, \
  attachment_collected_time=collected_time, warning=coalesce(warning,if(mapping_status!="mapped", "Source routing domain is unmapped or ambiguous; this observation is not correlated.", null())) \
| fields row_type _key contract_version source source_authority native_id client_mac client_ip access_platform routing_domain scope cluster source_time received_time latest_received_time collected_time attachment_basis attachment_event_time attachment_received_time attachment_collected_time attachment_device_id attachment_device_name attachment_device_mac device_serial ssid_number attachment_status mapping_status quality_reason diagnostic_status diagnostic_reason history_rows simultaneous_claims source_time_status history_coverage warning \
| sort 0 - source_time - received_time
description = Exact source-qualified client evidence with bounded-read completeness, profile, identity, freshness, conflict and optional-field diagnostics. Diagnostic freshness is evaluated at the earlier of now and selected window end; evidence_only is not proof of a matching flow or present attachment. Source time and indexed receipt remain separate.

# scope rows, and runtime SPL compilation are verified in the pilot.
[adm_topology_inventory_lookback_seconds]
definition = 3600
description = Bounded topology inventory lookback before the selected query start; timestamps remain unchanged.

[adm_topology_inventory_time_bounds]
definition = [| makeresults | addinfo | eval earliest=max(0,info_min_time-`adm_topology_inventory_lookback_seconds`), latest=info_max_time | return earliest latest]
description = Search-time bounds for topology snapshots: one configured lookback before the selected query start through the selected query end.

[adm_topology_client_observations]
definition = `adm_kv_read_all(adm_network_client_history)` \
| addinfo \
| eventstats min(adm_complete) AS adm_history_read_complete \
| where adm_page>=1 \
| eventstats count AS history_rows BY source source_authority native_id \
| `adm_network_client_history_canonicalize` \
| appendpipe [| stats min(adm_history_read_complete) AS adm_history_read_complete count(eval(source=="catalyst_client_snapshot")) AS adm_catalyst_history_rows \
    | eval source="history_diagnostic", topology_warning=case(adm_history_read_complete==0,"Catalyst client history read is incomplete; attachment evidence is unresolved. Ask an administrator to inspect collection/query limits.",adm_catalyst_history_rows==0,"No retained Catalyst client history is available; enable and backfill the source-qualified history builder before expecting Catalyst attachment context.",true(),null())] \
| where source=="catalyst_client_snapshot" OR source=="history_diagnostic" \
| eventstats dc(event_fingerprint) AS simultaneous_claims BY source source_authority native_id received_time \
| eval source_time=tonumber(source_time), received_time=tonumber(received_time), \
    source_time_status=case(source!="catalyst_client_snapshot",null(),isnull(source_time),"missing",source_time>received_time+300,"ahead",source_time<received_time-3600,"stale",true(),"current"), \
    history_coverage=case(source!="catalyst_client_snapshot",null(),isnull(source_time) OR isnull(received_time),"unconfirmed",source_time<received_time-`adm_identity_retention`,"unconfirmed",true(),"retained_evidence"), \
    topology_observed_time=received_time \
| sort 0 source source_authority native_id -received_time \
| streamstats current=f min(received_time) AS adm_later_received BY source source_authority native_id \
| eventstats max(eval(if(adm_later_received>received_time,adm_later_received,null()))) AS topology_next_received BY source source_authority native_id received_time \
| eval topology_attachment_eligible=if(adm_history_read_complete==1 AND history_rows<`adm_identity_max_matches` AND simultaneous_claims==1 AND source_time_status IN ("current","stale") AND history_coverage=="retained_evidence" AND isnull(quality_reason) AND client_type=="wired" AND attachment_status=="observed_snapshot" AND connected_device_type=="Switch" AND len(trim(coalesce(interface,"")))>0,1,0) \
| eval topology_warning=coalesce(topology_warning,if(source=="catalyst_client_snapshot" AND topology_attachment_eligible!=1,"Some retained Catalyst observations have disconnected, incomplete, conflicting, clock-skewed, capped or insufficient history; their attachments remain unresolved. Find retains the original evidence and diagnostics.",null())) \
| where source=="history_diagnostic" OR (received_time<info_max_time AND received_time+3600>=info_min_time AND (isnull(topology_next_received) OR topology_next_received>info_min_time)) \
| append [search `adm_network_client_meraki_raw` | `adm_network_client_normalize` \
    | eval topology_observed_time=source_time, topology_attachment_eligible=1]
description = Reads retained Catalyst history once, independently of caller event time, plus raw event-time Meraki associations. Catalyst context starts at earliest retained indexed receipt and ends at the earlier of one hour or the next retained receipt for that source/authority/native identity, including disconnected/incomplete/conflicting transitions. Old numeric source time is labeled stale, not backdated; missing/ahead timestamps, conflicting/capped/incomplete history and a source update age beyond the configured retention horizon suppress attachment without claiming an actual collection gap. No raw fallback restarts eligibility after replay. History retention cannot certify original receipt or continuity beyond retained evidence; Find retains unresolved diagnostics.

[adm_topology_v2]
definition = `adm_index_dcn` sourcetype="cisco:dc:aci:class" component="topSystem" `adm_topology_inventory_time_bounds` \
    | eval source="aci_topSystem", device_authority=trim(apic_host), native_device_id=replace(dn, "^topology/(pod-\\d+)/(node-\\d+)/sys$", "\\1/\\2"), \
      device_id="aci:".sha256(json_array(source, device_authority, native_device_id)), name=name, aci_node=native_device_id, aliases=mvappend(name,native_device_id), fabric="apic:".device_authority, \
      mgmt_ip=if(oobMgmtAddr=="0.0.0.0", null(), oobMgmtAddr), serial=serial, device_kind=case(role=="controller", "controller", true(), "switch"), \
      adm_scope_kind="apic", adm_scope_observer=lower(device_authority), row_type="device", sources=source \
    | lookup local=true adm_observer_scope observer_kind AS adm_scope_kind observer AS adm_scope_observer OUTPUT scope cluster \
    | eval mapping_status=if(mvcount(scope)==1 AND mvcount(cluster)==1 AND match(native_device_id,"^pod-[0-9]+/node-[0-9]+$") AND len(device_authority)>0, "mapped", "unmapped"), \
      scope=if(mapping_status=="mapped", scope, null()), cluster=if(mapping_status=="mapped", cluster, null()), adm_row_key=sha256(json_array(row_type, device_id)) \
    | fields _time row_type device_id device_authority native_device_id name aliases aci_node role fabric mgmt_ip serial device_kind scope cluster mapping_status sources adm_row_key \
| append [ search `adm_index_dcn` sourcetype="cisco:dc:nexus9k" (component="nxversion" OR component="nxhostname") `adm_topology_inventory_time_bounds` \
    | eval device_authority=lower(host), adm_endpoint=device, adm_native=if(component=="nxversion",mvindex('Row_info{}.proc_board_id',0),null()), \
      adm_name=if(component=="nxhostname",mvindex('Row_info{}.hostname',0),null()), adm_version=if(component=="nxversion",mvindex('Row_info{}.nxos_ver_str',0),null()) \
    | stats dc(adm_native) AS adm_native_count values(adm_native) AS native_device_id latest(adm_name) AS name values(adm_name) AS aliases latest(adm_version) AS os_version max(_time) AS _time BY device_authority adm_endpoint \
    | eval native_device_id=coalesce(native_device_id,"__missing_serial__") | mvexpand native_device_id \
    | eval source="cisco_nexus_9k://nxversion", device_id="nxos:".sha256(json_array(source, device_authority,if(native_device_id=="__missing_serial__",adm_endpoint,native_device_id))), mgmt_ip=replace(adm_endpoint, ":\\d+$", ""), serial=if(native_device_id!="__missing_serial__",native_device_id,null()), \
      device_kind="switch", adm_scope_kind="nxos_serial", adm_scope_observer=lower(json_array(device_authority, native_device_id)), row_type="device", sources="nxos" \
    | lookup local=true adm_observer_scope observer_kind AS adm_scope_kind observer AS adm_scope_observer OUTPUT scope cluster \
    | eval mapping_status=case(adm_native_count==0, "incomplete_identity", adm_native_count>1,"ambiguous", mvcount(scope)==1 AND mvcount(cluster)==1, "mapped", true(), "unmapped"), \
      scope=if(mapping_status=="mapped", scope, null()), cluster=if(mapping_status=="mapped", cluster, null()), adm_row_key=sha256(json_array(row_type, device_id)), native_device_id=if(adm_native_count==0,null(),native_device_id) \
    | fields _time row_type device_id device_authority native_device_id name aliases os_version serial mgmt_ip device_kind scope cluster mapping_status sources adm_row_key ] \
| append [ search `adm_index_meraki` sourcetype="meraki:devices" `adm_topology_inventory_time_bounds` \
    | eval source="meraki_device", device_authority=json_array(organizationId, networkId), native_device_id=serial, \
      device_id="meraki:".sha256(json_array("meraki_device", tostring(coalesce(organizationId,"")), tostring(coalesce(networkId,"")), tostring(coalesce(serial,"")))), name=name, mgmt_ip=lanIp, serial=serial, \
      device_kind=case(productType=="wireless", "access_point", productType=="switch", "switch", true(), "network_device"), \
      adm_scope_kind="network_authority", adm_scope_observer=lower(device_authority), row_type="device", sources=source \
    | lookup local=true adm_observer_scope observer_kind AS adm_scope_kind observer AS adm_scope_observer OUTPUT scope cluster \
    | eval mapping_status=if(mvcount(scope)==1 AND mvcount(cluster)==1 AND len(trim(coalesce(serial,"")))>0, "mapped", "unmapped"), \
      scope=if(mapping_status=="mapped", scope, null()), cluster=if(mapping_status=="mapped", cluster, null()), adm_row_key=sha256(json_array(row_type, device_id)) \
    | fields _time row_type device_id device_authority native_device_id name mgmt_ip serial device_kind scope cluster mapping_status sources adm_row_key ] \
| append [ search `adm_index_k8s` sourcetype="kube:object:nodes" `adm_topology_inventory_time_bounds` \
    | spath input=_raw path=object.metadata.name output=adm_node_name \
    | spath input=_raw path=object.metadata.uid output=adm_node_uid \
    | spath input=_raw path=object.status.addresses{} output=adm_addresses \
    | eval source="kubernetes_node", device_authority='k8s.cluster.name', native_device_id=adm_node_uid, \
      device_id="host:".sha256(json_array(source, device_authority, native_device_id)), name=adm_node_name, device_kind="host", \
      adm_scope_kind="cluster", adm_scope_observer=lower(device_authority), \
      sources=source, row_type="device", mgmt_ip=null(), adm_row_key=sha256(json_array(row_type, device_id)) \
    | lookup local=true adm_observer_scope observer_kind AS adm_scope_kind observer AS adm_scope_observer OUTPUT scope cluster \
    | eval mapping_status=if(mvcount(scope)==1 AND mvcount(cluster)==1 AND len(trim(coalesce(native_device_id,"")))>0 AND cluster==device_authority, "mapped", "unmapped"), \
      scope=if(mapping_status=="mapped", scope, null()), cluster=if(mapping_status=="mapped", cluster, null()) \
    | fields _time row_type device_id device_authority native_device_id name mgmt_ip device_kind scope cluster mapping_status sources adm_row_key ] \
| append [ | `adm_topology_client_observations` \
    | eval adm_client_row=1 \
    | appendpipe [| where isnotnull(topology_warning) | stats values(topology_warning) AS warnings | eval row_type="client_history_status", adm_row_key="client-history-status", adm_client_row=0] \
    | appendpipe [| where adm_client_row==1 AND mapping_status=="mapped" AND isnotnull(client_mac) \
        AND (source=="meraki_association" OR (source=="catalyst_client_snapshot" AND client_type=="wired")) \
        | eval _time=topology_observed_time, row_type="device", device_authority=source_authority, native_device_id=native_id, \
          device_id="network_client:".sha256(json_array(source, source_authority, native_id)), name=coalesce(client_mac, native_id), mgmt_ip=client_ip, \
          device_kind="network_client", sources=source, access_platform=if(source=="meraki_association","wireless","wired"), \
          attachment_event_time=if(source=="meraki_association",source_time,null()), attachment_received_time=received_time, attachment_collected_time=collected_time, attachment_interface=interface, attachment_status=if(source=="catalyst_client_snapshot" AND attachment_status=="observed_snapshot" AND topology_attachment_eligible!=1,"unresolved",attachment_status), \
          adm_row_key=sha256(json_array(row_type, device_id)), adm_client_row=0] \
    | appendpipe [| where adm_client_row==1 AND topology_attachment_eligible==1 AND mapping_status=="mapped" AND source=="catalyst_client_snapshot" AND client_type=="wired" AND attachment_status=="observed_snapshot" AND connected_device_type=="Switch" AND isnotnull(interface) \
        | eval _time=topology_observed_time, row_type="device", device_authority=source_authority, native_device_id=attachment_device_mac, device_id=attachment_device_id, \
          name=attachment_device_name, mgmt_ip=null(), device_kind="switch", sources=source, adm_row_key=sha256(json_array(row_type, device_id)), adm_client_row=0 \
        | fields _time row_type device_id device_authority native_device_id name mgmt_ip device_kind scope cluster mapping_status sources adm_row_key adm_client_row] \
    | appendpipe [| where adm_client_row==1 AND topology_attachment_eligible==1 \
        | eval adm_attached=case(source=="catalyst_client_snapshot" AND client_type=="wired" AND attachment_status=="observed_snapshot" AND connected_device_type=="Switch" AND isnotnull(interface),1,source=="meraki_association" AND isnotnull(attachment_device_id) AND isnotnull(source_time),1,true(),0), \
          a_device="network_client:".sha256(json_array(source, source_authority, native_id)), a_device_name=coalesce(client_mac, native_id), \
          b_device=attachment_device_id, b_device_name=attachment_device_name, a_interface=null(), b_interface=interface, \
          link_kind=if(source=="meraki_association","wireless_association","physical"), link_source=source, link_time=topology_observed_time, row_type="link", \
          adm_row_key=sha256(json_array(row_type,a_device,b_device,link_kind,link_time,raw_ref)), adm_client_row=0 \
        | where adm_attached==1 AND mapping_status=="mapped" AND isnotnull(a_device) AND isnotnull(b_device)] \
    | where adm_client_row==0 \
    | fields _time row_type device_id device_authority native_device_id name mgmt_ip device_kind scope cluster mapping_status sources adm_row_key warnings \
        routing_domain access_platform client_mac client_ip source_time received_time latest_received_time collected_time source_time_status history_coverage attachment_status attachment_basis attachment_event_time attachment_received_time attachment_collected_time attachment_device_id attachment_device_name attachment_interface ssid_number \
        a_device a_device_name a_interface b_device b_device_name b_interface link_kind link_source link_time ] \
| append [ search `adm_index_dcn` sourcetype="cisco:dc:aci:class" component="fabricLink" `adm_topology_inventory_time_bounds` \
    | eval source="aci_fabricLink", device_authority=trim(apic_host), adm_pod=replace(dn, "^topology/(pod-\\d+)/.*$", "\\1"), \
      adm_a_interface_raw="eth".s1."/".p1, adm_b_interface_raw="eth".s2."/".p2, \
      adm_a_native=adm_pod."/node-".tostring(n1), adm_b_native=adm_pod."/node-".tostring(n2), \
      a_device="aci:".sha256(json_array("aci_topSystem", device_authority, adm_a_native)), b_device="aci:".sha256(json_array("aci_topSystem", device_authority, adm_b_native)), \
      adm_scope_kind="apic", adm_scope_observer=lower(device_authority), row_type="link", link_kind="physical", link_source=source, link_time=_time \
    | eval a_interface=`adm_if_norm(adm_a_interface_raw)`, b_interface=`adm_if_norm(adm_b_interface_raw)` \
    | lookup local=true adm_observer_scope observer_kind AS adm_scope_kind observer AS adm_scope_observer OUTPUT scope cluster \
    | eval mapping_status=if(mvcount(scope)==1 AND mvcount(cluster)==1, "mapped", "unmapped"), adm_row_key=sha256(json_array(row_type, a_device, a_interface, b_device, b_interface, source)) \
    | where mapping_status=="mapped" AND isnotnull(n1) AND isnotnull(n2) AND isnotnull(a_interface) AND isnotnull(b_interface) \
    | fields row_type a_device a_interface b_device b_interface link_kind link_source link_time scope cluster mapping_status adm_row_key ] \
| append [ search `adm_index_meraki` sourcetype="meraki:custom" endpoint_name="switch_ports_topology_discovery_by_device" `adm_topology_inventory_time_bounds` \
    | spath input=_raw path=organizationId output=organizationId \
    | spath input=_raw path=network.id output=networkId \
    | spath input=_raw path=serial output=adm_local_serial \
    | spath input=_raw path=ports{} output=adm_port \
    | mvexpand adm_port \
    | spath input=adm_port path=portId output=adm_local_port \
    | spath input=adm_port path=lastUpdatedAt output=link_time \
    | spath input=adm_port path=lldp{} output=adm_tlv \
    | mvexpand adm_tlv \
    | spath input=adm_tlv path=name output=adm_tlv_name \
    | spath input=adm_tlv path=value output=adm_neighbor_name \
    | where adm_tlv_name=="System name" AND isnotnull(adm_neighbor_name) \
    | join type=inner max=0 organizationId networkId adm_local_serial [ search `adm_index_meraki` sourcetype="meraki:devices" `adm_topology_inventory_time_bounds` \
        | stats dc(serial) AS adm_local_count values(serial) AS adm_local_serial by organizationId networkId serial \
        | where adm_local_count==1 | fields organizationId networkId adm_local_serial ] \
    | join type=inner max=0 organizationId networkId adm_neighbor_name [ search `adm_index_meraki` sourcetype="meraki:devices" `adm_topology_inventory_time_bounds` \
        | stats dc(serial) AS adm_peer_count values(serial) AS adm_peer_serial values(name) AS b_device_name by organizationId networkId name \
        | where adm_peer_count==1 | rename name AS adm_neighbor_name | fields organizationId networkId adm_neighbor_name adm_peer_serial b_device_name ] \
    | eval device_authority=json_array(organizationId, networkId), a_device="meraki:".sha256(json_array("meraki_device", tostring(coalesce(organizationId,"")), tostring(coalesce(networkId,"")), tostring(adm_local_serial))), \
      b_device="meraki:".sha256(json_array("meraki_device", tostring(coalesce(organizationId,"")), tostring(coalesce(networkId,"")), tostring(adm_peer_serial))), a_interface=`adm_if_norm(adm_local_port)`, b_interface=null(), \
      row_type="link", link_kind="physical", link_source="meraki_switch_topology_lldp", adm_scope_kind="network_authority", adm_scope_observer=lower(device_authority) \
    | lookup local=true adm_observer_scope observer_kind AS adm_scope_kind observer AS adm_scope_observer OUTPUT scope cluster \
    | eval mapping_status=if(mvcount(scope)==1 AND mvcount(cluster)==1 AND adm_local_serial!=adm_peer_serial, "mapped", "unmapped"), \
      adm_row_key=sha256(json_array(row_type, a_device, a_interface, b_device, link_source, link_time)) \
    | where mapping_status=="mapped" \
    | fields row_type a_device a_interface b_device b_interface link_kind link_source link_time scope cluster mapping_status adm_row_key ] \
| append [ search `adm_index_dcn` sourcetype="cisco:dc:nexus9k" component="nxneighbor" `adm_topology_inventory_time_bounds` \
    | eval source="nxneighbor", host=lower(host), adm_local_endpoint=device, adm_peer_native=replace('Row_info.device_id', "^.*\\(([^)]+)\\)$", "\\1"), \
      a_interface=`adm_if_norm('Row_info.intf_id')`, b_interface=`adm_if_norm('Row_info.port_id')`, row_type="link", link_kind="physical", link_source="nxos_cdp", link_time=_time \
    | join type=inner max=0 host adm_local_endpoint [ search `adm_index_dcn` sourcetype="cisco:dc:nexus9k" component="nxversion" `adm_topology_inventory_time_bounds` \
        | eval host=lower(host), adm_local_endpoint=device, adm_candidate_native=mvindex('Row_info{}.proc_board_id', 0) \
        | stats dc(adm_candidate_native) AS adm_local_serial_count values(adm_candidate_native) AS adm_local_native by host adm_local_endpoint \
        | where adm_local_serial_count==1 | eval adm_local_native=mvindex(adm_local_native, 0) \
        | fields host adm_local_endpoint adm_local_native adm_local_serial_count ] \
    | eval adm_local_scope_kind="nxos_serial", adm_local_scope_observer=lower(json_array(host, adm_local_native)) \
    | lookup local=true adm_observer_scope observer_kind AS adm_local_scope_kind observer AS adm_local_scope_observer OUTPUT scope AS adm_local_scope cluster AS adm_local_cluster \
    | eval adm_peer_scope_kind="nxos_serial", adm_peer_scope_observer=lower(json_array(host, adm_peer_native)) \
    | lookup local=true adm_observer_scope observer_kind AS adm_peer_scope_kind observer AS adm_peer_scope_observer OUTPUT scope AS adm_peer_scope cluster AS adm_peer_cluster \
    | eval adm_peer_scope_count=mvcount(adm_peer_scope), adm_local_id="nxos:".sha256(json_array("cisco_nexus_9k://nxversion", host, adm_local_native)), \
      adm_peer_id="nxos:".sha256(json_array("cisco_nexus_9k://nxversion", host, adm_peer_native)), \
      a_device=adm_local_id, b_device=adm_peer_id, adm_peer_mapping_status=if(adm_peer_scope_count==1 AND mvcount(adm_peer_cluster)==1, "mapped", "ambiguous_or_unmapped") \
    | where adm_local_serial_count==1 AND mvcount(adm_local_scope)==1 AND mvcount(adm_local_cluster)==1 AND adm_peer_mapping_status=="mapped" AND adm_local_scope==adm_peer_scope AND adm_local_cluster==adm_peer_cluster AND isnotnull(a_interface) AND isnotnull(b_interface) \
    | eval scope=adm_local_scope, cluster=adm_local_cluster, mapping_status="mapped", adm_row_key=sha256(json_array(row_type, a_device, a_interface, b_device, b_interface, link_source)) \
    | fields row_type a_device a_interface b_device b_interface link_kind link_source link_time scope cluster mapping_status adm_row_key ] \
| append [ search `adm_index_dcn` sourcetype="cisco:dc:nexus9k" (component="nxinterface" OR component="nxneighbor") `adm_topology_inventory_time_bounds` \
    | eval host=lower(host), adm_local_endpoint=device, adm_if_raw=if(component=="nxinterface",'Row_info.interface','Row_info.intf_id'), \
      interface=`adm_if_norm(adm_if_raw)`, ifindex=if(component=="nxneighbor",'Row_info.ifindex',null()), description=if(component=="nxinterface",'Row_info.desc',null()), state=if(component=="nxinterface",'Row_info.state',null()) \
    | join type=inner max=0 host adm_local_endpoint [ search `adm_index_dcn` sourcetype="cisco:dc:nexus9k" component="nxversion" `adm_topology_inventory_time_bounds` \
        | eval host=lower(host), adm_local_endpoint=device, adm_candidate_native=mvindex('Row_info{}.proc_board_id',0) \
        | stats dc(adm_candidate_native) AS adm_native_count values(adm_candidate_native) AS native_device_id BY host adm_local_endpoint \
        | where adm_native_count==1 | eval native_device_id=mvindex(native_device_id,0) ] \
    | eval device_id="nxos:".sha256(json_array("cisco_nexus_9k://nxversion",host,native_device_id)), adm_scope_kind="nxos_serial", adm_scope_observer=lower(json_array(host,native_device_id)) \
    | lookup local=true adm_observer_scope observer_kind AS adm_scope_kind observer AS adm_scope_observer OUTPUT scope cluster \
    | where mvcount(scope)==1 AND mvcount(cluster)==1 AND isnotnull(interface) \
    | eval row_type="interface", mapping_status="mapped", sources="nxos", adm_row_key=sha256(json_array(row_type,device_id,interface)) \
    | fields _time row_type device_id interface ifindex description state scope cluster mapping_status sources adm_row_key ] \
| append [ search `adm_index_dcn` sourcetype="cisco:dc:aci:class" component="lldpAdjEp" `adm_topology_inventory_time_bounds` \
    | eval device_authority=trim(apic_host), adm_native=replace(dn,"^topology/(pod-\\d+)/(node-\\d+)/.*$","\\1/\\2"), adm_if_raw=replace(dn,"^.*/if-\\[([^\\]]+)\\]/.*$","\\1"), \
      a_device="aci:".sha256(json_array("aci_topSystem",device_authority,adm_native)), a_interface=`adm_if_norm(adm_if_raw)`, \
      adm_peer_native=if(match(sysDesc,"^topology/pod-[0-9]+/node-[0-9]+$"),replace(sysDesc,"^topology/",""),null()), \
      adm_peer_if=if(match(portDesc,"pathep-\\["),replace(portDesc,"^.*pathep-\\[([^\\]]+)\\].*$","\\1"),portDesc), b_interface=`adm_if_norm(adm_peer_if)`, \
      adm_scope_kind="apic", adm_scope_observer=lower(device_authority), link_time=_time \
    | lookup local=true adm_observer_scope observer_kind AS adm_scope_kind observer AS adm_scope_observer OUTPUT scope cluster \
    | where mvcount(scope)==1 AND mvcount(cluster)==1 AND match(adm_native,"^pod-[0-9]+/node-[0-9]+$") AND isnotnull(a_interface) \
    | join type=left max=0 scope cluster sysName [ search `adm_index_k8s` sourcetype="kube:object:nodes" `adm_topology_inventory_time_bounds` \
        | spath input=_raw path=object.metadata.name output=sysName | spath input=_raw path=object.metadata.uid output=adm_host_uid \
        | eval adm_scope_kind="cluster", adm_scope_observer=lower('k8s.cluster.name') \
        | lookup local=true adm_observer_scope observer_kind AS adm_scope_kind observer AS adm_scope_observer OUTPUT scope cluster \
        | where mvcount(scope)==1 AND mvcount(cluster)==1 AND cluster=='k8s.cluster.name' \
        | stats dc(adm_host_uid) AS adm_host_count values(adm_host_uid) AS adm_host_uid BY scope cluster sysName \
        | where adm_host_count==1 | eval adm_host_uid=mvindex(adm_host_uid,0), adm_host_id="host:".sha256(json_array("kubernetes_node",cluster,adm_host_uid)) \
        | fields scope cluster sysName adm_host_id ] \
    | eval b_device=if(isnotnull(adm_peer_native),"aci:".sha256(json_array("aci_topSystem",device_authority,adm_peer_native)),adm_host_id), \
      row_type="link", link_kind="physical", link_source=if(isnotnull(adm_peer_native),"aci_fabric_lldp","lldp"), mapping_status="mapped", \
      adm_row_key=sha256(json_array(row_type,a_device,a_interface,coalesce(b_device,sysName),b_interface,link_source)), \
      adm_unresolved_link=if(isnull(b_device),1,0) \
    | fields row_type a_device a_interface b_device b_interface link_kind link_source link_time scope cluster mapping_status adm_row_key adm_unresolved_link ] \
| append [ search `adm_index_ftd` sourcetype="cisco:sfw:estreamer" EventType="ConnectionEvent" `adm_topology_inventory_time_bounds` | head `adm_topology_sample` \
    | eval device_authority=lower(host), native_device_id=DeviceSerialNumber, adm_scope_kind="firewall", adm_scope_observer=lower(DeviceIP) \
    | lookup local=true adm_observer_scope observer_kind AS adm_scope_kind observer AS adm_scope_observer OUTPUT scope cluster \
    | eval device_id="ftd:".sha256(json_array("ftd",device_authority,coalesce(native_device_id,DeviceIP))), name=Device, serial=native_device_id, mgmt_ip=DeviceIP, aliases=Device, device_kind="firewall", row_type="device", sources="ftd", \
      mapping_status=case(isnull(native_device_id) OR len(trim(native_device_id))==0,"incomplete_identity",mvcount(scope)==1 AND mvcount(cluster)==1,"mapped",true(),"unmapped"), \
      scope=if(mapping_status=="mapped",scope,null()), cluster=if(mapping_status=="mapped",cluster,null()), adm_row_key=sha256(json_array(row_type,device_id)) \
    | fields _time row_type device_id device_authority native_device_id name aliases serial mgmt_ip device_kind scope cluster mapping_status sources adm_row_key ] \
| eventstats sum(adm_unresolved_link) AS adm_unresolved_links values(warnings) AS adm_client_history_warnings \
| where isnotnull(adm_row_key) \
| eval device_authority=if(row_type=="device", device_authority, null()), native_device_id=if(row_type=="device", native_device_id, null()), \
    sources=if(row_type=="device", sources, link_source) \
| stats values(row_type) AS row_type values(device_id) AS device_id values(device_authority) AS device_authority values(native_device_id) AS native_device_id \
    values(adm_client_history_warnings) AS adm_client_history_warnings values(aliases) AS aliases values(aci_node) AS aci_node latest(role) AS role latest(fabric) AS fabric latest(os_version) AS os_version max(adm_unresolved_links) AS adm_unresolved_links \
    values(interface) AS interface values(ifindex) AS adm_ifindex_values latest(description) AS description latest(state) AS state latest(name) AS name latest(mgmt_ip) AS mgmt_ip latest(_time) AS last_seen values(serial) AS serial values(device_kind) AS device_kind \
    values(scope) AS adm_scope_values values(cluster) AS adm_cluster_values values(mapping_status) AS adm_mapping_values values(sources) AS sources \
    latest(routing_domain) AS routing_domain latest(access_platform) AS access_platform latest(client_mac) AS client_mac latest(client_ip) AS client_ip latest(source_time) AS source_time latest(received_time) AS received_time latest(latest_received_time) AS latest_received_time latest(collected_time) AS collected_time latest(source_time_status) AS source_time_status latest(history_coverage) AS history_coverage latest(attachment_status) AS attachment_status latest(attachment_basis) AS attachment_basis latest(attachment_event_time) AS attachment_event_time latest(attachment_received_time) AS attachment_received_time latest(attachment_collected_time) AS attachment_collected_time latest(attachment_device_id) AS attachment_device_id latest(attachment_device_name) AS attachment_device_name latest(attachment_interface) AS attachment_interface latest(ssid_number) AS ssid_number \
    values(evidence_kind) AS evidence_kind values(overlay_peer_system_ip) AS overlay_peer_system_ip values(overlay_peer_color) AS overlay_peer_color values(overlay_protocol) AS overlay_protocol \
    values(a_device) AS a_device values(a_device_name) AS a_device_name values(a_interface) AS a_interface \
    values(b_device) AS b_device values(b_device_name) AS b_device_name values(b_interface) AS b_interface values(link_kind) AS link_kind values(link_source) AS link_source values(link_time) AS link_time by adm_row_key \
| eval ifindex=if(mvcount(adm_ifindex_values)==1,mvindex(adm_ifindex_values,0),null()) \
| eval mapping_status=case(mvcount(adm_scope_values)>1 OR mvcount(adm_cluster_values)>1 OR mvcount(adm_mapping_values)>1, "ambiguous", mvcount(adm_mapping_values)==1 AND mvindex(adm_mapping_values,0)=="mapped" AND mvcount(adm_scope_values)==1 AND mvcount(adm_cluster_values)==1, "mapped", mvcount(adm_mapping_values)==1, mvindex(adm_mapping_values,0), true(), "unmapped") \
| eval scope=if(mapping_status=="mapped", mvindex(adm_scope_values,0), null()), cluster=if(mapping_status=="mapped", mvindex(adm_cluster_values,0), null()) \
| eventstats values(eval(if(row_type=="device" AND mapping_status=="mapped",json_array(device_id,scope,cluster),null()))) AS adm_qualified_devices \
| eval adm_device_key=json_array(device_id,scope,cluster), adm_a_key=json_array(a_device,scope,cluster), adm_b_key=json_array(b_device,scope,cluster) \
| eval adm_supported_row=case(row_type=="client_history_status",1,row_type=="device" AND isnotnull(device_id) AND len(trim(device_id))>0,1,row_type=="interface" AND mapping_status=="mapped" AND `adm_mv_has(adm_qualified_devices,adm_device_key)`,1,row_type=="link" AND mapping_status=="mapped" AND a_device!=b_device AND `adm_mv_has(adm_qualified_devices,adm_a_key)` AND `adm_mv_has(adm_qualified_devices,adm_b_key)`,1,true(),0) \
| eventstats count(eval(adm_supported_row==0)) AS adm_unqualified_rows \
| where adm_supported_row==1 OR row_type=="client_history_status" \
| appendpipe [| stats values(adm_client_history_warnings) AS adm_client_history_warnings count(eval(row_type=="device")) AS devices count(eval(row_type=="link")) AS links count(eval(row_type=="interface")) AS interfaces max(adm_unresolved_links) AS unresolved_links max(adm_unqualified_rows) AS unqualified_rows \
    | eval row_type="meta", warnings=mvappend(adm_client_history_warnings,if(devices==0,"No source-qualified network inventory was collected in the selected time window.",null()),if(unqualified_rows>0,"Some inventory records, links, or interfaces have missing, conflicting, or differently scoped device identities and remain unresolved.",null()),if(unresolved_links>0,"Some LLDP peers could not be matched to a unique Kubernetes host in the same scope and cluster; those attachments remain unresolved.",null()),"Nexus Dashboard fabric labels are not yet correlated into V2 inventory; flow observations remain available separately.") ] \
| where row_type!="client_history_status" \
| fields row_type device_id device_authority native_device_id name aliases aci_node role fabric os_version interface ifindex description state warnings devices links interfaces mgmt_ip last_seen serial device_kind scope cluster mapping_status sources evidence_kind overlay_peer_system_ip overlay_peer_color overlay_protocol a_device a_device_name a_interface b_device b_device_name b_interface link_kind link_source link_time routing_domain access_platform client_mac client_ip source_time received_time latest_received_time collected_time source_time_status history_coverage attachment_status attachment_basis attachment_event_time attachment_received_time attachment_collected_time attachment_device_id attachment_device_name attachment_interface ssid_number
description = Source-qualified V2 topology with qualified ACI aliases, roles, NX-OS hostname/version/interfaces, exact scoped Kubernetes host LLDP and FTD inventory. ND fabric labels remain explicitly unsupported in the inventory view.  Device IDs are computed from observed source authority and native identity before grouping. APIC, Meraki network, Catalyst client, Nexus collector/serial, and exact flow-source profiles are explicit. Nexus CDP edges require one endpoint-to-serial candidate and a unique peer serial-to-scope match; unresolved records produce no edge. Meraki association is a wireless_association evidence link; Catalyst connected wired snapshots create a physical attachment link; Meraki custom LLDP requires a unique network/name peer. SD-WAN flow session references remain unjoined. TLOC option records lack a verified scoped event envelope here, so they do not create router inventory or tunnel attribution. Traffic observations remain in graph evidence and do not create topology adjacency. Unmapped scope remains null; duplicate profile keys must be rejected before lookup seeding; there is no default scope.

