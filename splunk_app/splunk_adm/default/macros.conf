| append [| `adm_health_quality_catalyst`] \
| append [| `adm_health_quality_meraki`]
description = Adds explicit V2 profile, identity, raw counter metadata and client-history quality dispositions to the legacy quality view. Positively identified Stream and SD-WAN profiles have separate quality sources; unclassified IPFIX remains uncertainty relevant to both families. Client history emits evaluated counts per source/disposition as well as individual reasons. Unknown counters and sampling remain visible as quality gaps and never become authoritative metrics.

[adm_missed_slot_lookback]
definition = 86400
description = Seconds of expected scheduler slots adm_health_missed_slots checks for the four V1 builders/rollup, the V2 history and summary writers, and both hourly application catalogs (default 24 hours). Raising it only grows the generated slot set; also extend the Scheduler missed-slot alert dispatch.earliest_time to cover this lookback plus one preceding hour, the longest monitored cadence. It does not change any writer's own dispatch window.

[adm_missed_slot_grace]
definition = 600
description = Seconds after a slot's scheduled_time before adm_health_missed_slots will report it missing (default 10 minutes). Slots younger than this are excluded: a legitimate run may still be in flight, or its scheduler.log success may not yet be visible in _internal.

[adm_health_missed_slots]
definition = makeresults \
    | eval adm_end=floor(now()/60)*60, adm_start=adm_end-`adm_missed_slot_lookback`, scheduled_time=mvrange(adm_start, adm_end+60, 60) \
    | mvexpand scheduled_time \
    | eval scheduled_time=floor(scheduled_time), adm_phase=floor(scheduled_time/60)%5 \
    | eval name=case(adm_phase==1, "ADM - Identity builder", adm_phase==2, "ADM - Service binding", adm_phase==3, "ADM - Service backends", adm_phase==0, "ADM - Conversation rollup") \
    | appendpipe [| where adm_phase==1 | eval name="ADM - Network client history builder" | fields name scheduled_time] \
    | appendpipe [| where adm_phase==0 | eval name="ADM - Conversation rollup v2" | fields name scheduled_time] \
    | appendpipe [| where adm_phase==0 | eval name="ADM - Traffic observation rollup v2" | fields name scheduled_time] \
    | appendpipe [| where isnotnull(adm_phase) | eval name="ADM - Application catalog" | fields name scheduled_time] \
    | appendpipe [| where isnotnull(adm_phase) | eval name="ADM - Application catalog v2" | fields name scheduled_time] \
    | where isnotnull(name) AND scheduled_time<=(now()-`adm_missed_slot_grace`) \
    | eval adm_kind="expected" \
    | fields adm_kind name scheduled_time \
    | append [ search index=_internal source=*scheduler.log* app="splunk_adm" savedsearch_name="ADM -*" status=success \
        | where match(sid, "^scheduler__") \
        | eval adm_kind="success", name=savedsearch_name, scheduled_time=floor(scheduled_time) \
        | fields adm_kind name scheduled_time ] \
    | eventstats min(eval(if(adm_kind=="success", scheduled_time, null()))) AS adm_checkpoint BY name \
    | where adm_kind!="expected" OR (name!="ADM - Application catalog" AND name!="ADM - Application catalog v2") OR isnull(adm_checkpoint) OR (scheduled_time-adm_checkpoint)%3600==0 \
    | eventstats max(eval(if(adm_kind=="success", 1, 0))) AS adm_had_success BY name scheduled_time \
    | append [ rest /servicesNS/-/splunk_adm/saved/searches splunk_server=local count=0 \
        | where match(title, "^ADM - ") \
        | rename title AS name \
        | eval adm_kind="config", adm_disabled=tonumber(disabled), adm_is_scheduled=tonumber(is_scheduled) \
        | fields adm_kind name adm_disabled adm_is_scheduled ] \
    | eventstats max(adm_disabled) AS adm_disabled max(adm_is_scheduled) AS adm_is_scheduled BY name \
    | where adm_kind=="expected" AND adm_had_success!=1 AND (isnull(adm_disabled) OR adm_disabled!=1) AND (isnull(adm_is_scheduled) OR adm_is_scheduled!=0) \
    | where isnull(adm_checkpoint) OR scheduled_time>adm_checkpoint \
    | eval reason=if(isnull(adm_checkpoint), "no_successful_checkpoint", "missed_slot"), adm_slot_key=if(isnull(adm_checkpoint), 0, scheduled_time) \
    | dedup name adm_slot_key \
    | eval scheduled_time=if(reason=="missed_slot", scheduled_time, null()) \
    | lookup adm_recovery_state name scheduled_time OUTPUT state AS adm_recovery_status \
    | where isnull(adm_recovery_status) OR adm_recovery_status!="recovered" \
    | append [ | inputlookup strict=true adm_recovery_state \
        | where state!="recovered" AND (record_type="slot" OR record_type="target") \
        | eval reason=if(state="uncertain" OR expires_at<=now(), "uncertain", "in_progress") \
        | fields name scheduled_time reason ] \
    | eval adm_priority=case(reason="uncertain", 0, reason="in_progress", 1, true(), 2), adm_slot_key=coalesce(scheduled_time, -1) \
    | sort 0 adm_priority \
    | dedup name adm_slot_key \
    | eval late_seconds=now()-scheduled_time, scheduled_time_human=strftime(scheduled_time, "%Y-%m-%d %H:%M:%S %Z") \
    | sort - scheduled_time \
    | fields name reason scheduled_time scheduled_time_human late_seconds
description = Reports reason=missed_slot only for unsatisfied scheduled slots strictly after the target's earliest visible scheduler.log status=success with a scheduler__ SID. Monitored targets use five-minute cadences except both hourly application catalogs, whose expected slots are whole hours after their checkpoints, so the check does not depend on the server or search user's time zone. A target with no such checkpoint yields exactly one reason=no_successful_checkpoint row without scheduled_time. Disabled or explicitly unscheduled targets are excluded; unknown schedule flags do not suppress reporting. Slots younger than adm_missed_slot_grace are excluded. The saved alert searches adm_missed_slot_lookback plus one preceding hour. Slots before first observed operation are not reported. A pre-pause checkpoint remains valid after resume: unsatisfied maintenance slots are real gaps and remain reported. Verified recovered slots are excluded using durable KV state. Nonterminal claims remain visible as in_progress, or uncertain after lease expiry, even while schedules are paused or history ages out. Manual replay alone is not scheduler success evidence. scheduled_time is the original scheduled slot, not dispatch_time.

[adm_recovery_scheduler_history]
definition = search index=_internal source=*scheduler.log* app="splunk_adm" savedsearch_name="ADM -*" | eval scheduled_time=floor(scheduled_time) | fields savedsearch_name scheduled_time status sid
description = Complete scheduler outcomes used by automated assisted recovery. Only scheduler__ successes qualify as checkpoints. Prior execution or failure evidence blocks automatic rollup replay because partial aggregates may already exist; a sid-less skipped record is allowed. Dispatch with the complete 24-hour lookback plus its preceding five-minute checkpoint.

