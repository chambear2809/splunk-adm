| fields adm_pkey adm_c_pkey adm_c_id adm_s_id adm_c_unknown adm_s_unknown adm_tuple adm_blocked adm_catalog_invalid adm_kind \
| appendpipe [| stats max(adm_catalog_invalid) AS adm_catalog_invalid | eval adm_pkey="adm-status", adm_kind="metric-status"] \
| where isnotnull(adm_pkey) \
| eventstats sum(eval(mvcount(adm_pkey))) AS adm_expand_expected \
| mvexpand adm_pkey \
| eventstats count AS adm_expand_actual max(adm_expand_expected) AS adm_expand_expected max(adm_catalog_invalid) AS adm_catalog_invalid \
| eval adm_catalog_invalid=if(isnull(adm_expand_expected) OR adm_expand_actual!=adm_expand_expected OR adm_catalog_invalid==1, 1, 0), \
    adm_peer=if(adm_pkey==adm_c_pkey, adm_s_id, adm_c_id), adm_unknown=if(adm_pkey==adm_c_pkey, adm_s_unknown, adm_c_unknown) \
| fields adm_pkey adm_peer adm_unknown adm_tuple adm_blocked adm_catalog_invalid adm_kind
description = Minimal evidence per pod/tuple, with expected-versus-actual checks around expansion and an always-present status sentinel. Observers and buckets do not multiply distinct conversations.

[adm_catalog_build_status]
definition = `adm_catalog_metrics` \
| `adm_catalog_append_kv(adm_service_workload)` \
| eval adm_kind=coalesce(adm_kind, "binding"), \
    adm_pkey=if(adm_kind=="binding", json_array(cluster, namespace, pod_uid), adm_pkey), \
    adm_ref=if(adm_kind=="binding", json_object("service", service, "environment", coalesce(environment, ""), "cluster", coalesce(cluster, ""), "namespace", coalesce(namespace, ""), "first", tonumber(first_seen), "last", tonumber(last_seen)), null()), \
    adm_binding_first=if(adm_kind=="binding", tonumber(first_seen), null()), adm_binding_last=if(adm_kind=="binding", tonumber(last_seen), null()), adm_binding_pod=if(adm_kind=="binding", pod_uid, null()) \
| stats values(adm_ref) AS adm_refs values(adm_tuple) AS adm_tuples values(adm_peer) AS adm_peers \
    values(eval(if(adm_blocked==1, adm_tuple, null()))) AS adm_blocked_tuples values(eval(if(adm_unknown==1, adm_peer, null()))) AS adm_unknown_peers \
    values(adm_binding_pod) AS adm_binding_pods min(adm_binding_first) AS adm_binding_first max(adm_binding_last) AS adm_binding_last max(adm_catalog_invalid) AS adm_catalog_invalid by adm_pkey \
| eventstats max(adm_catalog_invalid) AS adm_invalid \
| appendpipe [| where coalesce(adm_invalid, 0)==0 AND isnotnull(adm_refs) \
| eventstats sum(eval(mvcount(adm_refs))) AS adm_refs_expected \
| mvexpand adm_refs \
| eventstats count AS adm_refs_actual max(adm_refs_expected) AS adm_refs_expected \
| where adm_refs_actual==adm_refs_expected \
| eval service=json_extract(adm_refs, "service"), environment=json_extract(adm_refs, "environment"), cluster=json_extract(adm_refs, "cluster"), namespace=json_extract(adm_refs, "namespace"), adm_binding_first=json_extract(adm_refs, "first"), adm_binding_last=json_extract(adm_refs, "last") \
| stats dc(adm_binding_pods) AS pods min(adm_binding_first) AS first_seen max(adm_binding_last) AS last_seen dc(adm_peers) AS peers dc(adm_tuples) AS conversations_1h \
    dc(adm_blocked_tuples) AS blocked_1h dc(adm_unknown_peers) AS unknown_peers_1h by service environment cluster namespace \
| addinfo \
| eval _key=sha256(json_array(service, environment, cluster, namespace)), first_seen=floor(first_seen), last_seen=floor(last_seen), updated=floor(now()), window_start=floor(info_min_time), window_end=floor(info_max_time) \
| fields _key service environment cluster namespace pods first_seen last_seen peers conversations_1h blocked_1h unknown_peers_1h updated window_start window_end \
    | eval adm_kind="result"] \
| eventstats count(eval(adm_kind=="result")) AS adm_results \
| appendpipe [| stats max(adm_invalid) AS adm_invalid max(eval(if(isnotnull(adm_refs), 1, 0))) AS adm_had_refs max(adm_results) AS adm_results \
    | eval adm_kind="status", adm_catalog_invalid=if(coalesce(adm_invalid, 0)==1 OR (adm_had_refs==1 AND adm_results==0), 1, 0)] \
| where adm_kind=="result" OR adm_kind=="status" \
| fields _key service environment cluster namespace pods first_seen last_seen peers conversations_1h blocked_1h unknown_peers_1h updated window_start window_end adm_kind adm_catalog_invalid
description = Internal catalog computation with one completeness status row. The status survives empty bindings and failed reference expansion; no second computation or capped subsearch is used.

