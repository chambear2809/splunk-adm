definition = `adm_traffic_evidence_v2("$client$","$server$","$port$","$transport$")` | where rollup_id="$observation_id$"
description = Read-only exact traffic observation evidence selected by its source-preserving identity and tuple. Different scopes or observers with the same tuple are excluded.

[adm_trace_evidence(1)]
args = trace
validation = match(trace, "^[0-9a-f]{16,32}\z")
errormsg = Invalid trace evidence identifier.
definition = search `adm_index_traces` `adm_traces_sourcetype` trace_id="$trace$" | fields _time trace_id span_id parent_span_id name kind status start_time end_time "service.name" "deployment.environment.name" "k8s.namespace.name" "k8s.cluster.name" "k8s.pod.uid" attributes
description = Read-only spans for one exact lowercase hexadecimal trace identifier in the dispatch window. Fields follow the OTel translator schema; the call does not manufacture a span duration or peer fields.

# ---- applications catalog and exact Find ----
[adm_catalog_edges]
definition = search `adm_index_summary` source="adm:conversation" adm_record="conversation" \
| where isnotnull(client_ip) AND isnotnull(server_ip) AND isnotnull(transport) \
| `adm_summary_dedup` \
| eval scope=coalesce(scope, ""), adm_bfs=tonumber(first_seen), adm_bls=tonumber(last_seen) \
| lookup local=true adm_ip_identity ip AS client_ip scope OUTPUT desc AS adm_c_desc \
| lookup local=true adm_ip_identity ip AS server_ip scope OUTPUT desc AS adm_s_desc \
| eval adm_catalog_invalid=if(mvcount(adm_c_desc)>=`adm_identity_max_matches` OR mvcount(adm_s_desc)>=`adm_identity_max_matches`, 1, 0) \
| `adm_resolve(c, client_ip)` | `adm_resolve(s, server_ip)` \
| eval adm_c_pkey=if(adm_c_kind=="pod", json_array(adm_c_cluster, adm_c_ns, adm_c_uid), null()), \
