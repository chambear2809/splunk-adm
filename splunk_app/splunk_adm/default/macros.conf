[adm_graph_traffic_context_v2(4)]
args = service, environment, cluster, namespace
validation = match(service, "^[A-Za-z0-9][A-Za-z0-9._:/@-]{0,254}\z") AND match(environment, "^[A-Za-z0-9][A-Za-z0-9._-]{0,127}\z") AND match(cluster, "^[A-Za-z0-9][A-Za-z0-9._-]{0,252}\z") AND match(namespace, "^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?\z")
errormsg = Invalid graph arguments.
definition = `adm_index_summary_v2` source="adm:traffic_observation" adm_record="traffic_observation" contract_version=2 cluster="$cluster$" adm_profile_status="mapped" \
| addinfo \
| eval adm_requested_cluster="$cluster$" \
| lookup local=true adm_cilium_cluster_settings cluster AS adm_requested_cluster OUTPUT _key AS adm_cilium_setting_keys mapping_status AS adm_cilium_setting_status lb_mode AS adm_cluster_lb_mode ingress_mode AS adm_cluster_ingress_mode l2announcements_enabled AS adm_cluster_l2_enabled \
| eval adm_cilium_setting_count=mvcount(adm_cilium_setting_keys) \
| where adm_cilium_setting_count==1 AND mvindex(adm_cilium_setting_status,0)=="mapped" AND mvindex(adm_cluster_lb_mode,0) IN ("snat","dsr") AND mvindex(adm_cluster_ingress_mode,0) IN ("dedicated","shared") AND mvindex(adm_cluster_l2_enabled,0) IN (0,1) \
| eval traffic_observation_id=coalesce(rollup_id, traffic_observation_id) \
| where _time>=info_min_time AND _time<info_max_time AND isnotnull(traffic_observation_id) AND isnotnull(scope) AND isnotnull(source_ip) AND isnotnull(destination_ip) AND records==1 AND adm_quality_status IN ("accepted","accepted_with_warning") \
| dedup traffic_observation_id \
| lookup local=true adm_ip_identity ip AS source_ip scope AS scope OUTPUT _key AS adm_source_owner_keys \
| eval adm_source_owner_keys=if(mvcount(adm_source_owner_keys)>=`adm_identity_max_matches`, "__source_owner_cap__", coalesce(adm_source_owner_keys, "__no_source_owner__")) \
| eventstats sum(eval(mvcount(adm_source_owner_keys))) AS adm_source_owner_expected BY traffic_observation_id \
| mvexpand adm_source_owner_keys \
| eventstats count AS adm_source_owner_actual max(adm_source_owner_expected) AS adm_source_owner_expected BY traffic_observation_id \
| where adm_source_owner_actual==adm_source_owner_expected \
| lookup local=true adm_ip_identity _key AS adm_source_owner_keys OUTPUT cluster AS adm_source_owner_cluster namespace AS adm_source_owner_namespace valid_from AS adm_source_owner_from valid_end AS adm_source_owner_to \
| eval adm_source_owner_active=if(adm_source_owner_keys!="__no_source_owner__" AND adm_source_owner_keys!="__source_owner_cap__" AND tonumber(adm_source_owner_from)<=last_seen AND (isnull(tonumber(adm_source_owner_to)) OR tonumber(adm_source_owner_to)>first_seen), 1, 0) \
| eventstats max(adm_source_owner_active) AS adm_source_identity_conflict max(eval(if(adm_source_owner_keys=="__source_owner_cap__", 1, 0))) AS adm_source_identity_capped BY traffic_observation_id \
| where coalesce(adm_source_identity_conflict,0)==0 AND coalesce(adm_source_identity_capped,0)==0 \
| lookup local=true adm_network_client_history scope AS scope client_ip AS source_ip OUTPUT _key AS adm_client_candidate_keys \
| eval adm_client_candidate_rows=mvcount(adm_client_candidate_keys) \
| where adm_client_candidate_rows>0 AND adm_client_candidate_rows<`adm_identity_max_matches` \
| eventstats sum(adm_client_candidate_rows) AS adm_client_candidate_expected BY traffic_observation_id \
| mvexpand adm_client_candidate_keys \
| eventstats count AS adm_client_candidate_actual max(adm_client_candidate_expected) AS adm_client_candidate_expected BY traffic_observation_id \
| where adm_client_candidate_actual==adm_client_candidate_expected \
| lookup local=true adm_network_client_history _key AS adm_client_candidate_keys OUTPUT source AS adm_client_source source_authority AS adm_client_authority native_id AS adm_client_native \
| dedup traffic_observation_id adm_client_source adm_client_authority adm_client_native \
| lookup local=true adm_network_client_history source AS adm_client_source source_authority AS adm_client_authority native_id AS adm_client_native OUTPUT _key AS adm_timeline_keys \
| eval adm_timeline_count=mvcount(adm_timeline_keys) \
| eventstats max(eval(if(isnull(adm_timeline_count) OR adm_timeline_count==0 OR adm_timeline_count>=`adm_identity_max_matches`,1,0))) AS adm_timeline_incomplete sum(adm_timeline_count) AS adm_timeline_total_expected BY traffic_observation_id \
| where adm_timeline_incomplete==0 \
| eventstats sum(adm_timeline_count) AS adm_timeline_expected BY traffic_observation_id adm_client_source adm_client_authority adm_client_native \
| mvexpand adm_timeline_keys \
| eventstats count AS adm_timeline_actual max(adm_timeline_expected) AS adm_timeline_expected BY traffic_observation_id adm_client_source adm_client_authority adm_client_native \
| eventstats count AS adm_timeline_total_actual max(adm_timeline_total_expected) AS adm_timeline_total_expected max(eval(if(adm_timeline_actual!=adm_timeline_expected,1,0))) AS adm_timeline_expansion_incomplete BY traffic_observation_id \
| where adm_timeline_expansion_incomplete==0 AND adm_timeline_total_actual==adm_timeline_total_expected \
| lookup local=true adm_network_client_history _key AS adm_timeline_keys OUTPUT _key AS adm_timeline_event_key client_mac AS adm_client_mac client_ip AS adm_client_ip scope AS adm_client_scope cluster AS adm_client_cluster profile AS adm_client_profile mapping_status AS adm_client_mapping source_time AS adm_client_source_time received_time AS adm_client_received collected_time AS adm_client_collected event_type AS adm_client_event_type quality_reason AS adm_client_quality_reason client_type AS adm_client_type connected_device_type AS adm_connected_device_type interface AS adm_client_interface routing_domain AS adm_client_routing_domain attachment_status AS adm_client_status attachment_basis AS adm_client_basis attachment_device_id AS adm_attachment_device_id attachment_device_name AS adm_attachment_device_name attachment_device_mac AS adm_attachment_device_mac device_serial AS adm_client_serial ssid_number AS adm_ssid \
| eval adm_client_semantic_key=sha256(json_array(tostring(coalesce(adm_client_source,"")),tostring(coalesce(adm_client_authority,"")),tostring(coalesce(adm_client_native,"")),tostring(coalesce(adm_client_routing_domain,"")),tostring(coalesce(adm_client_scope,"")),tostring(coalesce(adm_client_cluster,"")),tostring(coalesce(adm_client_profile,"")),tostring(coalesce(adm_client_mapping,"")),tostring(coalesce(adm_client_mac,"")),tostring(coalesce(adm_client_ip,"")),tostring(coalesce(adm_client_source_time,"")),tostring(coalesce(adm_client_event_type,"")),tostring(coalesce(adm_client_type,"")),tostring(coalesce(adm_connected_device_type,"")),tostring(coalesce(adm_client_status,"")),tostring(coalesce(adm_client_basis,"")),tostring(coalesce(adm_attachment_device_id,"")),tostring(coalesce(adm_attachment_device_name,"")),tostring(coalesce(adm_attachment_device_mac,"")),tostring(coalesce(adm_client_serial,"")),tostring(coalesce(adm_ssid,"")),tostring(coalesce(adm_client_interface,"")),tostring(coalesce(adm_client_quality_reason,"")))) \
| eventstats min(adm_client_received) AS adm_client_received BY traffic_observation_id adm_client_semantic_key \
| dedup traffic_observation_id adm_client_semantic_key \
| eval adm_timeline_event_key=adm_client_semantic_key \
| eval adm_client_time=tonumber(adm_client_source_time), adm_client_received=tonumber(adm_client_received), \
  adm_client_event_time=if(adm_client_source=="meraki_association", adm_client_time, adm_client_received) \
| eventstats max(eval(if(adm_client_event_time<=first_seen, adm_client_event_time, null()))) AS adm_latest_client_event min(eval(if(adm_client_event_time>first_seen, adm_client_event_time, null()))) AS adm_next_client_event BY traffic_observation_id adm_client_source adm_client_authority adm_client_native \
| eventstats dc(eval(if(adm_client_event_time==adm_latest_client_event, adm_timeline_event_key, null()))) AS adm_latest_identity_claims BY traffic_observation_id adm_client_source adm_client_authority adm_client_native \
| eval adm_client_overlaps=if(adm_client_scope==scope AND adm_client_cluster=="$cluster$" AND adm_client_ip==source_ip \
    AND (isnull(source_mac) OR NOT match(lower(trim(coalesce(adm_client_mac,""))), "^(?:[0-9a-f]{2}:){5}[0-9a-f]{2}$") OR lower(trim(source_mac))==lower(trim(adm_client_mac))) \
    AND (adm_client_event_time==adm_latest_client_event OR (adm_client_event_time>first_seen AND adm_client_event_time<=last_seen)) \
    AND ((adm_client_source=="meraki_association" AND first_seen<=adm_client_event_time+900) \
      OR (adm_client_source=="catalyst_client_snapshot" AND first_seen<=adm_client_event_time+3600)), 1, 0) \
| eventstats dc(eval(if(adm_client_overlaps==1, json_array(adm_client_source, adm_client_authority, adm_client_native), null()))) AS adm_overlapping_client_count BY traffic_observation_id \
| where adm_overlapping_client_count==1 \
| where adm_client_event_time==adm_latest_client_event AND adm_latest_identity_claims==1 AND adm_client_scope==scope AND adm_client_cluster=="$cluster$" AND adm_client_mapping=="mapped" AND adm_client_ip==source_ip \
  AND (isnull(adm_next_client_event) OR last_seen<adm_next_client_event) \
  AND ((adm_client_source=="meraki_association" AND adm_client_basis=="meraki_association_event" AND first_seen<=adm_client_event_time+900 AND last_seen<=adm_client_event_time+900) \
    OR (adm_client_source=="catalyst_client_snapshot" AND adm_client_basis=="catalyst_client_snapshot" AND adm_client_received<info_max_time AND first_seen<=adm_client_event_time+3600 AND last_seen<=adm_client_event_time+3600 AND adm_client_source_time<=adm_client_received+300 AND adm_client_source_time>=adm_client_received-`adm_identity_retention`)) \
  AND (isnull(source_mac) OR lower(trim(source_mac))==lower(trim(coalesce(adm_client_mac,"")))) \
| eval adm_client_valid=if(isnotnull(adm_client_mac) AND match(adm_client_mac,"^(?:[0-9a-f]{2}:){5}[0-9a-f]{2}$") AND isnull(adm_client_quality_reason) AND ((adm_client_source=="meraki_association" AND adm_client_status=="unresolved") OR (adm_client_source=="catalyst_client_snapshot" AND adm_client_type=="wired" AND adm_connected_device_type=="Switch" AND len(trim(coalesce(adm_client_interface,"")))>0 AND adm_client_status=="observed_snapshot")), 1, 0), \
  adm_source_time_status=case(adm_client_source!="catalyst_client_snapshot",null(),isnull(adm_client_source_time),"missing",adm_client_source_time>adm_client_received+300,"ahead",adm_client_source_time<adm_client_received-3600,"stale",true(),"current"), \
  adm_client_id=if(adm_client_valid==1, "network_client:".sha256(json_array(adm_client_source, adm_client_authority, adm_client_native)), null()) \
| where adm_client_valid==1 \
| lookup local=true adm_ip_identity ip AS destination_ip scope AS scope OUTPUT _key AS adm_owner_keys \
| eval adm_owner_candidate_rows=mvcount(adm_owner_keys), adm_owner_keys=if(adm_owner_candidate_rows>=`adm_identity_max_matches`, "__owner_cap__", coalesce(adm_owner_keys, "__no_owner__")) \
| eventstats sum(eval(mvcount(adm_owner_keys))) AS adm_owner_expected BY traffic_observation_id \
| mvexpand adm_owner_keys \
| eventstats count AS adm_owner_actual max(adm_owner_expected) AS adm_owner_expected BY traffic_observation_id \
| where adm_owner_actual==adm_owner_expected \
| lookup local=true adm_ip_identity _key AS adm_owner_keys OUTPUT entity_kind AS adm_owner_kind entity_id AS adm_owner_entity_id entity_name AS adm_owner_name cluster AS adm_owner_cluster namespace AS adm_owner_namespace valid_from AS adm_owner_from valid_end AS adm_owner_to port AS adm_owner_port transport AS adm_owner_transport \
| eval adm_owner_valid=if(adm_owner_cluster=="$cluster$" AND adm_owner_namespace=="$namespace$" AND tonumber(adm_owner_from)<=first_seen AND (isnull(tonumber(adm_owner_to)) OR tonumber(adm_owner_to)>last_seen) AND ((adm_owner_kind=="pod" AND isnotnull(adm_owner_entity_id)) OR (adm_owner_kind=="k8s_service" AND tostring(adm_owner_port)==tostring(server_port) AND adm_owner_transport==transport)), 1, 0), \
  adm_owner_id=case(adm_owner_kind=="pod", "pod:".adm_owner_cluster."/".adm_owner_entity_id, adm_owner_kind=="k8s_service", "k8s_service:".adm_owner_cluster."/".adm_owner_namespace."/".adm_owner_name."/".destination_ip.":".server_port, true(), null()) \
| eval adm_owner_overlaps=if(adm_owner_keys!="__owner_cap__" AND adm_owner_keys!="__no_owner__" AND tonumber(adm_owner_from)<=last_seen AND (isnull(tonumber(adm_owner_to)) OR tonumber(adm_owner_to)>first_seen) AND (adm_owner_kind!="k8s_service" OR (tostring(adm_owner_port)==tostring(server_port) AND adm_owner_transport==transport)), 1, 0) \
| eventstats dc(eval(if(adm_owner_overlaps==1, adm_owner_keys, null()))) AS adm_overlapping_owner_count BY traffic_observation_id \
| where adm_owner_keys!="__owner_cap__" AND adm_owner_valid==1 AND isnotnull(adm_owner_id) AND adm_overlapping_owner_count==1 \
| stats count AS adm_valid_claims dc(adm_client_id) AS adm_client_candidate_count dc(adm_owner_keys) AS adm_owner_candidate_count first(scope) AS scope first(routing_domain) AS routing_domain first(cluster) AS cluster first(source_ip) AS source_ip first(destination_ip) AS destination_ip first(source_port) AS source_port first(destination_port) AS destination_port first(source_mac) AS source_mac first(destination_mac) AS destination_mac first(raw_bytes) AS raw_bytes first(raw_packets) AS raw_packets first(raw_sampling) AS raw_sampling first(counter_semantics) AS counter_semantics first(metrics_authoritative) AS metrics_authoritative first(server_port) AS server_port first(transport) AS transport first(first_seen) AS first_seen first(last_seen) AS last_seen first(received_time) AS received_time first(traffic_observations) AS traffic_observations first(records) AS records first(adm_client_source) AS adm_client_source first(adm_client_authority) AS adm_client_authority first(adm_client_native) AS adm_client_native first(adm_client_mac) AS adm_client_mac first(adm_client_id) AS adm_client_id first(adm_client_profile) AS adm_client_profile first(adm_client_mapping) AS adm_client_mapping first(adm_client_source_time) AS adm_client_source_time first(adm_source_time_status) AS adm_source_time_status first(adm_client_received) AS adm_client_received first(adm_client_collected) AS adm_client_collected first(adm_client_event_type) AS adm_client_event_type first(adm_client_quality_reason) AS adm_client_quality_reason first(adm_client_type) AS adm_client_type first(adm_connected_device_type) AS adm_connected_device_type first(adm_client_interface) AS adm_client_interface first(adm_client_basis) AS adm_client_basis first(adm_attachment_device_id) AS adm_attachment_device_id first(adm_attachment_device_name) AS adm_attachment_device_name first(adm_attachment_device_mac) AS adm_attachment_device_mac first(adm_client_serial) AS adm_client_serial first(adm_ssid) AS adm_ssid first(adm_owner_id) AS adm_owner_id BY traffic_observation_id \
| where adm_valid_claims==1 AND adm_client_candidate_count==1 AND adm_owner_candidate_count==1 \
| eval row_type="edge", id="traffic-observation:".traffic_observation_id, source=adm_client_id, target=adm_owner_id, relationship="traffic_observation", link_kind="traffic_observation", link_source="stream_ipfix", confidence="correlated", count=records, adm_context=1, \
  attachment_evidence="[".json_object("basis",if(adm_client_source=="meraki_association","meraki_association_flow","catalyst_client_snapshot"),"status",if(adm_client_source=="meraki_association","associated","observed_snapshot"),"event_time",tonumber(adm_client_source_time),"received_time",tonumber(adm_client_received),"collected_time",tonumber(adm_client_collected),"device_id",adm_attachment_device_id,"device_name",adm_attachment_device_name,"device_mac",adm_attachment_device_mac,"device_serial",adm_client_serial,"ssid_number",adm_ssid,"client_source",adm_client_source,"client_authority",adm_client_authority,"client_native_id",adm_client_native)."]" \
| appendpipe [| eval row_type="node", adm_context_edge_id="traffic-observation:".traffic_observation_id, id=adm_client_id, label=coalesce(adm_client_mac, adm_client_native), kind="client", endpoint_kind="network_client", cluster="$cluster$", addresses=source_ip, attr_scope=scope, attr_routing_domain=routing_domain, attr_source=adm_client_source, attr_source_authority=adm_client_authority, attr_native_id=adm_client_native, attr_client_mac=adm_client_mac, attr_profile=adm_client_profile, attr_mapping_status=adm_client_mapping, attr_event_type=adm_client_event_type, attr_quality_reason=adm_client_quality_reason, attr_source_time_status=adm_source_time_status, attr_history_coverage=if(adm_client_source=="catalyst_client_snapshot","retained_evidence",null()), attr_source_time=if(isnotnull(adm_client_source_time), tostring(adm_client_source_time), null()), attr_received_time=if(isnotnull(adm_client_received), tostring(adm_client_received), null()), attr_collected_time=if(isnotnull(adm_client_collected), tostring(adm_client_collected), null()), attr_client_type=adm_client_type, attr_connected_device_type=adm_connected_device_type, attr_interface=adm_client_interface, attr_access_platform=if(adm_client_source=="meraki_association", "wireless", "wired"), attr_attachment_basis=if(adm_client_source=="meraki_association", "meraki_association_flow", "catalyst_client_snapshot"), attr_attachment_status=if(adm_client_source=="meraki_association", "associated", "observed_snapshot"), attr_attachment_confidence="correlated", attr_attachment_event_time=if(adm_client_source=="meraki_association" AND isnotnull(adm_client_source_time), tostring(adm_client_source_time), null()), attr_attachment_received_time=if(isnotnull(adm_client_received), tostring(adm_client_received), null()), attr_attachment_collected_time=if(isnotnull(adm_client_collected), tostring(adm_client_collected), null()), attr_attachment_device_id=adm_attachment_device_id, attr_attachment_device_name=adm_attachment_device_name, attr_attachment_device_mac=adm_attachment_device_mac, attr_ssid_number=adm_ssid, attr_device_serial=adm_client_serial] \
| fields row_type id label kind endpoint_kind namespace cluster addresses reason source target relationship link_kind link_source confidence count records scope routing_domain source_ip destination_ip source_port destination_port server_port transport first_seen last_seen received_time traffic_observation_id source_mac destination_mac raw_bytes raw_packets raw_sampling counter_semantics metrics_authoritative traffic_observations attachment_evidence attr_* adm_context adm_context_edge_id
description = V2 context edges require exactly one time-valid source-qualified client-history row and exactly one already-known app service or pod identity for the destination IP in the same scope, cluster and namespace. Catalyst disconnected snapshots and expired receipt evidence fail closed; old source-update time remains explicitly labeled stale context within retained-history limits; Meraki association evidence expires after 15 minutes. No arbitrary IP endpoint nodes are created and context does not change route adjacency or authoritative metrics.

[adm_graph_handoff_coverage_v2]
definition = eventstats dc(eval(if(adm_row=="hconn",adm_cid,null()))) AS adm_v2_handoff_total \
    dc(eval(if(adm_row=="hconn" AND isnotnull(handoff_basis) AND mvcount(adm_targets)>0,adm_cid,null()))) AS adm_v2_handoff_determined BY adm_fe_id \
| eval adm_v2_handoff_unresolved=adm_v2_handoff_total-adm_v2_handoff_determined, \
    adm_v2_handoff_coverage=case(adm_v2_handoff_total==0,null(),adm_v2_handoff_determined==0,"unresolved",adm_v2_handoff_determined<adm_v2_handoff_total,"partial",true(),"complete") \
| eval adm_node_out=if(adm_row=="node_src" AND adm_v2_handoff_total>0 AND isnotnull(adm_fe_id), \
    "1#".json_set(replace(adm_node_out,"^[0-9]+#",""), \
      "attr_handoff_coverage",adm_v2_handoff_coverage, \
      "attr_handoff_connections",tostring(adm_v2_handoff_total), \
      "attr_handoff_determined",tostring(adm_v2_handoff_determined), \
      "attr_handoff_unresolved",tostring(adm_v2_handoff_unresolved)),adm_node_out) \
| fields - adm_v2_handoff_total adm_v2_handoff_determined adm_v2_handoff_unresolved adm_v2_handoff_coverage
description = V2-only coverage of distinct client connections represented in the handoff stage. A shared frontend with missing backend evidence remains partial or unresolved even when other clients support an observed aggregate forwarding edge. These counts describe represented evidence, not all network traffic.

[adm_graph_client_handoff_inputs_v2]
definition = eval adm_v2_handoff_input_relevant=if(adm_row=="xlate" OR adm_row=="l7" OR (adm_row=="conv" AND ((adm_keep==1 AND adm_s_kind=="k8s_service") OR (adm_s_kind=="pod" AND (flow_source=="hubble" OR adm_c_kind=="k8s_node")))),1,0) \
| eventstats max(eval(if(adm_v2_handoff_input_relevant==1 AND (coalesce(conns_capped,0)==1 OR coalesce(adm_capped,0)==1 OR coalesce(mvcount(adm_conns),0)==0),1,0))) AS adm_v2_handoff_input_incomplete \
| fields - adm_v2_handoff_input_relevant
description = Capture relevant frontend/backend connection-list incompleteness before handoff consumption removes explained connections. Conservatively withhold all V2 client handoffs in this graph when a relevant input is capped or has no connection list; retained singleton matches cannot prove that truncated evidence omitted no competing target.

[adm_graph_client_handoffs_v2]
definition = eval adm_ch_key=case(adm_row=="hconn",json_array(adm_fe_cid,adm_fe_id,tostring(server_port),transport), \
    adm_row=="conv" AND adm_s_kind=="k8s_service",json_array(adm_c_id,adm_s_id,tostring(server_port),transport), \
    adm_row=="edge" AND relationship=="communicates_with" AND match(target,"^k8s_service:"),json_array(source,target,tostring(server_port),transport)), \
    adm_ch_input_incomplete=if((adm_row=="conv" AND adm_fe==1 AND coalesce(mvcount(adm_conns),0)==0) OR coalesce(adm_capped,0)==1 OR coalesce(conns_capped,0)==1 OR coalesce(adm_ecapped,0)==1 OR (adm_row=="hconn" AND isnull(adm_cid)),1,0) \
| eventstats count(eval(adm_row=="backend")) AS adm_ch_backends_read count(eval(adm_row=="pod")) AS adm_ch_pods_read max(adm_scope_capped) AS adm_ch_scope_capped max(adm_v2_handoff_input_incomplete) AS adm_ch_source_incomplete \
| eventstats max(adm_ch_input_incomplete) AS adm_ch_pair_incomplete BY adm_ch_key \
| appendpipe [| where adm_row=="hconn" AND isnotnull(adm_cid) AND isnotnull(adm_ch_key) \
    | eval adm_ch_observers=if(handoff_basis!="time_inferred",mvdedup(mvmap(adm_match,if(mvindex(split(adm_match,"|"),3)==mvindex(adm_targets,0) AND len(mvindex(split(adm_match,"|"),4))>0,"hubble:".mvindex(split(adm_match,"|"),4),null()))),null()) \
    | stats values(adm_targets) AS adm_ch_targets values(handoff_basis) AS adm_ch_bases values(via_node) AS adm_ch_via values(adm_ch_observers) AS adm_ch_observers values(scope) AS adm_ch_scopes \
        max(adm_ch_pair_incomplete) AS adm_ch_incomplete max(adm_ch_backends_read) AS adm_ch_backends_read max(adm_ch_pods_read) AS adm_ch_pods_read max(adm_ch_scope_capped) AS adm_ch_scope_capped max(adm_ch_source_incomplete) AS adm_ch_source_incomplete BY adm_ch_key adm_cid \
    | eval adm_ch_valid=if(mvcount(adm_ch_targets)==1 AND len(mvindex(adm_ch_targets,0))>0 AND match(mvindex(adm_ch_targets,0),"^pod:[^/]+/[^/]+$") AND mvcount(adm_ch_bases)==1 AND in(mvindex(adm_ch_bases,0),"hubble_client_tuple","hubble_xlate","l7_forwarded_for","time_inferred"),1,0), \
        adm_ch_incomplete=if(adm_ch_incomplete==1 OR coalesce(adm_ch_source_incomplete,1)!=0 OR adm_ch_backends_read>=`adm_kv_max_rows` OR adm_ch_pods_read>=`adm_kv_max_rows` OR adm_ch_scope_capped==1 OR mvcount(adm_ch_scopes)!=1 OR len(mvindex(adm_ch_scopes,0))==0,1,0) \
    | eventstats count AS adm_ch_total sum(adm_ch_valid) AS adm_ch_determined dc(adm_ch_scopes) AS adm_ch_scope_count BY adm_ch_key \
    | eval adm_ch_group=if(adm_ch_valid==1,json_array(mvindex(adm_ch_targets,0),mvindex(adm_ch_bases,0)),"unresolved"), \
        adm_ch_target=if(adm_ch_valid==1,mvindex(adm_ch_targets,0),null()), adm_ch_basis=if(adm_ch_valid==1,mvindex(adm_ch_bases,0),null()) \
    | stats count AS adm_ch_connections values(adm_ch_via) AS adm_ch_via values(adm_ch_observers) AS adm_ch_observers first(adm_ch_target) AS adm_ch_target first(adm_ch_basis) AS adm_ch_basis \
        max(adm_ch_total) AS adm_ch_total max(adm_ch_determined) AS adm_ch_determined max(adm_ch_incomplete) AS adm_ch_incomplete max(adm_ch_scope_count) AS adm_ch_scope_count BY adm_ch_key adm_ch_group \
    | eval adm_ch_incomplete=if(adm_ch_incomplete==1 OR adm_ch_scope_count!=1 OR coalesce(mvcount(adm_ch_via),0)>64 OR coalesce(mvcount(adm_ch_observers),0)>64,1,0), \
        adm_ch_json=if(adm_ch_group!="unresolved",replace(json_object("target",adm_ch_target,"basis",adm_ch_basis,"connections",adm_ch_connections),"}$","").",\"receiving_nodes\":".if(coalesce(mvcount(adm_ch_via),0)>0,mv_to_json_array(adm_ch_via,false()),"[]").",\"observers\":".if(coalesce(mvcount(adm_ch_observers),0)>0,mv_to_json_array(adm_ch_observers,false()),"[]")."}",null()) \
    | stats values(adm_ch_json) AS adm_ch_records count(eval(adm_ch_group!="unresolved")) AS adm_ch_groups max(adm_ch_total) AS adm_ch_total max(adm_ch_determined) AS adm_ch_determined max(adm_ch_incomplete) AS adm_ch_incomplete BY adm_ch_key \
    | eval adm_ch_incomplete=if(adm_ch_incomplete==1 OR adm_ch_groups>64 OR coalesce(mvcount(adm_ch_records),0)!=adm_ch_groups,1,0), \
        adm_ch_coverage=case(adm_ch_incomplete==1,"incomplete",adm_ch_determined==0,"unresolved",adm_ch_determined<adm_ch_total,"partial",true(),"complete"), \
        adm_ch_unresolved=adm_ch_total-adm_ch_determined, adm_ch_records=if(adm_ch_incomplete==1,"[]","[".coalesce(mvjoin(adm_ch_records,","),"")."]"), adm_row="client_handoff_meta" \
    | fields adm_row adm_ch_key adm_ch_total adm_ch_determined adm_ch_unresolved adm_ch_coverage adm_ch_records] \
| eventstats values(adm_ch_coverage) AS adm_ch_coverages values(adm_ch_records) AS adm_ch_evidence max(adm_ch_total) AS adm_ch_total max(adm_ch_determined) AS adm_ch_determined max(adm_ch_unresolved) AS adm_ch_unresolved BY adm_ch_key \
| eval adm_ch_edge=if(adm_row=="edge" AND relationship=="communicates_with" AND match(target,"^k8s_service:"),1,0), \
    client_handoff_coverage=if(adm_ch_edge==1,if(mvcount(adm_ch_coverages)==1 AND mvcount(adm_ch_evidence)==1,mvindex(adm_ch_coverages,0),"incomplete"),null()), \
    client_handoff_connections=if(adm_ch_edge==1,coalesce(adm_ch_total,0),null()), client_handoff_determined=if(adm_ch_edge==1,coalesce(adm_ch_determined,0),null()), client_handoff_unresolved=if(adm_ch_edge==1,coalesce(adm_ch_unresolved,0),null()), \
    client_handoffs=if(adm_ch_edge==1,if(mvcount(adm_ch_coverages)==1 AND mvcount(adm_ch_evidence)==1,mvindex(adm_ch_evidence,0),"[]"),null()) \
| where adm_row!="client_handoff_meta" \
| fields - adm_ch_*
description = V2 client-to-frontend handoffs keyed by the exact selectable edge identity (source, target, server port, transport). Each retained handoff connection must have one backend and one supported evidence basis; missing, conflicting or capped evidence fails closed. Backend/basis counts, receiving-node sets and matching Hubble observers remain associated with this client's represented connections, never borrowed from aggregate frontend forwarding edges. The bounded evidence describes connection subsets, not an ordered packet route, and its raw-tuple connection counts are distinct from identity-deduplicated edge counts.

[adm_graph_v2(4)]
args = service, environment, cluster, namespace
validation = match(service, "^[A-Za-z0-9][A-Za-z0-9._:/@-]{0,254}\z") AND match(environment, "^[A-Za-z0-9][A-Za-z0-9._-]{0,127}\z") AND match(cluster, "^[A-Za-z0-9][A-Za-z0-9._-]{0,252}\z") AND match(namespace, "^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?\z")
errormsg = Invalid graph arguments: service may contain letters, numbers and . _ : / @ - (max 255); environment letters, numbers and . _ - (max 128); cluster letters, numbers and . _ - (max 253); namespace must be a Kubernetes namespace name.
definition = `adm_graph_inputs_v2("$service$", "$environment$", "$cluster$", "$namespace$")` \
| `adm_graph_cluster_settings_v2("$cluster$")` \
| `adm_graph_resolve("$service$", "$environment$", "$cluster$", "$namespace$")` \
| `adm_graph_cluster_settings_v2("$cluster$")` \
| `adm_graph_client_handoff_inputs_v2` \
| `adm_graph_handoffs("$service$", "$environment$", "$cluster$", "$namespace$")` \
| `adm_graph_handoff_coverage_v2` \
| `adm_graph_edges("$service$", "$environment$", "$cluster$", "$namespace$")` \
| `adm_graph_contracts("$service$", "$environment$", "$cluster$", "$namespace$")` \
| `adm_graph_client_handoffs_v2` \
| `adm_graph_output("$service$", "$environment$", "$cluster$", "$namespace$")` \
| eval adm_context=0 \
| append [search `adm_graph_traffic_context_v2("$service$", "$environment$", "$cluster$", "$namespace$")` | eval adm_context=1] \
| eventstats max(eval(if(adm_context==0 AND row_type=="meta", tonumber(root_present), null()))) AS adm_graph_root \
    values(eval(if(adm_context==0 AND row_type=="node", id, null()))) AS adm_existing_node_ids \
| eventstats values(eval(if(adm_context==1 AND row_type=="edge" AND `adm_mv_has(adm_existing_node_ids, target)`, id, null()))) AS adm_visible_context_edges \
| where adm_context==0 OR (adm_graph_root==1 AND ((row_type=="edge" AND `adm_mv_has(adm_existing_node_ids, target)`) OR (row_type=="node" AND `adm_mv_has(adm_visible_context_edges, adm_context_edge_id)`))) \
| eval adm_context_node_original=if(adm_context==1 AND row_type=="node" AND endpoint_kind=="network_client", 1, 0) \
| appendpipe [| where adm_context_node_original==1 \
    | stats latest(label) AS label values(kind) AS kind values(endpoint_kind) AS endpoint_kind values(namespace) AS namespaces values(cluster) AS clusters values(addresses) AS addresses \
      values(attr_scope) AS attr_scopes values(attr_routing_domain) AS attr_routing_domains values(attr_source) AS attr_sources values(attr_source_authority) AS attr_authorities values(attr_native_id) AS attr_native_ids values(attr_client_mac) AS attr_client_macs \
      values(attr_profile) AS attr_profiles values(attr_mapping_status) AS attr_mapping_statuses values(attr_event_type) AS attr_event_types values(attr_quality_reason) AS attr_quality_reasons values(attr_client_type) AS attr_client_types values(attr_connected_device_type) AS attr_connected_device_types values(attr_interface) AS attr_interfaces values(attr_access_platform) AS attr_platforms \
      values(attr_attachment_basis) AS attr_attachment_bases values(attr_attachment_status) AS attr_attachment_statuses values(attr_attachment_device_id) AS attr_attachment_device_ids values(attr_attachment_device_name) AS attr_attachment_device_names values(attr_attachment_device_mac) AS attr_attachment_device_macs values(attr_ssid_number) AS attr_ssids values(attr_device_serial) AS attr_device_serials \
      values(attr_source_time_status) AS attr_source_time_statuses values(attr_history_coverage) AS attr_history_coverages values(attr_source_time) AS attr_source_times values(attr_received_time) AS attr_received_times values(attr_collected_time) AS attr_collected_times values(attr_attachment_event_time) AS attr_attachment_event_times values(attr_attachment_received_time) AS attr_attachment_received_times values(attr_attachment_collected_time) AS attr_attachment_collected_times \
      values(adm_context_edge_id) AS adm_context_edge_id BY id \
    | eval namespace=if(mvcount(namespaces)==1,mvindex(namespaces,0),null()), cluster=if(mvcount(clusters)==1,mvindex(clusters,0),null()), addresses=mvjoin(mvdedup(addresses),"|"), \
      attr_scope=if(mvcount(attr_scopes)==1,mvindex(attr_scopes,0),null()), attr_routing_domain=if(mvcount(attr_routing_domains)==1,mvindex(attr_routing_domains,0),null()), \
      attr_source=if(mvcount(attr_sources)==1,mvindex(attr_sources,0),null()), attr_source_authority=if(mvcount(attr_authorities)==1,mvindex(attr_authorities,0),null()), attr_native_id=if(mvcount(attr_native_ids)==1,mvindex(attr_native_ids,0),null()), attr_client_mac=if(mvcount(attr_client_macs)==1,mvindex(attr_client_macs,0),null()), \
      attr_profile=if(mvcount(attr_profiles)==1,mvindex(attr_profiles,0),null()), attr_mapping_status=if(mvcount(attr_scopes)>1 OR mvcount(clusters)>1 OR mvcount(attr_mapping_statuses)>1,"ambiguous",if(mvcount(attr_mapping_statuses)==1,mvindex(attr_mapping_statuses,0),"unmapped")), \
      attr_event_type=case(mvcount(attr_event_types)==1,mvindex(attr_event_types,0),mvcount(attr_event_types)>1,"varied",true(),null()), attr_quality_reason=case(mvcount(attr_quality_reasons)==1,mvindex(attr_quality_reasons,0),mvcount(attr_quality_reasons)>1,"varied",true(),null()), \
      attr_client_type=case(mvcount(attr_client_types)==1,mvindex(attr_client_types,0),mvcount(attr_client_types)>1,"varied",true(),null()), attr_connected_device_type=case(mvcount(attr_connected_device_types)==1,mvindex(attr_connected_device_types,0),mvcount(attr_connected_device_types)>1,"varied",true(),null()), attr_interface=case(mvcount(attr_interfaces)==1,mvindex(attr_interfaces,0),mvcount(attr_interfaces)>1,"varied",true(),null()), attr_access_platform=case(mvcount(attr_platforms)==1,mvindex(attr_platforms,0),mvcount(attr_platforms)>1,"varied",true(),null()), \
      attr_attachment_basis=case(mvcount(attr_attachment_bases)==1,mvindex(attr_attachment_bases,0),mvcount(attr_attachment_bases)>1,"varied",true(),null()), attr_attachment_status=if(mvcount(attr_attachment_device_ids)>1 OR mvcount(attr_attachment_bases)>1 OR mvcount(attr_attachment_statuses)>1,"varied",if(mvcount(attr_attachment_statuses)==1,mvindex(attr_attachment_statuses,0),"unavailable")), \
      attr_attachment_device_id=if(mvcount(attr_attachment_device_ids)==1,mvindex(attr_attachment_device_ids,0),null()), attr_attachment_device_name=case(mvcount(attr_attachment_device_names)==1,mvindex(attr_attachment_device_names,0),mvcount(attr_attachment_device_names)>1,"varied",true(),null()), attr_attachment_device_mac=case(mvcount(attr_attachment_device_macs)==1,mvindex(attr_attachment_device_macs,0),mvcount(attr_attachment_device_macs)>1,"varied",true(),null()), \
      attr_ssid_number=case(mvcount(attr_ssids)==1,mvindex(attr_ssids,0),mvcount(attr_ssids)>1,"varied",true(),null()), attr_device_serial=case(mvcount(attr_device_serials)==1,mvindex(attr_device_serials,0),mvcount(attr_device_serials)>1,"varied",true(),null()), \
      attr_source_time_status=case(mvcount(attr_source_time_statuses)==1,mvindex(attr_source_time_statuses,0),mvcount(attr_source_time_statuses)>1,"varied",true(),null()), attr_history_coverage=case(mvcount(attr_history_coverages)==1,mvindex(attr_history_coverages,0),mvcount(attr_history_coverages)>1,"varied",true(),null()), \
      attr_source_time=case(mvcount(attr_source_times)==1,mvindex(attr_source_times,0),mvcount(attr_source_times)>1,"varied",true(),null()), attr_received_time=case(mvcount(attr_received_times)==1,mvindex(attr_received_times,0),mvcount(attr_received_times)>1,"varied",true(),null()), attr_collected_time=case(mvcount(attr_collected_times)==1,mvindex(attr_collected_times,0),mvcount(attr_collected_times)>1,"varied",true(),null()), \
      attr_attachment_event_time=case(mvcount(attr_attachment_event_times)==1,mvindex(attr_attachment_event_times,0),mvcount(attr_attachment_event_times)>1,"varied",true(),null()), attr_attachment_received_time=case(mvcount(attr_attachment_received_times)==1,mvindex(attr_attachment_received_times,0),mvcount(attr_attachment_received_times)>1,"varied",true(),null()), attr_attachment_collected_time=case(mvcount(attr_attachment_collected_times)==1,mvindex(attr_attachment_collected_times,0),mvcount(attr_attachment_collected_times)>1,"varied",true(),null()), row_type="node", adm_context_node_original=1, adm_context_node_final=1] \
| where adm_context_node_original!=1 OR adm_context_node_final==1 \
| fields - adm_context adm_graph_root adm_existing_node_ids adm_visible_context_edges adm_context_edge_id adm_context_node_original adm_context_node_final namespaces clusters attr_scopes attr_routing_domains attr_sources attr_authorities attr_native_ids attr_client_macs attr_profiles attr_mapping_statuses attr_event_types attr_quality_reasons attr_client_types attr_connected_device_types attr_interfaces attr_platforms attr_attachment_bases attr_attachment_statuses attr_attachment_device_ids attr_attachment_device_names attr_attachment_device_macs attr_ssids attr_device_serials attr_source_time_statuses attr_history_coverages attr_source_times attr_received_times attr_collected_times attr_attachment_event_times attr_attachment_received_times attr_attachment_collected_times
description = Version-2 dependency graph plus client and traffic context joined only to target IDs already rendered by this exact application graph. Context evidence remains outside route adjacency and authoritative counters.

[adm_graph_cluster_settings_v2(1)]
args = requested_cluster
validation = match(requested_cluster, "^[A-Za-z0-9][A-Za-z0-9._-]{0,252}\z")
errormsg = Invalid requested cluster.
definition = eval adm_v2_requested_cluster=case(adm_row=="conv" AND isnotnull(adm_s_cluster), adm_s_cluster, adm_row=="route" AND isnotnull(cluster), cluster, true(), "$requested_cluster$") \
| lookup local=true adm_cilium_cluster_settings cluster AS adm_v2_requested_cluster OUTPUT _key AS adm_v2_setting_keys mapping_status AS adm_v2_setting_status lb_mode AS adm_v2_lb_modes ingress_mode AS adm_v2_ingress_modes l2announcements_enabled AS adm_v2_l2_values \
| eval adm_v2_setting_rows=mvcount(adm_v2_setting_keys), adm_v2_settings_valid=if(adm_v2_setting_rows==1 AND mvcount(adm_v2_setting_status)==1 AND mvindex(adm_v2_setting_status,0)=="mapped" AND mvcount(adm_v2_lb_modes)==1 AND mvindex(adm_v2_lb_modes,0) IN ("snat","dsr") AND mvcount(adm_v2_ingress_modes)==1 AND mvindex(adm_v2_ingress_modes,0) IN ("dedicated","shared") AND mvcount(adm_v2_l2_values)==1 AND mvindex(adm_v2_l2_values,0) IN (0,1), 1, 0), \
  adm_cluster_lb_mode=if(adm_v2_settings_valid==1, mvindex(adm_v2_lb_modes,0), null()), adm_cluster_ingress_mode=if(adm_v2_settings_valid==1, mvindex(adm_v2_ingress_modes,0), null()), adm_cluster_l2_enabled=if(adm_v2_settings_valid==1, tonumber(mvindex(adm_v2_l2_values,0)), 0), \
  adm_v2_lb_source=if(adm_row=="conv" AND adm_s_kind=="k8s_service", json_extract(adm_s_best,"lbmsrc"), null()), \
  adm_v2_effective_lb_mode=case(adm_v2_lb_source=="service_annotation", json_extract(adm_s_best,"lbm"), adm_v2_lb_source=="cluster_default" AND adm_v2_settings_valid==1, adm_cluster_lb_mode, true(), null()), \
  adm_s_best=if(adm_row=="conv" AND adm_s_kind=="k8s_service", json_set(adm_s_best,"lbm",adm_v2_effective_lb_mode), adm_s_best), \
  parent_kind=if(adm_row=="route" AND route_kind=="Ingress" AND adm_v2_settings_valid==1, "Ingress".if(adm_cluster_ingress_mode=="shared","Shared",""), parent_kind), \
  adm_row=if(adm_row=="route" AND route_kind=="Ingress" AND adm_v2_settings_valid!=1, "unsupported_route", adm_row)
description = Applies exactly one validated per-cluster Cilium settings row to V2 service and Ingress routing. Service annotations retain precedence; when default or Ingress mode is unavailable or ambiguous, dependent V2 handoff evidence is suppressed instead of inheriting global macros.

# ---- topology (on demand) ----

[adm_if_norm(1)]
args = field
definition = replace(trim($field$), "(?i)^eth(ernet)?\s*(\d)", "Ethernet\2")
description = Normalizes ethX/Y, EthX/Y and EthernetX/Y interface names to the NX-OS EthernetX/Y form.

[adm_topology_sample]
definition = 10000
description = Number of most recent FTD connection events and Nexus Dashboard flow records read to name firewalls and assign switches to ND fabrics.

[adm_topology]
definition = (`adm_index_dcn` sourcetype="cisco:dc:nexus9k" (component="nxhostname" OR component="nxversion" OR component="nxneighbor" OR component="nxinterface")) \
  OR (`adm_index_dcn` sourcetype="cisco:dc:aci:class" (component="topSystem" OR component="fabricLink" OR component="lldpAdjEp")) \
| append [search `adm_index_ftd` sourcetype="cisco:sfw:estreamer" EventType="ConnectionEvent" | head `adm_topology_sample` \
    | stats latest(Device) AS Device latest(DeviceSerialNumber) AS DeviceSerialNumber max(_time) AS _time by DeviceIP | eval adm_kind="ftd"] \
| append [search `adm_index_dcn` sourcetype="cisco:dc:nd:flows" | head `adm_topology_sample` \
    | eval adm_nodes='stats{}.nodeNames{}' | mvexpand adm_nodes \
    | stats latest(fabricName) AS adm_fabric max(_time) AS _time by adm_nodes | eval adm_kind="ndfabric"] \
| eval adm_kind=coalesce(adm_kind, component), \
  adm_aci_pod=if(adm_kind=="topSystem" OR adm_kind=="fabricLink" OR adm_kind=="lldpAdjEp", replace(dn, "^topology/(pod-\d+)/.*$", "\1"), null()), \
  adm_aci_key=if(adm_kind=="topSystem", replace(dn, "^topology/(pod-\d+)/(node-\d+)/sys$", "\1/\2"), null()) \
| eventstats values(eval(if(adm_kind=="topSystem", apic_host."|".adm_aci_key."=".name, null()))) AS adm_aci_names \
| eval adm_lldp_local=if(adm_kind=="lldpAdjEp", apic_host."|".replace(dn, "^topology/(pod-\d+)/(node-\d+)/.*$", "\1/\2"), null()), \
  adm_lldp_if=if(adm_kind=="lldpAdjEp", replace(dn, "^.*/if-\[([^\]]+)\]/.*$", "\1"), null()), \
  adm_lldp_fabric=if(adm_kind=="lldpAdjEp" AND match(sysDesc, "^topology/pod-\d+/node-\d+$"), 1, 0), \
  adm_lldp_rif=if(adm_kind=="lldpAdjEp", if(match(portDesc, "pathep-\["), replace(portDesc, "^.*pathep-\[([^\]]+)\].*$", "\1"), portDesc), null()), \
  adm_fl_a=if(adm_kind=="fabricLink", apic_host."|".adm_aci_pod."/node-".n1, null()), adm_fl_b=if(adm_kind=="fabricLink", apic_host."|".adm_aci_pod."/node-".n2, null()), \
  adm_aci_a=mvindex(mvmap(adm_aci_names, if(mvindex(split(adm_aci_names, "="), 0)==coalesce(adm_fl_a, adm_lldp_local), mvindex(split(adm_aci_names, "="), 1), null())), 0), \
  adm_aci_b=mvindex(mvmap(adm_aci_names, if(mvindex(split(adm_aci_names, "="), 0)==adm_fl_b, mvindex(split(adm_aci_names, "="), 1), null())), 0) \
| eval adm_kind=case(adm_kind=="topSystem", "topSystem", adm_kind=="fabricLink", "aciLink", adm_kind=="lldpAdjEp" AND adm_lldp_fabric==1, "aciLink", adm_kind=="lldpAdjEp", "lldpHost", true(), adm_kind), \
  adm_l_ai_raw=case(component=="fabricLink", "eth".s1."/".p1, component=="lldpAdjEp", adm_lldp_if), \
  adm_l_bi_raw=case(component=="fabricLink", "eth".s2."/".p2, component=="lldpAdjEp", adm_lldp_rif), \
  adm_dev_ip=case(adm_kind=="ftd", `adm_ip(DeviceIP)`, adm_kind=="topSystem", if(oobMgmtAddr=="0.0.0.0", null(), oobMgmtAddr), adm_kind=="ndfabric", null(), true(), replace(device, ":\d+$", "")), \
  adm_hostname=if(adm_kind=="nxhostname", mvindex('Row_info{}.hostname', 0), null()), \
  adm_version=if(adm_kind=="nxversion", mvindex('Row_info{}.nxos_ver_str', 0), null()), \
  adm_peer_ip=if(adm_kind=="nxneighbor", 'Row_info.v4mgmtaddr', null()), \
  adm_ipkey=if(adm_kind=="nxneighbor", adm_peer_ip, adm_dev_ip) \
| eventstats latest(adm_hostname) AS adm_local_name latest(adm_version) AS adm_local_version by adm_dev_ip \
| eventstats latest(adm_hostname) AS adm_peer_name by adm_ipkey \
| eval adm_cdp_name=if(adm_kind=="nxneighbor", coalesce(adm_peer_name, replace('Row_info.device_id', "\([^)]*\)$", "")), null()), \
  adm_local=coalesce(adm_local_name, adm_dev_ip) \
| appendpipe [| where isnull(row_type) AND adm_kind!="nxinterface" AND adm_kind!="aciLink" AND adm_kind!="lldpHost" \
    | eval d_self=case(adm_kind=="nxhostname" OR adm_kind=="nxversion", adm_local_name, adm_kind=="topSystem", name, adm_kind=="ftd", Device), \
      d_name=coalesce(d_self, adm_cdp_name, adm_nodes), d_lname=lower(d_name), \
      d_ip=if(adm_kind=="nxneighbor", adm_peer_ip, adm_dev_ip), \
      d_platform=if(adm_kind=="nxneighbor", 'Row_info.platform_id', null()), \
      d_version=if(adm_kind=="nxhostname" OR adm_kind=="nxversion", adm_local_version, null()), \
      d_serial=case(adm_kind=="nxneighbor" AND match('Row_info.device_id', "\([^)]+\)$"), replace('Row_info.device_id', "^.*\(([^)]+)\)$", "\1"), adm_kind=="topSystem", serial, adm_kind=="ftd", DeviceSerialNumber), \
      d_kind=case(adm_kind=="ftd", "firewall", adm_kind=="topSystem" AND role=="controller", "controller", true(), "switch"), \
      d_fabric=case(adm_kind=="topSystem", "apic:".apic_host, adm_kind=="ndfabric", adm_fabric), \
      d_aci_node=if(adm_kind=="topSystem", replace(dn, "^topology/(pod-\d+)/(node-\d+)/sys$", "\1/\2"), null()), \
      d_role=if(adm_kind=="topSystem", role, null()), \
      d_src=case(adm_kind=="nxneighbor", "cdp", adm_kind=="topSystem", "aci", adm_kind=="ftd", "ftd", adm_kind=="ndfabric", "nd", true(), "nxos") \
    | where isnotnull(d_lname) AND d_lname!="" \
    | stats latest(d_self) AS d_self latest(d_name) AS d_name latest(d_ip) AS mgmt_ip latest(d_platform) AS platform latest(d_version) AS os_version \
        latest(d_serial) AS serial latest(d_kind) AS device_kind latest(eval(if(d_src=="aci", d_fabric, null()))) AS adm_aci_fabric latest(d_fabric) AS fabric \
        latest(d_aci_node) AS aci_node latest(d_role) AS role values(d_src) AS sources by d_lname \
    | eval row_type="device", name=coalesce(d_self, d_name), device_id=name, fabric=coalesce(adm_aci_fabric, fabric) \
    | fields row_type device_id name mgmt_ip device_kind platform os_version serial fabric aci_node role sources] \
| appendpipe [| where isnull(row_type) AND adm_kind=="aciLink" AND isnotnull(adm_aci_a) \
    | eval l_a=adm_aci_a, l_ai=`adm_if_norm(adm_l_ai_raw)`, l_b=coalesce(adm_aci_b, sysName), l_bi=`adm_if_norm(adm_l_bi_raw)`, \
      l_ae=lower(l_a)."|".l_ai, l_be=lower(l_b)."|".l_bi, l_fwd=if(l_ae<=l_be, 1, 0), \
      a_device=if(l_fwd==1, l_a, l_b), a_interface=if(l_fwd==1, l_ai, l_bi), b_device=if(l_fwd==1, l_b, l_a), b_interface=if(l_fwd==1, l_bi, l_ai), \
      l_key=if(l_fwd==1, l_ae."#".l_be, l_be."#".l_ae) \
    | where isnotnull(l_key) AND isnotnull(l_b) \
    | stats latest(a_device) AS a_device latest(a_interface) AS a_interface latest(b_device) AS b_device latest(b_interface) AS b_interface max(_time) AS last_seen by l_key \
    | eval row_type="link", link_source="aci" \
    | fields row_type a_device a_interface b_device b_interface link_source last_seen] \
| appendpipe [| where isnull(row_type) AND adm_kind=="lldpHost" AND isnotnull(adm_aci_a) AND isnotnull(sysName) AND sysName!="" \
    | eval a_device=adm_aci_a, a_interface=`adm_if_norm(adm_lldp_if)`, b_device=sysName, b_interface=adm_lldp_rif \
    | stats latest(b_interface) AS b_interface max(_time) AS last_seen by a_device a_interface b_device \
    | eval row_type="link", link_source="lldp" \
    | fields row_type a_device a_interface b_device b_interface link_source last_seen] \
| appendpipe [| where isnull(row_type) AND adm_kind=="nxneighbor" \
    | eval l_a=adm_local, l_ai=`adm_if_norm('Row_info.intf_id')`, l_b=adm_cdp_name, l_bi=`adm_if_norm('Row_info.port_id')`, \
      l_ae=lower(l_a)."|".l_ai, l_be=lower(l_b)."|".l_bi, l_fwd=if(l_ae<=l_be, 1, 0), \
      a_device=if(l_fwd==1, l_a, l_b), a_interface=if(l_fwd==1, l_ai, l_bi), b_device=if(l_fwd==1, l_b, l_a), b_interface=if(l_fwd==1, l_bi, l_ai), \
      l_key=if(l_fwd==1, l_ae."#".l_be, l_be."#".l_ae) \
    | where isnotnull(l_key) \
    | stats latest(a_device) AS a_device latest(a_interface) AS a_interface latest(b_device) AS b_device latest(b_interface) AS b_interface max(_time) AS last_seen by l_key \
    | eval row_type="link", link_source="cdp" \
    | fields row_type a_device a_interface b_device b_interface link_source last_seen] \
| appendpipe [| where isnull(row_type) AND (adm_kind=="nxinterface" OR adm_kind=="nxneighbor") \
    | eval i_raw=if(adm_kind=="nxinterface", 'Row_info.interface', 'Row_info.intf_id') \
    | eval i_if=`adm_if_norm(i_raw)`, \
      i_ifindex=if(adm_kind=="nxneighbor", 'Row_info.ifindex', null()), \
      i_desc=if(adm_kind=="nxinterface", 'Row_info.desc', null()), i_state=if(adm_kind=="nxinterface", 'Row_info.state', null()), \
      i_dev=adm_local, i_key=lower(adm_local)."|".i_if \
    | where isnotnull(i_if) AND i_if!="" \
    | stats latest(i_dev) AS device_id latest(i_if) AS interface latest(i_ifindex) AS ifindex latest(i_desc) AS description latest(i_state) AS state by i_key \
    | eval row_type="interface" \
    | fields row_type device_id interface ifindex description state] \
| where isnotnull(row_type) \
| appendpipe [| stats count(eval(row_type=="device")) AS devices count(eval(row_type=="link")) AS links count(eval(row_type=="interface")) AS interfaces \
      count(eval(row_type=="interface" AND isnotnull(ifindex))) AS adm_indexed count(eval(row_type=="link" AND link_source!="lldp")) AS adm_switch_links \
      count(eval(row_type=="device" AND role=="leaf")) AS adm_aci_leaves count(eval(row_type=="link" AND link_source=="aci")) AS adm_aci_links \
    | eval row_type="meta", generated_at=now(), \
      warnings=mvappend(if(devices==0, "No network inventory was found in the selected time range. Enable the DC Networking NX-OS inputs (show hostname, show cdp neighbors detail, show interface) or the ACI inputs (topSystem, and fabricLink and lldpAdjEp in a classInfo input), and set adm_index_dcn.", null()), \
        if(devices>0 AND adm_switch_links==0, "No switch-to-switch links (CDP, ACI fabricLink or fabric LLDP) were collected, so candidate paths between switches cannot be drawn.", null()), \
        if(adm_aci_leaves>0 AND adm_aci_links==0, "ACI leaves were found but no fabricLink or lldpAdjEp objects; add them to a DC Networking classInfo input to draw leaf-spine paths.", null()), \
        if(interfaces>adm_indexed, "SNMP ifIndex is known only for CDP-connected ports. NetFlow interfaces on other ports are shown by ifIndex unless 'show interface snmp-ifindex' output is collected.", null())) \
    | fields row_type devices links interfaces warnings generated_at] \
| fields row_type device_id name mgmt_ip device_kind platform os_version serial fabric aci_node role sources a_device a_interface b_device b_interface link_source last_seen interface ifindex description state devices links interfaces warnings generated_at \
| fields - _*
description = Network inventory rows (row_type device, link, interface, meta) over the search time range: NX-OS hostname/version/CDP/interfaces, ACI topSystem (name, role), ACI fabricLink and fabric LLDP adjacencies (link_source aci, both directions merged), LLDP host attachments on ACI leaves (link_source lldp: a_device leaf, b_device the host's LLDP system name), FTD devices named in recent connection events, and ND fabric membership from recent flow records. Never infers links from traffic.

# ---- health (on demand) ----

[adm_health_source_netflow]
definition = search `adm_index_netflow` sourcetype="stream:netflow" earliest=0 latest=+10y _index_earliest=-7d _index_latest=now \
| stats count AS records max(_time) AS latest_event max(_indextime) AS latest_indexed max(eval(if(isnotnull(_indextime) AND isnotnull(_time), max(0,_indextime-_time), null()))) AS max_ingest_lag \
| eval kind="source", name="NetFlow", source_seen=1, records=coalesce(records,0), status=if(records>0,"ok","no_visible_records"), probe_lookback_seconds=604800 \
| fields kind name source_seen records latest_event latest_indexed max_ingest_lag status probe_lookback_seconds contract_version
description = Read-only selected-source receipt probe for NetFlow; seven-day index window, independent of unrelated source indexes. No visible records is not evidence of collector or API permission health.

[adm_health_source_dcn]
definition = search `adm_index_dcn` (sourcetype="cisco:dc:nd:flows" OR sourcetype="cisco:dc:nd:endpoints" OR sourcetype="cisco:dc:aci:class" OR sourcetype="cisco:dc:aci:stats" OR sourcetype="cisco:dc:nexus9k") earliest=0 latest=+10y _index_earliest=-7d _index_latest=now \
| stats count AS records max(_time) AS latest_event max(_indextime) AS latest_indexed max(eval(if(isnotnull(_indextime) AND isnotnull(_time), max(0,_indextime-_time), null()))) AS max_ingest_lag \
| eval kind="source", name="DC Networking", source_seen=1, records=coalesce(records,0), status=if(records>0,"ok","no_visible_records"), probe_lookback_seconds=604800 \
| fields kind name source_seen records latest_event latest_indexed max_ingest_lag status probe_lookback_seconds contract_version
description = Read-only selected-source receipt probe for DC Networking; seven-day index window, independent of unrelated source indexes. No visible records is not evidence of collector or API permission health.

[adm_health_source_aci]
definition = search `adm_index_dcn` (sourcetype="cisco:dc:aci:class" OR sourcetype="cisco:dc:aci:stats") earliest=0 latest=+10y _index_earliest=-7d _index_latest=now \
| stats count AS records max(_time) AS latest_event max(_indextime) AS latest_indexed max(eval(if(isnotnull(_indextime) AND isnotnull(_time), max(0,_indextime-_time), null()))) AS max_ingest_lag \
| eval kind="source", name="ACI", source_seen=1, records=coalesce(records,0), status=if(records>0,"ok","no_visible_records"), probe_lookback_seconds=604800 \
| fields kind name source_seen records latest_event latest_indexed max_ingest_lag status probe_lookback_seconds contract_version
description = Read-only selected-source receipt probe for ACI; seven-day index window, independent of unrelated source indexes. No visible records is not evidence of collector or API permission health.

[adm_health_source_nd]
definition = search `adm_index_dcn` (sourcetype="cisco:dc:nd:flows" OR sourcetype="cisco:dc:nd:endpoints") earliest=0 latest=+10y _index_earliest=-7d _index_latest=now \
| stats count AS records max(_time) AS latest_event max(_indextime) AS latest_indexed max(eval(if(isnotnull(_indextime) AND isnotnull(_time), max(0,_indextime-_time), null()))) AS max_ingest_lag \
| eval kind="source", name="Nexus Dashboard", source_seen=1, records=coalesce(records,0), status=if(records>0,"ok","no_visible_records"), probe_lookback_seconds=604800 \
