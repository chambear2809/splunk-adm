# Application Atlas data layer. See docs/DATA_LAYER.md in the source repository.
# Administrators set the index macros to the indexes their TAs write to.

[adm_index_netflow]
definition = index=netflow
description = Index holding Splunk Stream NetFlow/IPFIX events (sourcetype stream:netflow).

[adm_index_dcn]
definition = index=cisco_dc
description = Index holding Cisco DC Networking events (Nexus Dashboard, ACI, NX-OS).

[adm_index_ftd]
definition = index=cisco_secure_fw
description = Index holding Cisco Security Cloud FTD eStreamer events (TA default cisco_secure_fw).

[adm_index_isovalent]
definition = index=cisco_isovalent
description = Index holding Cisco Security Cloud Isovalent events (TA default cisco_isovalent).

[adm_index_k8s]
definition = index=k8s
description = Index holding Kubernetes objects from the Splunk OTel Collector for Kubernetes.

[adm_index_traces]
definition = index=otel_traces
description = Index holding spans sent to Splunk Platform by the Splunk OTel Collector.

[adm_traces_sourcetype]
definition = sourcetype="otel:traces"
description = Sourcetype configured as splunkPlatform.sourcetype for spans.

[adm_index_hubble]
definition = index=cilium_hubble
description = Index holding Hubble flow exports tailed by the Splunk OTel Collector (logsCollection.extraFileLogs).

[adm_hubble_sourcetypes]
definition = sourcetype="cilium:hubble:flow"
description = Sourcetype(s) of open-source Hubble exporter JSON lines ({"flow":{...},"node_name":...,"time":...}), as set by com.splunk.sourcetype in the collector file-log configuration.

[adm_flows_hubble_enterprise]
definition = where false()
description = Placeholder for the Isovalent Enterprise flow export. Not referenced by adm_flows: its format has not been inspected. Add a normalization here (same output fields as adm_flows_hubble) only after modeling a real sample event.

[adm_cilium_lb_mode]
definition = "snat"
description = Cluster default Cilium loadBalancer.mode as a quoted string ("snat", "dsr" or "hybrid"), used for Services without the service.cilium.io/forwarding-mode annotation.

[adm_cilium_ingress_mode]
definition = "dedicated"
description = Cluster default Cilium Ingress load-balancer mode as a quoted string ("dedicated" or "shared") for Ingresses without ingress.cilium.io/loadbalancer-mode. Only dedicated mode is mapped to a frontend Service.

[adm_k8s_object_staleness]
definition = 0
description = Seconds after the last observation at which Service frontend, backend and route rows end when no DELETED event or newer listing closes them. 0 disables it (watch mode with include_initial_state); for pull mode use about twice the pull interval.

[adm_handoff_window]
definition = 1
description = Seconds of tolerance when matching a client-to-frontend conversation to Hubble evidence or to a receiving node's connection to a backend.

[adm_index_summary]
definition = index=adm_summary
description = Summary index read by the graph search. Must name the same index as adm_summary_index_name.

[adm_summary_index_name]
definition = adm_summary
description = Summary index name written by the conversation rollup (collect index=...).

[adm_identity_retention]
definition = 604800
description = Seconds to keep identity rows after their validity ended (default 7 days).

[adm_poll_interval]
definition = 300
description = Polling interval in seconds of the APIC input; an ACI endpoint stays valid for two intervals after its last report.

[adm_k8s_node_staleness]
definition = 0
description = Seconds after the last pod observation at which a Kubernetes node row ends. 0 disables it (watch mode, where stable pods are not re-reported); for pull mode use about twice the pull interval.

[adm_identity_max_matches]
definition = 1000
description = Must equal max_matches of the adm_ip_identity lookup in transforms.conf. Reads that return this many rows are treated as possibly truncated.

[adm_kv_max_rows]
definition = 50000
description = Must equal limits.conf [kvstore] max_rows_per_query. Collection reads returning this many rows are treated as possibly truncated.

[adm_kv_page_size]
definition = 10000
description = Page size used by adm_kv_read_all. Must be at most max_rows_per_query; adm_kv_read_all hard-codes the same value.

[adm_trace_limit]
definition = 10000
description = Maximum number of boundary traces whose out-of-boundary spans the graph search reads (subsearch). Must not exceed limits.conf [subsearch] maxout.

# ---- helpers ----

[adm_ip(1)]
args = field
definition = if(cidrmatch("::ffff:0:0/96", lower(trim($field$))), if(match(lower(trim($field$)), "\d+\.\d+\.\d+\.\d+$"), replace(lower(trim($field$)), "^.*:(\d+\.\d+\.\d+\.\d+)$", "\1"), tostring(floor(tonumber(replace(lower(trim($field$)), "^.*:([0-9a-f]{1,4}):([0-9a-f]{1,4})$", "\1"), 16)/256)).".".tostring(tonumber(replace(lower(trim($field$)), "^.*:([0-9a-f]{1,4}):([0-9a-f]{1,4})$", "\1"), 16)%256).".".tostring(floor(tonumber(replace(lower(trim($field$)), "^.*:([0-9a-f]{1,4}):([0-9a-f]{1,4})$", "\2"), 16)/256)).".".tostring(tonumber(replace(lower(trim($field$)), "^.*:([0-9a-f]{1,4}):([0-9a-f]{1,4})$", "\2"), 16)%256)), lower(trim($field$)))
description = Lower-cases an IP literal and unwraps IPv4-mapped IPv6 (::ffff:a.b.c.d, full and hexadecimal forms).

[adm_iso_time(1)]
args = field
definition = coalesce(strptime(replace(replace($field$, "(?i)Z$", "+0000"), "([+-]\d\d):(\d\d)$", "\1\2"), "%Y-%m-%dT%H:%M:%S.%N%z"), strptime(replace(replace($field$, "(?i)Z$", "+0000"), "([+-]\d\d):(\d\d)$", "\1\2"), "%Y-%m-%dT%H:%M:%S%z"))
description = Parses an RFC 3339 timestamp with an explicit offset to epoch seconds.

[adm_is_ip(1)]
args = field
definition = (match($field$, "^(?:\d{1,3}\.){3}\d{1,3}\z") OR (match($field$, "^[0-9A-Fa-f:.]{2,45}\z") AND like($field$, "%:%")))
description = True when a value is an IPv4 or IPv6 literal (no port, brackets or zone).

[adm_conn_cap]
definition = 50
description = Connections (client_port@start@end) listed per summary row for connection-level hand-off matching and connection counts. Rows with more are flagged conns_capped and reported by the graph.

[adm_conn_gap]
definition = 60
description = Seconds: records of the same client address and port to the same server whose start is within this many seconds of the previous record's end are one connection (return records, other observers and active-timeout re-exports).

[adm_aci_policy_complete]
definition = 0
description = Set to 1 only when every ACI policy class that can permit traffic (contracts, vzAny relations, taboos, in/out terms, preferred groups, ESGs, VRF enforcement) is collected. With 0, a conversation that no collected filter permits gets contract_basis not_evaluated instead of none.

[adm_transport(1)]
args = field
definition = case(lower($field$)=="tcp" OR $field$=="6", "tcp", lower($field$)=="udp" OR $field$=="17", "udp", lower($field$)=="icmp" OR $field$=="1", "icmp", lower($field$)=="ipv6-icmp" OR lower($field$)=="icmpv6" OR $field$=="58", "ipv6-icmp", lower($field$)=="ipip" OR lower($field$)=="ip-in-ip" OR $field$=="4", "ipip", lower($field$)=="sctp" OR $field$=="132", "sctp", isnotnull($field$), lower($field$))
description = Normalizes protocol names and IANA numbers (NetFlow protoid) to lower-case transport names (tcp, udp, icmp, ipv6-icmp, ipip, sctp).

[adm_is_private(1)]
args = field
definition = (cidrmatch("10.0.0.0/8", $field$) OR cidrmatch("172.16.0.0/12", $field$) OR cidrmatch("192.168.0.0/16", $field$) OR cidrmatch("100.64.0.0/10", $field$) OR cidrmatch("fc00::/7", $field$) OR cidrmatch("fe80::/10", $field$))
description = True for RFC 1918, RFC 6598 and IPv6 unique-local/link-local addresses.

[adm_mv_has(2)]
args = mv, field
definition = isnotnull(mvmap($mv$, if($mv$==$field$, 1, null())))
description = True when a multivalue field contains the value of another field (exact string equality).

[adm_mv_has_str(2)]
args = mv, literal
definition = isnotnull(mvmap($mv$, if($mv$=="$literal$", 1, null())))
description = True when a multivalue field contains a literal string (exact equality). Macro arguments arrive without quotes.

# ---- normalized flow records ----

[adm_flows_netflow]
definition = `adm_index_netflow` sourcetype="stream:netflow" \
| eval adm_source="netflow", adm_observer=exporter_ip, adm_observer_kind="exporter", adm_scope_kind="exporter", adm_scope_observer=exporter_ip, \
  adm_src_ip=`adm_ip(src_ip)`, adm_dest_ip=`adm_ip(dest_ip)`, \
  adm_src_port=tonumber(src_port), adm_dest_port=tonumber(dest_port), \
  adm_transport=`adm_transport(protoid)`, \
  adm_sampling=if(tonumber(exporter_sampling_interval)>1, tonumber(exporter_sampling_interval), 1), \
  adm_bytes_fwd=tonumber(bytes)*adm_sampling, adm_bytes_rev=0, adm_packets=tonumber(packets)*adm_sampling, \
  adm_start=`adm_iso_time(timestamp)`, adm_end=`adm_iso_time(endtime)`, \
  adm_exporter=exporter_ip, adm_in_ifindex=input_snmpidx, adm_out_ifindex=output_snmpidx, adm_initiator="unknown"
description = Stream NetFlow records. Bytes and packets are scaled by exporter_sampling_interval; flow_dir is not used.

[adm_flows_nd]
definition = `adm_index_dcn` sourcetype="cisco:dc:nd:flows" \
| eval adm_source="nd", adm_observer=fabricName, adm_observer_kind="fabric", adm_scope_kind="fabric", adm_scope_observer=fabricName, \
  adm_src_ip=`adm_ip(srcIp)`, adm_dest_ip=`adm_ip(dstIp)`, \
  adm_src_port=tonumber(srcPort), adm_dest_port=tonumber(dstPort), \
  adm_transport=`adm_transport(protocolName)`, \
  adm_bytes_fwd=tonumber(mvindex('stats{}.ingressByteCount', 0)), adm_bytes_rev=0, \
  adm_packets=tonumber(mvindex('stats{}.ingressPktCount', 0)), \
  adm_start=`adm_iso_time(ts)`, adm_end=adm_start, \
  adm_in_if=mvindex('stats{}.nodeNames{}', 0).":".mvindex('stats{}.ingressVif{}', 0), \
  adm_out_if=mvindex('stats{}.nodeNames{}', -1).":".mvindex('stats{}.egressVif{}', 0), \
  adm_initiator="unknown"
description = Nexus Dashboard flow records. Uses the first stats entry's ingress counters; the TA's EVAL-bytes adds ingress and egress and double counts.

[adm_flows_ftd]
definition = `adm_index_ftd` sourcetype="cisco:sfw:estreamer" EventType="ConnectionEvent" \
| eval adm_source="ftd", adm_observer=DeviceIP, adm_observer_kind="firewall", adm_scope_kind="firewall", adm_scope_observer=DeviceIP, \
  adm_src_ip=`adm_ip(InitiatorIP)`, adm_dest_ip=`adm_ip(ResponderIP)`, \
  adm_src_port=tonumber(InitiatorPort), adm_dest_port=tonumber(ResponderPort), \
  adm_transport=`adm_transport(Protocol)`, \
  adm_bytes_fwd=tonumber(InitiatorBytes), adm_bytes_rev=tonumber(ResponderBytes), \
  adm_packets=tonumber(InitiatorPackets)+tonumber(ResponderPackets), \
  adm_start=tonumber(FirstPacketSecond), adm_end=adm_start, \
  adm_in_if=IngressInterface, adm_out_if=EgressInterface, adm_initiator="src"
description = FTD connection events. The TA exposes no end time or translated tuple, so adm_end equals adm_start and NAT fields stay empty.

[adm_flows_isovalent]
definition = `adm_index_isovalent` sourcetype="cisco:isovalent:processConnect" \
| eval adm_source="isovalent", adm_observer=node_name, adm_observer_kind="host_sensor", adm_scope_kind="hec_source", adm_scope_observer=source, \
  adm_src_ip=`adm_ip('process_connect.source_ip')`, adm_dest_ip=`adm_ip('process_connect.destination_ip')`, \
  adm_src_port=tonumber('process_connect.source_port'), adm_dest_port=tonumber('process_connect.destination_port'), \
  adm_transport=`adm_transport('process_connect.protocol')`, \
  adm_start=`adm_iso_time(time)`, adm_end=adm_start, adm_initiator="src"
description = Isovalent (Tetragon) process_connect events: connection setup only, without byte or packet counts.

[adm_flows_hubble]
definition = `adm_index_hubble` `adm_hubble_sourcetypes` ("TO_ENDPOINT" OR "TO_NETWORK" OR "REQUEST") \
| eval adm_h_type='flow.Type', adm_h_point='flow.trace_observation_point', adm_h_reply=lower('flow.is_reply'), \
  adm_kind=case(adm_h_type=="L3_L4" AND adm_h_point=="TO_ENDPOINT" AND 'flow.verdict'=="FORWARDED" AND adm_h_reply!="true", "conv", \
    adm_h_type=="L3_L4" AND adm_h_point=="TO_NETWORK" AND isnotnull('flow.IP.source_xlated'), "xlate", \
    adm_h_type=="L7" AND lower('flow.l7.type')=="request", "l7") \
| where isnotnull(adm_kind) \
| eval adm_h_node=coalesce('k8s.node.name', replace(coalesce('flow.node_name', node_name), "^.*/", "")), \
  adm_h_cluster=coalesce('k8s.cluster.name', if(match(coalesce('flow.node_name', node_name), "/"), replace(coalesce('flow.node_name', node_name), "/.*$", ""), null())), \
  adm_source=case(adm_kind=="conv", "hubble", adm_kind=="xlate", "hubble_xlate", true(), "hubble_l7"), \
  adm_observer=adm_h_node, adm_observer_kind="host_sensor", adm_scope_kind="cluster", adm_scope_observer=adm_h_cluster, \
  adm_src_ip=`adm_ip('flow.IP.source')`, adm_dest_ip=`adm_ip('flow.IP.destination')`, \
  adm_src_port=tonumber(coalesce('flow.l4.TCP.source_port', 'flow.l4.UDP.source_port', 'flow.l4.SCTP.source_port')), \
  adm_dest_port=tonumber(coalesce('flow.l4.TCP.destination_port', 'flow.l4.UDP.destination_port', 'flow.l4.SCTP.destination_port')), \
  adm_transport=case(isnotnull('flow.l4.TCP.destination_port') OR isnotnull('flow.l4.TCP.source_port'), "tcp", \
    isnotnull('flow.l4.UDP.destination_port') OR isnotnull('flow.l4.UDP.source_port'), "udp", \
    isnotnull('flow.l4.SCTP.destination_port'), "sctp", isnotnull('flow.l4.ICMPv4.type'), "icmp", isnotnull('flow.l4.ICMPv6.type'), "ipv6-icmp"), \
  adm_start=`adm_iso_time('flow.time')`, adm_end=adm_start, \
  adm_initiator="src", \
  adm_xlate_ip=`adm_ip('flow.IP.source_xlated')`, \
  adm_h_hdr=mvzip('flow.l7.http.headers{}.key', 'flow.l7.http.headers{}.value', "="), \
  adm_xff_raw=mvjoin(mvmap(adm_h_hdr, if(match(adm_h_hdr, "(?i)^x-forwarded-for="), replace(adm_h_hdr, "(?i)^x-forwarded-for=", ""), null())), ","), \
  adm_xff_last=trim(mvindex(split(adm_xff_raw, ","), -1)), \
  adm_xff=if(adm_kind=="l7" AND `adm_is_ip(adm_xff_last)`, `adm_ip(adm_xff_last)`, null()), \
  adm_trace_id=if(match(lower('flow.trace_context.parent.trace_id'), "^[0-9a-f]{32}\z"), lower('flow.trace_context.parent.trace_id'), null()) \
| where adm_kind!="l7" OR isnotnull(adm_xff)
description = Hubble flow export records (Cilium flow.proto, open-source exporter JSON lines). The base search keeps only events mentioning TO_ENDPOINT, TO_NETWORK or REQUEST. For L7 requests adm_xff is the rightmost X-Forwarded-For entry (the address Envoy appends for its immediate downstream peer; with xff_num_trusted_hops 0 earlier entries are client-supplied and untrusted), kept only when it is an IP literal; requests without one are dropped. adm_trace_id is kept only as 32 lower-case hex digits. conv: L3_L4 TO_ENDPOINT forwarded flows in the original direction (post-translation tuple at the backend, initiator = source). hubble_xlate: TO_NETWORK forwarding traces with IP.source_xlated (SNAT to the node). hubble_l7: L7 HTTP requests with X-Forwarded-For. Hubble flows carry no byte counts. Relies on Splunk's automatic JSON field extraction of the event (AUTO_KV_JSON, the default for this sourcetype).

[adm_flows_acllog]
definition = `adm_index_dcn` sourcetype="cisco:dc:aci:class" (component="acllogPermitL3Pkt" OR component="acllogDropL3Pkt") \
| eval adm_kind="conv", adm_source="aci_acllog", adm_observer=replace(dn, "^topology/(pod-\d+)/(node-\d+)/.*$", "\1/\2"), adm_observer_kind="acl_leaf", \
  adm_scope_kind="apic", adm_scope_observer=apic_host, \
  adm_src_ip=`adm_ip(srcIp)`, adm_dest_ip=`adm_ip(dstIp)`, adm_src_port=tonumber(srcPort), adm_dest_port=tonumber(dstPort), \
  adm_transport=`adm_transport(protocol)`, adm_start=`adm_iso_time(timeStamp)`, adm_end=adm_start, adm_initiator="unknown", \
  adm_acl=if(component=="acllogDropL3Pkt", "drop", "permit"), adm_acl_dn=apic_host."|".dn, adm_acl_age=_time-adm_start \
| where adm_acl_age>=-60 AND adm_acl_age<=`adm_poll_interval`+60
description = ACI contract ACL-log records (acllogPermitL3Pkt, acllogDropL3Pkt): one logged packet each, at the enforcing leaf. Only subjects with directives=log produce them; no byte counts. A record stays in the leaf buffer and is re-reported by later polls; only the report from the first poll after the record's timeStamp (poll time minus timeStamp at most adm_poll_interval plus 60 s) is counted.

[adm_flows]
definition = multisearch [search `adm_flows_netflow`] [search `adm_flows_nd`] [search `adm_flows_ftd`] [search `adm_flows_isovalent`] [search `adm_flows_hubble`] [search `adm_flows_acllog`] \
| eval adm_kind=coalesce(adm_kind, "conv") \
| lookup adm_interfaces device_ip AS adm_exporter ifindex AS adm_in_ifindex OUTPUT interface AS adm_in_name \
| lookup adm_interfaces device_ip AS adm_exporter ifindex AS adm_out_ifindex OUTPUT interface AS adm_out_name \
| eval adm_in_if=if(adm_source=="netflow", coalesce(adm_in_name, "ifIndex ".adm_in_ifindex), adm_in_if), \
  adm_out_if=if(adm_source=="netflow", coalesce(adm_out_name, "ifIndex ".adm_out_ifindex), adm_out_if) \
| lookup adm_observer_scope observer_kind AS adm_scope_kind observer AS adm_scope_observer OUTPUT scope AS adm_scope cluster AS adm_cluster \
| eval adm_scope=coalesce(adm_scope, "default") \
| fields _time adm_*
description = All normalized flow records (generating; call as | `adm_flows`). Lookups run after multisearch. See docs/DATA_LAYER.md for the field list.

# ---- conversation rollup ----

[adm_conversation_rollup]
definition = `adm_flows` \
| dedup adm_acl_dn keepempty=true \
| eval adm_tunnel=if((adm_transport=="udp" AND (adm_dest_port==8472 OR adm_dest_port==6081)) OR adm_transport=="ipip", 1, 0), \
  adm_ev=if(adm_kind=="conv", 0, 1), \
  adm_rule=case(adm_tunnel==1, "unknown", adm_initiator=="src", "initiator", \
    adm_dest_port<1024 AND adm_src_port>=1024, "port_rule_dest", adm_src_port<1024 AND adm_dest_port>=1024, "port_rule_src", \
    adm_src_port>=32768 AND adm_dest_port<32768, "port_rule_dest", adm_dest_port>=32768 AND adm_src_port<32768, "port_rule_src", \
    true(), "unknown"), \
  adm_bucket=floor(adm_end/300)*300 \
| fillnull value="-" adm_src_port adm_dest_port adm_xff \
| fillnull value="unknown" adm_transport \
| eval adm_ep_src=adm_src_ip."|".adm_src_port, adm_ep_dst=adm_dest_ip."|".adm_dest_port, \
  adm_pair=if(adm_src_ip<=adm_dest_ip, adm_src_ip."|".adm_dest_ip, adm_dest_ip."|".adm_src_ip), \
  adm_known=case(adm_tunnel==1 OR adm_ev==1, null(), adm_rule=="initiator", "initiator@".adm_ep_dst, adm_rule=="port_rule_dest", "port_rule@".adm_ep_dst, adm_rule=="port_rule_src", "port_rule@".adm_ep_src) \
| eventstats values(adm_known) AS adm_known_servers by adm_scope adm_pair adm_transport adm_bucket \
| eval adm_match_src=mvmap(adm_known_servers, if(mvindex(split(adm_known_servers, "@"), 1)==adm_ep_src, mvindex(split(adm_known_servers, "@"), 0), null())), \
  adm_match_dst=mvmap(adm_known_servers, if(mvindex(split(adm_known_servers, "@"), 1)==adm_ep_dst, mvindex(split(adm_known_servers, "@"), 0), null())), \
  adm_rule=case(adm_rule!="unknown" OR adm_tunnel==1 OR adm_ev==1, adm_rule, isnotnull(adm_match_dst) AND isnull(adm_match_src), "reconciled_dest", \
    isnotnull(adm_match_src) AND isnull(adm_match_dst), "reconciled_src", true(), "unknown"), \
  adm_basis=case(adm_rule=="initiator", "initiator", adm_rule=="port_rule_dest" OR adm_rule=="port_rule_src", "port_rule", \
    adm_rule=="reconciled_dest", if(`adm_mv_has_str(adm_match_dst, initiator)`, "initiator", "port_rule"), \
    adm_rule=="reconciled_src", if(`adm_mv_has_str(adm_match_src, initiator)`, "initiator", "port_rule"), true(), "unknown"), \
  adm_src_is_client=case(adm_rule=="initiator" OR adm_rule=="port_rule_dest" OR adm_rule=="reconciled_dest", 1, \
    adm_rule=="port_rule_src" OR adm_rule=="reconciled_src", 0, \
    adm_tunnel==1, if(adm_src_ip<=adm_dest_ip, 1, 0), \
    true(), if(adm_src_ip<adm_dest_ip OR (adm_src_ip==adm_dest_ip AND adm_src_port<=adm_dest_port), 1, 0)), \
  client_ip=if(adm_src_is_client==1, adm_src_ip, adm_dest_ip), server_ip=if(adm_src_is_client==1, adm_dest_ip, adm_src_ip), \
  client_port=if(adm_src_is_client==1, adm_src_port, adm_dest_port), \
  server_port=if(adm_tunnel==1, adm_dest_port, if(adm_src_is_client==1, adm_dest_port, adm_src_port)), \
  bytes_c2s=if(adm_src_is_client==1, adm_bytes_fwd, adm_bytes_rev), bytes_s2c=if(adm_src_is_client==1, adm_bytes_rev, adm_bytes_fwd), \
  adm_observation=adm_source.":".adm_observer.if(isnotnull(adm_in_if) OR isnotnull(adm_out_if), ":".coalesce(adm_in_if, "?").">".coalesce(adm_out_if, "?"), ""), \
  adm_acl_permit=if(adm_acl=="permit", 1, null()), adm_acl_drop=if(adm_acl=="drop", 1, null()) \
| stats sum(bytes_c2s) AS bytes_c2s sum(bytes_s2c) AS bytes_s2c sum(adm_packets) AS packets count AS records \
    dc(client_port) AS client_ports values(client_port) AS adm_cports min(adm_start) AS first_seen max(adm_end) AS last_seen \
    values(adm_observation) AS observations values(adm_basis) AS bases sum(adm_acl_permit) AS acl_permits sum(adm_acl_drop) AS acl_drops \
    values(adm_xlate_ip) AS xlate_ip values(adm_trace_id) AS trace_ids values(eval(client_port."@".adm_start."@".adm_end)) AS adm_conns \
    max(eval(if(adm_sampling>1, 1, 0))) AS sampled \
    by adm_scope client_ip server_ip server_port adm_transport adm_bucket adm_source adm_observer adm_xff \
| eval direction_basis=case(`adm_mv_has_str(bases, initiator)`, "initiator", `adm_mv_has_str(bases, port_rule)`, "port_rule", true(), "unknown") \
| lookup adm_ip_identity ip AS client_ip scope AS adm_scope OUTPUT entity_kind AS adm_client_kinds \
| lookup adm_ip_identity ip AS server_ip scope AS adm_scope OUTPUT entity_kind AS adm_server_kinds \
| eval adm_nodes=if(`adm_mv_has_str(adm_client_kinds, k8s_node)` AND `adm_mv_has_str(adm_server_kinds, k8s_node)`, 1, 0), \
  encapsulation=case(adm_nodes==1 AND adm_transport=="udp" AND server_port==8472, "vxlan", adm_nodes==1 AND adm_transport=="udp" AND server_port==6081, "geneve", \
    adm_nodes==1 AND adm_transport=="ipip", "ipip") \
| rename adm_scope AS scope adm_transport AS transport adm_source AS flow_source \
| eval _time=adm_bucket, adm_record=case(flow_source=="hubble_xlate", "hubble_xlate", flow_source=="hubble_l7", "hubble_l7", true(), "conversation"), \
  observer=flow_source.":".adm_observer, observations=mvjoin(observations, "|"), \
  client_port_list=mvjoin(mvindex(adm_cports, 0, `adm_conn_cap`-1), "|"), conns=mvjoin(mvindex(adm_conns, 0, `adm_conn_cap`-1), "|"), \
  conns_capped=if(mvcount(adm_conns)>`adm_conn_cap`, 1, null()), sampled=if(sampled==1, 1, null()), xlate_ip=mvindex(xlate_ip, 0), \
  xff=if(adm_xff=="-", null(), adm_xff), trace_ids=mvjoin(mvindex(trace_ids, 0, 19), "|") \
| fields _time adm_record scope client_ip server_ip server_port transport flow_source observer observations bytes_c2s bytes_s2c packets records client_ports client_port_list conns conns_capped sampled first_seen last_seen direction_basis encapsulation acl_permits acl_drops xlate_ip xff trace_ids
description = Generating (call as | `adm_conversation_rollup`). Rolls normalized flow records into one row per conversation, 5-minute bucket (by adm_end) and observer. Records without a determined client inherit the orientation of another record of the same address pair, transport and bucket. Hubble SNAT traces and L7 requests become evidence rows (adm_record hubble_xlate / hubble_l7); ACI ACL-log records are counted per observing leaf (acl_permits / acl_drops) and deduplicated by object DN within a run. conns keeps up to adm_conn_cap client_port@start@end triples per row (conns_capped=1 when there were more) for connection-level hand-off matching and connection counts. Hubble L7 rows are grouped per X-Forwarded-For client (xff). sampled=1 marks rows with NetFlow records sampled at more than 1:1.

# ---- KV store paging ----

[adm_kv_read_all(1)]
args = collection
validation = match(collection, "^adm_[a-z_]+\z")
errormsg = adm_kv_read_all expects an Application Atlas collection name.
definition = inputlookup $collection$ start=0 max=10000 | eval adm_page=1 \
| inputlookup append=true $collection$ start=1 max=10000 | eval adm_page=coalesce(adm_page, 0) \
| inputlookup append=true $collection$ start=10000 max=10000 | eval adm_page=coalesce(adm_page, 2) \
| inputlookup append=true $collection$ start=20000 max=10000 | eval adm_page=coalesce(adm_page, 3) \
| inputlookup append=true $collection$ start=30000 max=10000 | eval adm_page=coalesce(adm_page, 4) \
| inputlookup append=true $collection$ start=40000 max=10000 | eval adm_page=coalesce(adm_page, 5) \
| inputlookup append=true $collection$ start=50000 max=10000 | eval adm_page=coalesce(adm_page, 6) \
| inputlookup append=true $collection$ start=60000 max=10000 | eval adm_page=coalesce(adm_page, 7) \
| inputlookup append=true $collection$ start=70000 max=10000 | eval adm_page=coalesce(adm_page, 8) \
| inputlookup append=true $collection$ start=80000 max=10000 | eval adm_page=coalesce(adm_page, 9) \
| inputlookup append=true $collection$ start=90000 max=10000 | eval adm_page=coalesce(adm_page, 10) \
| inputlookup append=true $collection$ start=100000 max=10000 | eval adm_page=coalesce(adm_page, 11) \
| inputlookup append=true $collection$ start=110000 max=10000 | eval adm_page=coalesce(adm_page, 12) \
| inputlookup append=true $collection$ start=120000 max=10000 | eval adm_page=coalesce(adm_page, 13) \
| inputlookup append=true $collection$ start=130000 max=10000 | eval adm_page=coalesce(adm_page, 14) \
| inputlookup append=true $collection$ start=140000 max=10000 | eval adm_page=coalesce(adm_page, 15) \
| inputlookup append=true $collection$ start=150000 max=10000 | eval adm_page=coalesce(adm_page, 16) \
| inputlookup append=true $collection$ start=160000 max=10000 | eval adm_page=coalesce(adm_page, 17) \
| inputlookup append=true $collection$ start=170000 max=10000 | eval adm_page=coalesce(adm_page, 18) \
| inputlookup append=true $collection$ start=180000 max=10000 | eval adm_page=coalesce(adm_page, 19) \
| inputlookup append=true $collection$ start=190000 max=10000 | eval adm_page=coalesce(adm_page, 20) \
| `adm_kv_complete`
description = Reads a whole collection in 20 pages of adm_kv_page_size rows (page 0 is a probe at offset 1) and sets adm_complete=1 only when the read provably returned every row.

[adm_kv_complete]
definition = eventstats count AS adm_page_n by adm_page \
| eventstats max(eval(if(adm_page>=1, adm_page, null()))) AS adm_last dc(eval(if(adm_page>=1, adm_page, null()))) AS adm_pages \
    max(eval(if(adm_page==1, adm_page_n, null()))) AS adm_p1 max(eval(if(adm_page==0, adm_page_n, null()))) AS adm_probe \
| eventstats max(eval(if(adm_page==adm_last, adm_page_n, null()))) AS adm_last_n min(eval(if(adm_page>=1 AND adm_page<adm_last, adm_page_n, null()))) AS adm_inner_min \
| eval adm_complete=if(adm_pages==adm_last AND (isnull(adm_inner_min) OR adm_inner_min==`adm_kv_page_size`) \
    AND (adm_last_n<`adm_kv_page_size` OR adm_last<20) \
    AND (adm_last>1 OR adm_p1==`adm_kv_page_size` OR coalesce(adm_probe, 0)==adm_p1-1), 1, 0)
description = Completeness test for adm_kv_read_all (20 pages): pages are contiguous, every page before the last is full, the page after the last was read and empty, and a short first page has an offset-1 probe exactly one row shorter (otherwise the store capped the read).

# ---- identity (KV store adm_ip_identity) ----

[adm_identity_observations]
definition = (`adm_index_k8s` (sourcetype="kube:object:pods" OR sourcetype="kube:object:nodes" OR sourcetype="kube:object:services")) \
  OR (`adm_index_dcn` (sourcetype="cisco:dc:aci:stats" OR sourcetype="cisco:dc:aci:class") (component="fvCEp" OR component="fvRsVm" OR component="compVm")) \
  OR (`adm_index_dcn` sourcetype="cisco:dc:nd:endpoints") \
| eval adm_src=case(sourcetype=="kube:object:pods", "k8s_pods", sourcetype=="kube:object:nodes", "k8s_node_obj", sourcetype=="kube:object:services", "k8s_services", \
    match(sourcetype, "^cisco:dc:aci:"), "aci", sourcetype=="cisco:dc:nd:endpoints", "nd_endpoints") \
| eval adm_cep_dn=case(component=="fvCEp", dn, component=="fvRsVm", replace(dn, "/rsvm$", "")), \
  adm_vm_dn=case(component=="fvRsVm", tDn, component=="compVm", dn), \
  adm_vm_label=if(component=="compVm", name, null()) \
| eventstats values(adm_vm_label) AS adm_vm_by_dn by adm_vm_dn \
| eval adm_vm_link=if(component=="fvRsVm", adm_vm_by_dn, null()) \
| eventstats values(adm_vm_link) AS adm_cep_vm by adm_cep_dn \
| where adm_src!="aci" OR component=="fvCEp" \
| eval adm_type=coalesce(type, "SNAPSHOT"), \
  adm_uid=coalesce('object.metadata.uid', 'metadata.uid'), \
  adm_k8s=if(match(adm_src, "^k8s_"), 1, 0), \
  adm_no_cluster=if(adm_k8s==1 AND isnull('k8s.cluster.name'), 1, 0), \
  cluster=if(adm_k8s==1, coalesce('k8s.cluster.name', "unknown"), null()), \
  adm_svc_ports=if(adm_src=="k8s_services", coalesce(spath(_raw, "object.spec.ports{}"), spath(_raw, "spec.ports{}"), "-"), "-") \
| mvexpand adm_svc_ports \
| eval adm_svct=if(adm_src=="k8s_services", coalesce('object.spec.type', 'spec.type'), null()), \
  adm_port=if(adm_src=="k8s_services", tonumber(json_extract(adm_svc_ports, "port")), null()), \
  adm_tp=if(adm_src=="k8s_services", lower(coalesce(json_extract(adm_svc_ports, "protocol"), "TCP")), null()), \
  adm_tport=if(adm_src=="k8s_services", json_extract(adm_svc_ports, "targetPort"), null()), \
  adm_nport=if(adm_src=="k8s_services", tonumber(json_extract(adm_svc_ports, "nodePort")), null()), \
  adm_lb_ips=if(adm_src=="k8s_services", mvdedup(mvappend('object.status.loadBalancer.ingress{}.ip', 'status.loadBalancer.ingress{}.ip', 'object.spec.externalIPs{}', 'spec.externalIPs{}')), null()), \
  adm_proxy_ips=if(adm_src=="k8s_node_obj", mvappend('object.metadata.annotations.network.cilium.io/ipv4-Ingress-ip', 'metadata.annotations.network.cilium.io/ipv4-Ingress-ip', \
    'object.metadata.annotations.network.cilium.io/ipv6-Ingress-ip', 'metadata.annotations.network.cilium.io/ipv6-Ingress-ip'), null()), \
  adm_role=case(adm_src=="k8s_services", mvappend(mvmap(adm_lb_ips, "lb=".adm_lb_ips), if(isnotnull(adm_nport) AND (adm_svct=="NodePort" OR adm_svct=="LoadBalancer"), "np=nodeport:".cluster, null())), \
    adm_src=="k8s_node_obj", mvappend("node=-", if(isnotnull(adm_proxy_ips), "proxy=-", null())), true(), "-=-") \
| eval adm_role=coalesce(adm_role, "none=-") \
| mvexpand adm_role \
| where adm_src!="k8s_services" OR match(adm_role, "^(lb|np)=") \
| eval adm_role_kind=replace(adm_role, "=.*$", ""), \
  adm_fe_ip=if(adm_role_kind=="np", replace(adm_role, "^[^=]*=", "").":".adm_nport."/".adm_tp, replace(adm_role, "^[^=]*=", "")), \
  adm_pname=if(adm_src=="k8s_services", coalesce(json_extract(adm_svc_ports, "name"), ""), null()), \
  adm_svc_name=if(adm_src=="k8s_services", coalesce('object.metadata.name', 'metadata.name'), null()), \
  adm_svc_ns=if(adm_src=="k8s_services", coalesce('object.metadata.namespace', 'metadata.namespace'), null()), \
  adm_svc_port=if(adm_role_kind=="np", adm_nport, adm_port), \
  adm_etp=if(adm_src=="k8s_services", coalesce('object.spec.externalTrafficPolicy', 'spec.externalTrafficPolicy', "Cluster"), null()), \
  adm_lbm=if(adm_src=="k8s_services", lower(coalesce('object.metadata.annotations.service.cilium.io/forwarding-mode', 'metadata.annotations.service.cilium.io/forwarding-mode', `adm_cilium_lb_mode`)), null()), \
  adm_ownk=if(adm_src=="k8s_services", mvindex(coalesce('object.metadata.ownerReferences{}.kind', 'metadata.ownerReferences{}.kind'), 0), null()), \
  adm_ownn=if(adm_src=="k8s_services", mvindex(coalesce('object.metadata.ownerReferences{}.name', 'metadata.ownerReferences{}.name'), 0), null()), \
  adm_ctl=case(adm_src!="k8s_services", null(), adm_ownk=="Gateway" OR isnotnull(coalesce('object.metadata.labels.io.cilium.gateway/owning-gateway', 'metadata.labels.io.cilium.gateway/owning-gateway')), "cilium_gateway", \
    adm_ownk=="Ingress" OR lower(coalesce('object.metadata.labels.cilium.io/ingress', 'metadata.labels.cilium.io/ingress'))=="true", "cilium_ingress"), \
  adm_node_name=if(adm_src=="k8s_node_obj", coalesce('object.metadata.name', 'metadata.name'), null()), \
  adm_node_addrs=if(adm_src=="k8s_node_obj", mvzip(coalesce('object.status.addresses{}.type', 'status.addresses{}.type'), coalesce('object.status.addresses{}.address', 'status.addresses{}.address'), "="), null()), \
  adm_created_ts=`adm_iso_time(coalesce('object.metadata.creationTimestamp', 'metadata.creationTimestamp'))` \
| eval adm_pod_ips=coalesce('object.status.podIPs{}.ip', 'status.podIPs{}.ip', 'object.status.podIP', 'status.podIP'), \
  adm_host_ip=coalesce('object.status.hostIP', 'status.hostIP'), \
  adm_hostnet=if(adm_src=="k8s_pods" AND (lower(coalesce('object.spec.hostNetwork', 'spec.hostNetwork'))=="true" \
    OR (isnotnull(adm_host_ip) AND `adm_mv_has(adm_pod_ips, adm_host_ip)`)), 1, 0), \
  adm_ips=case(adm_src=="k8s_pods", adm_pod_ips, adm_src=="aci", mvdedup(mvappend(ip, addr)), adm_src=="nd_endpoints", 'ip{}', \
    adm_src=="k8s_services", adm_fe_ip, adm_src=="k8s_node_obj" AND adm_role_kind=="proxy", adm_proxy_ips, \
    adm_src=="k8s_node_obj", mvmap(adm_node_addrs, if(match(adm_node_addrs, "^(InternalIP|ExternalIP)="), replace(adm_node_addrs, "^[^=]*=", ""), null()))), \
  adm_started=`adm_iso_time(coalesce('object.status.startTime', 'status.startTime'))`, \
  adm_deleted=case(adm_k8s==1 AND adm_type=="DELETED", _time, adm_src=="nd_endpoints" AND lower(modType)=="deletion", _time), \
  adm_added=if(adm_type=="ADDED", _time, null()), \
  adm_created=if(adm_src=="nd_endpoints", `adm_iso_time(createTime)`, null()), \
  adm_key=case(adm_src=="k8s_pods", "pod|".cluster."|".adm_uid, adm_src=="aci", "aci|".dn, adm_src=="nd_endpoints", "nd|".endpointId, \
    adm_src=="k8s_services", "svc|".cluster."|".adm_uid."|".adm_fe_ip."|".adm_svc_port."|".adm_tp, \
    adm_src=="k8s_node_obj", adm_role_kind."|".cluster."|".adm_node_name), \
  adm_name=case(adm_src=="k8s_pods", coalesce('object.metadata.name', 'metadata.name'), adm_src=="aci", mvindex(adm_cep_vm, 0), adm_src=="nd_endpoints", vmName, \
    adm_src=="k8s_services", adm_svc_name, adm_src=="k8s_node_obj", adm_node_name), \
  namespace=case(adm_src=="k8s_pods", coalesce('object.metadata.namespace', 'metadata.namespace'), adm_src=="k8s_services", adm_svc_ns), \
  node=case(adm_src=="k8s_node_obj", adm_node_name, true(), coalesce('object.spec.nodeName', 'spec.nodeName')), \
  adm_rs=mvindex(coalesce('object.metadata.ownerReferences{}.name', 'metadata.ownerReferences{}.name'), 0), \
  adm_rs_kind=mvindex(coalesce('object.metadata.ownerReferences{}.kind', 'metadata.ownerReferences{}.kind'), 0), \
  adm_pth=coalesce('object.metadata.labels.pod-template-hash', 'metadata.labels.pod-template-hash'), \
  owner_kind=if(adm_src!="k8s_pods", null(), if(adm_rs_kind=="ReplicaSet" AND isnotnull(adm_pth) AND adm_rs==replace(adm_rs, "-[^-]+$", "")."-".adm_pth, "Deployment", adm_rs_kind)), \
  owner_name=if(adm_src!="k8s_pods", null(), if(owner_kind=="Deployment" AND adm_rs_kind=="ReplicaSet", replace(adm_rs, "-[^-]+$", ""), adm_rs)), \
  tenant=case(adm_src=="aci", replace(dn, "^uni/tn-([^/]+)/.*$", "\1"), adm_src=="nd_endpoints", tenant), \
  app_profile=if(adm_src=="aci", replace(dn, "^uni/tn-[^/]+/ap-([^/]+)/.*$", "\1"), null()), \
  epg=case(adm_src=="aci", replace(dn, "^uni/tn-[^/]+/ap-[^/]+/epg-([^/]+)/.*$", "\1"), adm_src=="nd_endpoints", displayEpg), \
  attach_device=case(adm_src=="aci" AND match(mvindex(tDn, 0), "^topology/pod-\d+/paths-\d+/"), replace(mvindex(tDn, 0), "^topology/pod-(\d+)/paths-(\d+)/.*$", "pod-\1/node-\2"), adm_src=="nd_endpoints", nodeName), \
  attach_interface=case(adm_src=="aci" AND match(mvindex(tDn, 0), "pathep-\["), replace(mvindex(tDn, 0), "^.*pathep-\[([^\]]+)\]$", "\1"), adm_src=="nd_endpoints", mvindex('displayInterface{}', 0)), \
  mac=upper(mac), \
  adm_scope_observer=case(adm_k8s==1, cluster, adm_src=="aci", apic_host, adm_src=="nd_endpoints", nd_host), \
  adm_scope_kind=case(adm_k8s==1, "cluster", adm_src=="aci", "apic", adm_src=="nd_endpoints", "nd_host") \
| stats min(adm_started) AS adm_started min(adm_added) AS adm_added min(adm_created) AS adm_created min(adm_created_ts) AS adm_created_ts min(_time) AS first_seen max(_time) AS last_seen \
    max(adm_deleted) AS adm_deleted values(adm_ips) AS adm_ips latest(adm_host_ip) AS adm_host_ip max(adm_hostnet) AS adm_hostnet \
    latest(adm_name) AS entity_name latest(namespace) AS namespace latest(node) AS node latest(owner_kind) AS owner_kind latest(owner_name) AS owner_name \
    latest(tenant) AS tenant latest(app_profile) AS app_profile latest(epg) AS epg latest(attach_device) AS attach_device \
    latest(attach_interface) AS attach_interface latest(mac) AS mac latest(adm_scope_observer) AS adm_scope_observer latest(adm_scope_kind) AS adm_scope_kind \
    latest(cluster) AS cluster latest(adm_uid) AS adm_uid latest(dn) AS adm_dn latest(endpointId) AS adm_nd_id max(adm_no_cluster) AS adm_no_cluster \
    latest(adm_role_kind) AS adm_role_kind latest(adm_svc_port) AS port latest(adm_tp) AS transport latest(adm_svct) AS svc_type latest(adm_etp) AS traffic_policy \
    latest(adm_lbm) AS lb_mode latest(adm_ctl) AS controller latest(adm_ownk) AS owner_ref_kind latest(adm_ownn) AS owner_ref_name latest(adm_tport) AS target_port \
    latest(adm_pname) AS port_name \
    by adm_key adm_src \
| eval adm_hn=if(adm_src=="k8s_pods" AND adm_hostnet==1 AND isnotnull(adm_host_ip), 1, 0), \
  adm_ips=if(adm_hn==1, adm_host_ip, adm_ips), \
  source=case(adm_src=="k8s_node_obj" AND adm_role_kind=="proxy", "k8s_node_proxy", adm_src=="k8s_node_obj", "k8s_nodes", adm_hn==1, "k8s_hostnet", true(), adm_src), \
  entity_kind=case(adm_hn==1, "k8s_hostnet_pod", adm_src=="k8s_pods", "pod", adm_src=="k8s_services", "k8s_service", source=="k8s_node_proxy", "k8s_node_proxy", source=="k8s_nodes", "k8s_node", isnotnull(entity_name), "vm", true(), "endpoint"), \
  entity_id=case(adm_src=="k8s_pods" OR adm_src=="k8s_services", adm_uid, adm_src=="k8s_node_obj", cluster."/".node, adm_src=="aci", adm_dn, true(), adm_nd_id), \
  vm_name=if(entity_kind=="vm", entity_name, null()), \
  service=if(entity_kind=="k8s_service", entity_name, null()), \
  priority=case(entity_kind=="k8s_hostnet_pod", 9, entity_kind=="k8s_service", 0, entity_kind=="pod", 1, entity_kind=="k8s_node" OR entity_kind=="k8s_node_proxy", 2, true(), 3), \
  valid_from=case(adm_src=="k8s_pods", coalesce(adm_started, adm_added, adm_created_ts, first_seen), adm_src=="nd_endpoints", coalesce(adm_created, first_seen), \
    entity_kind=="k8s_node", coalesce(adm_created_ts, adm_added, first_seen), true(), first_seen), \
  valid_to=if(adm_src=="aci", null(), adm_deleted) \
| appendpipe [| where (source=="k8s_pods" OR source=="k8s_hostnet") AND isnotnull(adm_host_ip) AND cluster!="unknown" \
    | stats min(valid_from) AS valid_from min(first_seen) AS first_seen max(last_seen) AS last_seen latest(adm_scope_observer) AS adm_scope_observer by cluster node adm_host_ip \
    | eval source="k8s_nodes", entity_kind="k8s_node", entity_id=cluster."/".node, entity_name=node, adm_ips=adm_host_ip, priority=2, adm_scope_kind="cluster", adm_hostnet=0] \
| where adm_hostnet!=1 OR entity_kind=="k8s_hostnet_pod" \
| where entity_kind!="k8s_node" OR cluster!="unknown" \
| fields - adm_host_ip adm_hostnet \
| mvexpand adm_ips \
| eval ip=`adm_ip(adm_ips)` \
| where isnotnull(ip) AND ip!="0.0.0.0" AND ip!="" \
| lookup adm_observer_scope observer_kind AS adm_scope_kind observer AS adm_scope_observer OUTPUT scope AS scope \
| eval scope=coalesce(scope, "default"), \
  ek=case(entity_kind=="pod", "pod:".cluster."/".entity_id, entity_kind=="k8s_hostnet_pod", "hostnet:".cluster."/".entity_id, entity_kind=="k8s_node", "node:".entity_id, entity_kind=="k8s_node_proxy", "proxy:".entity_id, \
    entity_kind=="k8s_service", "svc:".cluster."/".namespace."/".entity_name."/".ip."/".port."/".transport, true(), "ep:".scope."/".ip."/".coalesce(mac, "*")) \
| fields source entity_kind entity_id entity_name ip scope cluster namespace node owner_kind owner_name tenant app_profile epg attach_device attach_interface mac vm_name priority valid_from valid_to first_seen last_seen ek adm_no_cluster \
    port transport service svc_type traffic_policy lb_mode controller owner_ref_kind owner_ref_name target_port port_name
description = Identity observations from Kubernetes pod, Node and Service objects (hostNetwork pods excluded), pod host IPs (nodes), Cilium per-node ingress (Envoy) addresses, ACI endpoints and Nexus Dashboard endpoints; one row per entity and IP with the newest attribute values. Service frontends are port-qualified: LoadBalancer ingress IPs and externalIPs per port, and NodePorts under the pseudo-address nodeport:<cluster>:<nodePort>/<transport>; port_name is the Service port name used to find the EndpointSlice port. hostNetwork pods are kept as entity_kind k8s_hostnet_pod on the node IP (priority 9): they never resolve an address but mark nodes whose own processes could have made a connection.

[adm_identity_desc]
definition = eval valid_end=case(isnotnull(valid_to), valid_to, source=="aci", last_seen + 2*`adm_poll_interval`, \
    source=="k8s_nodes" AND `adm_k8s_node_staleness`>0, last_seen + `adm_k8s_node_staleness`, \
    (source=="k8s_services" OR source=="k8s_node_proxy") AND `adm_k8s_object_staleness`>0, last_seen + `adm_k8s_object_staleness`), \
  desc=json_object("ip", ip, "sc", scope, "vf", valid_from, "vt", valid_to, "ve", valid_end, "fs", first_seen, "ls", last_seen, "p", priority, \
    "kind", entity_kind, "id", entity_id, "name", entity_name, "cluster", nullif(cluster, ""), "ns", nullif(namespace, ""), "node", node, \
    "owner_kind", owner_kind, "owner", owner_name, "tenant", tenant, "ap", app_profile, "epg", epg, "dev", attach_device, "if", attach_interface, \
    "mac", mac, "vm", vm_name, "source", source, "ek", ek, "upd", updated, \
    "port", port, "tp", transport, "svct", svc_type, "etp", traffic_policy, "lbm", lb_mode, "ctl", controller, "ownk", owner_ref_kind, "ownn", owner_ref_name, "tport", target_port, "pn", port_name)
description = Computes valid_end (end used for resolution and pruning) and the desc JSON carried by lookups.

[adm_identity_merge]
definition = eval adm_new=1 \
| lookup adm_ip_identity ip AS ip scope AS scope OUTPUT desc AS adm_group \
| eval adm_group_n=coalesce(mvcount(adm_group), 0) \
| appendpipe [| stats values(adm_group) AS adm_desc max(adm_group_n) AS adm_group_n by ip scope | mvexpand adm_desc \
    | eval adm_new=0, valid_from=tonumber(json_extract(adm_desc, "vf")), valid_to=tonumber(json_extract(adm_desc, "vt")), \
      first_seen=tonumber(json_extract(adm_desc, "fs")), last_seen=tonumber(json_extract(adm_desc, "ls")), priority=tonumber(json_extract(adm_desc, "p")), \
      entity_kind=json_extract(adm_desc, "kind"), entity_id=json_extract(adm_desc, "id"), entity_name=json_extract(adm_desc, "name"), \
      cluster=json_extract(adm_desc, "cluster"), namespace=json_extract(adm_desc, "ns"), node=json_extract(adm_desc, "node"), \
      owner_kind=json_extract(adm_desc, "owner_kind"), owner_name=json_extract(adm_desc, "owner"), tenant=json_extract(adm_desc, "tenant"), \
      app_profile=json_extract(adm_desc, "ap"), epg=json_extract(adm_desc, "epg"), attach_device=json_extract(adm_desc, "dev"), \
      attach_interface=json_extract(adm_desc, "if"), mac=json_extract(adm_desc, "mac"), vm_name=json_extract(adm_desc, "vm"), \
      source=json_extract(adm_desc, "source"), ek=json_extract(adm_desc, "ek"), \
      port=tonumber(json_extract(adm_desc, "port")), transport=json_extract(adm_desc, "tp"), svc_type=json_extract(adm_desc, "svct"), \
      traffic_policy=json_extract(adm_desc, "etp"), lb_mode=json_extract(adm_desc, "lbm"), controller=json_extract(adm_desc, "ctl"), \
      owner_ref_kind=json_extract(adm_desc, "ownk"), owner_ref_name=json_extract(adm_desc, "ownn"), target_port=json_extract(adm_desc, "tport"), \
      port_name=json_extract(adm_desc, "pn"), \
      service=if(entity_kind=="k8s_service", entity_name, null())] \
| fields - adm_group adm_desc \
| where isnotnull(source) AND isnotnull(entity_id) \
| eventstats max(adm_group_n) AS adm_group_n by ip scope \
| eval adm_k=sha256(source."|".entity_kind."|".entity_id."|".ip."|".scope.if(entity_kind=="k8s_service", "|".port."|".transport, "")) \
| sort 0 - adm_new - last_seen \
| stats min(valid_from) AS valid_from max(valid_to) AS valid_to min(first_seen) AS first_seen max(last_seen) AS last_seen \
    first(entity_name) AS entity_name first(cluster) AS cluster first(namespace) AS namespace first(node) AS node \
    first(owner_kind) AS owner_kind first(owner_name) AS owner_name first(tenant) AS tenant first(app_profile) AS app_profile first(epg) AS epg \
    first(attach_device) AS attach_device first(attach_interface) AS attach_interface first(mac) AS mac first(vm_name) AS vm_name \
    first(ek) AS ek min(priority) AS priority max(adm_new) AS adm_observed max(adm_group_n) AS adm_group_n max(adm_no_cluster) AS adm_no_cluster \
    first(port) AS port first(transport) AS transport first(service) AS service first(svc_type) AS svc_type first(traffic_policy) AS traffic_policy \
    first(lb_mode) AS lb_mode first(controller) AS controller first(owner_ref_kind) AS owner_ref_kind first(owner_ref_name) AS owner_ref_name first(target_port) AS target_port \
    first(port_name) AS port_name \
    by adm_k source entity_kind entity_id ip scope \
| eval adm_class=case(entity_kind=="pod", "pod", entity_kind=="k8s_node", "node", entity_kind=="k8s_node_proxy", "proxy", \
    entity_kind=="k8s_service", "svc:".port."/".transport, source=="nd_endpoints", "nd", true(), "none") \
| sort 0 scope ip adm_class -valid_from \
| streamstats current=f window=1 last(valid_from) AS adm_next_from last(entity_id) AS adm_next_id by scope ip adm_class \
| eval adm_truncated=if(adm_group_n>=`adm_identity_max_matches`, 1, 0), \
  adm_close=if(adm_class!="none" AND adm_truncated==0 AND isnotnull(adm_next_from) AND adm_next_id!=entity_id \
    AND (isnull(valid_to) OR valid_to>adm_next_from), 1, 0), \
  valid_to=if(adm_close==1, adm_next_from, valid_to), \
  adm_write=if(adm_observed==1 OR adm_close==1, 1, 0), updated=now(), _key=adm_k \
| `adm_identity_desc`
description = Combines new observations with the stored rows of the same IP and scope (read through the lookup, never a full collection read) and closes the earlier interval when another pod, node, Envoy address, Service frontend (same port) or Nexus Dashboard endpoint later takes the IP. Skips closing for IPs whose stored rows may be truncated.

[adm_identity_build]
definition = `adm_identity_observations` | `adm_identity_merge` \
| appendpipe [| where adm_write==1 \
    | fields _key ip scope entity_kind entity_id entity_name cluster namespace owner_kind owner_name node tenant app_profile epg attach_device attach_interface mac vm_name valid_from valid_to valid_end first_seen last_seen priority source ek updated desc \
        port transport service svc_type traffic_policy lb_mode controller owner_ref_kind owner_ref_name target_port port_name \
    | outputlookup append=true key_field=_key override_if_empty=false adm_ip_identity | where false()] \
| stats sum(adm_write) AS rows_written count(eval(adm_observed==1)) AS rows_observed sum(adm_close) AS rows_closed \
    dc(eval(if(adm_truncated==1, ip, null()))) AS truncated_ips sum(adm_no_cluster) AS rows_missing_cluster \
| eval warnings=mvappend(if(truncated_ips>0, truncated_ips." IPs returned adm_identity_max_matches stored rows; their intervals were not closed.", null()), \
    if(rows_missing_cluster>0, rows_missing_cluster." pod rows had no k8s.cluster.name and were stored with cluster unknown; set clusterName in the Helm chart.", null()))
description = Upserts identity rows (outputlookup append=true key_field=_key) and returns one summary row with warnings. Never deletes rows; see ADM - Identity prune.

[adm_identity_prune]
definition = `adm_kv_read_all(adm_ip_identity)` \
| eval adm_keep=if(isnull(valid_end) OR valid_end>=now()-`adm_identity_retention`, 1, 0) \
| appendpipe [| where adm_complete==1 AND adm_page>=1 AND adm_keep==1 | fields - adm_* | outputlookup override_if_empty=false adm_ip_identity | where false()] \
| stats max(adm_complete) AS complete count(eval(adm_page>=1)) AS rows_read count(eval(adm_page>=1 AND adm_keep==0)) AS rows_expired \
| eval rows_pruned=if(complete==1, rows_expired, 0), \
  warnings=if(complete==1, null(), "adm_ip_identity could not be read completely (over 200,000 rows or limits.conf max_rows_per_query below 10,000); nothing was pruned.")
description = Rewrites adm_ip_identity without rows whose validity ended before the retention period, only after a provably complete paged read.

[adm_service_binding_build]
definition = `adm_index_traces` `adm_traces_sourcetype` \
| rename "service.name" AS service, "deployment.environment.name" AS environment, "k8s.cluster.name" AS cluster, "k8s.namespace.name" AS namespace, "k8s.pod.uid" AS pod_uid, "k8s.pod.name" AS pod_name \
| eval environment=coalesce(environment, 'deployment.environment') \
| where isnotnull(service) AND isnotnull(pod_uid) \
| fillnull value="" environment cluster namespace \
| stats min(_time) AS first_seen max(_time) AS last_seen latest(pod_name) AS pod_name by service environment cluster namespace pod_uid \
| eval adm_k=sha256(service."|".environment."|".cluster."|".namespace."|".pod_uid) \
| lookup adm_service_workload _key AS adm_k OUTPUT first_seen AS adm_old_first last_seen AS adm_old_last \
| eval first_seen=min(first_seen, coalesce(adm_old_first, first_seen)), last_seen=max(last_seen, coalesce(adm_old_last, last_seen)), updated=now(), _key=adm_k \
| fields _key service environment cluster namespace pod_uid pod_name first_seen last_seen updated \
| outputlookup append=true key_field=_key override_if_empty=false adm_service_workload \
| stats count AS rows_written
description = Upserts OTel service (service.name, deployment.environment.name, k8s.cluster.name, k8s.namespace.name) to pod UID bindings.

[adm_service_binding_prune]
definition = `adm_kv_read_all(adm_service_workload)` \
| eval adm_keep=if(last_seen>=now()-`adm_identity_retention`, 1, 0) \
| appendpipe [| where adm_complete==1 AND adm_page>=1 AND adm_keep==1 | fields - adm_* | outputlookup override_if_empty=false adm_service_workload | where false()] \
| stats max(adm_complete) AS complete count(eval(adm_page>=1)) AS rows_read count(eval(adm_page>=1 AND adm_keep==0)) AS rows_expired \
| eval rows_pruned=if(complete==1, rows_expired, 0), \
  warnings=if(complete==1, null(), "adm_service_workload could not be read completely; nothing was pruned.")
description = Rewrites adm_service_workload without bindings last seen before the retention period, only after a provably complete paged read.

[adm_k8s_service_build]
definition = `adm_index_k8s` (sourcetype="kube:object:endpointslices" OR sourcetype="kube:object:httproutes" OR sourcetype="kube:object:ingresses") \
| eval adm_type=coalesce(type, "SNAPSHOT"), cluster=coalesce('k8s.cluster.name', "unknown"), \
  namespace=coalesce('object.metadata.namespace', 'metadata.namespace'), adm_puid=coalesce('object.metadata.uid', 'metadata.uid'), \
  adm_pname=coalesce('object.metadata.name', 'metadata.name'), \
  adm_kind=if(sourcetype=="kube:object:endpointslices", "backend", "route"), \
  adm_rkind=case(sourcetype=="kube:object:httproutes", "HTTPRoute", sourcetype=="kube:object:ingresses", "Ingress"), \
  adm_svc=coalesce('object.metadata.labels.kubernetes.io/service-name', 'metadata.labels.kubernetes.io/service-name'), \
  adm_portsj=coalesce(spath(_raw, "object.ports{}"), spath(_raw, "ports{}")), \
  adm_hosts=mvjoin(coalesce('object.spec.hostnames{}', 'spec.hostnames{}'), ","), \
  adm_prefs=coalesce(spath(_raw, "object.spec.parentRefs{}"), spath(_raw, "spec.parentRefs{}")), \
  adm_imode=lower(coalesce('object.metadata.annotations.ingress.cilium.io/loadbalancer-mode', 'metadata.annotations.ingress.cilium.io/loadbalancer-mode', `adm_cilium_ingress_mode`)), \
  adm_items=coalesce(case(adm_kind=="backend", coalesce(spath(_raw, "object.endpoints{}"), spath(_raw, "endpoints{}")), \
    true(), coalesce(spath(_raw, "object.spec.rules{}"), spath(_raw, "spec.rules{}"))), "-") \
| where isnotnull(adm_puid) AND isnotnull(namespace) \
| eval adm_lkey=adm_kind."|".cluster."|".adm_puid \
| mvexpand adm_items \
| eval adm_ports=mvmap(adm_portsj, json_extract(adm_portsj, "port")."/".lower(coalesce(json_extract(adm_portsj, "protocol"), "TCP"))."/".coalesce(json_extract(adm_portsj, "name"), "")), \
  adm_refs=case(adm_rkind=="HTTPRoute", spath(adm_items, "backendRefs{}"), adm_rkind=="Ingress", spath(adm_items, "http.paths{}")), \
  adm_rpath=mvindex(spath(adm_items, "matches{}.path.value"), 0), adm_ihost=json_extract(adm_items, "host"), \
  adm_ep_uid=json_extract(adm_items, "targetRef.uid"), adm_ep_name=json_extract(adm_items, "targetRef.name"), \
  adm_ep_ip=mvindex(spath(adm_items, "addresses{}"), 0), adm_ep_node=json_extract(adm_items, "nodeName"), \
  adm_ep_ready=lower(coalesce(tostring(json_extract(adm_items, "conditions.ready")), "true")), \
  adm_parents=case(adm_rkind=="HTTPRoute", mvmap(adm_prefs, coalesce(json_extract(adm_prefs, "kind"), "Gateway")."/".coalesce(json_extract(adm_prefs, "namespace"), namespace)."/".json_extract(adm_prefs, "name")), \
    adm_rkind=="Ingress", if(adm_imode=="shared", "IngressShared", "Ingress")."/".namespace."/".adm_pname, true(), "-") \
| eval adm_children=case(adm_items=="-", "-", \
    adm_kind=="backend" AND isnotnull(adm_ep_uid) AND adm_ep_ready!="false", \
      mvmap(adm_ports, json_object("uid", adm_ep_uid, "name", adm_ep_name, "ip", adm_ep_ip, "node", adm_ep_node, \
        "port", tonumber(mvindex(split(adm_ports, "/"), 0)), "proto", mvindex(split(adm_ports, "/"), 1), "pn", mvindex(split(adm_ports, "/"), 2))), \
    adm_rkind=="HTTPRoute", mvmap(adm_refs, json_object("bsvc", json_extract(adm_refs, "name"), "bns", coalesce(json_extract(adm_refs, "namespace"), namespace), \
        "bport", tonumber(json_extract(adm_refs, "port")), "bkind", coalesce(json_extract(adm_refs, "kind"), "Service"), "host", adm_hosts, "path", adm_rpath)), \
    adm_rkind=="Ingress", mvmap(adm_refs, json_object("bsvc", json_extract(adm_refs, "backend.service.name"), "bns", namespace, \
        "bport", tonumber(json_extract(adm_refs, "backend.service.port.number")), "bkind", "Service", \
        "host", adm_ihost, "path", json_extract(adm_refs, "path")))) \
| eval adm_children=coalesce(adm_children, "-") \
| mvexpand adm_children \
| mvexpand adm_parents \
| appendpipe [| stats values(_time) AS adm_parent_times latest(cluster) AS cluster latest(namespace) AS namespace by adm_kind adm_lkey adm_puid | eval adm_prow=1] \
| where adm_prow==1 OR (adm_children!="-" AND (adm_kind=="backend" OR json_extract(adm_children, "bkind")=="Service")) \
| eval adm_deleted=if(adm_type=="DELETED", _time, null()), \
  service=if(adm_kind=="backend", adm_svc, null()), pod_uid=json_extract(adm_children, "uid"), pod_name=json_extract(adm_children, "name"), \
  adm_bip=json_extract(adm_children, "ip"), node=json_extract(adm_children, "node"), target_port=tonumber(json_extract(adm_children, "port")), \
  protocol=json_extract(adm_children, "proto"), port_name=json_extract(adm_children, "pn"), \
  route_kind=adm_rkind, route_name=if(adm_kind=="route", adm_pname, null()), \
  parent_kind=if(adm_kind=="route", mvindex(split(adm_parents, "/"), 0), null()), parent_namespace=if(adm_kind=="route", mvindex(split(adm_parents, "/"), 1), null()), \
  parent_name=if(adm_kind=="route", mvindex(split(adm_parents, "/"), 2), null()), \
  host=json_extract(adm_children, "host"), path=json_extract(adm_children, "path"), \
  backend_service=json_extract(adm_children, "bsvc"), backend_namespace=json_extract(adm_children, "bns"), backend_port=tonumber(json_extract(adm_children, "bport")), \
  ip=`adm_ip(adm_bip)`, \
  adm_ck=case(adm_prow==1, "P|".adm_lkey, adm_kind=="backend", "b|".cluster."|".namespace."|".adm_svc."|".adm_puid."|".pod_uid."|".target_port."|".protocol, \
    true(), "r|".cluster."|".namespace."|".adm_puid."|".parent_kind."|".parent_namespace."|".parent_name."|".backend_namespace."|".backend_service."|".backend_port."|".coalesce(host, "")."|".coalesce(path, "")) \
| stats min(_time) AS first_seen max(_time) AS last_seen max(adm_deleted) AS adm_deleted values(adm_parent_times) AS adm_parent_times max(adm_prow) AS adm_prow \
    latest(adm_lkey) AS adm_lkey latest(adm_puid) AS adm_puid latest(cluster) AS cluster latest(namespace) AS namespace latest(service) AS service latest(pod_uid) AS pod_uid \
    latest(pod_name) AS pod_name latest(ip) AS ip latest(node) AS node latest(target_port) AS target_port latest(protocol) AS protocol latest(port_name) AS port_name \
    latest(route_kind) AS route_kind latest(route_name) AS route_name latest(parent_kind) AS parent_kind latest(parent_namespace) AS parent_namespace latest(parent_name) AS parent_name \
    latest(host) AS host latest(path) AS path latest(backend_service) AS backend_service latest(backend_namespace) AS backend_namespace latest(backend_port) AS backend_port by adm_kind adm_ck \
| eventstats values(adm_parent_times) AS adm_ptimes values(eval(if(adm_prow==1, null(), adm_ck))) AS adm_run_cks by adm_lkey \
| eval slice_uid=if(adm_kind=="backend", adm_puid, null()), route_uid=if(adm_kind=="route", adm_puid, null()) \
| lookup adm_service_backends slice_uid AS slice_uid cluster AS cluster OUTPUT desc AS adm_stored_b \
| lookup adm_service_routes route_uid AS route_uid cluster AS cluster OUTPUT desc AS adm_stored_r \
| eval adm_stored=coalesce(adm_stored_b, adm_stored_r), adm_stored_n=coalesce(mvcount(adm_stored), 0), \
  adm_next=mvindex(mvsort(mvmap(adm_ptimes, if(tonumber(adm_ptimes)>last_seen, adm_ptimes, null()))), 0), \
  adm_same=if(adm_prow==1, null(), mvmap(adm_stored, if(json_extract(adm_stored, "ck")==adm_ck, \
    substr("0000000000".tostring(floor(tonumber(json_extract(adm_stored, "vf")))), -10)."#".adm_stored, null()))), \
  adm_match=replace(mvindex(mvsort(mvmap(adm_same, if(tonumber(mvindex(split(adm_same, "#"), 0))<=last_seen, adm_same, null()))), -1), "^[^#]*#", ""), \
  adm_mvf=tonumber(json_extract(adm_match, "vf")), adm_mvt=tonumber(json_extract(adm_match, "vt")), \
  adm_prior=mvcount(mvmap(adm_same, if(isnotnull(tonumber(json_extract(replace(adm_same, "^[^#]*#", ""), "vt"))) \
    AND tonumber(json_extract(replace(adm_same, "^[^#]*#", ""), "vt"))<=adm_mvf, "1", null()))), \
  adm_isnew=if(isnull(adm_match) OR (isnotnull(adm_mvt) AND adm_mvt<first_seen), 1, 0), \
  adm_match=if(adm_isnew==1, null(), adm_match), \
  valid_to=case(isnotnull(adm_deleted), adm_deleted, isnotnull(adm_next), tonumber(adm_next), isnotnull(adm_mvt) AND adm_isnew==0 AND adm_mvt>=last_seen, adm_mvt), \
  valid_from=case(isnull(adm_match), first_seen, coalesce(adm_prior, 0)>0, adm_mvf, true(), min(first_seen, adm_mvf)), \
  first_seen=if(isnull(adm_match), first_seen, max(valid_from, min(first_seen, tonumber(json_extract(adm_match, "fs"))))), \
  last_seen=max(last_seen, coalesce(tonumber(json_extract(adm_match, "ls")), last_seen)), \
  _key=coalesce(json_extract(adm_match, "k"), sha256(adm_ck."|".tostring(floor(valid_from)))), adm_new=1 \
| appendpipe [| where adm_prow==1 AND adm_stored_n>0 \
    | mvexpand adm_stored \
    | eval adm_ck=json_extract(adm_stored, "ck"), adm_new=0, adm_sls=tonumber(json_extract(adm_stored, "ls")), \
      adm_close=mvindex(mvsort(mvmap(adm_ptimes, if(tonumber(adm_ptimes)>adm_sls, adm_ptimes, null()))), 0) \
    | where NOT `adm_mv_has(adm_run_cks, adm_ck)` AND isnull(tonumber(json_extract(adm_stored, "vt"))) AND isnotnull(adm_close) \
    | eval _key=json_extract(adm_stored, "k"), cluster=json_extract(adm_stored, "cluster"), namespace=json_extract(adm_stored, "ns"), service=json_extract(adm_stored, "svc"), \
      pod_uid=json_extract(adm_stored, "uid"), pod_name=json_extract(adm_stored, "name"), ip=json_extract(adm_stored, "ip"), node=json_extract(adm_stored, "node"), \
      target_port=tonumber(json_extract(adm_stored, "port")), protocol=json_extract(adm_stored, "proto"), port_name=json_extract(adm_stored, "pn"), \
      route_kind=json_extract(adm_stored, "rk"), route_name=json_extract(adm_stored, "rn"), parent_kind=json_extract(adm_stored, "pk"), \
      parent_namespace=json_extract(adm_stored, "pns"), parent_name=json_extract(adm_stored, "pn2"), host=json_extract(adm_stored, "host"), path=json_extract(adm_stored, "path"), \
      backend_service=json_extract(adm_stored, "bsvc"), backend_namespace=json_extract(adm_stored, "bns"), backend_port=tonumber(json_extract(adm_stored, "bport")), \
      first_seen=tonumber(json_extract(adm_stored, "fs")), last_seen=adm_sls, valid_from=tonumber(json_extract(adm_stored, "vf")), valid_to=adm_close, adm_prow=0] \
| where coalesce(adm_prow, 0)!=1 \
| eval valid_end=case(isnotnull(valid_to), valid_to, `adm_k8s_object_staleness`>0, last_seen + `adm_k8s_object_staleness`), updated=now(), \
  desc=json_object("k", _key, "ck", adm_ck, "cluster", cluster, "ns", namespace, "svc", service, "uid", pod_uid, "name", pod_name, "ip", ip, "node", node, "port", target_port, \
    "proto", protocol, "pn", port_name, "rk", route_kind, "rn", route_name, "pk", parent_kind, "pns", parent_namespace, "pn2", parent_name, "host", host, "path", path, \
    "bsvc", backend_service, "bns", backend_namespace, "bport", backend_port, "fs", first_seen, "ls", last_seen, "vf", valid_from, "vt", valid_to, "ve", valid_end) \
| appendpipe [| where adm_kind=="backend" \
    | fields _key cluster namespace service slice_uid pod_uid pod_name ip node target_port protocol port_name valid_from valid_to first_seen last_seen updated desc \
    | outputlookup append=true key_field=_key override_if_empty=false adm_service_backends | where false()] \
| appendpipe [| where adm_kind=="route" \
    | fields _key cluster namespace route_uid route_kind route_name parent_kind parent_namespace parent_name host path backend_service backend_namespace backend_port valid_from valid_to first_seen last_seen updated desc \
    | outputlookup append=true key_field=_key override_if_empty=false adm_service_routes | where false()] \
| stats count(eval(adm_kind=="backend")) AS backends_written count(eval(adm_kind=="route")) AS routes_written count(eval(adm_new==0)) AS rows_closed \
    count(eval(cluster=="unknown")) AS rows_missing_cluster dc(eval(if(adm_stored_n>=1000, adm_lkey, null()))) AS capped_parents \
| eval warnings=mvappend(if(rows_missing_cluster>0, rows_missing_cluster." backend or route rows had no k8s.cluster.name; set clusterName in the Helm chart.", null()), \
    if(capped_parents>0, capped_parents." EndpointSlices or routes returned 1000 stored rows (lookup max_matches); some intervals may not have been merged or closed.", null()))
description = Upserts adm_service_backends (EndpointSlice endpoints per Service, pod, port and port name) and adm_service_routes (HTTPRoute rules: parent Gateway namespace/name to backend namespace/Service/port; Ingress rules) from watch events or pull snapshots. A child present in the run continues its stored open interval (same _key, earliest valid_from and first_seen kept); a child absent from a later listing of its EndpointSlice or route (also a listing with no ready endpoints) or from a DELETED event is closed at that listing; a child that reappears after being closed starts a new interval. Cilium's dummy endpoints without targetRef and endpoints with conditions.ready=false are not backends.

[adm_service_backends_prune]
definition = `adm_kv_read_all(adm_service_backends)` \
| eval adm_keep=if(isnull(valid_to) OR valid_to>=now()-`adm_identity_retention`, 1, 0) \
| appendpipe [| where adm_complete==1 AND adm_page>=1 AND adm_keep==1 | fields - adm_* | outputlookup override_if_empty=false adm_service_backends | where false()] \
| stats max(adm_complete) AS complete count(eval(adm_page>=1)) AS rows_read count(eval(adm_page>=1 AND adm_keep==0)) AS rows_expired \
| eval rows_pruned=if(complete==1, rows_expired, 0), warnings=if(complete==1, null(), "adm_service_backends could not be read completely; nothing was pruned.")
description = Rewrites adm_service_backends without rows whose validity ended before the retention period, only after a provably complete paged read.

[adm_service_routes_prune]
definition = `adm_kv_read_all(adm_service_routes)` \
| eval adm_keep=if(isnull(valid_to) OR valid_to>=now()-`adm_identity_retention`, 1, 0) \
| appendpipe [| where adm_complete==1 AND adm_page>=1 AND adm_keep==1 | fields - adm_* | outputlookup override_if_empty=false adm_service_routes | where false()] \
| stats max(adm_complete) AS complete count(eval(adm_page>=1)) AS rows_read count(eval(adm_page>=1 AND adm_keep==0)) AS rows_expired \
| eval rows_pruned=if(complete==1, rows_expired, 0), warnings=if(complete==1, null(), "adm_service_routes could not be read completely; nothing was pruned.")
description = Rewrites adm_service_routes without rows whose validity ended before the retention period, only after a provably complete paged read.

[adm_aci_policy_build]
definition = `adm_index_dcn` sourcetype="cisco:dc:aci:class" (component="l3extSubnet" OR component="l3extInstP" OR component="fvRsCons" OR component="fvRsProv" \
    OR component="vzBrCP" OR component="vzSubj" OR component="vzRsSubjFiltAtt" OR component="vzEntry" OR component="fvAEPg" OR component="fvEPg" OR component="fvCtx" \
    OR component="vzRsAnyToCons" OR component="vzRsAnyToProv" OR component="vzRsAnyToConsIf" OR component="vzInTerm" OR component="vzOutTerm" \
    OR component="vzTaboo" OR component="fvRsProtBy" OR component="fvESg" OR component="vzRsSubjGraphAtt") \
| eval object_kind=case(component=="l3extSubnet", "subnet", component=="l3extInstP", "instp", component=="fvRsCons", "cons", component=="fvRsProv", "prov", \
    component=="vzBrCP", "contract", component=="vzSubj", "subj", component=="vzRsSubjFiltAtt", "filtatt", component=="vzEntry", "entry", \
    component=="fvCtx", "ctx", component=="fvAEPg" OR component=="fvEPg", "epg", \
    component=="vzInTerm" OR component=="vzOutTerm", "term", true(), "unsupported"), \
  tenant=replace(dn, "^uni/tn-([^/]+)/.*$", "\1"), \
  class_dn=case(object_kind=="cons" OR object_kind=="prov", replace(dn, "/rs(cons|prov)-[^/]+$", ""), object_kind=="subnet", replace(dn, "/extsubnet-\[.*\]$", ""), \
    object_kind=="instp" OR object_kind=="epg", dn), \
  contract_dn=case(object_kind=="cons" OR object_kind=="prov", tDn, object_kind=="subj" OR object_kind=="filtatt" OR object_kind=="term", replace(dn, "^(uni/tn-[^/]+/brc-[^/]+)/.*$", "\1"), \
    object_kind=="contract", dn), \
  subject=case(object_kind=="subj", name, object_kind=="filtatt" OR object_kind=="term", replace(dn, "^uni/tn-[^/]+/brc-[^/]+/subj-([^/]+)/.*$", "\1")), \
  filter_dn=case(object_kind=="filtatt", tDn, object_kind=="entry", replace(dn, "/e-[^/]+$", "")), \
  action=if(object_kind=="filtatt", coalesce(action, "permit"), null()), directives=if(object_kind=="filtatt", directives, null()), \
  prot=if(object_kind=="entry", prot, null()), d_from=if(object_kind=="entry", dFromPort, null()), d_to=if(object_kind=="entry", dToPort, null()), \
  s_from=if(object_kind=="entry", sFromPort, null()), s_to=if(object_kind=="entry", sToPort, null()), tcp_rules=if(object_kind=="entry", tcpRules, null()), \
  ether_t=if(object_kind=="entry", etherT, null()), subnet=if(object_kind=="subnet", ip, null()), subnet_scope=if(object_kind=="subnet", scope, null()), \
  contract_scope=if(object_kind=="contract", scope, null()), enf_pref=if(object_kind=="ctx" OR object_kind=="epg", pcEnfPref, null()), \
  pref_group=if(object_kind=="instp" OR object_kind=="epg", prefGrMemb, null()), \
  name=case(object_kind=="contract" OR object_kind=="entry" OR object_kind=="ctx" OR object_kind=="unsupported", coalesce(name, component), \
    object_kind=="cons" OR object_kind=="prov", tnVzBrCPName, object_kind=="filtatt", tnVzFilterName, object_kind=="term", component) \
| stats min(_time) AS first_seen max(_time) AS last_seen latest(object_kind) AS object_kind latest(tenant) AS tenant latest(class_dn) AS class_dn \
    latest(contract_dn) AS contract_dn latest(subject) AS subject latest(filter_dn) AS filter_dn latest(action) AS action latest(directives) AS directives \
    latest(prot) AS prot latest(d_from) AS d_from latest(d_to) AS d_to latest(s_from) AS s_from latest(s_to) AS s_to latest(tcp_rules) AS tcp_rules \
    latest(ether_t) AS ether_t latest(subnet) AS subnet latest(subnet_scope) AS subnet_scope latest(contract_scope) AS contract_scope latest(enf_pref) AS enf_pref \
    latest(pref_group) AS pref_group latest(name) AS name by apic_host dn \
| eval updated=now(), _key=sha256(apic_host."|".dn) \
| lookup adm_aci_policy _key AS _key OUTPUT first_seen AS adm_old_first \
| eval first_seen=min(first_seen, coalesce(adm_old_first, first_seen)) \
| fields _key apic_host dn object_kind tenant class_dn contract_dn subject filter_dn action directives prot d_from d_to s_from s_to tcp_rules ether_t subnet subnet_scope \
    contract_scope enf_pref pref_group name first_seen last_seen updated \
| outputlookup append=true key_field=_key override_if_empty=false adm_aci_policy \
| stats count AS rows_written
description = Upserts adm_aci_policy, one row per APIC object DN: contracts (vzBrCP, with scope), subjects (vzSubj), subject-filter relations (vzRsSubjFiltAtt: filter_dn, action, directives), filter entries (vzEntry: prot, d_from, d_to, s_from, s_to, tcp_rules, ether_t), consumer and provider relations (fvRsCons, fvRsProv), external EPG subnets (l3extSubnet), preferred-group membership and enforcement preference (l3extInstP, fvAEPg/fvEPg, fvCtx pcEnfPref), subject in/out terms (vzInTerm, vzOutTerm, object_kind term), and policy the graph does not evaluate (vzAny relations, taboos, ESGs, service graphs: object_kind unsupported).

[adm_aci_policy_prune]
definition = `adm_kv_read_all(adm_aci_policy)` \
| eval adm_keep=if(last_seen>=now()-`adm_identity_retention`, 1, 0) \
| appendpipe [| where adm_complete==1 AND adm_page>=1 AND adm_keep==1 | fields - adm_* | outputlookup override_if_empty=false adm_aci_policy | where false()] \
| stats max(adm_complete) AS complete count(eval(adm_page>=1)) AS rows_read count(eval(adm_page>=1 AND adm_keep==0)) AS rows_expired \
| eval rows_pruned=if(complete==1, rows_expired, 0), warnings=if(complete==1, null(), "adm_aci_policy could not be read completely; nothing was pruned.")
description = Rewrites adm_aci_policy without objects last polled before the retention period, only after a provably complete paged read.

[adm_interfaces_build]
definition = `adm_index_dcn` sourcetype="cisco:dc:nexus9k" (component="nxneighbor" OR component="nxhostname") \
| eval device_ip=replace(device, ":\d+$", ""), adm_hostname=if(component=="nxhostname", mvindex('Row_info{}.hostname', 0), null()) \
| eventstats latest(adm_hostname) AS adm_device by device_ip \
| where component=="nxneighbor" AND isnotnull('Row_info.ifindex') \
| eval ifindex='Row_info.ifindex', interface='Row_info.intf_id', neighbor=replace('Row_info.device_id', "\([^)]*\)$", ""), neighbor_interface='Row_info.port_id', device=adm_device \
| stats latest(device) AS device latest(interface) AS interface latest(neighbor) AS neighbor latest(neighbor_interface) AS neighbor_interface max(_time) AS updated by device_ip ifindex \
| eval _key=device_ip."|".ifindex \
| outputlookup append=true key_field=_key override_if_empty=false adm_interfaces \
| stats count AS rows_written
description = Upserts NX-OS SNMP ifIndex to interface name mappings from CDP neighbor output (the only default NX-API command reporting ifIndex).

# ---- graph (on demand) ----

[adm_service_node(1)]
args = id
validation = match(id, "^[a-z_]+\z")
errormsg = adm_service_node expects a field name.
definition = json_object("id", $id$, "label", mvindex(split(replace($id$, "^service:", ""), "/"), 2), "kind", "service", \
  "namespace", nullif(mvindex(split(replace($id$, "^service:", ""), "/"), 1), ""), "cluster", nullif(mvindex(split(replace($id$, "^service:", ""), "/"), 0), ""), \
  "attr_environment", nullif(mvindex(split(replace($id$, "^service:", ""), "/"), 3), ""), \
  "reason", "OpenTelemetry service.name qualified by deployment.environment.name, k8s.cluster.name and k8s.namespace.name")
description = Graph node JSON for a service ID service:<cluster>/<namespace>/<service>/<environment>.

[adm_pick(2)]
args = side, key
validation = match(side, "^(c|s)\z") AND match(key, "^[a-z_]+\z")
errormsg = adm_pick expects side c or s and a desc key.
definition = if(adm_$side$_state=="resolved", mvindex(mvmap(adm_$side$_sorted, json_extract(replace(adm_$side$_sorted, "^[^#]*#[^#]*#[^#]*#", ""), "$key$").""), 0), null())
description = First non-empty value of a desc key across the covering identity candidates, best priority and ACI before Nexus Dashboard first.

[adm_resolve(2)]
args = side, ip
validation = match(side, "^(c|s)\z") AND match(ip, "^[a-z_]+\z")
errormsg = adm_resolve expects side c or s and an IP field name.
definition = eval adm_$side$_cand=mvmap(adm_$side$_desc, if(tonumber(json_extract(adm_$side$_desc, "vf"))<=adm_bfs AND (isnull(tonumber(json_extract(adm_$side$_desc, "ve"))) OR tonumber(json_extract(adm_$side$_desc, "ve"))>adm_bls) \
      AND json_extract(adm_$side$_desc, "kind")!="k8s_hostnet_pod" \
      AND (json_extract(adm_$side$_desc, "kind")!="k8s_service" OR ("$side$"=="s" AND tostring(json_extract(adm_$side$_desc, "port"))==tostring(server_port) AND json_extract(adm_$side$_desc, "tp")==transport)), \
    json_extract(adm_$side$_desc, "p")."#".case(json_extract(adm_$side$_desc, "source")=="aci", "1", json_extract(adm_$side$_desc, "source")=="nd_endpoints", "2", true(), "0")."#".json_extract(adm_$side$_desc, "ek")."#".adm_$side$_desc, null())) \
| eval adm_$side$_hn=if(isnotnull(mvmap(adm_$side$_desc, if(json_extract(adm_$side$_desc, "kind")=="k8s_hostnet_pod" AND tonumber(json_extract(adm_$side$_desc, "vf"))<=adm_bls \
      AND (isnull(tonumber(json_extract(adm_$side$_desc, "ve"))) OR tonumber(json_extract(adm_$side$_desc, "ve"))>=adm_bfs), 1, null()))), 1, 0), \
  adm_$side$_sorted=mvsort(adm_$side$_cand), adm_$side$_bp=mvindex(split(mvindex(adm_$side$_sorted, 0), "#"), 0), \
  adm_$side$_eks=mvdedup(mvmap(adm_$side$_sorted, if(mvindex(split(adm_$side$_sorted, "#"), 0)==adm_$side$_bp, mvindex(split(adm_$side$_sorted, "#"), 2), null()))), \
  adm_$side$_ekm=mvmap(adm_$side$_eks, if(match(adm_$side$_eks, "/\*$"), null(), adm_$side$_eks)), \
  adm_$side$_nent=if(mvcount(adm_$side$_ekm)>0, mvcount(adm_$side$_ekm), if(mvcount(adm_$side$_eks)>0, 1, 0)), \
  adm_$side$_bek=coalesce(mvindex(adm_$side$_ekm, 0), mvindex(adm_$side$_eks, 0)), \
  adm_$side$_state=case(adm_$side$_nent==0, "none", adm_$side$_nent==1, "resolved", true(), "ambiguous"), \
  adm_$side$_best=if(adm_$side$_state=="resolved", mvindex(mvmap(adm_$side$_sorted, if(mvindex(split(adm_$side$_sorted, "#"), 0)==adm_$side$_bp \
    AND (mvindex(split(adm_$side$_sorted, "#"), 2)==adm_$side$_bek OR match(mvindex(split(adm_$side$_sorted, "#"), 2), "/\*$")), \
    replace(adm_$side$_sorted, "^[^#]*#[^#]*#[^#]*#", ""), null())), 0), null()) \
| eval adm_$side$_aciepg=mvindex(mvmap(adm_$side$_cand, if(json_extract(replace(adm_$side$_cand, "^[^#]*#[^#]*#[^#]*#", ""), "source")=="aci" \
      AND isnotnull(json_extract(replace(adm_$side$_cand, "^[^#]*#[^#]*#[^#]*#", ""), "epg")), "uni/tn-".json_extract(replace(adm_$side$_cand, "^[^#]*#[^#]*#[^#]*#", ""), "tenant") \
      ."/ap-".json_extract(replace(adm_$side$_cand, "^[^#]*#[^#]*#[^#]*#", ""), "ap")."/epg-".json_extract(replace(adm_$side$_cand, "^[^#]*#[^#]*#[^#]*#", ""), "epg"), null())), 0) \
| eval adm_$side$_kind=json_extract(adm_$side$_best, "kind"), adm_$side$_src=json_extract(adm_$side$_best, "source"), \
  adm_$side$_name=json_extract(adm_$side$_best, "name"), adm_$side$_uid=json_extract(adm_$side$_best, "id"), \
  adm_$side$_cluster=json_extract(adm_$side$_best, "cluster"), adm_$side$_ns=json_extract(adm_$side$_best, "ns"), \
  adm_$side$_host=case(adm_$side$_kind=="pod" OR adm_$side$_kind=="k8s_node_proxy", json_extract(adm_$side$_best, "node"), adm_$side$_kind=="k8s_node", adm_$side$_name), \
  adm_$side$_id=case(adm_$side$_kind=="pod", "pod:".adm_$side$_cluster."/".adm_$side$_uid, \
    adm_$side$_kind=="k8s_node", "node:".adm_$side$_uid, \
    adm_$side$_kind=="k8s_service", "k8s_service:".adm_$side$_cluster."/".adm_$side$_ns."/".adm_$side$_name."/".$ip$.":".server_port, \
    adm_$side$_kind=="k8s_node_proxy", "k8s_node_proxy:".adm_$side$_uid, \
    adm_$side$_kind=="vm" OR adm_$side$_kind=="endpoint", "vm:".scope."/".$ip$, true(), "ip:".scope."/".$ip$), \
  adm_$side$_ekind=case(adm_$side$_kind=="pod", null(), adm_$side$_kind=="k8s_node", "k8s_node", adm_$side$_kind=="k8s_service", "k8s_service", \
    adm_$side$_kind=="k8s_node_proxy", "k8s_node_proxy", adm_$side$_kind=="vm" OR adm_$side$_kind=="endpoint", "vm", \
    adm_$side$_state=="ambiguous", "ambiguous", `adm_is_private($ip$)`, "unresolved", true(), "external"), \
  adm_$side$_reason=case(adm_$side$_kind=="pod", "Kubernetes pod object owns this IP for the whole conversation", \
    adm_$side$_kind=="k8s_node", "Kubernetes node address (Node object or pod status.hostIP)", \
    adm_$side$_kind=="k8s_service", "Kubernetes Service frontend (LoadBalancer ingress IP, external IP or NodePort) for this port during the conversation", \
    adm_$side$_kind=="k8s_node_proxy", "Cilium ingress (Envoy) address of the node (network.cilium.io/ipv4-Ingress-ip)", \
    adm_$side$_src=="aci", "ACI endpoint (fvCEp) learned during the conversation", adm_$side$_src=="nd_endpoints", "Nexus Dashboard endpoint", \
    adm_$side$_state=="ambiguous", "Several identities claim this IP in scope ".scope." during the conversation", \
    adm_$side$_ekind=="external", "Public address with no identity record", true(), "No identity record covers this IP in scope ".scope." during the conversation") \
| eval adm_$side$_node=case(adm_$side$_kind=="k8s_service", json_object("id", adm_$side$_id, "label", adm_$side$_name." · ".$ip$.":".server_port, \
      "kind", "endpoint", "endpoint_kind", "k8s_service", "namespace", adm_$side$_ns, "cluster", adm_$side$_cluster, "addr", $ip$, \
      "attr_service", adm_$side$_name, "attr_frontend", $ip$.":".server_port, "attr_type", json_extract(adm_$side$_best, "svct"), \
      "attr_traffic_policy", json_extract(adm_$side$_best, "etp"), "attr_lb_mode", json_extract(adm_$side$_best, "lbm"), \
      "attr_controller", json_extract(adm_$side$_best, "ctl"), "attr_scope", scope, "reason", adm_$side$_reason), \
    adm_$side$_kind=="k8s_node_proxy", json_object("id", adm_$side$_id, "label", "Envoy on ".adm_$side$_host, "kind", "endpoint", "endpoint_kind", "k8s_node_proxy", \
      "cluster", adm_$side$_cluster, "addr", $ip$, "attr_node", adm_$side$_host, "attr_scope", scope, "reason", adm_$side$_reason), \
    true(), json_object("id", adm_$side$_id, "label", coalesce(adm_$side$_name, `adm_pick($side$, vm)`, $ip$), \
      "kind", if(adm_$side$_kind=="pod", "workload", "endpoint"), "endpoint_kind", adm_$side$_ekind, \
      "namespace", adm_$side$_ns, "cluster", adm_$side$_cluster, "addr", $ip$, \
      "attr_owner_kind", `adm_pick($side$, owner_kind)`, "attr_owner", `adm_pick($side$, owner)`, "attr_node", `adm_pick($side$, node)`, \
      "attr_tenant", `adm_pick($side$, tenant)`, "attr_app_profile", `adm_pick($side$, ap)`, "attr_epg", `adm_pick($side$, epg)`, \
      "attr_vm_name", `adm_pick($side$, vm)`, "attr_mac", `adm_pick($side$, mac)`, \
      "attr_attach_device", `adm_pick($side$, dev)`, "attr_attach_interface", `adm_pick($side$, if)`, "attr_scope", scope, "reason", adm_$side$_reason))
description = Resolves one conversation side (hostNetwork pod markers never resolve; adm_<side>_hn=1 when one covers the address during the conversation): covering rows have valid_from <= first_seen and last_seen < valid_end. Service frontend rows cover only the server side and only for their own port and transport. Rows with the same entity key (ACI and Nexus Dashboard describing one endpoint) count as one entity; several entities at the best priority are ambiguous.

[adm_boundary_filter(1)]
args = namespace
validation = match(namespace, "^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?\z")
errormsg = adm_boundary_filter expects a Kubernetes namespace name.
definition = addinfo \
| where isnull(entity_kind) OR (valid_from<info_max_time AND (isnull(valid_end) OR valid_end>info_min_time)) \
| eval adm_rparent=if(parent_kind=="Gateway", parent_namespace."/".parent_name, null()), adm_gkey=if(entity_kind=="k8s_service", namespace."/".owner_ref_name, null()) \
| eventstats values(adm_rparent) AS adm_rparents values(eval(if(entity_kind=="pod" AND namespace=="$namespace$", node, null()))) AS adm_bn \
| eval adm_fe=if(entity_kind=="k8s_service" AND (namespace=="$namespace$" OR (owner_ref_kind=="Gateway" AND `adm_mv_has(adm_rparents, adm_gkey)`)), 1, 0), \
  adm_bip=case(entity_kind=="pod" AND namespace=="$namespace$", ip, entity_kind=="k8s_node" AND `adm_mv_has(adm_bn, entity_name)`, ip, adm_fe==1 AND NOT like(ip, "nodeport:%"), ip), \
  adm_npp=if(adm_fe==1 AND like(ip, "nodeport:%"), replace(ip, "^.*:(\d+)/[a-z0-9-]+$", "\1"), null()), \
  adm_nip=if(entity_kind=="k8s_node", ip, null()) \
| eval adm_bip=if(match(adm_bip, "^[0-9a-f:.]{2,45}\z"), adm_bip, null()), adm_nip=if(match(adm_nip, "^[0-9a-f:.]{2,45}\z"), adm_nip, null()), \
  adm_npp=if(match(adm_npp, "^\d{1,5}\z"), adm_npp, null())
description = Shared body of the boundary filters, over adm_ip_identity and adm_service_routes rows: boundary addresses (pods of the namespace, nodes hosting them, LoadBalancer frontends of the namespace's Services and of Gateways its HTTPRoutes attach to), the namespace's NodePort ports and the cluster's node addresses. Only IP literals and port numbers survive.

[adm_graph_scope_core(2)]
args = cluster, namespace
validation = match(cluster, "^[A-Za-z0-9][A-Za-z0-9._-]{0,252}\z") AND match(namespace, "^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?\z")
errormsg = adm_graph_scope_filter expects a cluster name and a Kubernetes namespace name.
definition = `adm_index_summary` source="adm:conversation" adm_record="conversation" \
    [| inputlookup adm_ip_identity where (entity_kind="pod" AND cluster="$cluster$" AND namespace="$namespace$") OR ((entity_kind="k8s_node" OR entity_kind="k8s_service") AND cluster="$cluster$") \
      | inputlookup append=true adm_service_routes where cluster="$cluster$" AND namespace="$namespace$" \
      | `adm_boundary_filter("$namespace$")` \
      | stats values(adm_bip) AS adm_ips values(adm_npp) AS adm_nps values(adm_nip) AS adm_nodes \
      | eval search=case(isnull(adm_ips) AND isnull(adm_nps), "adm_record=adm_no_boundary_ip", \
          true(), "(".if(isnull(adm_ips), "adm_record=adm_no_boundary_ip", "client_ip IN (\"".mvjoin(adm_ips, "\",\"")."\") OR server_ip IN (\"".mvjoin(adm_ips, "\",\"")."\")") \
            .if(isnotnull(adm_nps) AND isnotnull(adm_nodes), " OR (server_ip IN (\"".mvjoin(adm_nodes, "\",\"")."\") AND server_port IN (\"".mvjoin(adm_nps, "\",\"")."\"))", "").")") \
      | fields search] \
| fields client_ip server_ip server_port \
| inputlookup append=true adm_ip_identity where (entity_kind="pod" AND cluster="$cluster$" AND namespace="$namespace$") OR ((entity_kind="k8s_node" OR entity_kind="k8s_service" OR entity_kind="k8s_node_proxy") AND cluster="$cluster$") \
| inputlookup append=true adm_service_routes where cluster="$cluster$" AND namespace="$namespace$" \
| `adm_boundary_filter("$namespace$")` \
| eventstats values(adm_bip) AS adm_bips values(adm_npp) AS adm_npps values(adm_nip) AS adm_nips values(eval(if(entity_kind=="k8s_node_proxy", ip, null()))) AS adm_infras \
| where isnull(entity_kind) AND isnull(route_uid) \
| eval adm_np=if(`adm_mv_has(adm_nips, server_ip)` AND `adm_mv_has(adm_npps, server_port)`, 1, 0), \
  adm_cb=if(`adm_mv_has(adm_bips, client_ip)`, 1, 0), adm_sb=if(`adm_mv_has(adm_bips, server_ip)` OR adm_np==1, 1, 0), \
  adm_pc=if(adm_sb==1 AND adm_cb==0 AND NOT `adm_mv_has(adm_infras, client_ip)` AND NOT `adm_mv_has(adm_nips, client_ip)` AND match(client_ip, "^[0-9a-f:.]{2,45}\z"), client_ip, null()), \
  adm_pd=if(adm_cb==1 AND adm_sb==0 AND match(server_ip, "^[0-9a-f:.]{2,45}\z"), server_ip, null()) \
| stats values(adm_bips) AS adm_bips values(adm_npps) AS adm_npps values(adm_nips) AS adm_nips values(adm_pc) AS adm_pc values(adm_pd) AS adm_pd \
| eval adm_scope_capped=if(mvcount(adm_pc)>`adm_scope_peer_limit` OR mvcount(adm_pd)>`adm_scope_peer_limit`, 1, 0), \
  adm_pc=mvindex(adm_pc, 0, `adm_scope_peer_limit`-1), adm_pd=mvindex(adm_pd, 0, `adm_scope_peer_limit`-1)
description = Shared body of adm_graph_scope_filter and adm_graph_scope_info: boundary addresses, NodePort conversations to any node of the cluster on a NodePort of the namespace, and the boundary's clients and dependencies (at most adm_scope_peer_limit each).

[adm_scope_peer_limit]
definition = 500
description = Maximum number of boundary clients and of boundary dependencies whose direct conversations (bypassing the application) are included. More are reported by a graph warning.

[adm_graph_scope_filter(2)]
args = cluster, namespace
validation = match(cluster, "^[A-Za-z0-9][A-Za-z0-9._-]{0,252}\z") AND match(namespace, "^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?\z")
errormsg = adm_graph_scope_filter expects a cluster name and a Kubernetes namespace name.
definition = `adm_graph_scope_core("$cluster$", "$namespace$")` \
| eval adm_b="\"".mvjoin(adm_bips, "\",\"")."\"", \
  adm_npc=if(isnotnull(adm_npps) AND isnotnull(adm_nips), " OR (server_ip IN (\"".mvjoin(adm_nips, "\",\"")."\") AND server_port IN (\"".mvjoin(adm_npps, "\",\"")."\"))", ""), \
  adm_peer=if(mvcount(adm_pc)>0 AND mvcount(adm_pd)>0, " OR (client_ip IN (\"".mvjoin(adm_pc, "\",\"")."\") AND server_ip IN (\"".mvjoin(adm_pd, "\",\"")."\"))", ""), \
  search=if(isnull(adm_bips) AND adm_npc=="", "adm_record=adm_no_boundary_ip", \
    "(".if(isnull(adm_bips), "adm_record=adm_no_boundary_ip", "client_ip IN (".adm_b.") OR server_ip IN (".adm_b.")").adm_npc.adm_peer.")") \
| fields search
description = Subsearch body (call as [search `adm_graph_scope_filter(cluster, namespace)`]): filter for summary rows of the boundary, NodePort conversations of the namespace on any node, and the boundary's clients (other than nodes and Envoy addresses) talking directly to its dependencies. Only IP literals and port numbers are inserted.

[adm_graph_scope_info(2)]
args = cluster, namespace
validation = match(cluster, "^[A-Za-z0-9][A-Za-z0-9._-]{0,252}\z") AND match(namespace, "^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?\z")
errormsg = adm_graph_scope_filter expects a cluster name and a Kubernetes namespace name.
definition = `adm_graph_scope_core("$cluster$", "$namespace$")` | eval adm_row="scopeinfo" | fields adm_row adm_scope_capped
description = One row (adm_row scopeinfo) telling whether the scope filter capped the boundary's clients or dependencies.

[adm_graph_inputs(4)]
args = service, environment, cluster, namespace
validation = match(service, "^[A-Za-z0-9][A-Za-z0-9._:/@-]{0,254}\z") AND match(environment, "^[A-Za-z0-9][A-Za-z0-9._-]{0,127}\z") AND match(cluster, "^[A-Za-z0-9][A-Za-z0-9._-]{0,252}\z") AND match(namespace, "^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?\z")
errormsg = Invalid graph arguments: service may contain letters, numbers and . _ : / @ - (max 255); environment letters, numbers and . _ - (max 128); cluster letters, numbers and . _ - (max 253); namespace must be a Kubernetes namespace name.
definition = (`adm_index_summary` source="adm:conversation" (adm_record="conversation" OR adm_record="hubble_xlate" OR adm_record="hubble_l7") \
    [search `adm_graph_scope_filter("$cluster$", "$namespace$")`]) \
  OR (`adm_index_traces` `adm_traces_sourcetype` ((k8s.cluster.name::$cluster$ k8s.namespace.name::$namespace$) \
    OR [search `adm_index_traces` `adm_traces_sourcetype` k8s.cluster.name::$cluster$ k8s.namespace.name::$namespace$ | dedup trace_id | head `adm_trace_limit` | fields trace_id \
        | appendpipe [| stats count | where count==0 | eval trace_id="adm-no-boundary-trace" | fields trace_id]])) \
| eval adm_row=case(adm_record=="conversation", "conv", adm_record=="hubble_xlate", "xlate", adm_record=="hubble_l7", "l7", true(), "span") \
| addinfo \
| eval adm_svc_name='service.name', adm_env=coalesce('deployment.environment.name', 'deployment.environment', ""), \
  adm_cl=coalesce('k8s.cluster.name', ""), adm_ns=coalesce('k8s.namespace.name', ""), \
  adm_svc_id=if(adm_row=="span", "service:".adm_cl."/".adm_ns."/".adm_svc_name."/".adm_env, null()), \
  adm_st=tonumber(start_time)/1000000000, adm_et=tonumber(end_time)/1000000000, \
  adm_no_cluster_span=if(adm_row=="span" AND isnull('k8s.cluster.name'), 1, 0) \
| where adm_row!="span" OR (isnotnull(adm_svc_name) AND adm_et>=info_min_time AND adm_st<info_max_time) \
| eval adm_span_ref=if(adm_row=="span", span_id."~".adm_svc_id, null()) \
| eventstats values(adm_span_ref) AS adm_trace_spans by trace_id \
| eval adm_psvc=if(adm_row=="span" AND parent_span_id!="", mvindex(mvmap(adm_trace_spans, if(mvindex(split(adm_trace_spans, "~"), 0)==parent_span_id, mvindex(split(adm_trace_spans, "~"), 1), null())), 0), null()), \
  adm_bprefix="service:$cluster$/$namespace$/", \
  adm_inb=if(adm_cl=="$cluster$" AND adm_ns=="$namespace$" AND adm_env=="$environment$", 1, 0), \
  adm_pinb=if(isnotnull(adm_psvc) AND substr(adm_psvc, 1, len(adm_bprefix))==adm_bprefix AND mvindex(split(adm_psvc, "/"), -1)=="$environment$", 1, 0), \
  adm_span=if(adm_row=="span", json_object("svc", adm_svc_id, "psvc", adm_psvc, "kind", kind, "sid", span_id, "tid", trace_id, \
    "uid", 'k8s.pod.uid', "peer", `adm_ip('attributes.network.peer.address')`, "port", tonumber('attributes.server.port'), \
    "st", adm_st, "et", adm_et, "inb", adm_inb, "pinb", adm_pinb, \
    "mp", if(parent_span_id!="" AND isnull(adm_psvc), 1, 0), "root", if(adm_inb==1 AND adm_svc_name=="$service$", 1, 0)), null()), \
  adm_btrace=if(adm_row=="span" AND adm_cl=="$cluster$" AND adm_ns=="$namespace$", trace_id, null()), \
  adm_bucket=if(adm_row!="span", _time, null()), \
  adm_gk=if(adm_row=="span", "s|".trace_id."|".span_id, adm_row."|".scope."|".client_ip."|".server_ip."|".server_port."|".transport."|".adm_bucket.if(adm_row=="l7", "|".xff, "")."|".observer), \
  adm_obs=if(adm_row!="span", split(observations, "|"), null()), adm_conn_mv=if(adm_row!="span", split(conns, "|"), null()) \
| stats sum(bytes_c2s) AS bytes_c2s sum(bytes_s2c) AS bytes_s2c sum(packets) AS packets sum(records) AS records sum(acl_permits) AS acl_permits sum(acl_drops) AS acl_drops \
    min(first_seen) AS first_seen max(last_seen) AS last_seen values(adm_obs) AS adm_observers values(flow_source) AS flow_source \
    values(direction_basis) AS adm_bases values(encapsulation) AS encapsulation values(adm_span) AS adm_span \
    values(scope) AS scope values(client_ip) AS client_ip values(server_ip) AS server_ip values(server_port) AS server_port values(transport) AS transport \
    values(observer) AS observer values(adm_btrace) AS adm_btrace max(adm_no_cluster_span) AS adm_no_cluster_span \
    values(adm_conn_mv) AS adm_conns values(xlate_ip) AS xlate_ip values(xff) AS adm_xff max(sampled) AS sampled max(conns_capped) AS conns_capped \
    by adm_gk adm_row \
| eval adm_ck=if(adm_row!="span", replace(adm_gk, "\|[^|]*$", ""), null()) \
| eventstats min(first_seen) AS adm_bfs max(last_seen) AS adm_bls by adm_ck \
| inputlookup append=true adm_ip_identity where entity_kind="pod" AND cluster="$cluster$" AND namespace="$namespace$" \
| eval adm_row=coalesce(adm_row, "pod") \
| inputlookup append=true adm_service_workload where cluster="$cluster$" AND namespace="$namespace$" AND environment="$environment$" \
| eval adm_row=coalesce(adm_row, "binding") \
| inputlookup append=true adm_service_backends where cluster="$cluster$" AND namespace="$namespace$" \
| eval adm_row=coalesce(adm_row, "backend") \
| inputlookup append=true adm_service_routes where cluster="$cluster$" AND namespace="$namespace$" \
| eval adm_row=coalesce(adm_row, "route") \
| append [search `adm_graph_scope_info("$cluster$", "$namespace$")`] \
| addinfo \
| eval adm_ws=floor(info_min_time), adm_we=floor(info_max_time), \
  valid_end=if(adm_row=="backend" OR adm_row=="route", coalesce(valid_to, tonumber(json_extract(desc, "ve"))), valid_end)
description = Graph stage 1: summary rows of the boundary (Hubble L7 rows kept per X-Forwarded-For client) (conversations and Hubble hand-off evidence) summed per (conversation, bucket, observer) across rollup runs; spans of traces touching the boundary with their parent's service; boundary pods; service bindings; Service backends and routes of the namespace.

[adm_graph_resolve(4)]
args = service, environment, cluster, namespace
validation = match(service, "^[A-Za-z0-9][A-Za-z0-9._:/@-]{0,254}\z") AND match(environment, "^[A-Za-z0-9][A-Za-z0-9._-]{0,127}\z") AND match(cluster, "^[A-Za-z0-9][A-Za-z0-9._-]{0,252}\z") AND match(namespace, "^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?\z")
errormsg = Invalid graph arguments: service may contain letters, numbers and . _ : / @ - (max 255); environment letters, numbers and . _ - (max 128); cluster letters, numbers and . _ - (max 253); namespace must be a Kubernetes namespace name.
definition = lookup adm_ip_identity ip AS client_ip scope AS scope OUTPUT desc AS adm_c_desc \
| lookup adm_ip_identity ip AS server_ip scope AS scope OUTPUT desc AS adm_s_desc \
| eval adm_np_cl=mvindex(mvdedup(mvmap(adm_s_desc, if(json_extract(adm_s_desc, "kind")=="k8s_node", json_extract(adm_s_desc, "cluster")."", null()))), 0), \
  adm_s_np_node=mvindex(mvdedup(mvmap(adm_s_desc, if(json_extract(adm_s_desc, "kind")=="k8s_node", json_extract(adm_s_desc, "name")."", null()))), 0), \
  adm_np_key=if(isnotnull(adm_np_cl) AND isnotnull(tonumber(server_port)), "nodeport:".adm_np_cl.":".server_port."/".transport, null()) \
| lookup adm_ip_identity ip AS adm_np_key scope AS scope OUTPUT desc AS adm_np_desc \
| eval adm_s_desc=mvappend(adm_s_desc, adm_np_desc), \
  adm_capped=if(coalesce(mvcount(adm_c_desc), 0)>=`adm_identity_max_matches` OR coalesce(mvcount(adm_s_desc), 0)>=`adm_identity_max_matches`, 1, 0) \
| `adm_resolve(c, client_ip)` \
| `adm_resolve(s, server_ip)` \
| eval adm_pod_node=if(adm_row=="pod" AND valid_from<adm_we AND (isnull(valid_end) OR valid_end>adm_ws), node, null()), \
  adm_rparent=if(adm_row=="route" AND parent_kind=="Gateway", parent_namespace."/".parent_name, null()), \
  adm_s_gkey=if(adm_s_kind=="k8s_service" AND json_extract(adm_s_best, "ownk")=="Gateway", adm_s_ns."/".json_extract(adm_s_best, "ownn"), null()) \
| eventstats values(adm_pod_node) AS adm_bnodes values(adm_rparent) AS adm_rparents \
| eval adm_c_inb=if(adm_c_kind=="pod" AND adm_c_cluster=="$cluster$" AND adm_c_ns=="$namespace$", 1, 0), \
  adm_s_inb=if(adm_s_kind=="pod" AND adm_s_cluster=="$cluster$" AND adm_s_ns=="$namespace$", 1, 0), \
  adm_s_fe_inb=if(adm_s_kind=="k8s_service" AND adm_s_cluster=="$cluster$" AND (adm_s_ns=="$namespace$" OR `adm_mv_has(adm_rparents, adm_s_gkey)`), 1, 0), \
  adm_tunnel_in=if(isnotnull(encapsulation) AND adm_c_kind=="k8s_node" AND adm_s_kind=="k8s_node" \
    AND `adm_mv_has(adm_bnodes, adm_c_name)` AND `adm_mv_has(adm_bnodes, adm_s_name)`, 1, 0), \
  adm_keep=if(adm_row=="conv" AND (adm_c_inb==1 OR adm_s_inb==1 OR adm_s_fe_inb==1 OR adm_tunnel_in==1), 1, 0), \
  adm_peer_c=if(adm_keep==1 AND (adm_s_inb==1 OR adm_s_fe_inb==1) AND adm_c_inb!=1 AND coalesce(adm_c_kind, "")!="k8s_node" AND coalesce(adm_c_kind, "")!="k8s_node_proxy", adm_c_id, null()), \
  adm_peer_s=if(adm_keep==1 AND adm_c_inb==1 AND adm_s_inb!=1 AND adm_s_fe_inb!=1, adm_s_id, null()) \
| eventstats values(adm_peer_c) AS adm_peer_cs values(adm_peer_s) AS adm_peer_ss \
| eval adm_peer=if(adm_row=="conv" AND adm_keep==0 AND `adm_mv_has(adm_peer_cs, adm_c_id)` AND `adm_mv_has(adm_peer_ss, adm_s_id)`, 1, 0), \
  adm_keep=if(adm_peer==1, 1, adm_keep), \
  adm_pkey=case(adm_row=="conv" AND adm_c_kind=="pod", "p|".adm_c_uid."|".server_ip."|".server_port, \
    adm_row=="span" AND json_extract(adm_span, "kind")=="SPAN_KIND_CLIENT" AND isnotnull(json_extract(adm_span, "peer")), \
    "p|".json_extract(adm_span, "uid")."|".json_extract(adm_span, "peer")."|".json_extract(adm_span, "port")), \
  adm_peer_span=if(adm_row=="span", json_extract(adm_span, "sid")."@".json_extract(adm_span, "st")."@".json_extract(adm_span, "et"), null()) \
| eventstats values(adm_peer_span) AS adm_peer_spans by adm_pkey \
| eval span_ids=if(adm_row=="conv", mvmap(adm_peer_spans, if(tonumber(mvindex(split(adm_peer_spans, "@"), 1))<=last_seen+1 AND tonumber(mvindex(split(adm_peer_spans, "@"), 2))>=first_seen-1, mvindex(split(adm_peer_spans, "@"), 0), null())), null())
description = Graph stage 2: resolves both sides of every (conversation, bucket, observer) row over that bucket's interval (Service frontends by IP, port and transport, NodePorts through nodeport:<cluster>:<port>/<transport>; frontends of the namespace and of Gateways its HTTPRoutes attach to are in the boundary), applies the namespace boundary (tunnel conversations only between nodes hosting boundary pods; conversations from boundary clients to boundary dependencies) and associates CLIENT spans by network.peer.address and server.port with conversations from the same pod.

[adm_handoff_dedupe]
definition = eval adm_cport=mvindex(split(adm_conns, "@"), 0), adm_cst=tonumber(mvindex(split(adm_conns, "@"), 1)), \
  adm_cen=coalesce(tonumber(mvindex(split(adm_conns, "@"), 2)), adm_cst) \
| sort 0 adm_dk adm_cport adm_cst \
| streamstats current=f max(adm_cen) AS adm_prev_en by adm_dk adm_cport \
| eval adm_newc=if(isnull(adm_prev_en) OR adm_cst>adm_prev_en+`adm_conn_gap`, 1, 0) \
| streamstats sum(adm_newc) AS adm_cidx by adm_dk adm_cport \
| eval adm_cid=adm_dk."|".adm_cport."|".adm_cidx
description = Connection dedupe over expanded adm_conns (client_port@start@end) grouped by adm_dk: records of one client port whose start is within adm_conn_gap seconds of the previous record's end are one connection (adm_cid).

[adm_graph_handoffs(4)]
args = service, environment, cluster, namespace
validation = match(service, "^[A-Za-z0-9][A-Za-z0-9._:/@-]{0,254}\z") AND match(environment, "^[A-Za-z0-9][A-Za-z0-9._-]{0,127}\z") AND match(cluster, "^[A-Za-z0-9][A-Za-z0-9._-]{0,252}\z") AND match(namespace, "^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?\z")
errormsg = Invalid graph arguments: service may contain letters, numbers and . _ : / @ - (max 255); environment letters, numbers and . _ - (max 128); cluster letters, numbers and . _ - (max 253); namespace must be a Kubernetes namespace name.
definition = eval adm_route_d=if(adm_row=="route" AND valid_from<adm_we AND (isnull(valid_end) OR valid_end>adm_ws), \
    parent_kind."/".parent_namespace."/".parent_name."|".backend_namespace."/".backend_service."|".backend_port."|".coalesce(host, "*")."|".coalesce(path, "/"), null()), \
  adm_be_d=if(adm_row=="backend" AND valid_from<adm_we AND (isnull(valid_end) OR valid_end>adm_ws), \
    namespace."/".service."|".pod_uid."|".ip."|".target_port."|".node."|".valid_from."|".coalesce(valid_end, "-")."|".coalesce(port_name, ""), null()), \
  adm_tun_d=if(adm_row=="conv" AND adm_c_kind=="k8s_node" AND adm_s_kind=="k8s_node" AND isnotnull(encapsulation), adm_c_name."|".adm_s_name."|".first_seen."|".last_seen, null()) \
| eventstats values(adm_route_d) AS adm_routes values(adm_be_d) AS adm_bes \
| eval adm_fe=if(adm_row=="conv" AND adm_keep==1 AND adm_s_kind=="k8s_service", 1, 0), \
  adm_fe_svc=if(adm_fe==1, adm_s_name, null()), adm_fe_ns=if(adm_fe==1, adm_s_ns, null()), adm_fe_ctl=if(adm_fe==1, json_extract(adm_s_best, "ctl"), null()), \
  adm_fe_pn=if(adm_fe==1, coalesce(json_extract(adm_s_best, "pn"), ""), null()), \
  adm_fe_parent=if(adm_fe==1 AND isnotnull(adm_fe_ctl), json_extract(adm_s_best, "ownk")."/".adm_fe_ns."/".json_extract(adm_s_best, "ownn"), null()), \
  adm_fe_routes=if(adm_fe==1 AND isnotnull(adm_fe_parent), mvmap(adm_routes, if(mvindex(split(adm_routes, "|"), 0)==adm_fe_parent, adm_routes, null())), null()), \
  adm_fe_bsvcs="#".if(isnotnull(adm_fe_parent), mvjoin(mvmap(adm_fe_routes, mvindex(split(adm_fe_routes, "|"), 1)), "#"), adm_fe_ns."/".adm_fe_svc)."#", \
  adm_fe_cands=if(adm_fe==1, mvmap(adm_bes, if(like(adm_fe_bsvcs, "%#".mvindex(split(adm_bes, "|"), 0)."#%") \
      AND (isnotnull(adm_fe_ctl) OR mvindex(split(adm_bes, "|"), 7)==adm_fe_pn) \
      AND tonumber(mvindex(split(adm_bes, "|"), 5))<=adm_bls AND (mvindex(split(adm_bes, "|"), 6)=="-" OR tonumber(mvindex(split(adm_bes, "|"), 6))>adm_bfs), adm_bes, null())), null()), \
  adm_tkey=case(adm_row=="conv" AND flow_source=="hubble" AND adm_s_kind=="pod", "T|".scope."|".client_ip), \
  adm_xkey=if(adm_row=="xlate", "X|".scope."|".client_ip, null()), \
  adm_lkey=if(adm_row=="l7" AND adm_c_kind=="k8s_node_proxy" AND adm_c_host==replace(observer, "^hubble_l7:", ""), "L|".scope."|".mvindex(adm_xff, 0), null()), \
  adm_ev=case(isnotnull(adm_tkey), mvmap(adm_conns, mvindex(split(adm_conns, "@"), 0)."|".mvindex(split(adm_conns, "@"), 1)."|".server_ip.":".server_port."|".adm_s_id."|".replace(observer, "^hubble:", "")), \
    isnotnull(adm_xkey), mvmap(adm_conns, mvindex(split(adm_conns, "@"), 0)."|".mvindex(split(adm_conns, "@"), 1)."|".server_ip.":".server_port."|".adm_s_id."|".replace(observer, "^hubble_xlate:", "")."|".xlate_ip), \
    isnotnull(adm_lkey), mvmap(adm_conns, replace(observer, "^hubble_l7:", "")."/".client_ip.":".mvindex(split(adm_conns, "@"), 0)."/".mvindex(split(adm_conns, "@"), 1)."|".mvindex(split(adm_conns, "@"), 1)."|".server_ip.":".server_port."|".adm_s_id."|".replace(observer, "^hubble_l7:", ""))), \
  adm_xleg=if(isnotnull(adm_xkey), mvmap(adm_conns, xlate_ip."|".mvindex(split(adm_conns, "@"), 0)."|".server_ip.":".server_port), null()) \
| appendpipe [| where adm_fe==1 \
    | eval adm_dk=adm_ck \
    | stats values(adm_conns) AS adm_conns values(adm_fe_cands) AS adm_cands min(first_seen) AS adm_ffs max(last_seen) AS adm_fls max(sampled) AS adm_sampled max(conns_capped) AS adm_capped \
        first(adm_s_id) AS adm_fe_id first(adm_s_node) AS adm_fe_node first(adm_c_id) AS adm_fe_cid first(adm_c_node) AS adm_fe_cnode first(adm_c_state) AS adm_c_state \
        first(adm_s_state) AS adm_s_state first(adm_fe_svc) AS adm_fe_svc first(adm_fe_ctl) AS adm_fe_ctl first(adm_s_np_node) AS adm_fe_np_node first(adm_s_best) AS adm_fe_best \
        values(adm_fe_routes) AS adm_fe_routes first(server_port) AS server_port first(transport) AS transport by adm_dk scope client_ip \
    | mvexpand adm_conns \
    | `adm_handoff_dedupe` \
    | stats min(adm_cst) AS adm_ct max(adm_cen) AS adm_cend first(adm_cport) AS adm_cport first(adm_dk) AS adm_dk first(scope) AS scope first(client_ip) AS client_ip \
        values(adm_cands) AS adm_cands values(adm_fe_routes) AS adm_fe_routes max(adm_sampled) AS adm_sampled max(adm_capped) AS adm_capped \
        first(adm_fe_id) AS adm_fe_id first(adm_fe_node) AS adm_fe_node first(adm_fe_cid) AS adm_fe_cid first(adm_fe_cnode) AS adm_fe_cnode \
        first(adm_c_state) AS adm_c_state first(adm_s_state) AS adm_s_state first(adm_fe_svc) AS adm_fe_svc first(adm_fe_ctl) AS adm_fe_ctl \
        first(adm_fe_np_node) AS adm_fe_np_node first(adm_fe_best) AS adm_fe_best first(server_port) AS server_port first(transport) AS transport by adm_cid \
    | eval adm_row="hconn", adm_tkey="T|".scope."|".client_ip, adm_xkey="X|".scope."|".client_ip, adm_lkey="L|".scope."|".client_ip, \
      adm_cands_ip="#".mvjoin(mvmap(adm_cands, mvindex(split(adm_cands, "|"), 2).":".mvindex(split(adm_cands, "|"), 3)), "#")."#", \
      adm_cand_nodes="#".mvjoin(mvmap(adm_cands, mvindex(split(adm_cands, "|"), 4)), "#")."#", \
      adm_cand_uids="#".mvjoin(mvmap(adm_cands, mvindex(split(adm_cands, "|"), 1)), "#")."#", \
      adm_off=mvrange(-`adm_handoff_window`, `adm_handoff_window`+1)] \
| eventstats values(adm_tun_d) AS adm_tuns values(adm_xleg) AS adm_xlegs \
| eventstats values(adm_ev) AS adm_evs_t by adm_tkey \
| eventstats values(adm_ev) AS adm_evs_x by adm_xkey \
| eventstats values(adm_ev) AS adm_evs_l by adm_lkey \
| appendpipe [| where adm_row=="conv" AND adm_c_kind=="k8s_node" AND adm_s_kind=="pod" \
    | mvexpand adm_conns \
    | eval adm_row="gleg", adm_gkey="g|".scope."|".tostring(floor(tonumber(mvindex(split(adm_conns, "@"), 1)))), \
      adm_ev_g=client_ip."|".adm_c_name."|".mvindex(split(adm_conns, "@"), 0)."|".mvindex(split(adm_conns, "@"), 1)."|".server_ip.":".server_port."|".adm_s_id."|".adm_c_hn."|".coalesce(sampled, 0) \
    | fields adm_row adm_gkey adm_ev_g] \
| appendpipe [| where adm_row=="hconn" | eval adm_gkey=mvmap(adm_off, "g|".scope."|".tostring(floor(adm_ct)+adm_off)) | mvexpand adm_gkey | eval adm_row="hconn_g" | fields adm_row adm_gkey adm_cid] \
| eventstats values(adm_ev_g) AS adm_evs_g by adm_gkey \
| eval adm_gtmp=if(adm_row=="hconn_g", adm_evs_g, null()) \
| eventstats values(adm_gtmp) AS adm_cevs_g by adm_cid \
| where adm_row!="hconn_g" AND adm_row!="gleg" \
| eval adm_w=`adm_handoff_window`, adm_xlegs_s="#".coalesce(mvjoin(adm_xlegs, "#"), "")."#", \
  adm_mT=if(adm_row=="hconn", mvmap(adm_evs_t, if(mvindex(split(adm_evs_t, "|"), 0)==adm_cport AND like(adm_cands_ip, "%#".mvindex(split(adm_evs_t, "|"), 2)."#%") AND like(adm_cand_uids, "%#".replace(mvindex(split(adm_evs_t, "|"), 3), "^pod:[^/]*/", "")."#%") \
    AND abs(tonumber(mvindex(split(adm_evs_t, "|"), 1))-adm_ct)<=adm_w, adm_evs_t, null())), null()), \
  adm_mX=if(adm_row=="hconn", mvmap(adm_evs_x, if(like(adm_cands_ip, "%#".mvindex(split(adm_evs_x, "|"), 2)."#%") AND like(adm_cand_uids, "%#".replace(mvindex(split(adm_evs_x, "|"), 3), "^pod:[^/]*/", "")."#%") \
    AND abs(tonumber(mvindex(split(adm_evs_x, "|"), 1))-adm_ct)<=adm_w AND (isnull(adm_fe_np_node) OR mvindex(split(adm_evs_x, "|"), 4)==adm_fe_np_node), adm_evs_x, null())), null()), \
  adm_mL=if(adm_row=="hconn" AND isnotnull(adm_fe_ctl), mvmap(adm_evs_l, if(like(adm_cands_ip, "%#".mvindex(split(adm_evs_l, "|"), 2)."#%") AND like(adm_cand_uids, "%#".replace(mvindex(split(adm_evs_l, "|"), 3), "^pod:[^/]*/", "")."#%") \
    AND tonumber(mvindex(split(adm_evs_l, "|"), 1))>=adm_ct-adm_w AND tonumber(mvindex(split(adm_evs_l, "|"), 1))<=adm_cend+adm_w, adm_evs_l, null())), null()), \
  adm_xn=if(mvcount(adm_mX)>0, 1, 0), adm_lreq=mvmap(adm_mL, mvindex(split(adm_mL, "|"), 0)) \
| eventstats sum(adm_xn) AS adm_xconns values(adm_mX) AS adm_xall by adm_dk \
| appendpipe [| where adm_row=="hconn" AND mvcount(adm_lreq)>0 | mvexpand adm_lreq | stats dc(adm_cid) AS adm_n by adm_lreq | where adm_n>1 | eval adm_row="lamb" | fields adm_row adm_lreq] \
| eventstats values(eval(if(adm_row=="lamb", adm_lreq, null()))) AS adm_lambs \
| where adm_row!="lamb" \
| eval adm_xok=if(adm_xn==1 AND mvcount(mvdedup(adm_xall))>=adm_xconns AND (mvcount(adm_mX)==1 OR mvcount(mvdedup(mvmap(adm_mX, mvindex(split(adm_mX, "|"), 3))))==1), 1, 0), \
  adm_lambs_s="#".coalesce(mvjoin(adm_lambs, "#"), "")."#", \
  adm_mL=mvmap(adm_mL, if(like(adm_lambs_s, "%#".mvindex(split(adm_mL, "|"), 0)."#%"), null(), adm_mL)), \
  adm_pre=if(adm_row=="hconn", case(mvcount(adm_mT)>0, "hubble_client_tuple", adm_xok==1, "hubble_xlate", mvcount(adm_mL)>0, "l7_forwarded_for"), null()), \
  adm_gall=if(adm_row=="hconn" AND isnull(adm_pre) AND adm_xn==0, mvmap(adm_cevs_g, if(like(adm_cands_ip, "%#".mvindex(split(adm_cevs_g, "|"), 4)."#%") \
    AND abs(tonumber(mvindex(split(adm_cevs_g, "|"), 3))-adm_ct)<=adm_w AND (isnull(adm_fe_np_node) OR mvindex(split(adm_cevs_g, "|"), 1)==adm_fe_np_node), adm_cevs_g, null())), null()), \
  adm_gfree=mvmap(adm_gall, if(like(adm_xlegs_s, "%#".mvindex(split(adm_gall, "|"), 0)."|".mvindex(split(adm_gall, "|"), 2)."|".mvindex(split(adm_gall, "|"), 4)."#%"), null(), adm_gall)), \
  adm_gport=mvmap(adm_gfree, if(mvindex(split(adm_gfree, "|"), 2)==adm_cport, adm_gfree, null())), \
  adm_gcand=if(mvcount(adm_gport)>0, adm_gport, adm_gfree), \
  adm_gblock=if(mvcount(mvmap(adm_gall, if(mvindex(split(adm_gall, "|"), 6)=="1" OR mvindex(split(adm_gall, "|"), 7)=="1" \
    OR like(adm_cand_nodes, "%#".mvindex(split(adm_gall, "|"), 1)."#%"), 1, null())))>0 OR adm_sampled==1, 1, 0), \
  adm_gref=mvdedup(mvmap(adm_gcand, mvindex(split(adm_gcand, "|"), 0)."|".mvindex(split(adm_gcand, "|"), 2)."|".mvindex(split(adm_gcand, "|"), 4))), \
  adm_gid=if(mvcount(adm_gref)==1 AND adm_gblock==0, mvindex(adm_gcand, 0), null()) \
| appendpipe [| where adm_row=="hconn" AND mvcount(adm_gref)>0 | mvexpand adm_gref | stats dc(adm_cid) AS adm_n by adm_gref | where adm_n>1 | eval adm_row="gamb" | fields adm_row adm_gref] \
| eventstats values(eval(if(adm_row=="gamb", adm_gref, null()))) AS adm_gambs \
| where adm_row!="gamb" \
| eval adm_gambs_s="#".coalesce(mvjoin(adm_gambs, "#"), "")."#", \
  adm_gok=if(isnotnull(adm_gid) AND NOT like(adm_gambs_s, "%#".mvindex(split(adm_gid, "|"), 0)."|".mvindex(split(adm_gid, "|"), 2)."|".mvindex(split(adm_gid, "|"), 4)."#%"), 1, 0), \
  handoff_basis=if(adm_row=="hconn", coalesce(adm_pre, if(adm_gok==1, "time_inferred", null())), null()), \
  adm_match=case(handoff_basis=="hubble_client_tuple", adm_mT, handoff_basis=="hubble_xlate", adm_mX, handoff_basis=="l7_forwarded_for", adm_mL, \
    handoff_basis=="time_inferred", mvindex(split(adm_gid, "|"), 5)."|".mvindex(split(adm_gid, "|"), 4)."|".mvindex(split(adm_gid, "|"), 1)), \
  adm_targets=case(handoff_basis=="time_inferred", mvindex(split(adm_match, "|"), 0), isnotnull(handoff_basis), mvdedup(mvmap(adm_match, mvindex(split(adm_match, "|"), 3)))), \
  adm_lbm=json_extract(adm_fe_best, "lbm"), adm_etp=json_extract(adm_fe_best, "etp"), \
  adm_tnode=if(isnotnull(handoff_basis), mvindex(split(mvindex(mvmap(adm_cands, if("pod:$cluster$/".mvindex(split(adm_cands, "|"), 1)==mvindex(adm_targets, 0), adm_cands, null())), 0), "|"), 4), null()), \
  adm_dsr_via=mvindex(mvmap(adm_tuns, if(mvindex(split(adm_tuns, "|"), 1)==adm_tnode AND tonumber(mvindex(split(adm_tuns, "|"), 2))<=adm_ct+adm_w \
    AND tonumber(mvindex(split(adm_tuns, "|"), 3))>=adm_ct-adm_w, mvindex(split(adm_tuns, "|"), 0), null())), 0), \
  via_node=case(isnull(handoff_basis), null(), isnotnull(adm_fe_np_node), adm_fe_np_node, \
    handoff_basis=="hubble_xlate" OR handoff_basis=="l7_forwarded_for", mvdedup(mvmap(adm_match, mvindex(split(adm_match, "|"), 4))), \
    handoff_basis=="time_inferred", mvindex(split(adm_match, "|"), 2), adm_lbm=="dsr", adm_dsr_via, true(), adm_tnode), \
  adm_consume=case(handoff_basis=="hubble_client_tuple", mvmap(adm_mT, client_ip."|".adm_cport."|".mvindex(split(adm_mT, "|"), 2)), \
    handoff_basis=="time_inferred", mvindex(split(adm_gid, "|"), 0)."|".mvindex(split(adm_gid, "|"), 2)."|".mvindex(split(adm_gid, "|"), 4)) \
| appendpipe [| where adm_row=="hconn" AND isnotnull(handoff_basis) \
    | mvexpand adm_targets \
    | eval target=adm_targets, adm_fobs=if(handoff_basis=="time_inferred", null(), mvdedup(mvmap(adm_match, "hubble:".mvindex(split(adm_match, "|"), 4)))) \
    | stats dc(adm_cid) AS count values(via_node) AS via_node values(adm_fobs) AS observers first(adm_fe_node) AS adm_src_node by adm_fe_id target handoff_basis \
    | eval adm_row="fwd", source=adm_fe_id, relationship="forwards_to", confidence=if(handoff_basis=="time_inferred", "inferred", "observed"), \
      evidence=handoff_basis, sources=if(handoff_basis=="time_inferred", null(), "hubble"), id="forwards:".source.">".target.":".handoff_basis] \
| appendpipe [| where adm_row=="hconn" \
    | stats count(eval(isnotnull(handoff_basis))) AS adm_determined values(adm_cands) AS adm_cands values(adm_fe_routes) AS adm_fe_routes first(adm_fe_node) AS adm_fe_node by adm_fe_id \
    | eval adm_row="node_src", adm_ncand=mvcount(mvdedup(mvmap(adm_cands, mvindex(split(adm_cands, "|"), 1)))), \
      adm_route=mvjoin(mvmap(adm_fe_routes, mvindex(split(adm_fe_routes, "|"), 3).mvindex(split(adm_fe_routes, "|"), 4)." → ".replace(mvindex(split(adm_fe_routes, "|"), 1), "^[^/]*/", "").":".mvindex(split(adm_fe_routes, "|"), 2)), "; "), \
      adm_node_out="1#".json_set(adm_fe_node, "attr_route", adm_route, "attr_handoff", if(adm_determined==0, "service_only", null()), \
        "attr_candidates", if(adm_determined==0, tostring(coalesce(adm_ncand, 0)), null()))] \
| appendpipe [| where adm_row=="hconn" AND handoff_basis=="hubble_client_tuple" \
    | mvexpand adm_mT \
    | eval adm_row="conv", adm_keep=1, adm_c_id=adm_fe_cid, adm_s_id=adm_fe_id, adm_c_node=adm_fe_cnode, adm_s_node=adm_fe_node, adm_s_kind="k8s_service", \
      flow_source="hubble", observer="hubble:".mvindex(split(adm_mT, "|"), 4), adm_observers=observer, records=1, adm_bases="initiator", \
      adm_conns=adm_cport."@".adm_ct."@".adm_cend, adm_ck=adm_dk \
    | fields adm_row adm_keep adm_ck adm_c_id adm_s_id adm_c_node adm_s_node adm_s_kind adm_c_state adm_s_state server_port transport scope flow_source observer adm_observers records adm_bases adm_conns] \
| appendpipe [| where adm_row=="hconn" | stats values(via_node) AS adm_pvia by adm_fe_cid adm_fe_id | eval adm_row="pairvia", adm_pair=adm_fe_cid."|".adm_fe_id | fields adm_row adm_pair adm_pvia] \
| appendpipe [| where adm_row=="hconn" AND isnotnull(adm_consume) | mvexpand adm_consume \
    | eval adm_row="consume", adm_cs=scope."|".mvindex(split(adm_consume, "|"), 2), adm_consume=mvindex(split(adm_consume, "|"), 0)."|".mvindex(split(adm_consume, "|"), 1) \
    | fields adm_row adm_cs adm_consume] \
| appendpipe [| where adm_row=="xlate" | mvexpand adm_xleg \
    | eval adm_row="consume", adm_cs=scope."|".mvindex(split(adm_xleg, "|"), 2), adm_consume=mvindex(split(adm_xleg, "|"), 0)."|".mvindex(split(adm_xleg, "|"), 1) \
    | fields adm_row adm_cs adm_consume] \
| eval adm_cs=if(adm_row=="conv" AND adm_keep==1 AND adm_s_kind=="pod", scope."|".server_ip.":".server_port, adm_cs) \
| eventstats values(eval(if(adm_row=="consume", adm_consume, null()))) AS adm_consumed_set by adm_cs \
| where adm_row!="consume" \
| eval adm_cset_s="#".coalesce(mvjoin(adm_consumed_set, "#"), "")."#", \
  adm_conns_left=if(adm_row=="conv" AND isnotnull(adm_consumed_set), mvmap(adm_conns, if(like(adm_cset_s, "%#".client_ip."|".mvindex(split(adm_conns, "@"), 0)."#%"), null(), adm_conns)), adm_conns), \
  adm_consumed=if(adm_row=="conv" AND isnotnull(adm_consumed_set) AND mvcount(adm_conns)>0 AND coalesce(mvcount(adm_conns_left), 0)==0, 1, 0), \
  adm_dsr_opt=if(adm_consumed==1 AND flow_source!="hubble" AND adm_c_kind!="k8s_node", 1, 0), \
  adm_capped_consumed=if(adm_consumed==1 AND conns_capped==1, 1, 0), \
  adm_conns=if(adm_row=="conv", adm_conns_left, adm_conns)
description = Graph stage 3: links each client connection to a Service frontend (connections deduplicated across observers, return records and re-exports by client port and adm_conn_gap) with the backend pod that served it. Candidates are the EndpointSlice pods of the Service port (by port name), or of the backend Services of the Gateway's or Ingress's routes. hubble_client_tuple: a Hubble backend flow with the connection's client address and port within adm_handoff_window. hubble_xlate: SNAT traces from the client to a candidate (on the NodePort node for NodePorts), accepted only when the conversation has at least as many traces as connections with traces and each connection's traces lead to one backend. l7_forwarded_for: Hubble L7 requests whose rightmost X-Forwarded-For is the client, received from that node's Envoy address during the connection, at a candidate; a request matching several connections is ignored. time_inferred: exactly one unexplained leg from a node (the NodePort node for NodePorts) to a candidate within the window, preferring legs with the client's source port, assigned to exactly one connection, and never when the node hosts a candidate backend or a hostNetwork pod, or the records are sampled. Emits forwards_to rows, frontend node attributes, per-client receiving nodes and consumes, per connection, the backend-side records a hand-off explains.

[adm_graph_edges(4)]
args = service, environment, cluster, namespace
validation = match(service, "^[A-Za-z0-9][A-Za-z0-9._:/@-]{0,254}\z") AND match(environment, "^[A-Za-z0-9][A-Za-z0-9._-]{0,127}\z") AND match(cluster, "^[A-Za-z0-9][A-Za-z0-9._-]{0,252}\z") AND match(namespace, "^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?\z")
errormsg = Invalid graph arguments: service may contain letters, numbers and . _ : / @ - (max 255); environment letters, numbers and . _ - (max 128); cluster letters, numbers and . _ - (max 253); namespace must be a Kubernetes namespace name.
definition = eval adm_ek=if(adm_row=="conv" AND adm_keep==1 AND coalesce(adm_consumed, 0)!=1, adm_c_id."|".adm_s_id."|".server_port."|".transport, null()), \
  adm_pair=if(adm_row=="conv", adm_c_id."|".adm_s_id, adm_pair) \
| appendpipe [| where isnotnull(adm_ek) AND mvcount(adm_conns)>0 | eval adm_dk=adm_ek | mvexpand adm_conns | `adm_handoff_dedupe` \
    | stats dc(adm_cid) AS adm_nconn by adm_ek | eval adm_row="ccount"] \
| eventstats max(adm_nconn) AS adm_edge_nconn by adm_ek \
| eventstats values(adm_pvia) AS adm_pair_via by adm_pair \
| where adm_row!="ccount" AND adm_row!="pairvia" \
| appendpipe [| where adm_row=="conv" AND adm_keep==1 AND coalesce(adm_consumed, 0)!=1 \
    | eval adm_conf=if(adm_c_state=="resolved" AND adm_s_state=="resolved", "correlated", "unresolved"), \
      adm_ev=mvappend(flow_source, if(mvcount(span_ids)>0, "span_peer", null())), \
      adm_bytes=if(isnull(bytes_c2s) AND isnull(bytes_s2c), null(), coalesce(bytes_c2s, 0)+coalesce(bytes_s2c, 0)), \
      adm_frec=if(flow_source=="aci_acllog", null(), records), adm_arec=if(flow_source=="aci_acllog", records, null()), \
      adm_acl_obs=if(flow_source=="aci_acllog", replace(observer, "^aci_acllog:", ""), null()) \
    | stats sum(adm_bytes) AS adm_obs_bytes sum(adm_frec) AS adm_obs_records sum(adm_arec) AS adm_acl_records sum(acl_permits) AS adm_ap sum(acl_drops) AS adm_ad \
        values(adm_acl_obs) AS adm_acl_obs values(adm_ev) AS evidence values(adm_observers) AS observers \
        values(flow_source) AS sources values(adm_bases) AS adm_bases values(span_ids) AS span_ids values(encapsulation) AS encapsulation \
        values(adm_c_node) AS adm_src_node values(adm_s_node) AS adm_dst_node values(adm_conf) AS adm_confs \
        values(adm_c_aciepg) AS adm_c_aciepg values(adm_s_aciepg) AS adm_s_aciepg max(adm_edge_nconn) AS adm_nconn values(adm_pair_via) AS via_node \
        max(conns_capped) AS adm_ecapped \
        by adm_c_id adm_s_id server_port transport observer \
    | stats max(adm_obs_bytes) AS bytes max(adm_obs_records) AS adm_count max(adm_acl_records) AS adm_acl_count sum(adm_ap) AS acl_permits sum(adm_ad) AS acl_drops \
        values(adm_acl_obs) AS acl_leaf values(evidence) AS evidence values(observers) AS observers \
        values(sources) AS sources values(adm_bases) AS adm_bases values(span_ids) AS span_ids values(encapsulation) AS encapsulation \
        values(adm_src_node) AS adm_src_node values(adm_dst_node) AS adm_dst_node values(adm_confs) AS adm_confs \
        values(adm_c_aciepg) AS adm_c_aciepg values(adm_s_aciepg) AS adm_s_aciepg max(adm_nconn) AS adm_nconn values(via_node) AS via_node \
        max(adm_ecapped) AS adm_ecapped \
        by adm_c_id adm_s_id server_port transport \
    | eval adm_row="edge", relationship="communicates_with", source=adm_c_id, target=adm_s_id, \
      id="communicates:".adm_c_id.">".adm_s_id.":".server_port."/".transport, \
      count=coalesce(adm_nconn, adm_count, adm_acl_count, 0), \
      confidence=if(mvcount(adm_confs)==1 AND adm_confs=="correlated", "correlated", "unresolved"), \
      direction_basis=case(`adm_mv_has_str(adm_bases, initiator)`, "initiator", `adm_mv_has_str(adm_bases, port_rule)`, "port_rule", true(), "unknown"), \
      server_port=if(server_port=="-", null(), server_port), \
      encapsulation=mvindex(mvmap(encapsulation, if(encapsulation=="vxlan" OR encapsulation=="geneve", encapsulation, null())), 0), \
      acl_leaf=mvindex(acl_leaf, 0), acl_permits=if(acl_permits>0, acl_permits, null()), acl_drops=if(acl_drops>0, acl_drops, null()), \
      acl_action=case(acl_drops>0, "drop", acl_permits>0, "permit"), \
      adm_src_node=mvindex(adm_src_node, 0), adm_dst_node=mvindex(adm_dst_node, 0), \
      adm_c_aciepg=mvindex(adm_c_aciepg, 0), adm_s_aciepg=mvindex(adm_s_aciepg, 0)] \
| eval adm_row=if(adm_row=="fwd", "edge", adm_row) \
| appendpipe [| where adm_row=="span" AND tonumber(json_extract(adm_span, "pinb"))==1 AND json_extract(adm_span, "psvc")!=json_extract(adm_span, "svc") \
    | eval source=json_extract(adm_span, "psvc"), target=json_extract(adm_span, "svc"), adm_ev="span:".json_extract(adm_span, "tid")."/".json_extract(adm_span, "sid") \
    | stats count values(adm_ev) AS evidence by source target \
    | eval adm_row="edge", relationship="calls", confidence="observed", id="calls:".source.">".target, span_ids=mvmap(evidence, replace(evidence, "^span:[^/]*/", "")), \
      adm_src_node=`adm_service_node(source)`, adm_dst_node=`adm_service_node(target)`] \
| appendpipe [| where adm_row=="binding" AND first_seen<=adm_we AND last_seen>=adm_ws \
    | eval source="service:".cluster."/".namespace."/".service."/".environment, target="pod:".cluster."/".pod_uid \
    | stats count by source target pod_name cluster namespace \
    | eval adm_row="edge", relationship="runs_on", confidence="correlated", id="runs_on:".source.">".target, count=1, evidence="otel_resource:k8s.pod.uid", \
      adm_src_node=`adm_service_node(source)`, \
      adm_dst_node=json_object("id", target, "label", pod_name, "kind", "workload", "namespace", namespace, "cluster", cluster, "reason", "Pod named by k8s.pod.uid on the service's spans") \
    | fields - pod_name cluster namespace] \
| appendpipe [| where adm_row=="pod" AND valid_from<adm_we AND (isnull(valid_end) OR valid_end>adm_ws) \
    | eval adm_row="node_src", adm_node_out="1#".json_object("id", "pod:".cluster."/".entity_id, "label", entity_name, "kind", "workload", \
      "namespace", namespace, "cluster", cluster, "addr", ip, "attr_owner_kind", owner_kind, "attr_owner", owner_name, "attr_node", node, "attr_scope", scope, \
      "reason", "Kubernetes pod object present during the window")] \
| appendpipe [| where adm_row=="span" AND tonumber(json_extract(adm_span, "inb"))==1 \
    | eval adm_svc=json_extract(adm_span, "svc") | stats count by adm_svc \
    | eval adm_row="node_src", adm_node_out="1#".`adm_service_node(adm_svc)`] \
| eval via_node=if(adm_row=="edge" AND relationship=="communicates_with" AND NOT match(target, "^k8s_service:"), null(), via_node)
description = Graph stage 4: communicates_with edges (count = distinct connections across observers, return records and re-exports, deduplicated by client port and adm_conn_gap; bytes per observer summed across buckets, then the largest observer; receiving nodes of the client's connections to a Service frontend in via_node; ACI ACL-log permits and drops summed, the record count from flow sources unless only ACL logs saw the conversation), forwards_to, calls and runs_on edges, receiving node of Service frontends, and node candidates for boundary pods and services.

[adm_graph_contracts(4)]
args = service, environment, cluster, namespace
validation = match(service, "^[A-Za-z0-9][A-Za-z0-9._:/@-]{0,254}\z") AND match(environment, "^[A-Za-z0-9][A-Za-z0-9._-]{0,127}\z") AND match(cluster, "^[A-Za-z0-9][A-Za-z0-9._-]{0,252}\z") AND match(namespace, "^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?\z")
errormsg = Invalid graph arguments: service may contain letters, numbers and . _ : / @ - (max 255); environment letters, numbers and . _ - (max 128); cluster letters, numbers and . _ - (max 253); namespace must be a Kubernetes namespace name.
definition = appendpipe [| where adm_row=="edge" AND relationship=="communicates_with" \
    | inputlookup append=true adm_aci_policy \
    | inputlookup append=true adm_ip_identity where entity_kind="k8s_node" AND cluster="$cluster$" \
    | eval adm_crow=case(adm_row=="edge", "edge", isnotnull(object_kind), "policy", true(), "nodeid"), adm_nip=if(adm_crow=="nodeid", ip, null()), adm_nscope=if(adm_crow=="nodeid", scope, null()) \
    | lookup adm_ip_identity ip AS adm_nip scope AS adm_nscope OUTPUT desc AS adm_ndesc \
    | addinfo \
    | eval adm_pol=if(adm_crow=="policy" AND last_seen>=info_min_time-3*`adm_poll_interval` AND first_seen<=info_max_time, 1, 0), \
      adm_node_epg=if(adm_crow=="nodeid", entity_name."#".mvindex(mvmap(adm_ndesc, if(json_extract(adm_ndesc, "source")=="aci" AND isnotnull(json_extract(adm_ndesc, "epg")), \
        "uni/tn-".json_extract(adm_ndesc, "tenant")."/ap-".json_extract(adm_ndesc, "ap")."/epg-".json_extract(adm_ndesc, "epg"), null())), 0), null()), \
      adm_p_sub=if(adm_pol==1 AND object_kind=="subnet" AND like(subnet_scope, "%import-security%"), substr("000".replace(subnet, "^.*/", ""), -3)."#".subnet."#".class_dn."#".tenant, null()), \
      adm_p_cons=if(adm_pol==1 AND object_kind=="cons", class_dn."#".contract_dn, null()), adm_p_prov=if(adm_pol==1 AND object_kind=="prov", class_dn."#".contract_dn, null()), \
      adm_p_fa=if(adm_pol==1 AND object_kind=="filtatt", contract_dn."#".subject."#".filter_dn."#".coalesce(action, "permit")."#".coalesce(directives, ""), null()), \
      adm_p_from=`adm_aci_port(d_from)`, adm_p_to=coalesce(`adm_aci_port(d_to)`, adm_p_from), \
      adm_p_prot=if(isnull(prot) OR lower(prot)=="unspecified", "unspecified", `adm_transport(prot)`), \
      adm_p_simple=if(coalesce(s_from, "unspecified")=="unspecified" AND coalesce(s_to, "unspecified")=="unspecified" AND coalesce(tcp_rules, "")=="", 1, 0), \
      adm_p_en=if(adm_pol==1 AND object_kind=="entry", filter_dn."#".adm_p_prot."#".if(isnull(adm_p_from), "any", tostring(adm_p_from))."#".if(isnull(adm_p_to), "any", tostring(adm_p_to)) \
        ."#".lower(coalesce(ether_t, "unspecified"))."#".adm_p_simple, null()), \
      adm_p_scope=if(adm_pol==1 AND object_kind=="contract", dn."#".coalesce(contract_scope, "context"), null()), \
      adm_p_term=if(adm_pol==1 AND object_kind=="term", contract_dn."#".subject, null()), \
      adm_p_unsupp=if(adm_pol==1 AND (object_kind=="unsupported" OR (object_kind=="ctx" AND lower(enf_pref)=="unenforced")), tenant, null()), \
      adm_p_pref=if(adm_pol==1 AND lower(pref_group)=="include", class_dn, null()), \
      adm_p_iso=if(adm_pol==1 AND object_kind=="epg" AND lower(enf_pref)=="enforced", class_dn, null()) \
    | eventstats values(adm_p_sub) AS adm_subs values(adm_p_cons) AS adm_cons values(adm_p_prov) AS adm_provs values(adm_p_fa) AS adm_fas values(adm_p_en) AS adm_ens \
        values(adm_p_scope) AS adm_scopes values(adm_p_term) AS adm_terms values(adm_p_unsupp) AS adm_unsupp values(adm_p_pref) AS adm_prefs values(adm_p_iso) AS adm_isos \
        values(adm_node_epg) AS adm_node_epgs sum(adm_pol) AS adm_npol count(eval(adm_crow=="policy")) AS adm_npol_read \
    | where adm_crow=="edge" \
    | eval adm_ck_kind=json_extract(adm_src_node, "kind"), adm_c_ek=json_extract(adm_src_node, "endpoint_kind"), adm_c_addr=json_extract(adm_src_node, "addr"), \
      adm_sk_kind=json_extract(adm_dst_node, "kind"), adm_s_ek=json_extract(adm_dst_node, "endpoint_kind"), adm_s_addr=json_extract(adm_dst_node, "addr"), \
      adm_c_host=case(adm_ck_kind=="workload" OR adm_c_ek=="k8s_node_proxy", json_extract(adm_src_node, "attr_node"), adm_c_ek=="k8s_node", json_extract(adm_src_node, "label")), \
      adm_s_host=case(adm_sk_kind=="workload" OR adm_s_ek=="k8s_node_proxy", json_extract(adm_dst_node, "attr_node"), adm_s_ek=="k8s_node", json_extract(adm_dst_node, "label")), \
      adm_c_host_epg=if(isnotnull(adm_c_host), mvindex(mvmap(adm_node_epgs, if(mvindex(split(adm_node_epgs, "#"), 0)==adm_c_host AND mvindex(split(adm_node_epgs, "#"), 1)!="", mvindex(split(adm_node_epgs, "#"), 1), null())), 0), null()), \
      adm_c_epg0=case(isnotnull(adm_c_aciepg), adm_c_aciepg, (adm_ck_kind=="workload" OR adm_c_ek=="k8s_node_proxy") AND isnotnull(adm_c_host_epg), adm_c_host_epg), \
      adm_s_epg0=adm_s_aciepg, \
      adm_ten=replace(coalesce(adm_c_epg0, adm_s_epg0, ""), "^uni/tn-([^/]+)/.*$", "\1"), \
      adm_c_lpm_ok=if(adm_c_ek=="unresolved" OR adm_c_ek=="ambiguous" OR isnull(adm_c_addr), 0, 1), adm_s_lpm_ok=if(adm_s_ek=="unresolved" OR adm_s_ek=="ambiguous" OR isnull(adm_s_addr), 0, 1), \
      adm_c_pub=if(isnotnull(adm_c_addr) AND NOT `adm_is_private(adm_c_addr)`, 1, 0), adm_s_pub=if(isnotnull(adm_s_addr) AND NOT `adm_is_private(adm_s_addr)`, 1, 0), \
      adm_c_hits=if(isnull(adm_c_epg0) AND adm_c_lpm_ok==1, mvsort(mvmap(adm_subs, if(cidrmatch(mvindex(split(adm_subs, "#"), 1), adm_c_addr) \
        AND (adm_ten=="" OR mvindex(split(adm_subs, "#"), 3)==adm_ten) AND (mvindex(split(adm_subs, "#"), 0)!="000" OR adm_c_pub==1), adm_subs, null()))), null()), \
      adm_s_hits=if(isnull(adm_s_epg0) AND adm_s_lpm_ok==1, mvsort(mvmap(adm_subs, if(cidrmatch(mvindex(split(adm_subs, "#"), 1), adm_s_addr) \
        AND (adm_ten=="" OR mvindex(split(adm_subs, "#"), 3)==adm_ten) AND (mvindex(split(adm_subs, "#"), 0)!="000" OR adm_s_pub==1), adm_subs, null()))), null()), \
      adm_c_class=coalesce(adm_c_epg0, mvindex(split(mvindex(adm_c_hits, -1), "#"), 2)), adm_s_class=coalesce(adm_s_epg0, mvindex(split(mvindex(adm_s_hits, -1), "#"), 2)), \
      adm_c_ten=replace(adm_c_class, "^uni/tn-([^/]+)/.*$", "\1"), adm_s_ten=replace(adm_s_class, "^uni/tn-([^/]+)/.*$", "\1"), \
      adm_c_ap=if(match(adm_c_class, "/ap-"), replace(adm_c_class, "^.*/ap-([^/]+)/.*$", "\1"), null()), adm_s_ap=if(match(adm_s_class, "/ap-"), replace(adm_s_class, "^.*/ap-([^/]+)/.*$", "\1"), null()), \
      adm_same_host=if(isnotnull(adm_c_host) AND adm_c_host==adm_s_host, 1, 0), \
      adm_blocked=if(`adm_mv_has(adm_unsupp, adm_c_ten)` OR `adm_mv_has(adm_unsupp, adm_s_ten)` OR `adm_mv_has(adm_prefs, adm_c_class)` OR `adm_mv_has(adm_prefs, adm_s_class)`, 1, 0), \
      adm_ccons="#".replace(replace(mvjoin(mvmap(adm_cons, if(mvindex(split(adm_cons, "#"), 0)==adm_c_class, mvindex(split(adm_cons, "#"), 1), null())), "#"), "~", "~t~"), "_", "~u~")."#", \
      adm_ccands=mvmap(adm_provs, if(mvindex(split(adm_provs, "#"), 0)==adm_s_class AND like(adm_ccons, "%#".replace(replace(mvindex(split(adm_provs, "#"), 1), "~", "~t~"), "_", "~u~")."#%"), mvindex(split(adm_provs, "#"), 1), null())), \
      adm_ccands=mvmap(adm_ccands, if(mvindex(split(mvindex(mvmap(adm_scopes, if(mvindex(split(adm_scopes, "#"), 0)==adm_ccands, adm_scopes, null())), 0), "#"), 1)=="application-profile" \
        AND (isnull(adm_c_ap) OR adm_c_ap!=adm_s_ap), null(), adm_ccands)), \
      adm_ccands_s="#".replace(replace(mvjoin(adm_ccands, "#"), "~", "~t~"), "_", "~u~")."#", adm_terms_s="#".replace(replace(mvjoin(adm_terms, "#"), "~", "~t~"), "_", "~u~")."#", \
      adm_efas=coalesce(mvmap(adm_fas, if(like(adm_ccands_s, "%#".replace(replace(mvindex(split(adm_fas, "#"), 0), "~", "~t~"), "_", "~u~")."#%"), adm_fas, null())), "-"), \
      adm_port=tonumber(server_port) \
    | mvexpand adm_efas \
    | eval adm_fdn=mvindex(split(adm_efas, "#"), 2), \
      adm_fterm=if(adm_efas!="-" AND like(adm_terms_s, "%#".replace(replace(mvindex(split(adm_efas, "#"), 0)."#".mvindex(split(adm_efas, "#"), 1), "~", "~t~"), "_", "~u~")."#%"), 1, 0), \
      adm_hits=if(adm_efas=="-", null(), mvmap(adm_ens, if(mvindex(split(adm_ens, "#"), 0)==adm_fdn \
        AND (mvindex(split(adm_ens, "#"), 1)=="unspecified" OR mvindex(split(adm_ens, "#"), 1)==transport) \
        AND (mvindex(split(adm_ens, "#"), 4)=="ip" OR mvindex(split(adm_ens, "#"), 4)=="ipv4" OR mvindex(split(adm_ens, "#"), 4)=="unspecified") \
        AND (NOT (transport=="tcp" OR transport=="udp") OR mvindex(split(adm_ens, "#"), 2)=="any" \
          OR (adm_port>=tonumber(mvindex(split(adm_ens, "#"), 2)) AND adm_port<=tonumber(mvindex(split(adm_ens, "#"), 3)))), \
        mvindex(split(adm_ens, "#"), 5)."#".if(mvindex(split(adm_ens, "#"), 1)=="unspecified", "ip", mvindex(split(adm_ens, "#"), 1).if(mvindex(split(adm_ens, "#"), 2)=="any", "", " ".mvindex(split(adm_ens, "#"), 2). \
          if(mvindex(split(adm_ens, "#"), 3)==mvindex(split(adm_ens, "#"), 2), "", "-".mvindex(split(adm_ens, "#"), 3)))), null()))), \
      adm_inc=if(mvcount(adm_hits)>0 AND (adm_fterm==1 OR isnotnull(mvmap(adm_hits, if(mvindex(split(adm_hits, "#"), 0)=="0", 1, null())))), 1, 0), \
      adm_okhit=mvindex(mvmap(adm_hits, if(mvindex(split(adm_hits, "#"), 0)=="1", mvindex(split(adm_hits, "#"), 1), null())), 0), \
      adm_permit=if(adm_inc==0 AND isnotnull(adm_okhit) AND mvindex(split(adm_efas, "#"), 3)!="deny", replace(mvindex(split(adm_efas, "#"), 0), "^.*/brc-", "")."#".mvindex(split(adm_efas, "#"), 1)."#".replace(adm_fdn, "^.*/flt-", "")."#".adm_okhit, null()), \
      adm_deny=if(adm_inc==0 AND isnotnull(adm_okhit) AND mvindex(split(adm_efas, "#"), 3)=="deny", replace(mvindex(split(adm_efas, "#"), 0), "^.*/brc-", ""), null()) \
    | eventstats values(adm_permit) AS adm_permits values(adm_deny) AS adm_denies max(adm_inc) AS adm_incomplete by id \
    | dedup id \
    | eval contract_basis=case(adm_same_host==1 OR coalesce(adm_npol, 0)==0, null(), \
        isnull(adm_c_class) OR isnull(adm_s_class) OR adm_c_ten!=adm_s_ten OR adm_blocked==1, "not_evaluated", \
        adm_c_class==adm_s_class, if(`adm_mv_has(adm_isos, adm_c_class)`, "not_evaluated", "intra_epg"), \
        adm_incomplete==1, "not_evaluated", \
        mvcount(adm_permits)>0 AND mvcount(adm_denies)>0, "not_evaluated", \
        mvcount(adm_denies)>0, if(`adm_aci_policy_complete`==1 OR acl_action=="drop", "none", "not_evaluated"), \
        mvcount(adm_permits)>0, "intent", \
        `adm_aci_policy_complete`==1, "none", true(), "not_evaluated"), \
      contract=if(contract_basis=="intent", mvindex(split(mvindex(adm_permits, 0), "#"), 0), null()), \
      contract_subject=if(contract_basis=="intent", mvindex(split(mvindex(adm_permits, 0), "#"), 1), null()), \
      contract_filter=if(contract_basis=="intent", mvindex(split(mvindex(adm_permits, 0), "#"), 2), null()), \
      contract_entry=if(contract_basis=="intent", mvindex(split(mvindex(adm_permits, 0), "#"), 3), null()), \
      adm_row="cedge"] \
| eventstats max(adm_npol_read) AS adm_npol_read \
| where NOT (adm_row=="edge" AND relationship=="communicates_with") \
| eval adm_row=if(adm_row=="cedge", "edge", adm_row)
description = Graph stage 5: ACI policy for each communicates_with edge, never claiming more than the collected policy supports. The client is classified by its ACI endpoint EPG, or for pods and Envoy addresses by their node's EPG; otherwise, and for the server without an endpoint EPG, by the longest-prefix external EPG subnet (import-security) of the same tenant; unresolved or ambiguous addresses are not classified, and 0.0.0.0/0 classifies only public addresses. contract_basis: intra_epg when both sides are in one EPG (not_evaluated if the EPG enforces intra-EPG isolation); intent when only permit entries of contracts the client consumes and the server provides (contract scope respected) match the transport and server port; none when only deny entries match and either adm_aci_policy_complete is 1 or a drop was logged, or when nothing matches and adm_aci_policy_complete is 1; otherwise not_evaluated: an unclassified side, sides in different tenants, a tenant with vzAny relations, taboos, ESGs, service graphs or an unenforced VRF, a preferred-group member, matching entries with source ports or tcpRules or in subjects with in/out terms, or permit and deny entries matching together. No contract fields on edges within one Kubernetes node or without collected ACI policy.

[adm_aci_port(1)]
args = value
definition = case($value$=="unspecified", null(), $value$=="http", 80, $value$=="https", 443, $value$=="ftpData", 20, $value$=="smtp", 25, $value$=="dns", 53, $value$=="pop3", 110, $value$=="rtsp", 554, $value$=="ssh", 22, true(), tonumber($value$))
description = ACI vzEntry port value (number or APIC named port) to a port number; unspecified is null.

[adm_graph_output(4)]
args = service, environment, cluster, namespace
validation = match(service, "^[A-Za-z0-9][A-Za-z0-9._:/@-]{0,254}\z") AND match(environment, "^[A-Za-z0-9][A-Za-z0-9._-]{0,127}\z") AND match(cluster, "^[A-Za-z0-9][A-Za-z0-9._-]{0,252}\z") AND match(namespace, "^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?\z")
errormsg = Invalid graph arguments: service may contain letters, numbers and . _ : / @ - (max 255); environment letters, numbers and . _ - (max 128); cluster letters, numbers and . _ - (max 253); namespace must be a Kubernetes namespace name.
definition = appendpipe [| where adm_row=="edge" OR adm_row=="node_src" \
    | eval adm_node_out=if(adm_row=="edge", mvappend("2#".adm_src_node, "2#".adm_dst_node), adm_node_out) \
    | mvexpand adm_node_out \
    | eval adm_nid=json_extract(replace(adm_node_out, "^\d+#", ""), "id"), adm_naddr=json_extract(replace(adm_node_out, "^\d+#", ""), "addr") \
    | where isnotnull(adm_nid) \
    | stats values(adm_node_out) AS adm_node_out values(adm_naddr) AS addresses by adm_nid \
    | eval adm_row="node", adm_node_json=replace(mvindex(mvsort(adm_node_out), 0), "^\d+#", "") \
    | spath input=adm_node_json \
    | fields - addr \
    | foreach label endpoint_kind namespace cluster reason attr_* [eval <<FIELD>>=if('<<FIELD>>'=="null" OR '<<FIELD>>'=="", null(), '<<FIELD>>')]] \
| appendpipe [| stats count(eval(adm_row=="span")) AS spans dc(eval(if(adm_row=="conv", adm_ck, null()))) AS conversations \
      dc(eval(if(adm_row=="conv" AND adm_keep==1 AND coalesce(adm_consumed, 0)!=1, adm_ck, null()))) AS conversations_in_scope \
      dc(eval(if(adm_row=="conv" AND adm_keep==1 AND coalesce(adm_consumed, 0)!=1 AND adm_c_state=="resolved" AND adm_s_state=="resolved", adm_ck, null()))) AS matched_conversations \
      dc(eval(if(adm_row=="conv" AND adm_keep==1 AND coalesce(adm_consumed, 0)!=1 AND (adm_c_state=="none" OR adm_s_state=="none"), adm_ck, null()))) AS unresolved_conversations \
      dc(eval(if(adm_row=="conv" AND adm_keep==1 AND coalesce(adm_consumed, 0)!=1 AND (adm_c_state=="ambiguous" OR adm_s_state=="ambiguous"), adm_ck, null()))) AS ambiguous_conversations \
      count(eval(adm_row=="node")) AS nodes count(eval(adm_row=="edge")) AS edges count(eval(adm_row=="pod")) AS adm_pods_read \
      sum(eval(if(adm_row=="span", tonumber(json_extract(adm_span, "mp")), 0))) AS missing_parent_spans \
      max(eval(if(adm_row=="span", tonumber(json_extract(adm_span, "root")), 0))) AS root_present \
      dc(adm_btrace) AS adm_btraces sum(adm_no_cluster_span) AS adm_no_cluster_spans dc(eval(if(adm_keep==1 AND adm_capped==1, adm_ck, null()))) AS adm_capped_n \
      count(eval(adm_row=="backend")) AS adm_backends_read max(adm_npol_read) AS adm_npol_read max(adm_ws) AS window_start max(adm_we) AS window_end \
      count(eval(adm_row=="conv" AND adm_keep==1 AND conns_capped==1)) AS adm_capped_rows sum(adm_dsr_opt) AS adm_dsr_rows max(adm_scope_capped) AS adm_scope_capped \
    | eval row_type="meta", generated_at=now(), \
      warnings=mvappend(if(root_present!=1, "Entry service $service$ has no spans in $cluster$/$namespace$ ($environment$) during the window; the graph is empty.", null()), \
        if(missing_parent_spans>0, missing_parent_spans." spans reference a parent outside the window; their calls edges are missing.", null()), \
        if(ambiguous_conversations>0, ambiguous_conversations." conversations have an IP claimed by several identities.", null()), \
        if(adm_capped_n>0, adm_capped_n." conversations reached adm_identity_max_matches identity rows for an IP; their resolution may be wrong.", null()), \
        if(adm_btraces>=`adm_trace_limit`, "More than ".tostring(`adm_trace_limit`)." boundary traces in the window; calls into other namespaces may be missing.", null()), \
        if(adm_no_cluster_spans>0, adm_no_cluster_spans." spans lack k8s.cluster.name and were not attributed to a cluster.", null()), \
        if(adm_pods_read>=`adm_kv_max_rows`, "Boundary pod read reached max_rows_per_query; workloads may be missing.", null()), \
        if(adm_backends_read>=`adm_kv_max_rows`, "Service backend read reached max_rows_per_query; hand-offs may be missing.", null()), \
        if(adm_npol_read>=`adm_kv_max_rows`, "ACI policy read reached max_rows_per_query; contract annotations may be incomplete.", null()), \
        if(adm_capped_rows>0, adm_capped_rows." summary rows listed only the first ".tostring(`adm_conn_cap`)." connections; their hand-offs and connection counts are approximate.", null()), \
        if(adm_dsr_rows>0, adm_dsr_rows." fabric records showed a client talking straight to a backend pod while Hubble attributed the connection to a Service frontend; this is DSR forwarding with loadBalancer.dsrDispatch opt (or geneve), so the records were folded into the hand-off instead of being drawn as direct edges. Use dsrDispatch ipip to see the node-to-node leg.", null()), \
        if(adm_scope_capped==1, "More than ".tostring(`adm_scope_peer_limit`)." boundary clients or dependencies; some direct conversations that bypass the application may be missing.", null()), \
        if(nodes>500 OR edges>2000, "Graph exceeds 500 nodes or 2,000 edges (".nodes." nodes, ".edges." edges); narrow the window or the namespace.", null())), \
      nodes=if(root_present==1, nodes, 0), edges=if(root_present==1, edges, 0), window_start=tostring(floor(window_start)), window_end=tostring(floor(window_end))] \
| eventstats max(root_present) AS adm_root_present \
| where row_type=="meta" OR (adm_root_present==1 AND (adm_row=="node" OR adm_row=="edge")) \
| eval row_type=coalesce(row_type, adm_row), evidence=mvindex(evidence, 0, 19), span_ids=mvindex(span_ids, 0, 19) \
| fields row_type id label kind endpoint_kind namespace cluster addresses reason attr_* source target relationship confidence count bytes evidence observers sources server_port transport direction_basis encapsulation span_ids \
    handoff_basis via_node contract contract_subject contract_filter contract_entry contract_basis acl_action acl_leaf acl_permits acl_drops \
    window_start window_end spans conversations conversations_in_scope matched_conversations unresolved_conversations ambiguous_conversations missing_parent_spans root_present nodes edges warnings generated_at \
| fields - _*
description = Graph stage 6: deduplicates nodes (identity, span and hand-off facts win over edge-derived ones; addresses are unioned) and appends one meta row with coverage counts and warnings.

[adm_graph(4)]
args = service, environment, cluster, namespace
validation = match(service, "^[A-Za-z0-9][A-Za-z0-9._:/@-]{0,254}\z") AND match(environment, "^[A-Za-z0-9][A-Za-z0-9._-]{0,127}\z") AND match(cluster, "^[A-Za-z0-9][A-Za-z0-9._-]{0,252}\z") AND match(namespace, "^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?\z")
errormsg = Invalid graph arguments: service may contain letters, numbers and . _ : / @ - (max 255); environment letters, numbers and . _ - (max 128); cluster letters, numbers and . _ - (max 253); namespace must be a Kubernetes namespace name.
definition = `adm_graph_inputs("$service$", "$environment$", "$cluster$", "$namespace$")` \
| `adm_graph_resolve("$service$", "$environment$", "$cluster$", "$namespace$")` \
| `adm_graph_handoffs("$service$", "$environment$", "$cluster$", "$namespace$")` \
| `adm_graph_edges("$service$", "$environment$", "$cluster$", "$namespace$")` \
| `adm_graph_contracts("$service$", "$environment$", "$cluster$", "$namespace$")` \
| `adm_graph_output("$service$", "$environment$", "$cluster$", "$namespace$")`
description = Dependency graph rows (row_type node, edge, meta) for an entry service and its Kubernetes namespace boundary over the search time range.

# ---- topology (on demand) ----

[adm_if_norm(1)]
args = field
definition = replace(trim($field$), "(?i)^eth(ernet)?\s*(\d)", "Ethernet\2")
description = Normalizes ethX/Y, EthX/Y and EthernetX/Y interface names to the NX-OS EthernetX/Y form.

[adm_topology_sample]
definition = 10000
description = Number of most recent FTD connection events and Nexus Dashboard flow records read to name firewalls and assign switches to ND fabrics.

[adm_topology]
definition = (`adm_index_dcn` sourcetype="cisco:dc:nexus9k" (component="nxhostname" OR component="nxversion" OR component="nxneighbor" OR component="nxinterface")) \
  OR (`adm_index_dcn` sourcetype="cisco:dc:aci:class" (component="topSystem" OR component="fabricLink" OR component="lldpAdjEp")) \
| append [search `adm_index_ftd` sourcetype="cisco:sfw:estreamer" EventType="ConnectionEvent" | head `adm_topology_sample` \
    | stats latest(Device) AS Device latest(DeviceSerialNumber) AS DeviceSerialNumber max(_time) AS _time by DeviceIP | eval adm_kind="ftd"] \
| append [search `adm_index_dcn` sourcetype="cisco:dc:nd:flows" | head `adm_topology_sample` \
    | eval adm_nodes='stats{}.nodeNames{}' | mvexpand adm_nodes \
    | stats latest(fabricName) AS adm_fabric max(_time) AS _time by adm_nodes | eval adm_kind="ndfabric"] \
| eval adm_kind=coalesce(adm_kind, component), \
  adm_aci_pod=if(adm_kind=="topSystem" OR adm_kind=="fabricLink" OR adm_kind=="lldpAdjEp", replace(dn, "^topology/(pod-\d+)/.*$", "\1"), null()), \
  adm_aci_key=if(adm_kind=="topSystem", replace(dn, "^topology/(pod-\d+)/(node-\d+)/sys$", "\1/\2"), null()) \
| eventstats values(eval(if(adm_kind=="topSystem", apic_host."|".adm_aci_key."=".name, null()))) AS adm_aci_names \
| eval adm_lldp_local=if(adm_kind=="lldpAdjEp", apic_host."|".replace(dn, "^topology/(pod-\d+)/(node-\d+)/.*$", "\1/\2"), null()), \
  adm_lldp_if=if(adm_kind=="lldpAdjEp", replace(dn, "^.*/if-\[([^\]]+)\]/.*$", "\1"), null()), \
  adm_lldp_fabric=if(adm_kind=="lldpAdjEp" AND match(sysDesc, "^topology/pod-\d+/node-\d+$"), 1, 0), \
  adm_lldp_rif=if(adm_kind=="lldpAdjEp", if(match(portDesc, "pathep-\["), replace(portDesc, "^.*pathep-\[([^\]]+)\].*$", "\1"), portDesc), null()), \
  adm_fl_a=if(adm_kind=="fabricLink", apic_host."|".adm_aci_pod."/node-".n1, null()), adm_fl_b=if(adm_kind=="fabricLink", apic_host."|".adm_aci_pod."/node-".n2, null()), \
  adm_aci_a=mvindex(mvmap(adm_aci_names, if(mvindex(split(adm_aci_names, "="), 0)==coalesce(adm_fl_a, adm_lldp_local), mvindex(split(adm_aci_names, "="), 1), null())), 0), \
  adm_aci_b=mvindex(mvmap(adm_aci_names, if(mvindex(split(adm_aci_names, "="), 0)==adm_fl_b, mvindex(split(adm_aci_names, "="), 1), null())), 0) \
| eval adm_kind=case(adm_kind=="topSystem", "topSystem", adm_kind=="fabricLink", "aciLink", adm_kind=="lldpAdjEp" AND adm_lldp_fabric==1, "aciLink", adm_kind=="lldpAdjEp", "lldpHost", true(), adm_kind), \
  adm_l_ai_raw=case(component=="fabricLink", "eth".s1."/".p1, component=="lldpAdjEp", adm_lldp_if), \
  adm_l_bi_raw=case(component=="fabricLink", "eth".s2."/".p2, component=="lldpAdjEp", adm_lldp_rif), \
  adm_dev_ip=case(adm_kind=="ftd", `adm_ip(DeviceIP)`, adm_kind=="topSystem", if(oobMgmtAddr=="0.0.0.0", null(), oobMgmtAddr), adm_kind=="ndfabric", null(), true(), replace(device, ":\d+$", "")), \
  adm_hostname=if(adm_kind=="nxhostname", mvindex('Row_info{}.hostname', 0), null()), \
  adm_version=if(adm_kind=="nxversion", mvindex('Row_info{}.nxos_ver_str', 0), null()), \
  adm_peer_ip=if(adm_kind=="nxneighbor", 'Row_info.v4mgmtaddr', null()), \
  adm_ipkey=if(adm_kind=="nxneighbor", adm_peer_ip, adm_dev_ip) \
| eventstats latest(adm_hostname) AS adm_local_name latest(adm_version) AS adm_local_version by adm_dev_ip \
| eventstats latest(adm_hostname) AS adm_peer_name by adm_ipkey \
| eval adm_cdp_name=if(adm_kind=="nxneighbor", coalesce(adm_peer_name, replace('Row_info.device_id', "\([^)]*\)$", "")), null()), \
  adm_local=coalesce(adm_local_name, adm_dev_ip) \
| appendpipe [| where isnull(row_type) AND adm_kind!="nxinterface" AND adm_kind!="aciLink" AND adm_kind!="lldpHost" \
    | eval d_self=case(adm_kind=="nxhostname" OR adm_kind=="nxversion", adm_local_name, adm_kind=="topSystem", name, adm_kind=="ftd", Device), \
      d_name=coalesce(d_self, adm_cdp_name, adm_nodes), d_lname=lower(d_name), \
      d_ip=if(adm_kind=="nxneighbor", adm_peer_ip, adm_dev_ip), \
      d_platform=if(adm_kind=="nxneighbor", 'Row_info.platform_id', null()), \
      d_version=if(adm_kind=="nxhostname" OR adm_kind=="nxversion", adm_local_version, null()), \
      d_serial=case(adm_kind=="nxneighbor" AND match('Row_info.device_id', "\([^)]+\)$"), replace('Row_info.device_id', "^.*\(([^)]+)\)$", "\1"), adm_kind=="topSystem", serial, adm_kind=="ftd", DeviceSerialNumber), \
      d_kind=case(adm_kind=="ftd", "firewall", adm_kind=="topSystem" AND role=="controller", "controller", true(), "switch"), \
      d_fabric=case(adm_kind=="topSystem", "apic:".apic_host, adm_kind=="ndfabric", adm_fabric), \
      d_aci_node=if(adm_kind=="topSystem", replace(dn, "^topology/(pod-\d+)/(node-\d+)/sys$", "\1/\2"), null()), \
      d_role=if(adm_kind=="topSystem", role, null()), \
      d_src=case(adm_kind=="nxneighbor", "cdp", adm_kind=="topSystem", "aci", adm_kind=="ftd", "ftd", adm_kind=="ndfabric", "nd", true(), "nxos") \
    | where isnotnull(d_lname) AND d_lname!="" \
    | stats latest(d_self) AS d_self latest(d_name) AS d_name latest(d_ip) AS mgmt_ip latest(d_platform) AS platform latest(d_version) AS os_version \
        latest(d_serial) AS serial latest(d_kind) AS device_kind latest(eval(if(d_src=="aci", d_fabric, null()))) AS adm_aci_fabric latest(d_fabric) AS fabric \
        latest(d_aci_node) AS aci_node latest(d_role) AS role values(d_src) AS sources by d_lname \
    | eval row_type="device", name=coalesce(d_self, d_name), device_id=name, fabric=coalesce(adm_aci_fabric, fabric) \
    | fields row_type device_id name mgmt_ip device_kind platform os_version serial fabric aci_node role sources] \
| appendpipe [| where isnull(row_type) AND adm_kind=="aciLink" AND isnotnull(adm_aci_a) \
    | eval l_a=adm_aci_a, l_ai=`adm_if_norm(adm_l_ai_raw)`, l_b=coalesce(adm_aci_b, sysName), l_bi=`adm_if_norm(adm_l_bi_raw)`, \
      l_ae=lower(l_a)."|".l_ai, l_be=lower(l_b)."|".l_bi, l_fwd=if(l_ae<=l_be, 1, 0), \
      a_device=if(l_fwd==1, l_a, l_b), a_interface=if(l_fwd==1, l_ai, l_bi), b_device=if(l_fwd==1, l_b, l_a), b_interface=if(l_fwd==1, l_bi, l_ai), \
      l_key=if(l_fwd==1, l_ae."#".l_be, l_be."#".l_ae) \
    | where isnotnull(l_key) AND isnotnull(l_b) \
    | stats latest(a_device) AS a_device latest(a_interface) AS a_interface latest(b_device) AS b_device latest(b_interface) AS b_interface max(_time) AS last_seen by l_key \
    | eval row_type="link", link_source="aci" \
    | fields row_type a_device a_interface b_device b_interface link_source last_seen] \
| appendpipe [| where isnull(row_type) AND adm_kind=="lldpHost" AND isnotnull(adm_aci_a) AND isnotnull(sysName) AND sysName!="" \
    | eval a_device=adm_aci_a, a_interface=`adm_if_norm(adm_lldp_if)`, b_device=sysName, b_interface=adm_lldp_rif \
    | stats latest(b_interface) AS b_interface max(_time) AS last_seen by a_device a_interface b_device \
    | eval row_type="link", link_source="lldp" \
    | fields row_type a_device a_interface b_device b_interface link_source last_seen] \
| appendpipe [| where isnull(row_type) AND adm_kind=="nxneighbor" \
    | eval l_a=adm_local, l_ai=`adm_if_norm('Row_info.intf_id')`, l_b=adm_cdp_name, l_bi=`adm_if_norm('Row_info.port_id')`, \
      l_ae=lower(l_a)."|".l_ai, l_be=lower(l_b)."|".l_bi, l_fwd=if(l_ae<=l_be, 1, 0), \
      a_device=if(l_fwd==1, l_a, l_b), a_interface=if(l_fwd==1, l_ai, l_bi), b_device=if(l_fwd==1, l_b, l_a), b_interface=if(l_fwd==1, l_bi, l_ai), \
      l_key=if(l_fwd==1, l_ae."#".l_be, l_be."#".l_ae) \
    | where isnotnull(l_key) \
    | stats latest(a_device) AS a_device latest(a_interface) AS a_interface latest(b_device) AS b_device latest(b_interface) AS b_interface max(_time) AS last_seen by l_key \
    | eval row_type="link", link_source="cdp" \
    | fields row_type a_device a_interface b_device b_interface link_source last_seen] \
| appendpipe [| where isnull(row_type) AND (adm_kind=="nxinterface" OR adm_kind=="nxneighbor") \
    | eval i_raw=if(adm_kind=="nxinterface", 'Row_info.interface', 'Row_info.intf_id') \
    | eval i_if=`adm_if_norm(i_raw)`, \
      i_ifindex=if(adm_kind=="nxneighbor", 'Row_info.ifindex', null()), \
      i_desc=if(adm_kind=="nxinterface", 'Row_info.desc', null()), i_state=if(adm_kind=="nxinterface", 'Row_info.state', null()), \
      i_dev=adm_local, i_key=lower(adm_local)."|".i_if \
    | where isnotnull(i_if) AND i_if!="" \
    | stats latest(i_dev) AS device_id latest(i_if) AS interface latest(i_ifindex) AS ifindex latest(i_desc) AS description latest(i_state) AS state by i_key \
    | eval row_type="interface" \
    | fields row_type device_id interface ifindex description state] \
| where isnotnull(row_type) \
| appendpipe [| stats count(eval(row_type=="device")) AS devices count(eval(row_type=="link")) AS links count(eval(row_type=="interface")) AS interfaces \
      count(eval(row_type=="interface" AND isnotnull(ifindex))) AS adm_indexed count(eval(row_type=="link" AND link_source!="lldp")) AS adm_switch_links \
      count(eval(row_type=="device" AND role=="leaf")) AS adm_aci_leaves count(eval(row_type=="link" AND link_source=="aci")) AS adm_aci_links \
    | eval row_type="meta", generated_at=now(), \
      warnings=mvappend(if(devices==0, "No network inventory was found in the selected time range. Enable the DC Networking NX-OS inputs (show hostname, show cdp neighbors detail, show interface) or the ACI inputs (topSystem, and fabricLink and lldpAdjEp in a classInfo input), and set adm_index_dcn.", null()), \
        if(devices>0 AND adm_switch_links==0, "No switch-to-switch links (CDP, ACI fabricLink or fabric LLDP) were collected, so candidate paths between switches cannot be drawn.", null()), \
        if(adm_aci_leaves>0 AND adm_aci_links==0, "ACI leaves were found but no fabricLink or lldpAdjEp objects; add them to a DC Networking classInfo input to draw leaf-spine paths.", null()), \
        if(interfaces>adm_indexed, "SNMP ifIndex is known only for CDP-connected ports. NetFlow interfaces on other ports are shown by ifIndex unless 'show interface snmp-ifindex' output is collected.", null())) \
    | fields row_type devices links interfaces warnings generated_at] \
| fields row_type device_id name mgmt_ip device_kind platform os_version serial fabric aci_node role sources a_device a_interface b_device b_interface link_source last_seen interface ifindex description state devices links interfaces warnings generated_at \
| fields - _*
description = Network inventory rows (row_type device, link, interface, meta) over the search time range: NX-OS hostname/version/CDP/interfaces, ACI topSystem (name, role), ACI fabricLink and fabric LLDP adjacencies (link_source aci, both directions merged), LLDP host attachments on ACI leaves (link_source lldp: a_device leaf, b_device the host's LLDP system name), FTD devices named in recent connection events, and ND fabric membership from recent flow records. Never infers links from traffic.
