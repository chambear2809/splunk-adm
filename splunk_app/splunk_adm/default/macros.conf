# Application Atlas data layer. See docs/DATA_LAYER.md in the source repository.
# Administrators set the index macros to the indexes their TAs write to.

[adm_index_netflow]
definition = index=netflow
description = Index holding Splunk Stream NetFlow/IPFIX events (sourcetype stream:netflow).

[adm_index_catalyst]
definition = index=cisco_catalyst
description = Index holding Cisco Catalyst Center client observations (sourcetype cisco:dnac:client).

[adm_index_meraki]
definition = index=cisco_meraki
description = Index holding Cisco Meraki wireless network events (sourcetype meraki:accesspoints).

[adm_index_dcn]
definition = index=cisco_dc
description = Index holding Cisco DC Networking events (Nexus Dashboard, ACI, NX-OS).

[adm_index_ftd]
definition = index=cisco_secure_fw
description = Index holding Cisco Security Cloud FTD eStreamer events (TA default cisco_secure_fw).

[adm_index_isovalent]
definition = index=cisco_isovalent
description = Index holding Cisco Security Cloud Isovalent events (TA default cisco_isovalent).

[adm_index_k8s]
definition = index=k8s
description = Index holding Kubernetes objects from the Splunk OTel Collector for Kubernetes.

[adm_index_traces]
definition = index=otel_traces
description = Index holding spans sent to Splunk Platform by the Splunk OTel Collector.

[adm_traces_sourcetype]
definition = sourcetype="otel:traces"
description = Sourcetype configured as splunkPlatform.sourcetype for spans.

[adm_index_hubble]
definition = index=cilium_hubble
description = Index holding Hubble flow exports tailed by the Splunk OTel Collector (logsCollection.extraFileLogs).

[adm_hubble_sourcetypes]
definition = sourcetype="cilium:hubble:flow"
description = Sourcetype(s) of open-source and Isovalent Enterprise Hubble exporter JSON lines ({"flow":{...},"node_name":...,"time":...}), as set by com.splunk.sourcetype in the collector file-log configuration.

[adm_flows_hubble_enterprise]
definition = `adm_flows_hubble`
description = Alias for adm_flows_hubble. A real Hubble 1.19.5-cee.1 Enterprise export uses the same JSON-lines envelope and Cilium flow.proto fields as the open-source exporter. adm_flows already includes these records through adm_flows_hubble; do not append this alias separately. Validated by tests/splunk/test_hubble_enterprise.py against fixtures/samples/hubble-enterprise/.

[adm_cilium_lb_mode]
definition = "snat"
description = Cluster default Cilium loadBalancer.mode as a quoted string ("snat", "dsr" or "hybrid"), used for Services without the service.cilium.io/forwarding-mode annotation.

[adm_cilium_ingress_mode]
definition = "dedicated"
description = Cluster default Cilium Ingress load-balancer mode as a quoted string ("dedicated" or "shared") for Ingresses without ingress.cilium.io/loadbalancer-mode. Only dedicated mode is mapped to a frontend Service.

[adm_l2announcements_enabled]
definition = 0
description = Cluster default Cilium l2announcements.enabled Helm setting (0 or 1), operator-reported and not derived from traffic or Kubernetes objects. Cilium does not support combining L2 announcements with a Service's externalTrafficPolicy: Local, so adm_graph_handoffs uses this macro to flag Local-policy Services as misconfigured when it is 1.

[adm_k8s_object_staleness]
definition = 0
description = Seconds after the last observation at which Service frontend, backend and route rows end when no DELETED event or newer listing closes them. 0 disables it (watch mode with include_initial_state); for pull mode use about twice the pull interval.

[adm_handoff_window]
definition = 1
description = Seconds of tolerance when matching a client-to-frontend conversation to Hubble evidence or to a receiving node's connection to a backend.

[adm_index_summary]
definition = index=adm_summary
description = Summary index read by the graph search. Must name the same index as adm_summary_index_name.

[adm_summary_index_name]
definition = adm_summary
description = Summary index name written by the conversation rollup (collect index=...).

[adm_index_summary_v2]
definition = index=adm_summary_v2
description = Staged version-2 summary index read only by explicitly selected v2 graph and catalog readers.

[adm_summary_index_v2_name]
definition = adm_summary_v2
description = Separate staged summary index written by the version-2 rollup; never redirects the legacy writer.

[adm_data_contract_version]
definition = 1
description = Active persisted data contract version. Shipped at 1; set to 2 only after staged version-2 backfill validation and bounded writer handoff.

[adm_identity_retention]
definition = 604800
description = Seconds to keep identity rows after their validity ended (default 7 days).

[adm_poll_interval]
definition = 300
description = Polling interval in seconds of the APIC input; an ACI endpoint stays valid for two intervals after its last report.

[adm_k8s_node_staleness]
definition = 0
description = Seconds after the last pod observation at which a Kubernetes node row ends. 0 disables it (watch mode, where stable pods are not re-reported); for pull mode use about twice the pull interval.

[adm_identity_max_matches]
definition = 1000
description = Must equal max_matches of the adm_ip_identity lookup in transforms.conf. Reads that return this many rows are treated as possibly truncated.

[adm_network_history_cap]
definition = 512
description = Maximum network metadata runs (consecutive polls with identical VLAN and bridge-domain state, stored with first t and last te observation time) retained inside one identity row. Older runs are discarded first; the row is marked capped only when a discarded run's state differs from every retained run.

[adm_kv_max_rows]
definition = 50000
description = Must equal limits.conf [kvstore] max_rows_per_query. Collection reads returning this many rows are treated as possibly truncated.

[adm_kv_page_size]
definition = 10000
description = Page size used by adm_kv_read_all. Must be at most max_rows_per_query; adm_kv_read_all hard-codes the same value.

[adm_trace_limit]
definition = 10000
description = Maximum number of boundary traces whose out-of-boundary spans the graph search reads (subsearch). Must not exceed limits.conf [subsearch] maxout.

# ---- helpers ----

[adm_unmapped_scope(2)]
args = kind, observer
definition = "unmapped:".sha256(json_array(lower(trim(coalesce($kind$, ""))), lower(trim(coalesce($observer$, "")))))
description = Reserved observer-qualified isolation scope for evidence without an explicit routing mapping. It cannot correlate different observer authorities or an explicitly mapped default scope.

[adm_ip(1)]
args = field
definition = if(cidrmatch("::ffff:0:0/96", lower(trim($field$))), if(match(lower(trim($field$)), "\d+\.\d+\.\d+\.\d+$"), replace(lower(trim($field$)), "^.*:(\d+\.\d+\.\d+\.\d+)$", "\1"), tostring(floor(tonumber(replace(lower(trim($field$)), "^.*:([0-9a-f]{1,4}):([0-9a-f]{1,4})$", "\1"), 16)/256)).".".tostring(tonumber(replace(lower(trim($field$)), "^.*:([0-9a-f]{1,4}):([0-9a-f]{1,4})$", "\1"), 16)%256).".".tostring(floor(tonumber(replace(lower(trim($field$)), "^.*:([0-9a-f]{1,4}):([0-9a-f]{1,4})$", "\2"), 16)/256)).".".tostring(tonumber(replace(lower(trim($field$)), "^.*:([0-9a-f]{1,4}):([0-9a-f]{1,4})$", "\2"), 16)%256)), lower(trim($field$)))
description = Lower-cases an IP literal and unwraps IPv4-mapped IPv6 (::ffff:a.b.c.d, full and hexadecimal forms).

[adm_iso_time(1)]
args = field
definition = coalesce(strptime(replace(replace($field$, "(?i)Z$", "+0000"), "([+-]\d\d):(\d\d)$", "\1\2"), "%Y-%m-%dT%H:%M:%S.%N%z"), strptime(replace(replace($field$, "(?i)Z$", "+0000"), "([+-]\d\d):(\d\d)$", "\1\2"), "%Y-%m-%dT%H:%M:%S%z"))
description = Parses an RFC 3339 timestamp with an explicit offset to epoch seconds.

[adm_is_ip(1)]
args = field
definition = (match($field$, "^(?:\d{1,3}\.){3}\d{1,3}\z") OR (match($field$, "^[0-9A-Fa-f:.]{2,45}\z") AND like($field$, "%:%")))
description = True when a value is an IPv4 or IPv6 literal (no port, brackets or zone).

[adm_nat_ip_usable(1)]
args = field
definition = (match($field$, "^(?:0|[1-9]\d{0,2})(?:\.(?:0|[1-9]\d{0,2})){3}\z") OR (match($field$, "^[0-9A-Fa-f:.]{2,45}\z") AND like($field$, "%:%"))) AND (cidrmatch("0.0.0.0/0", $field$) OR cidrmatch("::/0", $field$)) AND NOT (cidrmatch("0.0.0.0/8", $field$) OR cidrmatch("224.0.0.0/4", $field$) OR cidrmatch("240.0.0.0/4", $field$) OR $field$=="255.255.255.255" OR cidrmatch("::/128", $field$) OR cidrmatch("ff00::/8", $field$))
description = True for a syntactically valid normalized IP literal except unspecified/reserved IPv4, IPv6 unspecified, limited broadcast, and IPv4/IPv6 multicast addresses.

[adm_nat_ip_equal(2)]
args = left,right
definition = if(match($left$, ":"), if(match($right$, ":"), cidrmatch($left$."/128", $right$), 0), if(match($right$, ":"), 0, cidrmatch($left$."/32", $right$)))
description = True when two already-validated NAT IP literals identify the same address, including expanded and compressed IPv6 forms.

[adm_nat_filter_window]
definition = eval adm_nat_contexts=mvmap(adm_nat_contexts, if(isnotnull(tonumber(json_extract(adm_nat_contexts, "event_time"))) AND tonumber(json_extract(adm_nat_contexts, "event_time"))>=info_min_time AND tonumber(json_extract(adm_nat_contexts, "event_time"))<info_max_time, adm_nat_contexts, null()))
description = Keeps only same-event NAT observations whose event_time is inside the current search's half-open info_min_time/info_max_time window.

[adm_conn_cap]
definition = 50
description = Connections (client_port@start@end) listed per summary row for connection-level hand-off matching and connection counts. Rows with more are flagged conns_capped and reported by the graph.

[adm_conn_gap]
definition = 60
description = Seconds: records of the same client address and port to the same server whose start is within this many seconds of the previous record's end are one connection (return records, other observers and active-timeout re-exports).

[adm_aci_policy_complete]
definition = 0
description = Set to 1 only when every ACI policy class that can permit traffic (contracts, vzAny relations, taboos, in/out terms, preferred groups, ESGs, VRF enforcement) is collected. With 0, a conversation that no collected filter permits gets contract_basis not_evaluated instead of none.

[adm_transport(1)]
args = field
definition = case(lower($field$)=="tcp" OR $field$=="6", "tcp", lower($field$)=="udp" OR $field$=="17", "udp", lower($field$)=="icmp" OR $field$=="1", "icmp", lower($field$)=="ipv6-icmp" OR lower($field$)=="icmpv6" OR $field$=="58", "ipv6-icmp", lower($field$)=="ipip" OR lower($field$)=="ip-in-ip" OR $field$=="4", "ipip", lower($field$)=="sctp" OR $field$=="132", "sctp", isnotnull($field$), lower($field$))
description = Normalizes protocol names and IANA numbers (NetFlow protoid) to lower-case transport names (tcp, udp, icmp, ipv6-icmp, ipip, sctp).

[adm_is_private(1)]
args = field
definition = (cidrmatch("10.0.0.0/8", $field$) OR cidrmatch("172.16.0.0/12", $field$) OR cidrmatch("192.168.0.0/16", $field$) OR cidrmatch("100.64.0.0/10", $field$) OR cidrmatch("fc00::/7", $field$) OR cidrmatch("fe80::/10", $field$))
description = True for RFC 1918, RFC 6598 and IPv6 unique-local/link-local addresses.

[adm_mv_has(2)]
args = mv, field
definition = isnotnull(mvmap($mv$, if($mv$==$field$, 1, null())))
description = True when a multivalue field contains the value of another field (exact string equality).

[adm_mv_has_str(2)]
args = mv, literal
definition = isnotnull(mvmap($mv$, if($mv$=="$literal$", 1, null())))
description = True when a multivalue field contains a literal string (exact equality). Macro arguments arrive without quotes.

[adm_bad_counter(1)]
args = field
definition = (isnotnull($field$) AND (isnull(tonumber($field$)) OR tonumber($field$)<0 OR tonumber($field$)!=floor(tonumber($field$)) OR match(tostring(tonumber($field$)), "(?i)nan|inf")))
description = True for a present counter that is not a finite nonnegative integer. An absent counter is reported separately.

[adm_flow_future_tolerance]
definition = 900
description = Maximum seconds a normalized flow timestamp may be ahead of now before the record is excluded as invalid_time.

[adm_flow_quality]
definition = eval adm_quality_errors=mvappend( \
    if(NOT coalesce(cidrmatch("0.0.0.0/0", adm_src_ip) OR cidrmatch("::/0", adm_src_ip), false()), "invalid_source_ip", null()), \
    if(NOT coalesce(cidrmatch("0.0.0.0/0", adm_dest_ip) OR cidrmatch("::/0", adm_dest_ip), false()), "invalid_destination_ip", null()), \
    if(isnull(adm_observer) OR len(trim(adm_observer))==0 OR isnull(adm_scope_observer) OR len(trim(adm_scope_observer))==0, "missing_observer", null()), \
    if((adm_source=="netflow" OR adm_source=="ftd") AND isnotnull(adm_observer) AND NOT coalesce(cidrmatch("0.0.0.0/0", adm_observer) OR cidrmatch("::/0", adm_observer), false()), "invalid_observer_ip", null()), \
    if(isnull(adm_start) OR isnull(adm_end) OR adm_start<0 OR adm_end<adm_start OR adm_start>now()+`adm_flow_future_tolerance` OR adm_end>now()+`adm_flow_future_tolerance`, "invalid_time", null()), \
    if(isnull(adm_transport) OR len(trim(adm_transport))==0, "missing_transport", null()), \
    if((adm_transport=="tcp" OR adm_transport=="udp" OR adm_transport=="sctp") AND (isnull(adm_src_port) OR isnull(adm_dest_port) OR adm_src_port<0 OR adm_dest_port<0 OR adm_src_port>65535 OR adm_dest_port>65535 OR adm_src_port!=floor(adm_src_port) OR adm_dest_port!=floor(adm_dest_port)), "invalid_ports", null()), \
    if(adm_counter_invalid==1 OR `adm_bad_counter(adm_bytes_fwd)` OR `adm_bad_counter(adm_bytes_rev)` OR `adm_bad_counter(adm_packets)`, "invalid_counters", null()), if(adm_sampling_invalid==1, "invalid_sampling", null())), \
  adm_quality_warnings=mvappend(if(adm_counter_missing==1, "missing_counters", null()), if(adm_sampling_missing==1, "unknown_sampling", null()), if(adm_scope_unmapped==1, "unmapped_scope", null())) \
| eval adm_quality_status=case(isnotnull(adm_quality_errors), "excluded", isnotnull(adm_quality_warnings), "accepted_with_warning", true(), "accepted")
description = Shared validation used by rollup and quality diagnostics. Missing counters remain unmeasured; missing NetFlow sampling retains the existing 1:1 assumption but is explicitly reported. Invalid identity, ordering/time, ports, supplied counters or sampling exclude a record.

# ---- normalized flow records ----

[adm_flows_netflow]
definition = `adm_index_netflow` sourcetype="stream:netflow" \
| eval adm_source="netflow", adm_observer=exporter_ip, adm_observer_kind="exporter", adm_scope_kind="exporter", adm_scope_observer=exporter_ip, \
  adm_src_ip=`adm_ip(src_ip)`, adm_dest_ip=`adm_ip(dest_ip)`, \
  adm_src_port=tonumber(src_port), adm_dest_port=tonumber(dest_port), \
  adm_transport=`adm_transport(protoid)`, \
  adm_sampling_invalid=if(isnotnull(exporter_sampling_interval) AND (isnull(tonumber(exporter_sampling_interval)) OR tonumber(exporter_sampling_interval)<1 OR tonumber(exporter_sampling_interval)!=floor(tonumber(exporter_sampling_interval)) OR match(tostring(tonumber(exporter_sampling_interval)), "(?i)nan|inf")), 1, 0), \
  adm_sampling_missing=if(isnull(exporter_sampling_interval), 1, 0), adm_counter_invalid=if(`adm_bad_counter(bytes)` OR `adm_bad_counter(packets)`, 1, 0), adm_counter_missing=if(isnull(bytes) OR isnull(packets), 1, 0), \
  adm_sampling=if(tonumber(exporter_sampling_interval)>1, tonumber(exporter_sampling_interval), 1), \
  adm_bytes_fwd=tonumber(bytes)*adm_sampling, adm_bytes_rev=if(isnotnull(bytes), 0, null()), adm_packets=tonumber(packets)*adm_sampling, \
  adm_start=`adm_iso_time(timestamp)`, adm_end=`adm_iso_time(endtime)`, \
  adm_exporter=exporter_ip, adm_in_ifindex=input_snmpidx, adm_out_ifindex=output_snmpidx, \
  adm_ingress_vlan=if(match(tostring(ingress_vlan), "^\\d+$") AND tonumber(ingress_vlan)>=1 AND tonumber(ingress_vlan)<=4094, tostring(floor(tonumber(ingress_vlan))), null()), \
  adm_egress_vlan=if(match(tostring(egress_vlan), "^\\d+$") AND tonumber(egress_vlan)>=1 AND tonumber(egress_vlan)<=4094, tostring(floor(tonumber(egress_vlan))), null()), \
  adm_initiator="unknown"
description = Stream NetFlow records. Bytes and packets are scaled by exporter_sampling_interval; flow_dir is not used.

# Version 2 registers each exporter/domain/VPN tuple explicitly. Stream's vendor_product aliases
# are deliberately ignored because the TA labels every stream:netflow event Cisco SD-WAN.
[adm_flows_netflow_v2]
definition = `adm_index_netflow` sourcetype="stream:netflow" \
| spath input=_raw path=exporter_ip output=adm_raw_exporter_ip \
| spath input=_raw path=ingress_interface output=adm_raw_ingress_interface \
| spath input=_raw path=egress_interface output=adm_raw_egress_interface \
| spath input=_raw path=input_snmpidx output=adm_raw_input_snmpidx \
| spath input=_raw path=output_snmpidx output=adm_raw_output_snmpidx \
| spath input=_raw path=observation_domain_id output=adm_raw_observation_domain_id \
| spath input=_raw path=vpn_id output=adm_raw_vpn_id \
| spath input=_raw path=src_mac output=adm_raw_src_mac \
| spath input=_raw path=dest_mac output=adm_raw_dest_mac \
| spath input=_raw path=src_port output=adm_raw_src_port \
| spath input=_raw path=dest_port output=adm_raw_dest_port \
| spath input=_raw path=bytes output=adm_raw_bytes_field \
| spath input=_raw path=packets output=adm_raw_packets_field \
| spath input=_raw path=exporter_sampling_interval output=adm_raw_sampling_field \
| eval adm_source="netflow", adm_observer=adm_raw_exporter_ip, adm_observer_kind="exporter", adm_scope_kind="exporter", adm_scope_observer=adm_raw_exporter_ip, \
  adm_src_ip=`adm_ip(src_ip)`, adm_dest_ip=`adm_ip(dest_ip)`, adm_src_port=tonumber(src_port), adm_dest_port=tonumber(dest_port), adm_transport=`adm_transport(protoid)`, \
  adm_scope_source="stream_ipfix", adm_scope_domain_kind="exporter", adm_scope_authority=lower(trim(coalesce(adm_raw_exporter_ip, ""))), \
  adm_scope_observation_domain_present=if(isnull(adm_raw_observation_domain_id) OR len(trim(tostring(adm_raw_observation_domain_id)))==0, "0", "1"), \
  adm_scope_observation_domain_id=if(isnull(adm_raw_observation_domain_id), "", tostring(adm_raw_observation_domain_id)), \
  adm_scope_vpn_id=if(isnull(adm_raw_vpn_id), "", tostring(adm_raw_vpn_id)), adm_scope_routing_domain=if(isnull(adm_raw_vpn_id), "", tostring(adm_raw_vpn_id)), \
  adm_source_mac=if(match(lower(trim(coalesce(adm_raw_src_mac,""))), "^(?:[0-9a-f]{2}:){5}[0-9a-f]{2}$"), lower(trim(adm_raw_src_mac)), null()), \
  adm_destination_mac=if(match(lower(trim(coalesce(adm_raw_dest_mac,""))), "^(?:[0-9a-f]{2}:){5}[0-9a-f]{2}$"), lower(trim(adm_raw_dest_mac)), null()), \
  adm_raw_source_port=tonumber(adm_raw_src_port), adm_raw_destination_port=tonumber(adm_raw_dest_port), adm_raw_bytes=tonumber(adm_raw_bytes_field), adm_raw_packets=tonumber(adm_raw_packets_field), adm_raw_sampling=tonumber(adm_raw_sampling_field), \
  adm_sampling_invalid=if(isnotnull(adm_raw_sampling_field) AND (isnull(tonumber(adm_raw_sampling_field)) OR tonumber(adm_raw_sampling_field)<1 OR tonumber(adm_raw_sampling_field)!=floor(tonumber(adm_raw_sampling_field))), 1, 0), \
  adm_sampling_missing=if(isnull(adm_raw_sampling_field), 1, 0), adm_counter_invalid=if(`adm_bad_counter(adm_raw_bytes_field)` OR `adm_bad_counter(adm_raw_packets_field)`, 1, 0), \
  adm_counter_missing=if(isnull(adm_raw_bytes_field) OR isnull(adm_raw_packets_field), 1, 0), adm_sampling=if(tonumber(adm_raw_sampling_field)>1, tonumber(adm_raw_sampling_field), 1), \
  adm_bytes_fwd=tonumber(adm_raw_bytes_field)*adm_sampling, adm_bytes_rev=if(isnotnull(adm_raw_bytes_field), 0, null()), adm_packets=tonumber(adm_raw_packets_field)*adm_sampling, \
  adm_start=`adm_iso_time(timestamp)`, adm_end=`adm_iso_time(endtime)`, adm_exporter=exporter_ip, \
  adm_in_ifindex=adm_raw_input_snmpidx, adm_out_ifindex=adm_raw_output_snmpidx, adm_ingress_vlan=ingress_vlan, adm_egress_vlan=egress_vlan, adm_initiator="unknown", \
  adm_flow_direction=coalesce(flow_dir, biflow_direction), adm_flow_id=if(isnotnull(flow_id), tostring(flow_id), null()), adm_sequence=if(isnotnull(seqnumber), tostring(seqnumber), null()), \
  adm_traffic_observation=json_object("source", "stream_ipfix", "source_authority", adm_scope_authority, \
    "observation_domain_present", adm_scope_observation_domain_present, "observation_domain_id", adm_scope_observation_domain_id, \
    "routing_domain", adm_scope_routing_domain, "source_mac", adm_source_mac, "destination_mac", adm_destination_mac, "source_port", adm_raw_source_port, "destination_port", adm_raw_destination_port, \
    "raw_bytes", adm_raw_bytes, "raw_packets", adm_raw_packets, "raw_sampling", adm_raw_sampling, "exporter_ip", if(isnotnull(adm_raw_exporter_ip), tostring(adm_raw_exporter_ip), null()), "flow_id", adm_flow_id, "sequence", adm_sequence, \
    "first_seen", adm_start, "last_seen", adm_end, "received_time", _indextime, "direction", coalesce(flow_dir, biflow_direction), \
    "observation_point", coalesce(export_process_id, exporter_engine_id, ""), "interface_in", coalesce(adm_raw_ingress_interface, if(isnotnull(adm_raw_input_snmpidx), tostring(adm_raw_input_snmpidx), null())), \
    "interface_out", coalesce(adm_raw_egress_interface, if(isnotnull(adm_raw_output_snmpidx), tostring(adm_raw_output_snmpidx), null())), "raw_bytes_in", tonumber(bytes_in), "raw_bytes_out", tonumber(bytes_out), \
    "raw_packets_in", tonumber(packets_in), "raw_packets_out", tonumber(packets_out), \
    "vpn_id", adm_scope_vpn_id, "ingress_overlay_session_id", if(isnotnull(ingress_overlay_session_id), tostring(ingress_overlay_session_id), null()), \
    "egress_overlay_session_id", if(isnotnull(egress_overlay_session_id), tostring(egress_overlay_session_id), null()), "records", 1, "counter_semantics", "stream_profile_required", \
    "metrics_authoritative", "0", "record_fingerprint", sha256(json_array(exporter_ip, observation_domain_id, vpn_id, flow_id, seqnumber, timestamp, endtime, src_ip, dest_ip, src_port, dest_port, protoid, bytes, packets, input_snmpidx, output_snmpidx, ingress_interface, egress_interface, flow_dir, biflow_direction, bytes_in, bytes_out, packets_in, packets_out, ingress_overlay_session_id, egress_overlay_session_id))) \
| eval adm_traffic_fingerprint=sha256(json_array(exporter_ip, observation_domain_id, vpn_id, flow_id, seqnumber, timestamp, endtime, src_ip, dest_ip, src_port, dest_port, protoid, bytes, packets, input_snmpidx, output_snmpidx, ingress_interface, egress_interface, flow_dir, biflow_direction, bytes_in, bytes_out, packets_in, packets_out, ingress_overlay_session_id, egress_overlay_session_id))
description = Version-2 Stream IPFIX adapter. Raw identity, exporter/domain/VPN, tuple and counter fields are retained. No mapping or Cisco product alias is inferred here; only explicit source-scope profiles can authorize scope, profile semantics and metrics.

[adm_flows_nd]
definition = `adm_index_dcn` sourcetype="cisco:dc:nd:flows" \
| eval adm_source="nd", adm_observer=fabricName, adm_observer_kind="fabric", adm_scope_kind="fabric", adm_scope_observer=fabricName, \
  adm_src_ip=`adm_ip(srcIp)`, adm_dest_ip=`adm_ip(dstIp)`, \
  adm_src_port=tonumber(srcPort), adm_dest_port=tonumber(dstPort), \
  adm_transport=`adm_transport(protocolName)`, \
  adm_bytes_fwd=tonumber(mvindex('stats{}.ingressByteCount', 0)), adm_bytes_rev=if(isnotnull(mvindex('stats{}.ingressByteCount', 0)), 0, null()), \
  adm_counter_invalid=if(`adm_bad_counter(mvindex('stats{}.ingressByteCount', 0))` OR `adm_bad_counter(mvindex('stats{}.ingressPktCount', 0))`, 1, 0), \
  adm_counter_missing=if(isnull(mvindex('stats{}.ingressByteCount', 0)) OR isnull(mvindex('stats{}.ingressPktCount', 0)), 1, 0), \
  adm_packets=tonumber(mvindex('stats{}.ingressPktCount', 0)), \
  adm_start=`adm_iso_time(ts)`, adm_end=adm_start, \
  adm_in_if=mvindex('stats{}.nodeNames{}', 0).":".mvindex('stats{}.ingressVif{}', 0), \
  adm_out_if=mvindex('stats{}.nodeNames{}', -1).":".mvindex('stats{}.egressVif{}', 0), \
  adm_initiator="unknown"
description = Nexus Dashboard flow records. Uses the first stats entry's ingress counters; the TA's EVAL-bytes adds ingress and egress and double counts.

[adm_flows_ftd]
definition = `adm_index_ftd` sourcetype="cisco:sfw:estreamer" EventType="ConnectionEvent" \
| eval adm_source="ftd", adm_observer=DeviceIP, adm_observer_kind="firewall", adm_scope_kind="firewall", adm_scope_observer=DeviceIP, \
  adm_ftd_tuple_single=if(mvcount(EventType)==1 AND mvcount(InitiatorIP)==1 AND mvcount(InitiatorPort)==1 AND mvcount(ResponderIP)==1 AND mvcount(ResponderPort)==1 AND \
    mvcount(NAT_InitiatorIP)==1 AND mvcount(NAT_InitiatorPort)==1 AND mvcount(NAT_ResponderIP)==1 AND mvcount(NAT_ResponderPort)==1 AND \
    mvcount(Protocol)==1 AND mvcount(DeviceIP)==1 AND mvcount(FirstPacketSecond)==1, 1, 0), \
  adm_ftd_reported_initiator_ip=if(mvcount(InitiatorIP)==1, `adm_ip(mvindex(InitiatorIP,0))`, null()), \
  adm_ftd_reported_initiator_port=if(mvcount(InitiatorPort)==1, tonumber(mvindex(InitiatorPort,0)), null()), \
  adm_ftd_reported_responder_ip=if(mvcount(ResponderIP)==1, `adm_ip(mvindex(ResponderIP,0))`, null()), \
  adm_ftd_reported_responder_port=if(mvcount(ResponderPort)==1, tonumber(mvindex(ResponderPort,0)), null()), \
  adm_ftd_translated_initiator_ip=if(mvcount(NAT_InitiatorIP)==1, `adm_ip(mvindex(NAT_InitiatorIP,0))`, null()), \
  adm_ftd_translated_initiator_port=if(mvcount(NAT_InitiatorPort)==1, tonumber(mvindex(NAT_InitiatorPort,0)), null()), \
  adm_ftd_translated_responder_ip=if(mvcount(NAT_ResponderIP)==1, `adm_ip(mvindex(NAT_ResponderIP,0))`, null()), \
  adm_ftd_translated_responder_port=if(mvcount(NAT_ResponderPort)==1, tonumber(mvindex(NAT_ResponderPort,0)), null()), \
  adm_ftd_device_ip=if(mvcount(DeviceIP)==1, `adm_ip(mvindex(DeviceIP,0))`, null()), \
  adm_ftd_reported_original_initiator_ip=if(mvcount(OriginalInitiatorIP)==1, `adm_ip(mvindex(OriginalInitiatorIP,0))`, null()), \
  adm_ftd_event_time=if(mvcount(FirstPacketSecond)==1, tonumber(mvindex(FirstPacketSecond,0)), null()), \
  adm_src_ip=`adm_ip(InitiatorIP)`, adm_dest_ip=`adm_ip(ResponderIP)`, \
  adm_src_port=tonumber(InitiatorPort), adm_dest_port=tonumber(ResponderPort), \
  adm_transport=`adm_transport(Protocol)`, \
  adm_counter_invalid=if(`adm_bad_counter(InitiatorBytes)` OR `adm_bad_counter(ResponderBytes)` OR `adm_bad_counter(InitiatorPackets)` OR `adm_bad_counter(ResponderPackets)`, 1, 0), \
  adm_counter_missing=if(isnull(InitiatorBytes) OR isnull(ResponderBytes) OR isnull(InitiatorPackets) OR isnull(ResponderPackets), 1, 0), \
  adm_bytes_fwd=tonumber(InitiatorBytes), adm_bytes_rev=tonumber(ResponderBytes), \
  adm_packets=tonumber(InitiatorPackets)+tonumber(ResponderPackets), \
  adm_start=tonumber(FirstPacketSecond), adm_end=adm_start, \
  adm_in_if=IngressInterface, adm_out_if=EgressInterface, adm_initiator="src"
description = FTD eStreamer ConnectionEvents. The base connection fields remain the flow-accounting tuple; complete explicit NAT_* values are separately validated as same-event evidence after scope enrichment. This normalizer uses FirstPacketSecond for adm_start and sets adm_end equal to it; a distinct close time is not retained. Cisco documents FirstPacketSecond for ConnectionEvents, while LastPacketSecond is described for syslog and ConnectionDuration as syslog-only. Actual eStreamer end-time output is unqualified.

[adm_flows_isovalent]
definition = `adm_index_isovalent` sourcetype="cisco:isovalent:processConnect" \
| eval adm_source="isovalent", adm_observer=node_name, adm_observer_kind="host_sensor", adm_scope_kind="hec_source", adm_scope_observer=source, \
  adm_src_ip=`adm_ip('process_connect.source_ip')`, adm_dest_ip=`adm_ip('process_connect.destination_ip')`, \
  adm_src_port=tonumber('process_connect.source_port'), adm_dest_port=tonumber('process_connect.destination_port'), \
  adm_transport=`adm_transport('process_connect.protocol')`, \
  adm_start=`adm_iso_time(time)`, adm_end=adm_start, adm_initiator="src"
description = Isovalent (Tetragon) process_connect events: connection setup only, without byte or packet counts.

[adm_flows_hubble]
definition = `adm_index_hubble` `adm_hubble_sourcetypes` ("TO_ENDPOINT" OR "TO_NETWORK" OR "REQUEST") \
| eval adm_h_type='flow.Type', adm_h_point='flow.trace_observation_point', adm_h_reply=lower('flow.is_reply'), \
  adm_kind=case(adm_h_type=="L3_L4" AND adm_h_point=="TO_ENDPOINT" AND 'flow.verdict'=="FORWARDED" AND adm_h_reply!="true", "conv", \
    adm_h_type=="L3_L4" AND adm_h_point=="TO_NETWORK" AND isnotnull('flow.IP.source_xlated'), "xlate", \
    adm_h_type=="L7" AND lower('flow.l7.type')=="request", "l7") \
| where isnotnull(adm_kind) \
| eval adm_h_node=coalesce('k8s.node.name', replace(coalesce('flow.node_name', node_name), "^.*/", "")), \
  adm_h_cluster=coalesce('k8s.cluster.name', if(match(coalesce('flow.node_name', node_name), "/"), replace(coalesce('flow.node_name', node_name), "/.*$", ""), null())), \
  adm_source=case(adm_kind=="conv", "hubble", adm_kind=="xlate", "hubble_xlate", true(), "hubble_l7"), \
  adm_observer=adm_h_node, adm_observer_kind="host_sensor", adm_scope_kind="cluster", adm_scope_observer=adm_h_cluster, \
  adm_src_ip=`adm_ip('flow.IP.source')`, adm_dest_ip=`adm_ip('flow.IP.destination')`, \
  adm_src_port=tonumber(coalesce('flow.l4.TCP.source_port', 'flow.l4.UDP.source_port', 'flow.l4.SCTP.source_port')), \
  adm_dest_port=tonumber(coalesce('flow.l4.TCP.destination_port', 'flow.l4.UDP.destination_port', 'flow.l4.SCTP.destination_port')), \
  adm_transport=case(isnotnull('flow.l4.TCP.destination_port') OR isnotnull('flow.l4.TCP.source_port'), "tcp", \
    isnotnull('flow.l4.UDP.destination_port') OR isnotnull('flow.l4.UDP.source_port'), "udp", \
    isnotnull('flow.l4.SCTP.destination_port'), "sctp", isnotnull('flow.l4.ICMPv4.type'), "icmp", isnotnull('flow.l4.ICMPv6.type'), "ipv6-icmp"), \
  adm_start=`adm_iso_time('flow.time')`, adm_end=adm_start, \
  adm_initiator="src", \
  adm_xlate_ip=`adm_ip('flow.IP.source_xlated')`, \
  adm_h_hdr=mvzip('flow.l7.http.headers{}.key', 'flow.l7.http.headers{}.value', "="), \
  adm_xff_raw=mvjoin(mvmap(adm_h_hdr, if(match(adm_h_hdr, "(?i)^x-forwarded-for="), replace(adm_h_hdr, "(?i)^x-forwarded-for=", ""), null())), ","), \
  adm_xff_last=trim(mvindex(split(adm_xff_raw, ","), -1)), \
  adm_xff=if(adm_kind=="l7" AND `adm_is_ip(adm_xff_last)`, `adm_ip(adm_xff_last)`, null()), \
  adm_trace_id=if(match(lower('flow.trace_context.parent.trace_id'), "^[0-9a-f]{32}\z"), lower('flow.trace_context.parent.trace_id'), null()) \
| where adm_kind!="l7" OR isnotnull(adm_xff)
description = Hubble flow export records (Cilium flow.proto, open-source and Isovalent Enterprise exporter JSON lines). The base search keeps only events mentioning TO_ENDPOINT, TO_NETWORK or REQUEST. For L7 requests adm_xff is the rightmost X-Forwarded-For entry (the address Envoy appends for its immediate downstream peer; with xff_num_trusted_hops 0 earlier entries are client-supplied and untrusted), kept only when it is an IP literal; requests without one are dropped. adm_trace_id is kept only as 32 lower-case hex digits. conv: L3_L4 TO_ENDPOINT forwarded flows in the original direction (post-translation tuple at the backend, initiator = source). hubble_xlate: TO_NETWORK forwarding traces with IP.source_xlated (SNAT to the node). hubble_l7: L7 HTTP requests with X-Forwarded-For. Hubble flows carry no byte counts. Relies on Splunk's automatic JSON field extraction of the event (AUTO_KV_JSON, the default for this sourcetype).

[adm_flows_acllog]
definition = `adm_index_dcn` sourcetype="cisco:dc:aci:class" (component="acllogPermitL3Pkt" OR component="acllogDropL3Pkt") \
| eval adm_kind="conv", adm_source="aci_acllog", adm_observer=replace(dn, "^topology/(pod-\d+)/(node-\d+)/.*$", "\1/\2"), adm_observer_kind="acl_leaf", \
  adm_scope_kind="apic", adm_scope_observer=apic_host, \
  adm_src_ip=`adm_ip(srcIp)`, adm_dest_ip=`adm_ip(dstIp)`, adm_src_port=tonumber(srcPort), adm_dest_port=tonumber(dstPort), \
  adm_transport=`adm_transport(protocol)`, adm_start=`adm_iso_time(timeStamp)`, adm_end=adm_start, adm_initiator="unknown", \
  adm_acl=if(component=="acllogDropL3Pkt", "drop", "permit"), adm_acl_dn=apic_host."|".dn, adm_acl_age=_time-adm_start \
| where adm_acl_age>=-60 AND adm_acl_age<=`adm_poll_interval`+60
description = ACI contract ACL-log records (acllogPermitL3Pkt, acllogDropL3Pkt): one logged packet each, at the enforcing leaf. Only subjects with directives=log produce them; no byte counts. A record stays in the leaf buffer and is re-reported by later polls; only the report from the first poll after the record's timeStamp (poll time minus timeStamp at most adm_poll_interval plus 60 s) is counted.

[adm_flow_enrich]
definition = eval adm_kind=coalesce(adm_kind, "conv") \
| lookup local=true adm_interfaces device_ip AS adm_exporter ifindex AS adm_in_ifindex OUTPUT interface AS adm_in_name \
| lookup local=true adm_interfaces device_ip AS adm_exporter ifindex AS adm_out_ifindex OUTPUT interface AS adm_out_name \
| eval adm_in_if=if(adm_source=="netflow", coalesce(adm_in_name, "ifIndex ".adm_in_ifindex), adm_in_if), \
  adm_out_if=if(adm_source=="netflow", coalesce(adm_out_name, "ifIndex ".adm_out_ifindex), adm_out_if) \
| eval adm_scope_kind=lower(adm_scope_kind), adm_scope_observer=lower(adm_scope_observer) \
| lookup adm_observer_scope observer_kind AS adm_scope_kind observer AS adm_scope_observer OUTPUT scope AS adm_scope cluster AS adm_cluster \
| eval adm_scope_unmapped=if(isnull(adm_scope), 1, 0), adm_scope=coalesce(adm_scope, `adm_unmapped_scope(adm_scope_kind, adm_scope_observer)`), \
  adm_event_id=case(isnotnull(adm_acl_dn), sha256(json_object("acl", adm_acl_dn, "time", adm_start)), \
    isnotnull(_bkt) AND isnotnull(_cd), sha256(json_object("index", index, "bucket", _bkt, "event", _cd))) \
| `adm_flow_quality` \
| eval adm_ftd_nat_ports_valid=if(match(tostring(InitiatorPort), "^(?:0|[1-9][0-9]{0,4})$") AND adm_ftd_reported_initiator_port>=1 AND adm_ftd_reported_initiator_port<=65535 AND adm_ftd_reported_initiator_port==floor(adm_ftd_reported_initiator_port) AND \
    match(tostring(ResponderPort), "^(?:0|[1-9][0-9]{0,4})$") AND adm_ftd_reported_responder_port>=1 AND adm_ftd_reported_responder_port<=65535 AND adm_ftd_reported_responder_port==floor(adm_ftd_reported_responder_port) AND \
    match(tostring(NAT_InitiatorPort), "^(?:0|[1-9][0-9]{0,4})$") AND adm_ftd_translated_initiator_port>=1 AND adm_ftd_translated_initiator_port<=65535 AND adm_ftd_translated_initiator_port==floor(adm_ftd_translated_initiator_port) AND \
    match(tostring(NAT_ResponderPort), "^(?:0|[1-9][0-9]{0,4})$") AND adm_ftd_translated_responder_port>=1 AND adm_ftd_translated_responder_port<=65535 AND adm_ftd_translated_responder_port==floor(adm_ftd_translated_responder_port), 1, 0), \
  adm_ftd_nat_ips_valid=if(`adm_nat_ip_usable(adm_ftd_reported_initiator_ip)` AND `adm_nat_ip_usable(adm_ftd_reported_responder_ip)` AND \
    `adm_nat_ip_usable(adm_ftd_translated_initiator_ip)` AND `adm_nat_ip_usable(adm_ftd_translated_responder_ip)` AND `adm_nat_ip_usable(adm_ftd_device_ip)`, 1, 0), \
  adm_ftd_nat_original_ip_valid=if(isnotnull(adm_ftd_reported_original_initiator_ip) AND `adm_nat_ip_usable(adm_ftd_reported_original_initiator_ip)`, 1, 0) \
| eval adm_ftd_nat_changed=if(adm_ftd_nat_ips_valid==1, \
    if(NOT `adm_nat_ip_equal(adm_ftd_reported_initiator_ip, adm_ftd_translated_initiator_ip)` OR adm_ftd_reported_initiator_port!=adm_ftd_translated_initiator_port OR \
      NOT `adm_nat_ip_equal(adm_ftd_reported_responder_ip, adm_ftd_translated_responder_ip)` OR adm_ftd_reported_responder_port!=adm_ftd_translated_responder_port, 1, 0), 0) \
| eval \
  adm_nat_observation=if(adm_source=="ftd" AND adm_quality_status!="excluded" AND adm_ftd_tuple_single==1 AND adm_ftd_nat_ports_valid==1 AND adm_ftd_nat_ips_valid==1 AND adm_ftd_nat_changed==1 AND \
    adm_transport IN ("tcp", "udp", "sctp") AND mvcount(adm_scope)==1 AND isnotnull(adm_scope) AND len(trim(adm_scope))>0 AND len(adm_scope)<=2048 AND NOT like(lower(trim(adm_scope)), "unmapped:%") AND adm_scope_unmapped==0 AND isnotnull(adm_event_id) AND \
    match(adm_event_id, "^[0-9a-f]{64}$") AND match(tostring(FirstPacketSecond), "^(?:0|[1-9][0-9]{0,12})$") AND isnotnull(adm_ftd_event_time) AND adm_ftd_event_time>=0 AND adm_ftd_event_time<=8640000000000 AND adm_ftd_event_time==floor(adm_ftd_event_time) AND \
    isnotnull(_indextime) AND tonumber(_indextime)>=0 AND tonumber(_indextime)<=8640000000000 AND tonumber(_indextime)==floor(tonumber(_indextime)), \
    json_object("source_authority", "cisco:sfw:estreamer", "event_type", "ConnectionEvent", "scope", adm_scope, "scope_mapping_verified", true(), \
      "device_ip", adm_ftd_device_ip, "event_fingerprint", adm_event_id, \
      "event_time", adm_ftd_event_time, "received_time", tonumber(_indextime), "protocol", adm_transport, "direction", "initiator_to_responder", \
      "reported_initiator_ip", adm_ftd_reported_initiator_ip, "reported_initiator_port", adm_ftd_reported_initiator_port, \
      "reported_responder_ip", adm_ftd_reported_responder_ip, "reported_responder_port", adm_ftd_reported_responder_port, \
      "translated_initiator_ip", adm_ftd_translated_initiator_ip, "translated_initiator_port", adm_ftd_translated_initiator_port, \
      "translated_responder_ip", adm_ftd_translated_responder_ip, "translated_responder_port", adm_ftd_translated_responder_port, \
      "reported_original_initiator_ip", if(adm_ftd_nat_original_ip_valid==1, adm_ftd_reported_original_initiator_ip, null())), null()) \
| fields _time _indextime adm_*
description = Shared observer/interface enrichment, event identity and validation for normalized flow candidates. FTD NAT evidence is attached only as complete, changed, same-event tuples with mapped scope and event provenance; it never creates a normalized flow record.

[adm_flows]
definition = multisearch [search `adm_flows_netflow`] [search `adm_flows_nd`] [search `adm_flows_ftd`] [search `adm_flows_isovalent`] [search `adm_flows_hubble`] [search `adm_flows_acllog`] | `adm_flow_enrich`
description = All normalized flow candidates, including excluded rows annotated by adm_flow_quality. Conversation rollup only consumes accepted candidates.

[adm_flow_enrich_v2]
definition = eval adm_kind=coalesce(adm_kind, "conv") \
| eval adm_in_if=if(adm_source=="netflow", coalesce(adm_raw_ingress_interface, if(isnotnull(adm_in_ifindex), "ifIndex ".adm_in_ifindex, null())), adm_in_if), \
  adm_out_if=if(adm_source=="netflow", coalesce(adm_raw_egress_interface, if(isnotnull(adm_out_ifindex), "ifIndex ".adm_out_ifindex, null())), adm_out_if), \
  adm_scope_kind=lower(adm_scope_kind), adm_scope_observer=lower(adm_scope_observer) \
| lookup local=true adm_observer_scope observer_kind AS adm_scope_kind observer AS adm_scope_observer OUTPUT scope AS adm_legacy_scope cluster AS adm_legacy_cluster \
| eval adm_scope_mapping_key=sha256(json_array(tostring(coalesce(adm_scope_source,"")), tostring(coalesce(adm_scope_authority,"")), tostring(coalesce(adm_scope_domain_kind,"")), tostring(coalesce(adm_scope_observation_domain_present,"")), tostring(coalesce(adm_scope_observation_domain_id,"")), tostring(coalesce(adm_scope_vpn_id,"")), tostring(coalesce(adm_scope_routing_domain,"")))) \
| lookup local=true adm_network_source_scope mapping_key AS adm_scope_mapping_key OUTPUT _key AS adm_registered_keys scope AS adm_registered_scopes cluster AS adm_registered_clusters profile AS adm_registered_profiles mapping_status AS adm_registered_status duplicate_count AS adm_registered_duplicate_counts \
| eval adm_profile_matches=mvcount(adm_registered_profiles), adm_scope_matches=mvcount(adm_registered_scopes), adm_cluster_matches=mvcount(adm_registered_clusters), adm_mapping_rows=mvcount(adm_registered_keys), adm_duplicate_rows=if(mvcount(adm_registered_duplicate_counts)!=1 OR mvfind(adm_registered_duplicate_counts, "^1$")<0, 1, 0), \
  adm_profile=mvindex(adm_registered_profiles,0), \
  adm_profile_supported=case(adm_profile=="standard_netflow" AND adm_scope_domain_kind=="exporter" AND adm_scope_observation_domain_present=="0" AND adm_scope_vpn_id=="" AND adm_scope_routing_domain=="", 1, \
    adm_profile=="catalyst_campus_fnf" AND adm_scope_domain_kind=="exporter" AND adm_scope_observation_domain_present=="1" AND adm_scope_vpn_id=="", 1, \
    adm_profile=="catalyst_sdwan_ipfix" AND adm_scope_domain_kind=="exporter" AND adm_scope_observation_domain_present=="1" AND len(adm_scope_vpn_id)>0 AND adm_scope_routing_domain==adm_scope_vpn_id, 1, \
    adm_profile=="meraki_ms390_ipfix" AND adm_scope_domain_kind=="exporter" AND adm_scope_observation_domain_present=="1" AND adm_scope_vpn_id=="" AND adm_scope_routing_domain=="", 1, true(), 0), \
  adm_profile_status=case(adm_duplicate_rows==1 OR adm_mapping_rows>1 OR adm_profile_matches>1 OR adm_scope_matches>1 OR adm_cluster_matches>1, "ambiguous", adm_mapping_rows==1 AND adm_profile_matches==1 AND adm_scope_matches==1 AND adm_cluster_matches==1 AND mvcount(adm_registered_status)==1 AND mvindex(adm_registered_status,0)=="mapped" AND adm_profile_supported==1, "mapped", adm_profile_matches==1 AND adm_scope_matches==1, "unsupported", true(), "unmapped"), \
  adm_scope=if(adm_source=="netflow", if(adm_profile_status=="mapped", mvindex(adm_registered_scopes,0), null()), coalesce(adm_legacy_scope, `adm_unmapped_scope(adm_scope_kind, adm_scope_observer)`)), \
  adm_cluster=if(adm_source=="netflow", if(adm_profile_status=="mapped", mvindex(adm_registered_clusters,0), null()), adm_legacy_cluster), \
  adm_scope_unmapped=if(adm_source=="netflow", if(adm_profile_status=="mapped", 0, 1), if(isnull(adm_legacy_scope), 1, 0)), \
  adm_event_id=case(isnotnull(adm_acl_dn), sha256(json_object("acl", adm_acl_dn, "time", adm_start)), isnotnull(_bkt) AND isnotnull(_cd), sha256(json_object("index", index, "bucket", _bkt, "event", _cd))) \
| eval adm_event_id=if(adm_source=="netflow" AND isnotnull(_bkt) AND isnotnull(_cd), sha256(json_array(index, _bkt, _cd)), if(adm_source=="netflow", null(), adm_event_id)) \
| `adm_flow_quality` \
| fields _time _indextime adm_*
description = Version-2 enrichment. New Stream/IPFIX records require one exact seven-dimension source-scope profile; absent, duplicate or unmapped profiles are marked and never assigned a default scope. Interfaces retain raw exported identifiers or ifIndex labels; the legacy interface-name lookup lacks domain authority and is not used. Other legacy flow sources retain their existing normalization and are rolled into the separate v2 summary index.

[adm_flows_v2]
definition = multisearch [search `adm_flows_netflow_v2`] [search `adm_flows_nd`] [search `adm_flows_ftd`] [search `adm_flows_isovalent`] [search `adm_flows_hubble`] [search `adm_flows_acllog`] | `adm_flow_enrich_v2`
description = Version-2 normalized flows. The Stream branch occurs exactly once and requires explicit domain profiles; no second append of vendor aliases is permitted.

# ---- conversation rollup ----

[adm_vlan_merge(1)]
args = items
validation = match(items, "^[a-zA-Z_][a-zA-Z0-9_]*$")
errormsg = adm_vlan_merge expects a field name.
definition = streamstats count AS adm_vm_row \
| appendpipe [| where isnotnull($items$) \
    | eval adm_vm_item=$items$ | mvexpand adm_vm_item \
    | eval adm_vm_context=json_delete(adm_vm_item, "first_seen", "last_seen"), adm_vm_first=tonumber(json_extract(adm_vm_item, "first_seen")), adm_vm_last=tonumber(json_extract(adm_vm_item, "last_seen")) \
    | stats min(adm_vm_first) AS adm_vm_first max(adm_vm_last) AS adm_vm_last by adm_vm_row adm_vm_context \
    | eval adm_vm_value=json_set(adm_vm_context, "first_seen", adm_vm_first, "last_seen", adm_vm_last) \
    | stats values(adm_vm_value) AS adm_vm_values by adm_vm_row \
    | eval adm_vm_added=1] \
| eventstats values(adm_vm_values) AS adm_vm_all by adm_vm_row \
| where isnull(adm_vm_added) \
| eval vlan_observations_truncated=if(vlan_observations_truncated=="1" OR mvcount(adm_vm_all)>32, "1", "0"), \
  vlan_observations=if(mvcount(adm_vm_all)>0, "[".mvjoin(mvindex(mvsort(adm_vm_all), 0, 31), ",")."]", null()) \
| fields - adm_vm_*
description = Deduplicates VLAN observation contexts per input row, merges their time bounds, and caps the returned JSON array at 32. Auxiliary rows never contribute to conversation byte or record counts.

[adm_conversation_rollup]
definition = `adm_flows` \
| where adm_quality_status!="excluded" \
| dedup adm_acl_dn keepempty=true \
| eval adm_tunnel=if((adm_transport=="udp" AND (adm_dest_port==8472 OR adm_dest_port==6081)) OR adm_transport=="ipip", 1, 0), \
  adm_ev=if(adm_kind=="conv", 0, 1), \
  adm_rule=case(adm_tunnel==1, "unknown", adm_initiator=="src", "initiator", \
    adm_dest_port<1024 AND adm_src_port>=1024, "port_rule_dest", adm_src_port<1024 AND adm_dest_port>=1024, "port_rule_src", \
    adm_src_port>=32768 AND adm_dest_port<32768, "port_rule_dest", adm_dest_port>=32768 AND adm_src_port<32768, "port_rule_src", \
    true(), "unknown"), \
  adm_bucket=floor(adm_end/300)*300 \
| fillnull value="-" adm_src_port adm_dest_port adm_xff \
| fillnull value="unknown" adm_transport \
| eval adm_ep_src=adm_src_ip."|".adm_src_port, adm_ep_dst=adm_dest_ip."|".adm_dest_port, \
  adm_pair=if(adm_src_ip<=adm_dest_ip, adm_src_ip."|".adm_dest_ip, adm_dest_ip."|".adm_src_ip), \
  adm_known=case(adm_tunnel==1 OR adm_ev==1, null(), adm_rule=="initiator", "initiator@".adm_ep_dst, adm_rule=="port_rule_dest", "port_rule@".adm_ep_dst, adm_rule=="port_rule_src", "port_rule@".adm_ep_src) \
| eventstats values(adm_known) AS adm_known_servers by adm_scope adm_pair adm_transport adm_bucket \
| eval adm_match_src=mvmap(adm_known_servers, if(mvindex(split(adm_known_servers, "@"), 1)==adm_ep_src, mvindex(split(adm_known_servers, "@"), 0), null())), \
  adm_match_dst=mvmap(adm_known_servers, if(mvindex(split(adm_known_servers, "@"), 1)==adm_ep_dst, mvindex(split(adm_known_servers, "@"), 0), null())), \
  adm_rule=case(adm_rule!="unknown" OR adm_tunnel==1 OR adm_ev==1, adm_rule, isnotnull(adm_match_dst) AND isnull(adm_match_src), "reconciled_dest", \
    isnotnull(adm_match_src) AND isnull(adm_match_dst), "reconciled_src", true(), "unknown"), \
  adm_basis=case(adm_rule=="initiator", "initiator", adm_rule=="port_rule_dest" OR adm_rule=="port_rule_src", "port_rule", \
    adm_rule=="reconciled_dest", if(`adm_mv_has_str(adm_match_dst, initiator)`, "initiator", "port_rule"), \
    adm_rule=="reconciled_src", if(`adm_mv_has_str(adm_match_src, initiator)`, "initiator", "port_rule"), true(), "unknown"), \
  adm_src_is_client=case(adm_rule=="initiator" OR adm_rule=="port_rule_dest" OR adm_rule=="reconciled_dest", 1, \
    adm_rule=="port_rule_src" OR adm_rule=="reconciled_src", 0, \
    adm_tunnel==1, if(adm_src_ip<=adm_dest_ip, 1, 0), \
    true(), if(adm_src_ip<adm_dest_ip OR (adm_src_ip==adm_dest_ip AND adm_src_port<=adm_dest_port), 1, 0)), \
  client_ip=if(adm_src_is_client==1, adm_src_ip, adm_dest_ip), server_ip=if(adm_src_is_client==1, adm_dest_ip, adm_src_ip), \
  client_port=if(adm_src_is_client==1, adm_src_port, adm_dest_port), \
  server_port=if(adm_tunnel==1, adm_dest_port, if(adm_src_is_client==1, adm_dest_port, adm_src_port)), \
  bytes_c2s=if(adm_src_is_client==1, adm_bytes_fwd, adm_bytes_rev), bytes_s2c=if(adm_src_is_client==1, adm_bytes_rev, adm_bytes_fwd), \
  adm_observation=adm_source.":".adm_observer.if(isnotnull(adm_in_if) OR isnotnull(adm_out_if), ":".coalesce(adm_in_if, "?").">".coalesce(adm_out_if, "?"), ""), \
  adm_vlan_in=if(adm_source=="netflow" AND isnotnull(adm_ingress_vlan) AND isnotnull(adm_exporter), json_object("vlan", tonumber(adm_ingress_vlan), "position", "ingress", "exporter", adm_exporter, "src_ip", adm_src_ip, "dest_ip", adm_dest_ip, "first_seen", adm_start, "last_seen", adm_end), null()), \
  adm_vlan_out=if(adm_source=="netflow" AND isnotnull(adm_egress_vlan) AND isnotnull(adm_exporter), json_object("vlan", tonumber(adm_egress_vlan), "position", "egress", "exporter", adm_exporter, "src_ip", adm_src_ip, "dest_ip", adm_dest_ip, "first_seen", adm_start, "last_seen", adm_end), null()), \
  adm_acl_permit=if(adm_acl=="permit", 1, null()), adm_acl_drop=if(adm_acl=="drop", 1, null()) \
| eval adm_vlan_in=if(isnotnull(adm_vlan_in) AND match(tostring(adm_in_ifindex), "^[0-9]+$"), json_set(adm_vlan_in, "interface_index", tostring(adm_in_ifindex)), adm_vlan_in), \
  adm_vlan_out=if(isnotnull(adm_vlan_out) AND match(tostring(adm_out_ifindex), "^[0-9]+$"), json_set(adm_vlan_out, "interface_index", tostring(adm_out_ifindex)), adm_vlan_out) \
| eval adm_vlan_in=if(isnotnull(adm_vlan_in) AND len(adm_in_name)>0, json_set(adm_vlan_in, "interface", adm_in_name), adm_vlan_in), \
  adm_vlan_out=if(isnotnull(adm_vlan_out) AND len(adm_out_name)>0, json_set(adm_vlan_out, "interface", adm_out_name), adm_vlan_out), \
  adm_vlan_observation=mvappend(adm_vlan_in, adm_vlan_out) \
| stats sum(bytes_c2s) AS bytes_c2s sum(bytes_s2c) AS bytes_s2c sum(adm_packets) AS packets count AS records \
    dc(client_port) AS client_ports values(client_port) AS adm_cports min(adm_start) AS first_seen max(adm_end) AS last_seen \
    values(adm_event_id) AS adm_event_ids dc(adm_event_id) AS adm_event_count \
    values(adm_observation) AS observations values(adm_vlan_observation) AS adm_vlan_observations values(adm_nat_observation) AS adm_nat_observations values(adm_basis) AS bases sum(adm_acl_permit) AS acl_permits sum(adm_acl_drop) AS acl_drops \
    values(adm_xlate_ip) AS xlate_ip values(adm_trace_id) AS trace_ids values(eval(client_port."@".adm_start."@".adm_end)) AS adm_conns \
    max(eval(if(adm_sampling>1, 1, 0))) AS sampled max(adm_scope_unmapped) AS scope_unmapped \
    by adm_scope client_ip server_ip server_port adm_transport adm_bucket adm_source adm_observer adm_xff \
| eval scope_mapping_verified=if(scope_unmapped==0, 1, 0), \
  rollup_id=if(adm_event_count==records AND mvcount(adm_event_ids)==records, sha256("v1|".mvjoin(mvsort(adm_event_ids), "|")), null()), \
  replay_protected=if(isnotnull(rollup_id), 1, 0), \
  direction_basis=case(`adm_mv_has_str(bases, initiator)`, "initiator", `adm_mv_has_str(bases, port_rule)`, "port_rule", true(), "unknown") \
| lookup adm_ip_identity ip AS client_ip scope AS adm_scope OUTPUT entity_kind AS adm_client_kinds \
| lookup adm_ip_identity ip AS server_ip scope AS adm_scope OUTPUT entity_kind AS adm_server_kinds \
| eval adm_nodes=if(`adm_mv_has_str(adm_client_kinds, k8s_node)` AND `adm_mv_has_str(adm_server_kinds, k8s_node)`, 1, 0), \
  encapsulation=case(adm_nodes==1 AND adm_transport=="udp" AND server_port==8472, "vxlan", adm_nodes==1 AND adm_transport=="udp" AND server_port==6081, "geneve", \
    adm_nodes==1 AND adm_transport=="ipip", "ipip") \
| rename adm_scope AS scope adm_transport AS transport adm_source AS flow_source \
| eval _time=adm_bucket, adm_record=case(flow_source=="hubble_xlate", "hubble_xlate", flow_source=="hubble_l7", "hubble_l7", true(), "conversation"), \
  observer=flow_source.":".adm_observer, observations=mvjoin(observations, "|"), \
  client_port_list=mvjoin(mvindex(adm_cports, 0, `adm_conn_cap`-1), "|"), conns=mvjoin(mvindex(adm_conns, 0, `adm_conn_cap`-1), "|"), \
  conns_capped=if(mvcount(adm_conns)>`adm_conn_cap`, 1, null()), sampled=if(sampled==1, 1, null()), xlate_ip=mvindex(xlate_ip, 0), \
  xff=if(adm_xff=="-", null(), adm_xff), trace_ids=mvjoin(mvindex(trace_ids, 0, 19), "|"), \
  nat_observations_truncated=if(mvcount(adm_nat_observations)>32, 1, null()), \
  nat_observations=if(mvcount(adm_nat_observations)>0, "[".mvjoin(mvindex(mvsort(adm_nat_observations), 0, 31), ",")."]", null()) \
| `adm_vlan_merge(adm_vlan_observations)` \
| fields _time rollup_id replay_protected adm_record scope scope_mapping_verified client_ip server_ip server_port transport flow_source observer observations bytes_c2s bytes_s2c packets records client_ports client_port_list conns conns_capped sampled first_seen last_seen direction_basis encapsulation acl_permits acl_drops xlate_ip xff trace_ids vlan_observations vlan_observations_truncated nat_observations nat_observations_truncated
description = Generating (call as | `adm_conversation_rollup`). Rolls normalized flow records into one row per conversation, 5-minute bucket (by adm_end) and observer. Records without a determined client inherit the orientation of another record of the same address pair, transport and bucket. Complete FTD NAT_* tuples are retained as capped same-event evidence and never add records, bytes, packets or connections. Hubble SNAT traces and L7 requests become evidence rows (adm_record hubble_xlate / hubble_l7); ACI ACL-log records are counted per observing leaf (acl_permits / acl_drops) and deduplicated by object DN within a run. conns keeps up to adm_conn_cap client_port@start@end triples per row (conns_capped=1 when there were more) for connection-level hand-off matching and connection counts. Hubble L7 rows are grouped per X-Forwarded-For client (xff). sampled=1 marks rows with NetFlow records sampled at more than 1:1.

# Replay protection applies to an identical closed input slice and unchanged normalization.
# Overlapping/differently bounded slices and reindexed copies are not interchangeable replays.
[adm_conversation_rollup_v2]
definition = `adm_flows_v2` | where adm_source!="netflow" \
| where adm_quality_status!="excluded" \
| dedup adm_acl_dn keepempty=true \
| eval adm_tunnel=if((adm_transport=="udp" AND (adm_dest_port==8472 OR adm_dest_port==6081)) OR adm_transport=="ipip", 1, 0), \
  adm_ev=if(adm_kind=="conv", 0, 1), \
  adm_rule=case(adm_tunnel==1, "unknown", adm_initiator=="src", "initiator", \
    adm_dest_port<1024 AND adm_src_port>=1024, "port_rule_dest", adm_src_port<1024 AND adm_dest_port>=1024, "port_rule_src", \
    adm_src_port>=32768 AND adm_dest_port<32768, "port_rule_dest", adm_dest_port>=32768 AND adm_src_port<32768, "port_rule_src", \
    true(), "unknown"), \
  adm_bucket=floor(adm_end/300)*300 \
| fillnull value="-" adm_src_port adm_dest_port adm_xff \
| fillnull value="unknown" adm_transport \
| eval adm_ep_src=adm_src_ip."|".adm_src_port, adm_ep_dst=adm_dest_ip."|".adm_dest_port, \
  adm_pair=if(adm_src_ip<=adm_dest_ip, adm_src_ip."|".adm_dest_ip, adm_dest_ip."|".adm_src_ip), \
  adm_known=case(adm_tunnel==1 OR adm_ev==1, null(), adm_rule=="initiator", "initiator@".adm_ep_dst, adm_rule=="port_rule_dest", "port_rule@".adm_ep_dst, adm_rule=="port_rule_src", "port_rule@".adm_ep_src) \
| eventstats values(adm_known) AS adm_known_servers by adm_scope adm_pair adm_transport adm_bucket \
| eval adm_match_src=mvmap(adm_known_servers, if(mvindex(split(adm_known_servers, "@"), 1)==adm_ep_src, mvindex(split(adm_known_servers, "@"), 0), null())), \
  adm_match_dst=mvmap(adm_known_servers, if(mvindex(split(adm_known_servers, "@"), 1)==adm_ep_dst, mvindex(split(adm_known_servers, "@"), 0), null())), \
  adm_rule=case(adm_rule!="unknown" OR adm_tunnel==1 OR adm_ev==1, adm_rule, isnotnull(adm_match_dst) AND isnull(adm_match_src), "reconciled_dest", \
    isnotnull(adm_match_src) AND isnull(adm_match_dst), "reconciled_src", true(), "unknown"), \
  adm_basis=case(adm_rule=="initiator", "initiator", adm_rule=="port_rule_dest" OR adm_rule=="port_rule_src", "port_rule", \
    adm_rule=="reconciled_dest", if(`adm_mv_has_str(adm_match_dst, initiator)`, "initiator", "port_rule"), \
    adm_rule=="reconciled_src", if(`adm_mv_has_str(adm_match_src, initiator)`, "initiator", "port_rule"), true(), "unknown"), \
  adm_src_is_client=case(adm_rule=="initiator" OR adm_rule=="port_rule_dest" OR adm_rule=="reconciled_dest", 1, \
    adm_rule=="port_rule_src" OR adm_rule=="reconciled_src", 0, \
    adm_tunnel==1, if(adm_src_ip<=adm_dest_ip, 1, 0), \
    true(), if(adm_src_ip<adm_dest_ip OR (adm_src_ip==adm_dest_ip AND adm_src_port<=adm_dest_port), 1, 0)), \
  client_ip=if(adm_src_is_client==1, adm_src_ip, adm_dest_ip), server_ip=if(adm_src_is_client==1, adm_dest_ip, adm_src_ip), \
  client_port=if(adm_src_is_client==1, adm_src_port, adm_dest_port), \
  server_port=if(adm_tunnel==1, adm_dest_port, if(adm_src_is_client==1, adm_dest_port, adm_src_port)), \
  bytes_c2s=if(adm_src_is_client==1, adm_bytes_fwd, adm_bytes_rev), bytes_s2c=if(adm_src_is_client==1, adm_bytes_rev, adm_bytes_fwd), \
  adm_observation=adm_source.":".adm_observer.if(isnotnull(adm_in_if) OR isnotnull(adm_out_if), ":".coalesce(adm_in_if, "?").">".coalesce(adm_out_if, "?"), ""), \
  adm_vlan_in=if(adm_source=="netflow" AND isnotnull(adm_ingress_vlan) AND isnotnull(adm_exporter), json_object("vlan", tonumber(adm_ingress_vlan), "position", "ingress", "exporter", adm_exporter, "src_ip", adm_src_ip, "dest_ip", adm_dest_ip, "first_seen", adm_start, "last_seen", adm_end), null()), \
  adm_vlan_out=if(adm_source=="netflow" AND isnotnull(adm_egress_vlan) AND isnotnull(adm_exporter), json_object("vlan", tonumber(adm_egress_vlan), "position", "egress", "exporter", adm_exporter, "src_ip", adm_src_ip, "dest_ip", adm_dest_ip, "first_seen", adm_start, "last_seen", adm_end), null()), \
  adm_acl_permit=if(adm_acl=="permit", 1, null()), adm_acl_drop=if(adm_acl=="drop", 1, null()) \
| eval adm_vlan_in=if(isnotnull(adm_vlan_in) AND match(tostring(adm_in_ifindex), "^[0-9]+$"), json_set(adm_vlan_in, "interface_index", tostring(adm_in_ifindex)), adm_vlan_in), \
  adm_vlan_out=if(isnotnull(adm_vlan_out) AND match(tostring(adm_out_ifindex), "^[0-9]+$"), json_set(adm_vlan_out, "interface_index", tostring(adm_out_ifindex)), adm_vlan_out) \
| eval adm_vlan_in=if(isnotnull(adm_vlan_in) AND len(adm_in_name)>0, json_set(adm_vlan_in, "interface", adm_in_name), adm_vlan_in), \
  adm_vlan_out=if(isnotnull(adm_vlan_out) AND len(adm_out_name)>0, json_set(adm_vlan_out, "interface", adm_out_name), adm_vlan_out), \
  adm_vlan_observation=mvappend(adm_vlan_in, adm_vlan_out) \
| stats sum(bytes_c2s) AS bytes_c2s sum(bytes_s2c) AS bytes_s2c sum(adm_packets) AS packets count AS records \
    dc(client_port) AS client_ports values(client_port) AS adm_cports min(adm_start) AS first_seen max(adm_end) AS last_seen \
    values(adm_event_id) AS adm_event_ids dc(adm_event_id) AS adm_event_count \
    values(adm_observation) AS observations values(adm_vlan_observation) AS adm_vlan_observations values(adm_basis) AS bases sum(adm_acl_permit) AS acl_permits sum(adm_acl_drop) AS acl_drops \
    values(adm_xlate_ip) AS xlate_ip values(adm_trace_id) AS trace_ids values(eval(client_port."@".adm_start."@".adm_end)) AS adm_conns \
    max(eval(if(adm_sampling>1, 1, 0))) AS sampled max(adm_scope_unmapped) AS scope_unmapped \
    by adm_scope client_ip server_ip server_port adm_transport adm_bucket adm_source adm_observer adm_xff \
| eval scope_mapping_verified=if(scope_unmapped==0, 1, 0), \
  rollup_id=if(adm_event_count==records AND mvcount(adm_event_ids)==records, sha256("v2|".mvjoin(mvsort(adm_event_ids), "|")), null()), \
  replay_protected=if(isnotnull(rollup_id), 1, 0), \
  direction_basis=case(`adm_mv_has_str(bases, initiator)`, "initiator", `adm_mv_has_str(bases, port_rule)`, "port_rule", true(), "unknown") \
| lookup adm_ip_identity ip AS client_ip scope AS adm_scope OUTPUT entity_kind AS adm_client_kinds \
| lookup adm_ip_identity ip AS server_ip scope AS adm_scope OUTPUT entity_kind AS adm_server_kinds \
| eval adm_nodes=if(`adm_mv_has_str(adm_client_kinds, k8s_node)` AND `adm_mv_has_str(adm_server_kinds, k8s_node)`, 1, 0), \
  encapsulation=case(adm_nodes==1 AND adm_transport=="udp" AND server_port==8472, "vxlan", adm_nodes==1 AND adm_transport=="udp" AND server_port==6081, "geneve", \
    adm_nodes==1 AND adm_transport=="ipip", "ipip") \
| rename adm_scope AS scope adm_transport AS transport adm_source AS flow_source \
| eval _time=adm_bucket, adm_record=case(flow_source=="hubble_xlate", "hubble_xlate", flow_source=="hubble_l7", "hubble_l7", true(), "conversation"), \
  observer=flow_source.":".adm_observer, observations=mvjoin(observations, "|"), \
  client_port_list=mvjoin(mvindex(adm_cports, 0, `adm_conn_cap`-1), "|"), conns=mvjoin(mvindex(adm_conns, 0, `adm_conn_cap`-1), "|"), \
  conns_capped=if(mvcount(adm_conns)>`adm_conn_cap`, 1, null()), sampled=if(sampled==1, 1, null()), xlate_ip=mvindex(xlate_ip, 0), \
  xff=if(adm_xff=="-", null(), adm_xff), trace_ids=mvjoin(mvindex(trace_ids, 0, 19), "|") \
| `adm_vlan_merge(adm_vlan_observations)` \
| eval contract_version=2 \
| fields _time contract_version rollup_id replay_protected adm_record scope scope_mapping_verified client_ip server_ip server_port transport flow_source observer observations bytes_c2s bytes_s2c packets records client_ports client_port_list conns conns_capped sampled first_seen last_seen direction_basis encapsulation acl_permits acl_drops xlate_ip xff trace_ids vlan_observations vlan_observations_truncated
description = Version-2 base-compatible conversation rollup over sources other than Stream IPFIX. Stream observations are kept in separate traffic rows because their counters are not authoritative until the selected profile semantics are verified. Rolls normalized flow records into one row per conversation, 5-minute bucket (by adm_end) and observer. Records without a determined client inherit the orientation of another record of the same address pair, transport and bucket. Hubble SNAT traces and L7 requests become evidence rows (adm_record hubble_xlate / hubble_l7); ACI ACL-log records are counted per observing leaf (acl_permits / acl_drops) and deduplicated by object DN within a run. conns keeps up to adm_conn_cap client_port@start@end triples per row (conns_capped=1 when there were more) for connection-level hand-off matching and connection counts. Hubble L7 rows are grouped per X-Forwarded-For client (xff). sampled=1 marks rows with NetFlow records sampled at more than 1:1.

[adm_traffic_observations_v2]
definition = `adm_flows_netflow_v2` | `adm_flow_enrich_v2` \
| eval _time=floor(adm_end/300)*300, contract_version=2, adm_record="traffic_observation", scope=adm_scope, cluster=adm_cluster, \
  traffic_observation_id=adm_event_id, replay_protected=if(isnotnull(adm_event_id), 1, 0), \
  source_ip=adm_src_ip, destination_ip=adm_dest_ip, source_port=adm_raw_source_port, destination_port=adm_raw_destination_port, source_mac=adm_source_mac, destination_mac=adm_destination_mac, \
  raw_bytes=adm_raw_bytes, raw_packets=adm_raw_packets, raw_sampling=adm_raw_sampling, counter_semantics="unknown", metrics_authoritative=0, server_port=adm_dest_port, transport=adm_transport, routing_domain=adm_scope_routing_domain, records=1, \
  adm_traffic_observation=json_set(adm_traffic_observation, "domain_kind", adm_scope_domain_kind, "routing_domain", adm_scope_routing_domain, \
    "scope", adm_scope, "cluster", adm_cluster, "profile", adm_profile, "mapping_status", adm_profile_status, "direction", coalesce(adm_flow_direction,"unknown"), \
    "source_ip", adm_src_ip, "destination_ip", adm_dest_ip, "server_port", adm_dest_port, "transport", adm_transport, \
    "interface_in", coalesce(adm_in_if, if(isnotnull(adm_in_ifindex), tostring(adm_in_ifindex), null())), "interface_out", coalesce(adm_out_if, if(isnotnull(adm_out_ifindex), tostring(adm_out_ifindex), null())), \
    "source_port", adm_raw_source_port, "destination_port", adm_raw_destination_port, "source_mac", adm_source_mac, "destination_mac", adm_destination_mac, \
    "raw_bytes", adm_raw_bytes, "raw_packets", adm_raw_packets, "raw_sampling", adm_raw_sampling, \
    "quality_status", adm_quality_status, "quality_errors", mvjoin(adm_quality_errors,"|"), "quality_warnings", mvjoin(adm_quality_warnings,"|"), \
    "counter_semantics", "unknown", "metrics_authoritative", "0", "records", 1, "record_fingerprint", adm_traffic_fingerprint, "event_identity_status", if(isnotnull(adm_event_id), "stable", "unavailable")) \
| streamstats count AS adm_observation_row \
| eval adm_observation_dedup_key=if(isnotnull(traffic_observation_id), traffic_observation_id, "unprotected:".tostring(adm_observation_row)) \
| dedup adm_observation_dedup_key \
| fields _time contract_version adm_record traffic_observation_id replay_protected scope cluster routing_domain source_port destination_port source_mac destination_mac raw_bytes raw_packets raw_sampling counter_semantics metrics_authoritative adm_quality_status adm_quality_errors adm_quality_warnings adm_profile_status adm_scope_source adm_scope_authority adm_scope_domain_kind adm_scope_observation_domain_present adm_scope_observation_domain_id adm_scope_vpn_id adm_scope_routing_domain adm_registered_profiles source_ip destination_ip server_port transport adm_start adm_end _indextime adm_flow_direction adm_in_if adm_out_if records adm_traffic_observation \
| eval traffic_observations="[".adm_traffic_observation."]" \
| rename adm_start AS first_seen adm_end AS last_seen _indextime AS received_time adm_flow_direction AS direction traffic_observation_id AS rollup_id \
| fields - _raw _bkt _cd index
description = Stages one source-preserving context row per explicitly mapped Stream/IPFIX record. Counters remain non-authoritative until a selected template/profile has verified their semantics; unknown or duplicate mapping profiles never become metrics or routes.

# Replay protection applies to an identical closed input slice and unchanged normalization.
# Overlapping/differently bounded slices and reindexed copies are not interchangeable replays.
[adm_summary_dedup]
definition = dedup rollup_id keepempty=true \
| eval scope=if(scope=="default" AND coalesce(tostring(scope_mapping_verified), "0")!="1", "unmapped:legacy-default", scope)
description = Removes repeated writes of the same input-event set before summary counters are summed. Legacy rows with no rollup_id are retained; replay protection cannot be retrofitted onto their aggregates.

[adm_prune_maintenance]
definition = 0
description = Destructive prune gate. Leave 0 during normal operation. Set 1 only after disabling ALL builders and pruning schedules, draining active jobs, and backing up the collections. This is an operator maintenance assertion, not a concurrency lock. Restore 0 before resuming builders.

# ---- KV store paging ----

[adm_kv_read_all(1)]
args = collection
validation = match(collection, "^adm_[a-z_]+\z")
errormsg = adm_kv_read_all expects an Application Atlas collection name.
definition = inputlookup $collection$ start=0 max=10000 | eval adm_page=1 \
| inputlookup append=true $collection$ start=1 max=10000 | eval adm_page=coalesce(adm_page, 0) \
| inputlookup append=true $collection$ start=10000 max=10000 | eval adm_page=coalesce(adm_page, 2) \
| inputlookup append=true $collection$ start=20000 max=10000 | eval adm_page=coalesce(adm_page, 3) \
| inputlookup append=true $collection$ start=30000 max=10000 | eval adm_page=coalesce(adm_page, 4) \
| inputlookup append=true $collection$ start=40000 max=10000 | eval adm_page=coalesce(adm_page, 5) \
| inputlookup append=true $collection$ start=50000 max=10000 | eval adm_page=coalesce(adm_page, 6) \
| inputlookup append=true $collection$ start=60000 max=10000 | eval adm_page=coalesce(adm_page, 7) \
| inputlookup append=true $collection$ start=70000 max=10000 | eval adm_page=coalesce(adm_page, 8) \
| inputlookup append=true $collection$ start=80000 max=10000 | eval adm_page=coalesce(adm_page, 9) \
| inputlookup append=true $collection$ start=90000 max=10000 | eval adm_page=coalesce(adm_page, 10) \
| inputlookup append=true $collection$ start=100000 max=10000 | eval adm_page=coalesce(adm_page, 11) \
| inputlookup append=true $collection$ start=110000 max=10000 | eval adm_page=coalesce(adm_page, 12) \
| inputlookup append=true $collection$ start=120000 max=10000 | eval adm_page=coalesce(adm_page, 13) \
| inputlookup append=true $collection$ start=130000 max=10000 | eval adm_page=coalesce(adm_page, 14) \
| inputlookup append=true $collection$ start=140000 max=10000 | eval adm_page=coalesce(adm_page, 15) \
| inputlookup append=true $collection$ start=150000 max=10000 | eval adm_page=coalesce(adm_page, 16) \
| inputlookup append=true $collection$ start=160000 max=10000 | eval adm_page=coalesce(adm_page, 17) \
| inputlookup append=true $collection$ start=170000 max=10000 | eval adm_page=coalesce(adm_page, 18) \
| inputlookup append=true $collection$ start=180000 max=10000 | eval adm_page=coalesce(adm_page, 19) \
| inputlookup append=true $collection$ start=190000 max=10000 | eval adm_page=coalesce(adm_page, 20) \
| `adm_kv_complete`
description = Reads a whole collection in 20 pages of adm_kv_page_size rows (page 0 is a probe at offset 1) and sets adm_complete=1 only when the read provably returned every row.

[adm_kv_complete]
definition = eventstats count AS adm_page_n by adm_page \
| eventstats max(eval(if(adm_page>=1, adm_page, null()))) AS adm_last dc(eval(if(adm_page>=1, adm_page, null()))) AS adm_pages \
    max(eval(if(adm_page==1, adm_page_n, null()))) AS adm_p1 max(eval(if(adm_page==0, adm_page_n, null()))) AS adm_probe \
| eventstats max(eval(if(adm_page==adm_last, adm_page_n, null()))) AS adm_last_n min(eval(if(adm_page>=1 AND adm_page<adm_last, adm_page_n, null()))) AS adm_inner_min \
| eval adm_complete=if(adm_pages==adm_last AND (isnull(adm_inner_min) OR adm_inner_min==`adm_kv_page_size`) \
    AND (adm_last_n<`adm_kv_page_size` OR adm_last<20) \
    AND (adm_last>1 OR adm_p1==`adm_kv_page_size` OR coalesce(adm_probe, 0)==adm_p1-1), 1, 0)
description = Completeness test for adm_kv_read_all (20 pages): pages are contiguous, every page before the last is full, the page after the last was read and empty, and a short first page has an offset-1 probe exactly one row shorter (otherwise the store capped the read).

# ---- identity (KV store adm_ip_identity) ----

[adm_identity_observations]
definition = search (`adm_index_k8s` (sourcetype="kube:object:pods" OR sourcetype="kube:object:nodes" OR sourcetype="kube:object:services")) \
    OR (`adm_index_dcn` (sourcetype="cisco:dc:aci:stats" OR sourcetype="cisco:dc:aci:class") (component="fvCEp" OR component="fvRsVm" OR component="compVm")) \
    OR (`adm_index_dcn` sourcetype="cisco:dc:nd:endpoints") \
| append maxout=50001 maxtime=0 [search `adm_index_dcn` sourcetype="cisco:dc:aci:class" component="fvRsBd" _index_earliest=0 \
    [| makeresults | addinfo | eval earliest=max(0, info_min_time-2*`adm_poll_interval`), \
      latest=if(match(tostring(info_max_time), "(?i)inf"), "+15m", tostring(info_max_time)) | return earliest latest] \
    | eval adm_aci_epg_dn=replace(dn, "/rsbd$", ""), \
      adm_aci_bd_dn=if(state=="formed" AND match(tDn, "^uni/tn-[^/]+/BD-[^/]+$"), tDn, null()), \
      adm_aci_bd_name=if(isnotnull(adm_aci_bd_dn), replace(adm_aci_bd_dn, "^.*/BD-", ""), null()), \
      adm_aci_bd_tenant=if(isnotnull(adm_aci_bd_dn), replace(adm_aci_bd_dn, "^uni/tn-([^/]+)/.*$", "\1"), null()) \
    | stats values(eval(json_object("dn", adm_aci_bd_dn, "name", adm_aci_bd_name, "tenant", adm_aci_bd_tenant, "t", _time))) AS adm_aci_bd_candidates by apic_host adm_aci_epg_dn \
    | eval adm_rel_footer=0, adm_rel_data=1, component="fvRsBd", sourcetype="cisco:dc:aci:class", dn=adm_aci_epg_dn."/rsbd" \
    | appendpipe [| stats count AS adm_rel_expected | eval adm_rel_footer=1] \
    | sort 0 adm_rel_footer] \
| eventstats sum(adm_rel_footer) AS adm_rel_footers sum(adm_rel_data) AS adm_rel_received max(adm_rel_expected) AS adm_rel_expected \
| eval adm_network_complete=if(adm_rel_footers==1 AND coalesce(adm_rel_received,0)==adm_rel_expected, 1, 0) \
| where coalesce(adm_rel_footer,0)==0 \
| eval adm_src=case(sourcetype=="kube:object:pods", "k8s_pods", sourcetype=="kube:object:nodes", "k8s_node_obj", sourcetype=="kube:object:services", "k8s_services", \
    match(sourcetype, "^cisco:dc:aci:"), "aci", sourcetype=="cisco:dc:nd:endpoints", "nd_endpoints") \
| eval adm_aci_epg_dn=if(adm_src=="aci", if(component=="fvRsBd", replace(dn, "/rsbd$", ""), replace(dn, "/cep-[^/]+$", "")), null()) \
| eventstats values(adm_aci_bd_candidates) AS adm_aci_bd_candidates by apic_host adm_aci_epg_dn \
| eval adm_cep_dn=case(component=="fvCEp", dn, component=="fvRsVm", replace(dn, "/rsvm$", "")), \
  adm_vm_dn=case(component=="fvRsVm", tDn, component=="compVm", dn), \
  adm_vm_label=if(component=="compVm", name, null()) \
| eventstats values(adm_vm_label) AS adm_vm_by_dn by apic_host adm_vm_dn \
| eval adm_vm_link=if(component=="fvRsVm", adm_vm_by_dn, null()) \
| eventstats values(adm_vm_link) AS adm_cep_vm by apic_host adm_cep_dn \
| where adm_src!="aci" OR component=="fvCEp" \
| eval adm_type=coalesce(type, "SNAPSHOT"), \
  adm_uid=coalesce('object.metadata.uid', 'metadata.uid'), \
  adm_k8s=if(match(adm_src, "^k8s_"), 1, 0), \
  adm_no_cluster=if(adm_k8s==1 AND isnull('k8s.cluster.name'), 1, 0), \
  cluster=if(adm_k8s==1, coalesce('k8s.cluster.name', "unknown"), null()), \
  adm_svc_ports=if(adm_src=="k8s_services", coalesce(spath(_raw, "object.spec.ports{}"), spath(_raw, "spec.ports{}"), "-"), "-") \
| eventstats sum(eval(mvcount(adm_svc_ports))) AS adm_expand_expected \
| mvexpand adm_svc_ports \
| eventstats count AS adm_expand_actual \
| eval adm_network_complete=if(adm_expand_expected==adm_expand_actual, adm_network_complete, 0) \
| eval adm_svct=if(adm_src=="k8s_services", coalesce('object.spec.type', 'spec.type'), null()), \
  adm_port=if(adm_src=="k8s_services", tonumber(json_extract(adm_svc_ports, "port")), null()), \
  adm_tp=if(adm_src=="k8s_services", lower(coalesce(json_extract(adm_svc_ports, "protocol"), "TCP")), null()), \
  adm_tport=if(adm_src=="k8s_services", json_extract(adm_svc_ports, "targetPort"), null()), \
  adm_nport=if(adm_src=="k8s_services", tonumber(json_extract(adm_svc_ports, "nodePort")), null()), \
  adm_lb_ips=if(adm_src=="k8s_services", mvdedup(mvappend('object.status.loadBalancer.ingress{}.ip', 'status.loadBalancer.ingress{}.ip', 'object.spec.externalIPs{}', 'spec.externalIPs{}')), null()), \
  adm_proxy_ips=if(adm_src=="k8s_node_obj", mvappend('object.metadata.annotations.network.cilium.io/ipv4-Ingress-ip', 'metadata.annotations.network.cilium.io/ipv4-Ingress-ip', \
    'object.metadata.annotations.network.cilium.io/ipv6-Ingress-ip', 'metadata.annotations.network.cilium.io/ipv6-Ingress-ip'), null()), \
  adm_role=case(adm_src=="k8s_services", mvappend(mvmap(adm_lb_ips, "lb=".adm_lb_ips), if(isnotnull(adm_nport) AND (adm_svct=="NodePort" OR adm_svct=="LoadBalancer"), "np=nodeport:".cluster, null())), \
    adm_src=="k8s_node_obj", mvappend("node=-", if(isnotnull(adm_proxy_ips), "proxy=-", null())), true(), "-=-") \
| eval adm_role=coalesce(adm_role, "none=-") \
| eventstats sum(eval(mvcount(adm_role))) AS adm_expand_expected \
| mvexpand adm_role \
| eventstats count AS adm_expand_actual \
| eval adm_network_complete=if(adm_expand_expected==adm_expand_actual, adm_network_complete, 0) \
| where adm_src!="k8s_services" OR isnotnull(adm_role) \
| eval adm_role_kind=replace(adm_role, "=.*$", ""), \
  adm_fe_ip=if(adm_role_kind=="np", replace(adm_role, "^[^=]*=", "").":".adm_nport."/".adm_tp, replace(adm_role, "^[^=]*=", "")), \
  adm_fe_ip=if(adm_role_kind=="lb", `adm_ip(adm_fe_ip)`, adm_fe_ip), \
  adm_pname=if(adm_src=="k8s_services", coalesce(json_extract(adm_svc_ports, "name"), ""), null()), \
  adm_svc_name=if(adm_src=="k8s_services", coalesce('object.metadata.name', 'metadata.name'), null()), \
  adm_svc_ns=if(adm_src=="k8s_services", coalesce('object.metadata.namespace', 'metadata.namespace'), null()), \
  adm_svc_port=if(adm_role_kind=="np", adm_nport, adm_port), \
  adm_etp=if(adm_src=="k8s_services", coalesce('object.spec.externalTrafficPolicy', 'spec.externalTrafficPolicy', "Cluster"), null()), \
  adm_lb_annotation=if(adm_src=="k8s_services", coalesce('object.metadata.annotations.service.cilium.io/forwarding-mode', 'metadata.annotations.service.cilium.io/forwarding-mode'), null()), \
  adm_lbm=if(adm_src=="k8s_services", lower(coalesce(adm_lb_annotation, `adm_cilium_lb_mode`)), null()), \
  adm_lb_mode_source=if(adm_src=="k8s_services", if(isnotnull(adm_lb_annotation), "service_annotation", "cluster_default"), null()), \
  adm_ownk=if(adm_src=="k8s_services", mvindex(coalesce('object.metadata.ownerReferences{}.kind', 'metadata.ownerReferences{}.kind'), 0), null()), \
  adm_ownn=if(adm_src=="k8s_services", mvindex(coalesce('object.metadata.ownerReferences{}.name', 'metadata.ownerReferences{}.name'), 0), null()), \
  adm_ctl=case(adm_src!="k8s_services", null(), adm_ownk=="Gateway" OR isnotnull(coalesce('object.metadata.labels.io.cilium.gateway/owning-gateway', 'metadata.labels.io.cilium.gateway/owning-gateway')), "cilium_gateway", \
    adm_ownk=="Ingress" OR lower(coalesce('object.metadata.labels.cilium.io/ingress', 'metadata.labels.cilium.io/ingress'))=="true", "cilium_ingress"), \
  adm_node_name=if(adm_src=="k8s_node_obj", coalesce('object.metadata.name', 'metadata.name'), null()), \
  adm_node_addrs=if(adm_src=="k8s_node_obj", mvzip(coalesce('object.status.addresses{}.type', 'status.addresses{}.type'), coalesce('object.status.addresses{}.address', 'status.addresses{}.address'), "="), null()), \
  adm_created_ts=`adm_iso_time(coalesce('object.metadata.creationTimestamp', 'metadata.creationTimestamp'))` \
| eval adm_pod_ips=coalesce('object.status.podIPs{}.ip', 'status.podIPs{}.ip', 'object.status.podIP', 'status.podIP'), \
  adm_host_ip=coalesce('object.status.hostIP', 'status.hostIP'), \
  adm_hostnet=if(adm_src=="k8s_pods" AND (lower(coalesce('object.spec.hostNetwork', 'spec.hostNetwork'))=="true" \
    OR (isnotnull(adm_host_ip) AND `adm_mv_has(adm_pod_ips, adm_host_ip)`)), 1, 0), \
  adm_vlan_raw=if(adm_src=="aci" OR adm_src=="nd_endpoints", if(match(encap, "^vlan-[0-9]+$"), replace(encap, "^vlan-", ""), null()), null()), \
  attr_vlan=if(match(tostring(adm_vlan_raw), "^\\d+$") AND tonumber(adm_vlan_raw)>=1 AND tonumber(adm_vlan_raw)<=4094, tostring(floor(tonumber(adm_vlan_raw))), null()), \
  attr_vlan_status=if(isnull(attr_vlan) AND isnotnull(adm_vlan_raw), "incomplete", null()), \
  adm_aci_bd_match=replace(mvindex(mvsort(mvmap(adm_aci_bd_candidates, if(tonumber(json_extract(adm_aci_bd_candidates, "t"))<=_time AND tonumber(json_extract(adm_aci_bd_candidates, "t"))>=_time-2*`adm_poll_interval`, printf("%020.6f", tonumber(json_extract(adm_aci_bd_candidates, "t")))."#".adm_aci_bd_candidates, null()))), -1), "^[^#]*#", ""), \
  attr_bridge_domain=case(adm_src=="aci" AND isnotnull(adm_aci_bd_match), json_extract(adm_aci_bd_match, "name"), adm_src=="nd_endpoints", nullif(trim(displayBd), ""), true(), null()), \
  attr_bridge_domain_status=if(isnull(attr_bridge_domain) AND (adm_src=="aci" OR adm_src=="nd_endpoints"), "incomplete", null()), \
  adm_network_sample=if(adm_src=="aci" OR adm_src=="nd_endpoints", json_object("t", _time, "v", attr_vlan, "b", attr_bridge_domain, "vs", attr_vlan_status, "bs", attr_bridge_domain_status, \
    "bd_dn", if(adm_src=="aci" AND isnotnull(adm_aci_bd_match), json_extract(adm_aci_bd_match, "dn"), null()), \
    "bd_tenant", if(adm_src=="aci" AND isnotnull(adm_aci_bd_match), json_extract(adm_aci_bd_match, "tenant"), null()), "source", adm_src, "observer", if(adm_src=="aci", apic_host, nd_host), "epg_dn", if(adm_src=="aci", adm_aci_epg_dn, null())), null()), \
  adm_ips=case(adm_src=="k8s_pods", adm_pod_ips, adm_src=="aci", mvdedup(mvappend(ip, addr)), adm_src=="nd_endpoints", 'ip{}', \
    adm_src=="k8s_services", adm_fe_ip, adm_src=="k8s_node_obj" AND adm_role_kind=="proxy", adm_proxy_ips, \
    adm_src=="k8s_node_obj", mvmap(adm_node_addrs, if(match(adm_node_addrs, "^(InternalIP|ExternalIP)="), replace(adm_node_addrs, "^[^=]*=", ""), null()))), \
  adm_started=`adm_iso_time(coalesce('object.status.startTime', 'status.startTime'))`, \
  adm_deleted=case(adm_k8s==1 AND adm_type=="DELETED", _time, adm_src=="nd_endpoints" AND lower(modType)=="deletion", _time), \
  adm_added=if(adm_type=="ADDED", _time, null()), \
  adm_created=if(adm_src=="nd_endpoints", `adm_iso_time(createTime)`, null()), \
  adm_key=case(adm_src=="k8s_pods", "pod|".cluster."|".adm_uid, adm_src=="aci", "aci|".apic_host."|".dn, adm_src=="nd_endpoints", "nd|".nd_host."|".endpointId, \
    adm_src=="k8s_services", if(adm_role_kind=="none", "svcparent|".cluster."|".adm_uid."|".tostring(_time), "svc|".cluster."|".adm_uid."|".adm_fe_ip."|".adm_svc_port."|".adm_tp), \
    adm_src=="k8s_node_obj", adm_role_kind."|".cluster."|".adm_node_name), \
  service_child_key=if(adm_src=="k8s_services" AND adm_role_kind!="none", adm_key, null()), \
  adm_name=case(adm_src=="k8s_pods", coalesce('object.metadata.name', 'metadata.name'), adm_src=="aci", mvindex(adm_cep_vm, 0), adm_src=="nd_endpoints", vmName, \
    adm_src=="k8s_services", adm_svc_name, adm_src=="k8s_node_obj", adm_node_name), \
  namespace=case(adm_src=="k8s_pods", coalesce('object.metadata.namespace', 'metadata.namespace'), adm_src=="k8s_services", adm_svc_ns), \
  node=case(adm_src=="k8s_node_obj", adm_node_name, true(), coalesce('object.spec.nodeName', 'spec.nodeName')), \
  adm_rs=mvindex(coalesce('object.metadata.ownerReferences{}.name', 'metadata.ownerReferences{}.name'), 0), \
  adm_rs_kind=mvindex(coalesce('object.metadata.ownerReferences{}.kind', 'metadata.ownerReferences{}.kind'), 0), \
  adm_pth=coalesce('object.metadata.labels.pod-template-hash', 'metadata.labels.pod-template-hash'), \
  owner_kind=if(adm_src!="k8s_pods", null(), if(adm_rs_kind=="ReplicaSet" AND isnotnull(adm_pth) AND adm_rs==replace(adm_rs, "-[^-]+$", "")."-".adm_pth, "Deployment", adm_rs_kind)), \
  owner_name=if(adm_src!="k8s_pods", null(), if(owner_kind=="Deployment" AND adm_rs_kind=="ReplicaSet", replace(adm_rs, "-[^-]+$", ""), adm_rs)), \
  tenant=case(adm_src=="aci", replace(dn, "^uni/tn-([^/]+)/.*$", "\1"), adm_src=="nd_endpoints", tenant), \
  app_profile=if(adm_src=="aci", replace(dn, "^uni/tn-[^/]+/ap-([^/]+)/.*$", "\1"), null()), \
  epg=case(adm_src=="aci", replace(dn, "^uni/tn-[^/]+/ap-[^/]+/epg-([^/]+)/.*$", "\1"), adm_src=="nd_endpoints", displayEpg), \
  attach_device=case(adm_src=="aci" AND match(mvindex(tDn, 0), "^topology/pod-\d+/paths-\d+/"), replace(mvindex(tDn, 0), "^topology/pod-(\d+)/paths-(\d+)/.*$", "pod-\1/node-\2"), adm_src=="nd_endpoints", nodeName), \
  attach_interface=case(adm_src=="aci" AND match(mvindex(tDn, 0), "pathep-\["), replace(mvindex(tDn, 0), "^.*pathep-\[([^\]]+)\]$", "\1"), adm_src=="nd_endpoints", mvindex('displayInterface{}', 0)), \
  mac=upper(mac), \
  adm_scope_observer=case(adm_k8s==1, cluster, adm_src=="aci", apic_host, adm_src=="nd_endpoints", nd_host), \
  adm_scope_kind=case(adm_k8s==1, "cluster", adm_src=="aci", "apic", adm_src=="nd_endpoints", "nd_host") \
| eventstats values(eval(if(adm_src=="k8s_services" AND adm_role_kind!="none", adm_key, null()))) AS adm_parent_children by cluster adm_uid _time \
| appendpipe [| where adm_src=="k8s_services" | stats values(adm_parent_children) AS adm_parent_children latest(adm_scope_observer) AS adm_scope_observer latest(adm_scope_kind) AS adm_scope_kind latest(adm_svct) AS svc_type latest(adm_name) AS entity_name latest(namespace) AS namespace min(adm_network_complete) AS adm_network_complete max(adm_deleted) AS adm_deleted by cluster adm_uid _time \
    | eval adm_key="svcparent|".cluster."|".adm_uid."|".tostring(_time), adm_src="k8s_service_parent", adm_role_kind="parent", adm_parent_marker=1, adm_ips="__adm_service_parent__", adm_parent_time=_time, adm_parent_deleted=adm_deleted] \
| eval adm_key=if(adm_src=="k8s_services", adm_key."|snapshot|".tostring(_time), adm_key) \
| stats min(adm_started) AS adm_started min(adm_added) AS adm_added min(adm_created) AS adm_created min(adm_created_ts) AS adm_created_ts min(_time) AS first_seen max(_time) AS last_seen \
    max(adm_deleted) AS adm_deleted values(adm_ips) AS adm_ips latest(adm_host_ip) AS adm_host_ip max(adm_hostnet) AS adm_hostnet \
    latest(adm_name) AS entity_name latest(namespace) AS namespace latest(node) AS node latest(owner_kind) AS owner_kind latest(owner_name) AS owner_name \
    latest(tenant) AS tenant latest(app_profile) AS app_profile latest(epg) AS epg latest(attach_device) AS attach_device \
    latest(attach_interface) AS attach_interface latest(mac) AS mac latest(adm_scope_observer) AS adm_scope_observer latest(adm_scope_kind) AS adm_scope_kind \
    latest(attr_vlan) AS attr_vlan values(attr_vlan) AS attr_vlans latest(attr_bridge_domain) AS attr_bridge_domain values(attr_bridge_domain) AS attr_bds latest(attr_vlan_status) AS attr_vlan_status latest(attr_bridge_domain_status) AS attr_bridge_domain_status \
    values(adm_network_sample) AS adm_network_samples min(adm_network_complete) AS adm_network_complete \
    latest(cluster) AS cluster latest(adm_uid) AS adm_uid latest(dn) AS adm_dn latest(endpointId) AS adm_nd_id max(adm_no_cluster) AS adm_no_cluster \
    latest(adm_role_kind) AS adm_role_kind latest(adm_svc_port) AS port latest(adm_tp) AS transport latest(adm_svct) AS svc_type latest(adm_etp) AS traffic_policy \
    latest(adm_lbm) AS lb_mode latest(adm_lb_mode_source) AS lb_mode_source latest(adm_ctl) AS controller latest(adm_ownk) AS owner_ref_kind latest(adm_ownn) AS owner_ref_name latest(adm_tport) AS target_port \
    latest(adm_pname) AS port_name latest(service_child_key) AS service_child_key max(adm_parent_marker) AS adm_parent_marker values(adm_parent_children) AS adm_parent_children latest(adm_parent_time) AS adm_parent_time latest(adm_parent_deleted) AS adm_parent_deleted \
    by adm_key adm_src \
| eval adm_hn=if(adm_src=="k8s_pods" AND adm_hostnet==1 AND isnotnull(adm_host_ip), 1, 0), \
  adm_ips=if(adm_hn==1, adm_host_ip, adm_ips), \
  source=case(adm_src=="k8s_node_obj" AND adm_role_kind=="proxy", "k8s_node_proxy", adm_src=="k8s_node_obj", "k8s_nodes", adm_hn==1, "k8s_hostnet", true(), adm_src), \
  entity_kind=case(adm_parent_marker==1, "k8s_service_parent", adm_hn==1, "k8s_hostnet_pod", adm_src=="k8s_pods", "pod", adm_src=="k8s_services", "k8s_service", source=="k8s_node_proxy", "k8s_node_proxy", source=="k8s_nodes", "k8s_node", isnotnull(entity_name), "vm", true(), "endpoint"), \
  entity_id=case(adm_parent_marker==1 OR adm_src=="k8s_pods" OR adm_src=="k8s_services", adm_uid, adm_src=="k8s_node_obj", cluster."/".node, adm_src=="aci", adm_dn, true(), adm_nd_id), \
  service_uid=if(entity_kind=="k8s_service" OR entity_kind=="k8s_service_parent", entity_id, null()), \
  vm_name=if(entity_kind=="vm", entity_name, null()), \
  service=if(entity_kind=="k8s_service", entity_name, null()), \
  priority=case(entity_kind=="k8s_service_parent", 0, entity_kind=="k8s_hostnet_pod", 9, entity_kind=="k8s_service", 0, entity_kind=="pod", 1, entity_kind=="k8s_node" OR entity_kind=="k8s_node_proxy", 2, true(), 3), \
  valid_from=case(adm_src=="k8s_pods", coalesce(adm_started, adm_added, adm_created_ts, first_seen), adm_src=="nd_endpoints", coalesce(adm_created, first_seen), \
    entity_kind=="k8s_node", coalesce(adm_created_ts, adm_added, first_seen), true(), first_seen), \
  valid_to=if(adm_src=="aci", null(), adm_deleted) \
| appendpipe [| where (source=="k8s_pods" OR source=="k8s_hostnet") AND isnotnull(adm_host_ip) AND cluster!="unknown" \
    | stats min(valid_from) AS valid_from min(first_seen) AS first_seen max(last_seen) AS last_seen latest(adm_scope_observer) AS adm_scope_observer min(adm_network_complete) AS adm_network_complete by cluster node adm_host_ip \
    | eval source="k8s_nodes", entity_kind="k8s_node", entity_id=cluster."/".node, entity_name=node, adm_ips=adm_host_ip, priority=2, adm_scope_kind="cluster", adm_hostnet=0] \
| where coalesce(adm_hostnet, 0)!=1 OR entity_kind=="k8s_hostnet_pod" \
| where entity_kind!="k8s_node" OR cluster!="unknown" \
| where adm_parent_marker==1 OR coalesce(adm_role_kind, "-")!="none" \
| fields - adm_host_ip adm_hostnet \
| where isnotnull(adm_ips) \
| eventstats sum(eval(mvcount(adm_ips))) AS adm_expand_expected \
| mvexpand adm_ips \
| eventstats count AS adm_expand_actual \
| eval adm_network_complete=if(adm_expand_expected==adm_expand_actual, adm_network_complete, 0) \
| eval ip=if(entity_kind=="k8s_service_parent", "__adm_service_parent__", `adm_ip(adm_ips)`) \
| where (isnotnull(ip) AND ip!="0.0.0.0" AND ip!="") OR entity_kind=="k8s_service_parent" \
| eval adm_scope_kind=lower(adm_scope_kind), adm_scope_observer=lower(adm_scope_observer) \
| lookup adm_observer_scope observer_kind AS adm_scope_kind observer AS adm_scope_observer OUTPUT scope AS scope \
| eval scope_mapping_verified=if(isnotnull(scope),1,0), scope=coalesce(scope, `adm_unmapped_scope(adm_scope_kind, adm_scope_observer)`), \
  ek=case(entity_kind=="k8s_service_parent", "svcparent:".cluster."/".entity_id, entity_kind=="pod", "pod:".cluster."/".entity_id, entity_kind=="k8s_hostnet_pod", "hostnet:".cluster."/".entity_id, entity_kind=="k8s_node", "node:".entity_id, entity_kind=="k8s_node_proxy", "proxy:".entity_id, \
    entity_kind=="k8s_service", "svc:".cluster."/".namespace."/".entity_name."/".ip."/".port."/".transport, true(), "ep:".scope."/".ip."/".coalesce(mac, "*")) \
| eval attr_vlan=if(mvcount(attr_vlans)>1, null(), attr_vlan), attr_bridge_domain=if(mvcount(attr_bds)>1, null(), attr_bridge_domain), \
  attr_vlan_status=if(mvcount(attr_vlans)>1, "varies", attr_vlan_status), attr_bridge_domain_status=if(mvcount(attr_bds)>1, "varies", attr_bridge_domain_status), \
  network_history=adm_network_samples \
| fields source entity_kind entity_id entity_name ip scope scope_mapping_verified cluster namespace node owner_kind owner_name tenant app_profile epg attach_device attach_interface mac vm_name priority valid_from valid_to first_seen last_seen ek adm_no_cluster adm_network_complete \
    attr_vlan attr_bridge_domain attr_vlan_status attr_bridge_domain_status network_history attr_network_history_capped port transport service service_uid service_child_key svc_type traffic_policy lb_mode lb_mode_source controller owner_ref_kind owner_ref_name target_port port_name adm_parent_children adm_parent_time adm_parent_deleted
description = Identity observations from Kubernetes pod, Node and Service objects (hostNetwork pods excluded), pod host IPs (nodes), Cilium per-node ingress (Envoy) addresses, ACI endpoints and Nexus Dashboard endpoints; one row per entity and IP with the newest attribute values. Service frontends are port-qualified: LoadBalancer ingress IPs and externalIPs per port, and NodePorts under the pseudo-address nodeport:<cluster>:<nodePort>/<transport>; port_name is the Service port name used to find the EndpointSlice port. hostNetwork pods are kept as entity_kind k8s_hostnet_pod on the node IP (priority 9): they never resolve an address but mark nodes whose own processes could have made a connection.
[adm_identity_desc]
definition = eval valid_end=case(isnotnull(valid_to), valid_to, source=="aci", last_seen + 2*`adm_poll_interval`, \
    source=="k8s_nodes" AND `adm_k8s_node_staleness`>0, last_seen + `adm_k8s_node_staleness`, \
    (source=="k8s_services" OR source=="k8s_node_proxy") AND `adm_k8s_object_staleness`>0, last_seen + `adm_k8s_object_staleness`), \
  desc=json_object("ip", ip, "sc", scope, "sm", scope_mapping_verified, "vf", valid_from, "vt", valid_to, "ve", valid_end, "fs", first_seen, "ls", last_seen, "p", priority, \
    "kind", entity_kind, "id", entity_id, "name", entity_name, "cluster", nullif(cluster, ""), "ns", nullif(namespace, ""), "node", node, \
    "owner_kind", owner_kind, "owner", owner_name, "tenant", tenant, "ap", app_profile, "epg", epg, "dev", attach_device, "if", attach_interface, \
    "mac", mac, "vm", vm_name, "source", source, "ek", ek, "upd", updated, \
    "port", port, "tp", transport, "svct", svc_type, "etp", traffic_policy, "lbm", lb_mode, "lbmsrc", lb_mode_source, "ctl", controller, "ownk", owner_ref_kind, "ownn", owner_ref_name, "tport", target_port, "pn", port_name, "k", _key, "suid", service_uid, "sck", service_child_key, \
    "vlan", attr_vlan, "bd", attr_bridge_domain, "vlan_status", attr_vlan_status, "bd_status", attr_bridge_domain_status, "nhc", attr_network_history_capped, "nhc_te", attr_nhc_te) \
| eval desc=if(isnotnull(network_history), json_set(desc, "nh", json(network_history)), desc) \
| eval desc=if(entity_kind=="k8s_service_parent" AND isnotnull(service_snapshot_history), json_set(desc, "sh", json(service_snapshot_history)), desc)
description = Computes valid_end (end used for resolution and pruning) and the desc JSON carried by lookups.
[adm_identity_merge]
definition = appendpipe [| where entity_kind=="k8s_service" OR entity_kind=="k8s_service_parent" | `adm_identity_service_merge` | eval adm_service_output=1] \
| where adm_service_output==1 OR (entity_kind!="k8s_service" AND entity_kind!="k8s_service_parent") \
| appendpipe [| where isnull(adm_service_output) | `adm_identity_merge_base` | eval adm_base_output=1] \
| where adm_service_output==1 OR adm_base_output==1
description = Keeps Service membership intervals separate from generic IP ownership merging.

[adm_identity_service_merge]
definition = eval adm_prow=if(entity_kind=="k8s_service_parent", 1, 0), adm_kind="frontend", adm_puid=entity_id, \
  adm_lkey=sha256(json_array(cluster, scope, entity_id)), adm_ck=if(entity_kind=="k8s_service_parent", "P|".sha256(json_array(cluster, scope, entity_id)), service_child_key), \
  _time=first_seen, updated=now() \
| `adm_identity_desc` \
| eval adm_payload=desc \
| lookup local=true adm_ip_identity_service entity_id AS adm_puid cluster AS cluster scope AS scope OUTPUT desc AS adm_history_stored \
| eval adm_history_read_n=coalesce(mvcount(adm_history_stored), 0), adm_history_anchors=mvfilter(json_extract(adm_history_stored,"kind")=="k8s_service_parent") \
| eval adm_history_anchor=mvindex(adm_history_anchors,0), adm_history_anchor_n=coalesce(mvcount(adm_history_anchors),0) \
| spath input=adm_history_anchor path=sh{} output=adm_history_items \
| eval adm_history_expected=coalesce(mvcount(adm_history_items),0) \
| appendpipe [| stats values(adm_history_items) AS adm_history_item first(cluster) AS cluster first(scope) AS scope first(adm_puid) AS adm_puid max(adm_history_read_n) AS adm_history_read_n by adm_lkey \
    | mvexpand adm_history_item | where len(adm_history_item)>0 AND isnotnull(tonumber(json_extract(adm_history_item,"t"))) \
    | eval adm_parent_time=tonumber(json_extract(adm_history_item, "t")), adm_parent_members=coalesce(json_extract(adm_history_item, "p"), ""), adm_prow=1, \
        adm_kind="frontend", adm_ck="P|".adm_lkey, first_seen=adm_parent_time, _time=adm_parent_time, adm_history_loaded=1] \
| eventstats max(adm_history_expected) AS adm_history_expected sum(adm_history_loaded) AS adm_history_actual max(adm_history_anchor_n) AS adm_history_anchor_n by adm_lkey \
| eval adm_parent_time=if(adm_prow==1, first_seen, null()), \
  adm_parent_members=if(adm_prow==1 AND isnull(adm_history_loaded), if(isnotnull(valid_to), "", coalesce(mvjoin(mvmap(adm_parent_children, sha256(adm_parent_children)), "|"), "")), adm_parent_members), \
  adm_parent_snapshot=if(adm_prow==1, json_object("t", adm_parent_time, "p", adm_parent_members), null()) \
| eventstats values(adm_parent_snapshot) AS adm_all_snapshots max(adm_parent_time) AS adm_latest_parent by adm_lkey \
| eval adm_parent_states=if(adm_prow==1, adm_parent_members, null()) \
| eventstats dc(adm_parent_states) AS adm_states_at_time by adm_lkey first_seen \
| eventstats max(adm_states_at_time) AS adm_snapshot_conflicts max(adm_history_read_n) AS adm_history_read_n min(adm_network_complete) AS adm_network_complete by adm_lkey \
| streamstats count AS adm_history_carrier by adm_lkey adm_prow \
| eval adm_history_carrier=if(adm_prow==1 AND adm_history_carrier==1,1,0), adm_fresh_outside_history=if(isnull(adm_history_loaded) AND first_seen<adm_latest_parent-`adm_identity_retention`,1,0) \
| eventstats max(adm_fresh_outside_history) AS adm_fresh_outside_history sum(adm_history_carrier) AS adm_has_history_carrier by adm_lkey \
| eval adm_all_snapshots=if(adm_history_carrier==1,adm_all_snapshots,null()) \
| eval adm_older_snapshot=mvindex(mvsort(mvmap(adm_all_snapshots, if(tonumber(json_extract(adm_all_snapshots,"t"))<adm_latest_parent-`adm_identity_retention`, printf("%020.6f",tonumber(json_extract(adm_all_snapshots,"t")))."#".adm_all_snapshots, null()))), -1), \
    adm_kept_snapshots=mvappend(mvmap(adm_all_snapshots, if(tonumber(json_extract(adm_all_snapshots,"t"))>=adm_latest_parent-`adm_identity_retention`, adm_all_snapshots, null())), replace(adm_older_snapshot,"^[^#]*#", "")), \
    service_snapshot_history=if(adm_history_carrier==1,"[".mvjoin(mvsort(adm_kept_snapshots), ",")."]",null()), \
    adm_history_complete=if(adm_has_history_carrier!=1,0,if(adm_history_carrier==0,1,if(adm_history_read_n<`adm_identity_max_matches` AND coalesce(adm_network_complete,1)==1 AND adm_snapshot_conflicts<=1 AND adm_history_anchor_n<=1 AND adm_history_expected==coalesce(adm_history_actual,0) AND mvcount(adm_kept_snapshots)<=10000 AND len(service_snapshot_history)<=8388608, 1, 0))), \
    adm_parent_times=if(adm_prow==1, first_seen, null()), adm_member_hashes=split(adm_parent_members,"|") \
| eval adm_snapshot_presence=if(adm_prow==1 AND len(adm_parent_members)>0, mvmap(adm_member_hashes, adm_member_hashes."@".tostring(first_seen)), null()) \
| eval adm_history_stored=mvfilter(json_extract(adm_history_stored,"kind")=="k8s_service") \
| fields - adm_history_items adm_history_item adm_parent_children adm_history_anchors adm_history_anchor adm_all_snapshots adm_kept_snapshots adm_older_snapshot adm_member_hashes adm_parent_snapshot desc \
| eventstats max(adm_fresh_outside_history) AS adm_fresh_outside_history values(adm_parent_times) AS adm_ptimes min(adm_history_complete) AS adm_history_complete by adm_lkey \
| eval adm_history_complete=if(adm_fresh_outside_history==1,0,adm_history_complete) \
| eval adm_inventory=adm_history_stored, adm_incoming=1 \
| eventstats values(adm_inventory) AS adm_inventory by adm_lkey \
| eval adm_inventory=mvfilter(json_extract(adm_inventory,"kind")=="k8s_service") \
| eventstats max(eval(if(adm_prow==1 AND isnull(adm_history_loaded),1,0))) AS adm_current_snapshot by adm_lkey first_seen \
| eval adm_synthesize=if(adm_history_loaded==1 AND adm_current_snapshot==0 AND len(adm_parent_members)>0,1,0) \
| eventstats dc(eval(if(adm_synthesize==1,first_seen,null()))) AS adm_synthetic_parents max(eval(coalesce(mvcount(adm_inventory),0))) AS adm_inventory_n by adm_lkey \
| eval adm_synthetic_expected=adm_synthetic_parents*adm_inventory_n \
| eval adm_seq=coalesce(mvcount(mvmap(adm_ptimes, if(tonumber(adm_ptimes)<=_time, adm_ptimes, null()))), 0) \
| appendpipe [| where adm_synthesize==1 \
    | dedup adm_lkey _time \
    | where adm_synthetic_expected<=`adm_kv_max_rows` \
    | fields _time adm_lkey adm_puid cluster scope adm_kind adm_parent_members adm_inventory adm_synthetic_expected adm_history_complete adm_network_complete adm_seq \
    | mvexpand adm_inventory \
    | eval adm_synthetic_expanded=1 \
    | eventstats count AS adm_synthetic_actual by adm_lkey \
    | eval adm_synthetic_ck=coalesce(json_extract(adm_inventory,"sck"),"svc|".json_extract(adm_inventory,"cluster")."|".json_extract(adm_inventory,"id")."|".json_extract(adm_inventory,"ip")."|".json_extract(adm_inventory,"port")."|".json_extract(adm_inventory,"tp")), \
        adm_payload_cover=if(tonumber(json_extract(adm_inventory,"vf"))<=_time AND (isnull(tonumber(json_extract(adm_inventory,"vt"))) OR tonumber(json_extract(adm_inventory,"vt"))>_time),1,0), \
        adm_synthetic_match=if(adm_payload_cover==1 AND like("|".adm_parent_members."|","%|".sha256(adm_synthetic_ck)."|%"),1,0) \
    | eventstats dc(eval(if(adm_synthetic_match==1,adm_synthetic_ck,null()))) AS adm_synthetic_members by adm_lkey _time \
    | eval adm_history_complete=if(adm_synthetic_expected==adm_synthetic_actual AND adm_synthetic_members==mvcount(split(adm_parent_members,"|")),adm_history_complete,0) \
    | appendpipe [| stats min(adm_history_complete) AS adm_history_complete sum(adm_synthetic_expanded) AS adm_synthetic_actual by adm_lkey | eval adm_synthetic_footer=1] \
    | where adm_synthetic_footer==1 OR adm_synthetic_match==1 \
    | eval adm_payload=adm_inventory, adm_ck=adm_synthetic_ck, adm_prow=0, adm_incoming=0, first_seen=_time, last_seen=_time, valid_to=null(), adm_payload_time=tonumber(json_extract(adm_inventory,"ls")) \
    | sort 0 -adm_payload_time \
    | dedup adm_lkey adm_ck _time keepempty=true] \
| eventstats min(adm_history_complete) AS adm_history_complete min(adm_network_complete) AS adm_network_complete max(adm_synthetic_actual) AS adm_synthetic_actual max(adm_synthetic_expected) AS adm_synthetic_expected by adm_lkey \
| eval adm_history_complete=if(adm_synthetic_expected==coalesce(adm_synthetic_actual,0) AND adm_synthetic_expected<=`adm_kv_max_rows`,adm_history_complete,0) \
| where isnull(adm_synthetic_footer) \
| where adm_prow==1 OR isnull(valid_to) \
| sort 0 -adm_history_carrier -adm_incoming \
| dedup adm_ck _time keepempty=true \
| eventstats sum(adm_history_carrier) AS adm_surviving_history_carriers by adm_lkey \
| eval adm_history_complete=if(adm_surviving_history_carriers==1,adm_history_complete,0) \
| sort 0 adm_ck _time \
| streamstats current=f last(adm_seq) AS adm_prev_seq by adm_ck \
| eval adm_break=if(isnull(adm_prev_seq) OR adm_seq>adm_prev_seq+1, 1, 0) \
| streamstats sum(adm_break) AS adm_run by adm_ck \
| stats values(adm_snapshot_presence) AS adm_present min(_time) AS first_seen max(_time) AS last_seen max(adm_deleted) AS adm_deleted values(adm_parent_times) AS adm_parent_times max(adm_prow) AS adm_prow \
    latest(adm_lkey) AS adm_lkey latest(adm_puid) AS adm_puid latest(cluster) AS cluster latest(namespace) AS namespace latest(service) AS service latest(pod_uid) AS pod_uid \
    latest(pod_name) AS pod_name latest(ip) AS ip latest(node) AS node latest(target_port) AS target_port latest(protocol) AS protocol latest(port_name) AS port_name \
    latest(adm_payload) AS adm_payload values(service_snapshot_history) AS service_snapshot_history min(adm_history_complete) AS adm_history_complete latest(adm_latest_parent) AS adm_latest_parent latest(scope) AS scope min(adm_network_complete) AS adm_network_complete latest(route_kind) AS route_kind latest(route_name) AS route_name latest(parent_kind) AS parent_kind latest(parent_namespace) AS parent_namespace latest(parent_name) AS parent_name \
    latest(host) AS host latest(path) AS path latest(backend_service) AS backend_service latest(backend_namespace) AS backend_namespace latest(backend_port) AS backend_port latest(backend_port_name) AS backend_port_name by adm_kind adm_ck adm_run \
| eventstats values(adm_parent_times) AS adm_ptimes values(adm_present) AS adm_present by adm_lkey \
| lookup local=true adm_ip_identity_service entity_id AS adm_puid cluster AS cluster scope AS scope OUTPUT desc AS adm_stored \
| eval adm_stored=mvdedup(mvmap(adm_stored, json_set(adm_stored, "ck", coalesce(json_extract(adm_stored,"sck"), "svc|".json_extract(adm_stored,"cluster")."|".json_extract(adm_stored,"id")."|".json_extract(adm_stored,"ip")."|".json_extract(adm_stored,"port")."|".json_extract(adm_stored,"tp")), "k", coalesce(json_extract(adm_stored,"k"), sha256(json_extract(adm_stored,"source")."|".json_extract(adm_stored,"kind")."|".json_extract(adm_stored,"id")."|".json_extract(adm_stored,"ip")."|".json_extract(adm_stored,"sc")."|".json_extract(adm_stored,"port")."|".json_extract(adm_stored,"tp")))))), adm_stored_n=coalesce(mvcount(adm_stored), 0), adm_presence=mvmap(adm_present,sha256(adm_present)), \
  adm_next=mvindex(mvsort(mvmap(adm_ptimes, if(tonumber(adm_ptimes)>last_seen AND NOT isnotnull(mvfind(adm_presence,"^".sha256(sha256(adm_ck)."@".tostring(adm_ptimes))."$")), adm_ptimes, null()))), 0), \
  adm_same=if(adm_prow==1, null(), mvmap(adm_stored, if(json_extract(adm_stored, "ck")==adm_ck, \
    printf("%020.6f", tonumber(json_extract(adm_stored, "vf")))."#".adm_stored, null()))), \
  adm_match=replace(mvindex(mvsort(mvmap(adm_same, if(tonumber(mvindex(split(adm_same, "#"), 0))<=last_seen, adm_same, null()))), -1), "^[^#]*#", ""), \
  adm_future=replace(mvindex(mvsort(mvmap(adm_same, if(tonumber(mvindex(split(adm_same, "#"), 0))>last_seen, adm_same, null()))), 0), "^[^#]*#", ""), \
  adm_fvf=tonumber(json_extract(adm_future, "vf")), \
  adm_future_block=coalesce(mvcount(mvmap(adm_same, if(tonumber(json_extract(replace(adm_same, "^[^#]*#", ""), "vt"))>first_seen \
    AND tonumber(json_extract(replace(adm_same, "^[^#]*#", ""), "vt"))<=adm_fvf, 1, null()))), 0) \
    + coalesce(mvcount(mvmap(adm_ptimes, if(tonumber(adm_ptimes)>=first_seen AND tonumber(adm_ptimes)<adm_fvf \
      AND NOT isnotnull(mvfind(adm_presence,"^".sha256(sha256(adm_ck)."@".tostring(adm_ptimes))."$")), 1, null()))), 0), \
  adm_use_future=if(isnotnull(adm_future) AND adm_future_block==0 AND (isnull(adm_match) OR tonumber(json_extract(adm_match, "vt"))<=first_seen), 1, 0), \
  adm_match=if(adm_use_future==1, adm_future, adm_match), \
  adm_mvf=tonumber(json_extract(adm_match, "vf")), adm_mvt=tonumber(json_extract(adm_match, "vt")), \
  adm_prior=mvcount(mvmap(adm_same, if(isnotnull(tonumber(json_extract(replace(adm_same, "^[^#]*#", ""), "vt"))) \
    AND tonumber(json_extract(replace(adm_same, "^[^#]*#", ""), "vt"))<=adm_mvf, "1", null()))), \
  adm_prior_end=tonumber(mvindex(mvsort(mvmap(adm_same,if(isnotnull(tonumber(json_extract(replace(adm_same,"^[^#]*#",""),"vt"))) AND tonumber(json_extract(replace(adm_same,"^[^#]*#",""),"vt"))<=adm_mvf,printf("%020.6f",tonumber(json_extract(replace(adm_same,"^[^#]*#",""),"vt"))),null()))),-1)), \
  adm_absent=mvmap(adm_ptimes, if(tonumber(adm_ptimes)<first_seen \
    AND NOT isnotnull(mvfind(adm_presence,"^".sha256(sha256(adm_ck)."@".tostring(adm_ptimes))."$")), adm_ptimes, null())), \
  adm_isnew=if(isnull(adm_match) OR (isnotnull(adm_mvt) AND adm_mvt<=first_seen) OR (mvcount(adm_absent)>0 AND adm_mvf<=tonumber(mvindex(mvsort(adm_absent), -1))), 1, 0), \
  adm_match_ls=tonumber(json_extract(adm_match, "ls")), adm_match=if(adm_isnew==1, null(), adm_match), \
  valid_to=case(isnotnull(adm_deleted), adm_deleted, isnotnull(adm_next) AND (isnull(adm_mvt) OR adm_isnew==1 OR tonumber(adm_next)<adm_mvt), tonumber(adm_next), isnotnull(adm_mvt) AND adm_isnew==0, adm_mvt), \
  valid_from=case(isnull(adm_match), first_seen, adm_use_future==1, min(first_seen, adm_mvf), coalesce(adm_prior, 0)>0 AND first_seen<adm_prior_end, adm_mvf, true(), min(first_seen, adm_mvf)), \
  first_seen=if(isnull(adm_match), first_seen, max(valid_from, min(first_seen, tonumber(json_extract(adm_match, "fs"))))), \
  adm_payload=if(adm_isnew==0 AND adm_match_ls>last_seen, adm_match, adm_payload), \
  last_seen=max(last_seen, if(isnull(valid_to) OR adm_match_ls<valid_to, coalesce(adm_match_ls, last_seen), last_seen)), \
  _key=coalesce(json_extract(adm_match, "k"), sha256(adm_lkey."|".adm_ck."|".printf("%.6f", valid_from))), adm_new=1 \
| eval adm_closure_rows=mvfilter(json_extract(adm_stored,"kind")=="k8s_service") \
| eventstats max(eval(if(adm_prow==1,coalesce(mvcount(adm_closure_rows),0),0))) AS adm_closure_expected by adm_lkey \
| appendpipe [| where adm_prow==1 AND adm_closure_expected>0 \
    | eval adm_stored=adm_closure_rows \
    | mvexpand adm_stored \
    | appendpipe [| stats count AS adm_closure_actual max(adm_closure_expected) AS adm_closure_expected by adm_lkey | eval adm_closure_footer=1] \
    | eval adm_ck=json_extract(adm_stored, "ck"), adm_new=0, adm_sls=tonumber(json_extract(adm_stored, "ls")), adm_svf=tonumber(json_extract(adm_stored, "vf")), adm_svt=tonumber(json_extract(adm_stored, "vt")), \
      adm_close=mvindex(mvsort(mvmap(adm_ptimes, if(tonumber(adm_ptimes)>adm_svf AND NOT isnotnull(mvfind(adm_presence,"^".sha256(sha256(adm_ck)."@".tostring(adm_ptimes))."$")), adm_ptimes, null()))), 0) \
    | where adm_closure_footer==1 OR (isnotnull(adm_close) AND (isnull(adm_svt) OR adm_close<adm_svt)) \
    | eval _key=json_extract(adm_stored, "k"), adm_payload=adm_stored, first_seen=tonumber(json_extract(adm_stored, "fs")), last_seen=if(adm_sls<adm_close, adm_sls, tonumber(json_extract(adm_stored, "fs"))), valid_from=tonumber(json_extract(adm_stored, "vf")), valid_to=adm_close, adm_prow=0 \
    | eval adm_last_gap=mvindex(mvsort(mvmap(adm_ptimes, if(tonumber(adm_ptimes)<=adm_sls \
        AND NOT isnotnull(mvfind(adm_presence,"^".sha256(sha256(adm_ck)."@".tostring(adm_ptimes))."$")), adm_ptimes, null()))), -1), \
      adm_future_gap=mvindex(mvsort(mvmap(adm_ptimes, if(tonumber(adm_ptimes)>adm_sls \
        AND NOT isnotnull(mvfind(adm_presence,"^".sha256(sha256(adm_ck)."@".tostring(adm_ptimes))."$")), adm_ptimes, null()))), 0), \
      adm_reopen_times=mvmap(adm_present, if(mvindex(split(adm_present, "@"), 0)==sha256(adm_ck) \
        AND tonumber(mvindex(split(adm_present, "@"), 1))>tonumber(adm_last_gap) AND tonumber(mvindex(split(adm_present, "@"), 1))<=adm_sls, 1, null())) \
    | appendpipe [| where adm_sls>adm_close AND isnull(adm_reopen_times) \
        | eval valid_from=adm_sls, first_seen=adm_sls, last_seen=adm_sls, valid_to=if(isnotnull(adm_future_gap) AND (isnull(adm_svt) OR tonumber(adm_future_gap)<adm_svt), tonumber(adm_future_gap), adm_svt), _key=sha256(_key."|split|".adm_close."|".adm_sls)]] \
| eventstats max(adm_closure_actual) AS adm_closure_actual max(adm_closure_expected) AS adm_closure_expected max(adm_stored_n) AS adm_stored_n by adm_lkey \
| eval adm_history_complete=if(adm_closure_expected==coalesce(adm_closure_actual,0),adm_history_complete,0) \
| where isnull(adm_closure_footer) \
| appendpipe [| where adm_prow==1 \
    | stats first(adm_payload) AS adm_payload first(adm_kind) AS adm_kind first(adm_ck) AS adm_ck first(adm_puid) AS adm_puid first(cluster) AS cluster first(scope) AS scope values(service_snapshot_history) AS service_snapshot_history min(adm_history_complete) AS adm_history_complete max(adm_stored_n) AS adm_stored_n min(first_seen) AS first_seen max(last_seen) AS last_seen max(adm_latest_parent) AS adm_latest_parent by adm_lkey \
    | eval adm_anchor_output=1, adm_new=1, _key=sha256("service-parent|".adm_lkey), valid_from=first_seen, valid_to=null(), last_seen=adm_latest_parent, adm_payload=json_object("source", "k8s_service_parent", "kind", "k8s_service_parent", "id", adm_puid, "name", adm_puid, "ip", "service-parent:".adm_lkey, "sc", scope, "sm", json_extract(adm_payload,"sm"), "cluster", cluster, "ek", "service-parent:".adm_lkey)] \
| where coalesce(adm_prow, 0)!=1 OR adm_anchor_output==1 \
| sort 0 - adm_new \
| dedup _key \
| eval source=json_extract(adm_payload, "source"), entity_kind=json_extract(adm_payload, "kind"), entity_id=json_extract(adm_payload, "id"), entity_name=json_extract(adm_payload, "name"), ip=json_extract(adm_payload, "ip"), scope=json_extract(adm_payload, "sc"), scope_mapping_verified=tonumber(json_extract(adm_payload,"sm")), cluster=json_extract(adm_payload, "cluster"), namespace=json_extract(adm_payload, "ns"), node=json_extract(adm_payload, "node"), owner_kind=json_extract(adm_payload, "owner_kind"), owner_name=json_extract(adm_payload, "owner"), tenant=json_extract(adm_payload, "tenant"), app_profile=json_extract(adm_payload, "ap"), epg=json_extract(adm_payload, "epg"), attach_device=json_extract(adm_payload, "dev"), attach_interface=json_extract(adm_payload, "if"), mac=json_extract(adm_payload, "mac"), vm_name=json_extract(adm_payload, "vm"), ek=json_extract(adm_payload, "ek"), port=json_extract(adm_payload, "port"), transport=json_extract(adm_payload, "tp"), svc_type=json_extract(adm_payload, "svct"), traffic_policy=json_extract(adm_payload, "etp"), lb_mode=json_extract(adm_payload, "lbm"), lb_mode_source=json_extract(adm_payload, "lbmsrc"), controller=json_extract(adm_payload, "ctl"), owner_ref_kind=json_extract(adm_payload, "ownk"), owner_ref_name=json_extract(adm_payload, "ownn"), target_port=json_extract(adm_payload, "tport"), port_name=json_extract(adm_payload, "pn") \
| eval priority=0, service=entity_name, service_uid=entity_id, service_child_key=adm_ck, adm_observed=adm_new, adm_close=if(adm_new==0, 1, 0), \
  adm_truncated=if(adm_stored_n>=`adm_identity_max_matches`, 1, 0), adm_network_complete=if(adm_stored_n>=`adm_identity_max_matches` OR adm_history_complete!=1, 0, coalesce(adm_network_complete, 1)), updated=now(), \
  adm_write=if(adm_stored_n<`adm_identity_max_matches` AND adm_history_complete==1 AND coalesce(adm_network_complete, 1)==1, 1, 0) \
| eval adm_anchor_snapshots=if(entity_kind=="k8s_service_parent",json_array_to_mv(service_snapshot_history),null()), \
    adm_anchor_last=mvindex(mvsort(mvmap(adm_anchor_snapshots,printf("%020.6f",tonumber(json_extract(adm_anchor_snapshots,"t")))."#".adm_anchor_snapshots)),-1) \
| eval valid_to=if(entity_kind=="k8s_service_parent" AND coalesce(json_extract(replace(adm_anchor_last,"^[^#]*#",""),"p"),"")=="",last_seen,valid_to) \
| `adm_identity_desc` \
| `adm_service_frontend_replacements`
description = Reconciles complete per-Service snapshots against UID-scoped retained frontend intervals, including absence, deletion, reappearance and chronological or indexed-late replay. Capped UID lookup results suppress writes.

[adm_service_frontend_replacements]
definition = lookup local=true adm_ip_identity ip AS ip scope AS scope OUTPUT desc AS adm_replacement_rows \
| eval adm_replacement_n=coalesce(mvcount(adm_replacement_rows),0), adm_replacement_rows=mvfilter(json_extract(adm_replacement_rows,"kind")=="k8s_service") \
| eval adm_replacement_expected=coalesce(mvcount(adm_replacement_rows),0) \
| appendpipe [| where entity_kind=="k8s_service" \
    | stats values(adm_replacement_rows) AS adm_replacement_rows max(adm_replacement_n) AS adm_replacement_n max(adm_replacement_expected) AS adm_replacement_expected by ip scope \
    | mvexpand adm_replacement_rows \
    | where json_extract(adm_replacement_rows,"kind")=="k8s_service" \
    | eval adm_payload=adm_replacement_rows \
| eval source=json_extract(adm_payload, "source"), entity_kind=json_extract(adm_payload, "kind"), entity_id=json_extract(adm_payload, "id"), entity_name=json_extract(adm_payload, "name"), ip=json_extract(adm_payload, "ip"), scope=json_extract(adm_payload, "sc"), scope_mapping_verified=tonumber(json_extract(adm_payload,"sm")), cluster=json_extract(adm_payload, "cluster"), namespace=json_extract(adm_payload, "ns"), node=json_extract(adm_payload, "node"), owner_kind=json_extract(adm_payload, "owner_kind"), owner_name=json_extract(adm_payload, "owner"), tenant=json_extract(adm_payload, "tenant"), app_profile=json_extract(adm_payload, "ap"), epg=json_extract(adm_payload, "epg"), attach_device=json_extract(adm_payload, "dev"), attach_interface=json_extract(adm_payload, "if"), mac=json_extract(adm_payload, "mac"), vm_name=json_extract(adm_payload, "vm"), ek=json_extract(adm_payload, "ek"), port=json_extract(adm_payload, "port"), transport=json_extract(adm_payload, "tp"), svc_type=json_extract(adm_payload, "svct"), traffic_policy=json_extract(adm_payload, "etp"), lb_mode=json_extract(adm_payload, "lbm"), lb_mode_source=json_extract(adm_payload, "lbmsrc"), controller=json_extract(adm_payload, "ctl"), owner_ref_kind=json_extract(adm_payload, "ownk"), owner_ref_name=json_extract(adm_payload, "ownn"), target_port=json_extract(adm_payload, "tport"), port_name=json_extract(adm_payload, "pn") \
    | eval valid_from=tonumber(json_extract(adm_payload,"vf")), valid_to=tonumber(json_extract(adm_payload,"vt")), first_seen=tonumber(json_extract(adm_payload,"fs")), last_seen=tonumber(json_extract(adm_payload,"ls")), \
        _key=coalesce(json_extract(adm_payload,"k"), sha256(source."|".entity_kind."|".entity_id."|".ip."|".scope."|".port."|".transport)), \
        service_uid=entity_id, service_child_key=json_extract(adm_payload,"sck"), priority=0, adm_observed=0, adm_write=0, adm_replacement_old=1] \
| eventstats sum(adm_replacement_old) AS adm_replacement_actual max(adm_replacement_expected) AS adm_replacement_expected by ip scope \
| eventstats min(adm_network_complete) AS adm_group_complete max(adm_replacement_n) AS adm_group_lookup_n by ip scope \
| eval adm_network_complete=if(adm_replacement_expected==coalesce(adm_replacement_actual,0) AND adm_group_complete==1 AND adm_group_lookup_n<`adm_identity_max_matches`,1,0) \
| sort 0 -adm_observed -adm_write \
| dedup _key \
| eval adm_replacement_class=if(entity_kind=="k8s_service", tostring(port)."/".transport, "ignore:"._key) \
| eventstats count AS adm_replacement_candidates by ip scope \
| eval adm_network_complete=if(adm_replacement_candidates>=`adm_identity_max_matches`,0,adm_network_complete), adm_truncated=if(adm_replacement_candidates>=`adm_identity_max_matches`,1,adm_truncated) \
| eventstats values(eval(if(adm_network_complete==1,json_object("id",entity_id,"t",valid_from),null()))) AS adm_replacement_starts by scope ip adm_replacement_class \
| eval adm_next_from=tonumber(mvindex(mvsort(mvmap(adm_replacement_starts,if(json_extract(adm_replacement_starts,"id")!=entity_id AND tonumber(json_extract(adm_replacement_starts,"t"))>valid_from,printf("%020.6f",tonumber(json_extract(adm_replacement_starts,"t"))),null()))),0)) \
| eval adm_replacement_close=if(adm_network_complete==1 AND entity_kind=="k8s_service" AND isnotnull(adm_next_from) AND (isnull(valid_to) OR valid_to>adm_next_from),1,0), \
    valid_to=if(adm_replacement_close==1,adm_next_from,valid_to), \
    adm_network_complete=if(adm_replacement_n>=`adm_identity_max_matches`,0,coalesce(adm_network_complete,1)), \
    adm_write=if(adm_replacement_n>=`adm_identity_max_matches` OR adm_network_complete==0,0,if(adm_replacement_close==1,1,adm_write)), \
    adm_close=if(adm_replacement_close==1,1,adm_close), updated=now() \
| where coalesce(adm_replacement_old,0)==0 OR adm_replacement_close==1 \
| `adm_identity_desc`
description = Closes an earlier Service UID when another Service takes the same frontend IP, port and transport. Preserves each interval key and refuses capped IP lookups.

[adm_identity_merge_base]
definition = eval adm_new=1 \
| lookup adm_ip_identity ip AS ip scope AS scope OUTPUT desc AS adm_group \
| eval adm_group_n=coalesce(mvcount(adm_group), 0) \
| appendpipe [| stats values(adm_group) AS adm_desc max(adm_group_n) AS adm_group_n by ip scope | mvexpand adm_desc \
    | eval adm_new=0, valid_from=tonumber(json_extract(adm_desc, "vf")), valid_to=tonumber(json_extract(adm_desc, "vt")), \
      first_seen=tonumber(json_extract(adm_desc, "fs")), last_seen=tonumber(json_extract(adm_desc, "ls")), priority=tonumber(json_extract(adm_desc, "p")), \
      entity_kind=json_extract(adm_desc, "kind"), entity_id=json_extract(adm_desc, "id"), entity_name=json_extract(adm_desc, "name"), \
      cluster=json_extract(adm_desc, "cluster"), namespace=json_extract(adm_desc, "ns"), node=json_extract(adm_desc, "node"), \
      owner_kind=json_extract(adm_desc, "owner_kind"), owner_name=json_extract(adm_desc, "owner"), tenant=json_extract(adm_desc, "tenant"), \
      app_profile=json_extract(adm_desc, "ap"), epg=json_extract(adm_desc, "epg"), attach_device=json_extract(adm_desc, "dev"), \
      attach_interface=json_extract(adm_desc, "if"), mac=json_extract(adm_desc, "mac"), vm_name=json_extract(adm_desc, "vm"), \
      source=json_extract(adm_desc, "source"), scope_mapping_verified=tonumber(json_extract(adm_desc,"sm")), ek=json_extract(adm_desc, "ek"), \
      port=tonumber(json_extract(adm_desc, "port")), transport=json_extract(adm_desc, "tp"), svc_type=json_extract(adm_desc, "svct"), \
      traffic_policy=json_extract(adm_desc, "etp"), lb_mode=json_extract(adm_desc, "lbm"), lb_mode_source=json_extract(adm_desc, "lbmsrc"), controller=json_extract(adm_desc, "ctl"), \
      owner_ref_kind=json_extract(adm_desc, "ownk"), owner_ref_name=json_extract(adm_desc, "ownn"), target_port=json_extract(adm_desc, "tport"), \
      port_name=json_extract(adm_desc, "pn"), attr_vlan=json_extract(adm_desc, "vlan"), attr_bridge_domain=json_extract(adm_desc, "bd"), \
      attr_vlan_status=json_extract(adm_desc, "vlan_status"), attr_bridge_domain_status=json_extract(adm_desc, "bd_status"), \
      network_history=json_array_to_mv(json_extract(adm_desc, "nh")), attr_network_history_capped=json_extract(adm_desc, "nhc"), attr_nhc_te=tonumber(json_extract(adm_desc, "nhc_te")), \
      service=if(entity_kind=="k8s_service", entity_name, null())] \
| fields - adm_group adm_desc \
| where isnotnull(source) AND isnotnull(entity_id) AND entity_kind!="k8s_service" AND entity_kind!="k8s_service_parent" \
| eventstats max(adm_group_n) AS adm_group_n min(adm_network_complete) AS adm_network_complete by ip scope \
| eval adm_k=sha256(source."|".entity_kind."|".entity_id."|".ip."|".scope.if(entity_kind=="k8s_service", "|".port."|".transport, "").if(scope=="default", "|scope-verified-v1", "")) \
| sort 0 - last_seen - adm_new \
| stats min(valid_from) AS valid_from max(valid_to) AS valid_to min(first_seen) AS first_seen max(last_seen) AS last_seen \
    first(entity_name) AS entity_name first(cluster) AS cluster first(namespace) AS namespace first(node) AS node \
    first(owner_kind) AS owner_kind first(owner_name) AS owner_name first(tenant) AS tenant first(app_profile) AS app_profile first(epg) AS epg \
    first(attach_device) AS attach_device first(attach_interface) AS attach_interface first(mac) AS mac first(vm_name) AS vm_name \
    first(ek) AS ek max(scope_mapping_verified) AS scope_mapping_verified min(priority) AS priority max(adm_new) AS adm_observed max(adm_group_n) AS adm_group_n max(adm_no_cluster) AS adm_no_cluster min(adm_network_complete) AS adm_network_complete \
    first(port) AS port first(transport) AS transport first(service) AS service first(svc_type) AS svc_type first(traffic_policy) AS traffic_policy \
    first(lb_mode) AS lb_mode first(lb_mode_source) AS lb_mode_source first(controller) AS controller first(owner_ref_kind) AS owner_ref_kind first(owner_ref_name) AS owner_ref_name first(target_port) AS target_port \
    first(port_name) AS port_name \
    first(attr_vlan) AS attr_vlan values(attr_vlan) AS attr_vlans first(attr_bridge_domain) AS attr_bridge_domain values(attr_bridge_domain) AS attr_bds first(attr_vlan_status) AS attr_vlan_status first(attr_bridge_domain_status) AS attr_bridge_domain_status \
    values(network_history) AS network_histories max(attr_network_history_capped) AS attr_network_history_capped max(attr_nhc_te) AS attr_nhc_te \
    by adm_k source entity_kind entity_id ip scope \
| eval adm_nh_expected=coalesce(mvcount(network_histories), 0) \
| appendpipe [| where isnotnull(network_histories) \
    | fields adm_k last_seen network_histories \
    | mvexpand network_histories \
    | eval adm_nh_expanded_row=1 \
    | appendpipe [| eval adm_nh_t=tonumber(json_extract(network_histories, "t")), adm_nh_te=coalesce(tonumber(json_extract(network_histories, "te")), tonumber(json_extract(network_histories, "t"))), \
        adm_nh_state=json_array(coalesce(tostring(json_extract(network_histories, "v")), ""), coalesce(tostring(json_extract(network_histories, "b")), ""), coalesce(tostring(json_extract(network_histories, "bd_dn")), ""), \
          coalesce(tostring(json_extract(network_histories, "bd_tenant")), ""), coalesce(tostring(json_extract(network_histories, "source")), ""), coalesce(tostring(json_extract(network_histories, "vs")), ""), coalesce(tostring(json_extract(network_histories, "bs")), "")) \
    | where isnotnull(adm_nh_t) \
    | sort 0 adm_k adm_nh_t adm_nh_te \
    | streamstats current=f window=1 last(adm_nh_state) AS adm_nh_prev_state by adm_k \
    | streamstats current=f max(adm_nh_te) AS adm_nh_prev_te by adm_k \
    | eval adm_nh_start=if(isnull(adm_nh_prev_state) OR adm_nh_prev_state!=adm_nh_state OR adm_nh_t-adm_nh_prev_te>2*`adm_poll_interval`, 1, 0) \
    | streamstats sum(adm_nh_start) AS adm_nh_run by adm_k \
    | stats first(network_histories) AS adm_nh_first first(adm_nh_state) AS adm_nh_state min(adm_nh_t) AS adm_nh_rt max(adm_nh_te) AS adm_nh_rte first(last_seen) AS last_seen by adm_k adm_nh_run \
    | where adm_nh_rte>=last_seen-`adm_identity_retention` \
    | eval adm_nh_item=json_set(adm_nh_first, "t", adm_nh_rt, "te", adm_nh_rte) \
    | sort 0 adm_k -adm_nh_rt \
    | streamstats count AS adm_nh_rank by adm_k \
    | eventstats count(eval(if(adm_nh_rank<=`adm_network_history_cap`, 1, null()))) AS adm_nh_kept_n by adm_k adm_nh_state \
    | stats values(eval(if(adm_nh_rank<=`adm_network_history_cap`, printf("%020.6f", adm_nh_rt)."#".adm_nh_item, null()))) AS adm_nh_runs \
        max(eval(if(adm_nh_rank>`adm_network_history_cap` AND adm_nh_kept_n==0, adm_nh_rte, null()))) AS adm_nh_drop_te \
        min(eval(if(adm_nh_rank<=`adm_network_history_cap`, adm_nh_rt, null()))) AS adm_nh_min_t by adm_k] \
    | stats sum(adm_nh_expanded_row) AS adm_nh_actual values(adm_nh_runs) AS adm_nh_runs \
        max(adm_nh_drop_te) AS adm_nh_drop_te min(adm_nh_min_t) AS adm_nh_min_t by adm_k \
    | eval adm_nh_added=1] \
| eventstats max(adm_nh_actual) AS adm_nh_actual values(adm_nh_runs) AS adm_nh_runs max(adm_nh_drop_te) AS adm_nh_drop_te min(adm_nh_min_t) AS adm_nh_min_t by adm_k \
| where isnull(adm_nh_added) \
| eval adm_network_complete=if(adm_nh_expected==coalesce(adm_nh_actual, 0), coalesce(adm_network_complete, 1), 0) \
| eval attr_nhc_te=if(attr_network_history_capped=="1" AND isnull(attr_nhc_te), coalesce(adm_nh_min_t, last_seen-`adm_identity_retention`-1), attr_nhc_te), \
  attr_nhc_te=case(isnull(adm_nh_drop_te), attr_nhc_te, isnull(attr_nhc_te), adm_nh_drop_te, true(), max(attr_nhc_te, adm_nh_drop_te)), \
  attr_nhc_te=if(attr_nhc_te>=last_seen-`adm_identity_retention`, attr_nhc_te, null()), \
  attr_network_history_capped=if(isnotnull(attr_nhc_te), "1", null()), \
  adm_nh_sorted=adm_nh_runs, \
  adm_nh_recent=mvmap(adm_nh_sorted, replace(adm_nh_sorted, "^[^#]*#", "")), \
  adm_nh_vrows=mvfilter(isnotnull(json_extract(adm_nh_recent, "v")) AND len(tostring(json_extract(adm_nh_recent, "v")))>0), \
  adm_nh_brows=mvfilter(isnotnull(json_extract(adm_nh_recent, "b")) AND len(tostring(json_extract(adm_nh_recent, "b")))>0), \
  adm_nh_vpresent=coalesce(mvcount(adm_nh_vrows), 0), adm_nh_bpresent=coalesce(mvcount(adm_nh_brows), 0), \
  adm_nh_vlans=mvdedup(mvmap(adm_nh_vrows, tostring(json_extract(adm_nh_vrows, "v")))), \
  adm_nh_bdkeys=mvdedup(mvmap(adm_nh_brows, json_array(json_extract(adm_nh_brows, "b"), json_extract(adm_nh_brows, "bd_dn"), json_extract(adm_nh_brows, "bd_tenant"), json_extract(adm_nh_brows, "source")))), \
  adm_nh_vstatus=mvdedup(mvmap(adm_nh_recent, json_extract(adm_nh_recent, "vs")."")), \
  adm_nh_bstatus=mvdedup(mvmap(adm_nh_recent, json_extract(adm_nh_recent, "bs")."")), \
  adm_nh_vcount=coalesce(mvcount(adm_nh_vlans), 0), adm_nh_bdcount=coalesce(mvcount(adm_nh_bdkeys), 0), adm_nh_sample_count=coalesce(mvcount(adm_nh_recent), 0), \
  attr_vlan_status=if(adm_nh_sample_count>0, case(adm_nh_vcount>1, "varies", adm_nh_vpresent<adm_nh_sample_count, "incomplete", `adm_mv_has_str(adm_nh_vstatus, varies)`, "varies", `adm_mv_has_str(adm_nh_vstatus, incomplete)` OR attr_network_history_capped=="1", "incomplete"), attr_vlan_status), \
  attr_bridge_domain_status=if(adm_nh_sample_count>0, case(adm_nh_bdcount>1, "varies", adm_nh_bpresent<adm_nh_sample_count, "incomplete", `adm_mv_has_str(adm_nh_bstatus, varies)`, "varies", `adm_mv_has_str(adm_nh_bstatus, incomplete)` OR attr_network_history_capped=="1", "incomplete"), attr_bridge_domain_status), \
  attr_vlan=if(adm_nh_sample_count>0 AND isnull(attr_vlan_status) AND adm_nh_vcount==1, mvindex(adm_nh_vlans, 0), if(isnotnull(attr_vlan_status), null(), attr_vlan)), \
  attr_bridge_domain=if(adm_nh_sample_count>0 AND isnull(attr_bridge_domain_status) AND adm_nh_bdcount==1, json_extract(mvindex(adm_nh_brows, 0), "b"), if(isnotnull(attr_bridge_domain_status), null(), attr_bridge_domain)), \
  network_history=if(adm_nh_sample_count>0, "[".mvjoin(adm_nh_recent, ",")."]", null()), \
  adm_class=case(entity_kind=="pod", "pod", entity_kind=="k8s_node", "node", entity_kind=="k8s_node_proxy", "proxy", \
    entity_kind=="k8s_service", "svc:".port."/".transport, source=="nd_endpoints", "nd", true(), "none") \
| sort 0 scope ip adm_class -valid_from \
| streamstats current=f window=1 last(valid_from) AS adm_next_from last(entity_id) AS adm_next_id by scope ip adm_class \
| eval adm_truncated=if(adm_group_n>=`adm_identity_max_matches`, 1, 0), \
  adm_close=if(coalesce(adm_network_complete,1)==1 AND adm_class!="none" AND adm_truncated==0 AND isnotnull(adm_next_from) AND adm_next_id!=entity_id \
    AND (isnull(valid_to) OR valid_to>adm_next_from), 1, 0), \
  valid_to=if(adm_close==1, adm_next_from, valid_to), \
  adm_write=if(coalesce(adm_network_complete,1)==1 AND (adm_observed==1 OR adm_close==1), 1, 0), updated=now(), _key=adm_k \
| `adm_identity_desc`
description = Combines new observations with the stored rows of the same IP and scope (read through the lookup, never a full collection read) and closes the earlier interval when another pod, node, Envoy address, Service frontend (same port) or Nexus Dashboard endpoint later takes the IP. Skips closing for IPs whose stored rows may be truncated.
[adm_identity_build]
definition = `adm_identity_observations` | `adm_identity_merge` \
| appendpipe [| where adm_write==1 \
    | fields _key ip scope scope_mapping_verified entity_kind entity_id entity_name cluster namespace owner_kind owner_name node tenant app_profile epg attach_device attach_interface mac vm_name valid_from valid_to valid_end first_seen last_seen priority source ek updated desc \
    attr_vlan attr_bridge_domain attr_vlan_status attr_bridge_domain_status network_history attr_network_history_capped port transport service service_uid svc_type traffic_policy lb_mode lb_mode_source controller owner_ref_kind owner_ref_name target_port port_name \
    | outputlookup append=true key_field=_key override_if_empty=false adm_ip_identity | where false()] \
| stats sum(adm_write) AS rows_written count(eval(adm_observed==1)) AS rows_observed sum(adm_close) AS rows_closed \
    dc(eval(if(adm_truncated==1, ip, null()))) AS truncated_ips sum(adm_no_cluster) AS rows_missing_cluster min(adm_network_complete) AS network_lookup_complete \
| eval warnings=mvappend(if(network_lookup_complete==0, "Identity evidence was incomplete; affected rows were not written.", null()), if(truncated_ips>0, truncated_ips." IPs returned adm_identity_max_matches stored rows; their intervals were not closed.", null()), \
    if(rows_missing_cluster>0, rows_missing_cluster." pod rows had no k8s.cluster.name and were stored with cluster unknown; set clusterName in the Helm chart.", null()))
description = Upserts identity rows (outputlookup append=true key_field=_key) and returns one summary row with warnings. Never deletes rows; see ADM - Identity prune.

# ---- source-qualified Catalyst and Meraki client evidence (contract v1) ----

[adm_network_client_meraki_raw]
definition = `adm_index_meraki` sourcetype="meraki:accesspoints" \
    | spath input=_raw path=type output=adm_raw_event_type \
    | where lower(adm_raw_event_type)=="association" \
    | eval source="meraki_association", source_authority=if(len(trim(coalesce(organizationId,"")))>0 AND len(trim(coalesce(networkId,"")))>0, json_array(organizationId, networkId), ""), routing_domain=coalesce(networkId, ""), \
      native_id=coalesce(lower('eventData.client_mac'), lower(clientMac)), client_mac=lower(coalesce('eventData.client_mac', clientMac)), \
      client_ip=`adm_ip('eventData.client_ip')`, event_type=lower(adm_raw_event_type), source_time=`adm_iso_time(occurredAt)`, \
      attachment_status="unresolved", attachment_basis="meraki_association_event", attachment_device_id=if(isnotnull(deviceSerial) AND len(trim(deviceSerial))>0, "meraki:".sha256(json_array("meraki_device", tostring(coalesce(organizationId,"")), tostring(coalesce(networkId,"")), tostring(deviceSerial))), null()), \
      attachment_device_name=deviceName, device_serial=deviceSerial, ssid_number=if(isnotnull(ssidNumber), tostring(ssidNumber), null()), event_fingerprint=sha256(json_array(source, source_authority, event_type, source_time, native_id, client_mac, client_ip, deviceSerial, deviceName, ssidNumber)), raw_ref=sha256(_raw), received_time=_indextime, contract_version=1, domain_kind="network"
description = Private Meraki raw association adapter; inherits caller event/index bounds. No Catalyst index is referenced.

[adm_network_client_catalyst_raw]
definition = `adm_index_catalyst` sourcetype="cisco:dnac:client" \
    | spath input=_raw path=type output=adm_raw_client_type \
    | eval source="catalyst_client_snapshot", source_authority=if(len(trim(coalesce(cisco_catalyst_host,"")))>0, trim(cisco_catalyst_host), ""), routing_domain=coalesce(siteId, ""), \
      client_mac=lower(macAddress), native_id=if(isnotnull(id) AND len(trim(tostring(id)))>0, trim(tostring(id)), lower(macAddress)), client_ip=`adm_ip(ipv4Address)`, event_type="snapshot", client_type=lower(adm_raw_client_type), \
      connected_device_type='connectedNetworkDevice.connectedNetworkDeviceType', interface='connectedNetworkDevice.interfaceName', \
      source_time=tonumber(lastUpdatedTime)/1000, received_time=_indextime, latest_received_time=_indextime, attachment_status=case(lower(coalesce(adm_raw_client_type,""))!="wired", "unsupported_client_type", lower(coalesce(connectionStatus,""))!="connected", "disconnected_snapshot", coalesce(connected_device_type,"")!="Switch" OR isnull(interface) OR len(trim(interface))==0, "incomplete_snapshot", true(), "observed_snapshot"), attachment_basis="catalyst_client_snapshot", domain_kind="controller", \
      attachment_device_id=if(isnotnull('connectedNetworkDevice.connectedNetworkDeviceMac'), "catalyst:".sha256(json_array(cisco_catalyst_host, 'connectedNetworkDevice.connectedNetworkDeviceMac')), null()), \
      attachment_device_name='connectedNetworkDevice.connectedNetworkDeviceName', attachment_device_mac=lower('connectedNetworkDevice.connectedNetworkDeviceMac'), \
      event_fingerprint=sha256(json_array(source, source_authority, routing_domain, native_id, client_mac, client_ip, lastUpdatedTime, client_type, connectionStatus, connected_device_type, 'connectedNetworkDevice.connectedNetworkDeviceName', lower('connectedNetworkDevice.connectedNetworkDeviceMac'), 'connectedNetworkDevice.connectedNetworkDeviceManagementIp', interface)), raw_ref=sha256(_raw), contract_version=1
description = Private Catalyst snapshot adapter; inherits caller event/index bounds. Source time and indexed receipt remain separate.

[adm_network_client_normalize]
definition = eval source_authority=coalesce(source_authority, ""), routing_domain=coalesce(routing_domain, ""), native_id=coalesce(native_id, client_mac, ""), \
    client_mac=if(match(client_mac, "(?i)^(?:[0-9a-f]{2}:){5}[0-9a-f]{2}$"), client_mac, null()), \
    client_ip=if(`adm_is_ip(client_ip)`, client_ip, null()), \
    _key=sha256(json_array(contract_version, source, source_authority, native_id, event_fingerprint)) \
| eval observation_domain_present="0", observation_domain_id="", vpn_id="" \
| eval mapping_key=sha256(json_array(tostring(coalesce(source,"")), tostring(coalesce(source_authority,"")), tostring(coalesce(domain_kind,"")), tostring(coalesce(observation_domain_present,"")), tostring(coalesce(observation_domain_id,"")), tostring(coalesce(vpn_id,"")), tostring(coalesce(routing_domain,"")))) \
| lookup local=true adm_network_source_scope mapping_key OUTPUT _key AS adm_mapping_keys scope cluster mapping_status AS adm_mapping_status profile duplicate_count AS adm_duplicate_counts \
| eval adm_mapping_count=mvcount(adm_mapping_keys), adm_mapping_truncated=if(adm_mapping_count>=1000, 1, 0), adm_duplicate_rows=if(mvcount(adm_duplicate_counts)!=1 OR mvfind(adm_duplicate_counts, "^1$")<0, 1, 0), \
    mapping_status=case(adm_mapping_truncated==1 OR adm_duplicate_rows==1 OR adm_mapping_count>1, "ambiguous", adm_mapping_count==1 AND mvcount(scope)==1 AND mvcount(cluster)==1 AND mvcount(profile)==1 AND mvcount(adm_mapping_status)==1 AND mvindex(adm_mapping_status,0)=="mapped", "mapped", adm_mapping_count>0, "ambiguous", true(), "unmapped"), \
    scope=if(mapping_status="mapped", scope, null()), cluster=if(mapping_status="mapped", cluster, null()), \
    adm_domain_kind=domain_kind, adm_profile=profile, \
    quality_reason=case(isnull(client_mac), "missing_client_mac", isnull(source_time), "missing_source_time", len(source_authority)==0, "missing_source_authority", mapping_status=="ambiguous", "source_scope_ambiguous", mapping_status!="mapped", "scope_unmapped", true(), null()) \
| where isnotnull(event_fingerprint) \
| fields _key contract_version source source_authority native_id event_fingerprint client_mac client_ip scope cluster routing_domain adm_domain_kind adm_profile mapping_status source_time received_time collected_time event_type client_type connected_device_type attachment_status attachment_basis attachment_device_id attachment_device_name attachment_device_mac device_serial ssid_number interface quality_reason raw_ref
description = Private common client evidence validation and exact source-domain scope lookup. Does not change source or receipt timestamps.

[adm_network_client_history_observations]
definition = multisearch [search `adm_network_client_meraki_raw`] [search `adm_network_client_catalyst_raw`] | `adm_network_client_normalize`
description = Normalizes only documented Meraki `association` events and Catalyst Center client snapshots. received_time is indexed receipt time; Catalyst lastUpdatedTime is freshness only and never backdates snapshot ownership. Source authority/domain mapping is explicit; unmapped records remain evidence but carry no scope. A missing event-type allowlist or unverified Meraki event shape is not promoted.

[adm_network_client_history_canonicalize]
definition = eval adm_client_semantic_key=sha256(json_array(tostring(coalesce(source,"")),tostring(coalesce(source_authority,"")),tostring(coalesce(native_id,"")),tostring(coalesce(routing_domain,"")),tostring(coalesce(scope,"")),tostring(coalesce(cluster,"")),tostring(coalesce(profile,"")),tostring(coalesce(mapping_status,"")),tostring(coalesce(client_mac,"")),tostring(coalesce(client_ip,"")),tostring(coalesce(source_time,"")),tostring(coalesce(event_type,"")),tostring(coalesce(client_type,"")),tostring(coalesce(connected_device_type,"")),tostring(coalesce(attachment_status,"")),tostring(coalesce(attachment_basis,"")),tostring(coalesce(attachment_device_id,"")),tostring(coalesce(attachment_device_name,"")),tostring(coalesce(attachment_device_mac,"")),tostring(coalesce(device_serial,"")),tostring(coalesce(ssid_number,"")),tostring(coalesce(interface,"")),tostring(coalesce(quality_reason,"")))) \
| eventstats min(received_time) AS received_time max(latest_received_time) AS latest_received_time values(_key) AS adm_client_history_keys values(raw_ref) AS adm_client_history_refs BY adm_client_semantic_key \
| eval _key=mvindex(mvsort(adm_client_history_keys),0), raw_ref=mvindex(mvsort(adm_client_history_refs),0), event_fingerprint=adm_client_semantic_key \
| dedup adm_client_semantic_key \
| fields - adm_client_history_keys adm_client_history_refs
description = Read-only semantic deduplication of retained legacy/new fingerprint keys. Exact source authority, native identity, routing domain, scope and cluster remain distinct; source/payload changes remain distinct. Earliest retained receipt is preserved, so upgrading the fingerprint or replaying equivalent payload cannot manufacture a later eligibility origin.

[adm_network_client_history_build]
definition = `adm_network_client_history_observations` \
| stats first(contract_version) AS contract_version first(source) AS source first(source_authority) AS source_authority first(native_id) AS native_id first(event_fingerprint) AS event_fingerprint \
    first(client_mac) AS client_mac first(client_ip) AS client_ip first(scope) AS scope first(cluster) AS cluster first(routing_domain) AS routing_domain first(adm_domain_kind) AS domain_kind first(adm_profile) AS profile first(mapping_status) AS mapping_status \
    first(source_time) AS source_time min(received_time) AS adm_first_received max(received_time) AS adm_this_latest first(collected_time) AS collected_time \
    first(event_type) AS event_type first(client_type) AS client_type first(connected_device_type) AS connected_device_type first(attachment_status) AS attachment_status first(attachment_basis) AS attachment_basis first(attachment_device_id) AS attachment_device_id \
    first(attachment_device_name) AS attachment_device_name first(attachment_device_mac) AS attachment_device_mac first(device_serial) AS device_serial first(ssid_number) AS ssid_number \
    first(interface) AS interface first(quality_reason) AS quality_reason first(raw_ref) AS raw_ref by _key \
| lookup local=true adm_network_client_history _key OUTPUT received_time AS adm_old_received latest_received_time AS adm_old_latest \
| eval received_time=min(coalesce(adm_old_received, adm_first_received), adm_first_received), latest_received_time=max(coalesce(adm_old_latest, 0), adm_this_latest) \
| appendpipe [| fields _key contract_version source source_authority native_id event_fingerprint client_mac client_ip scope cluster routing_domain domain_kind profile mapping_status source_time received_time latest_received_time collected_time event_type client_type connected_device_type attachment_status attachment_basis attachment_device_id attachment_device_name attachment_device_mac device_serial ssid_number interface quality_reason raw_ref \
    | outputlookup append=true key_field=_key override_if_empty=false adm_network_client_history | where false()] \
| stats count AS observations count(eval(mapping_status=="mapped")) AS mapped count(eval(mapping_status!="mapped")) AS incomplete \
| eval warnings=if(incomplete>0, incomplete." client evidence rows have no unambiguous source/domain scope mapping and were retained without correlation scope.", null())
description = Idempotently upserts the additive v1 network-client history collection and reports unmapped evidence. Does not mutate legacy adm_ip_identity keys, network_history or summary-index rows.

[adm_network_client_history_prune]
definition = `adm_kv_read_all(adm_network_client_history)` \
| eval adm_first_receipt=tonumber(received_time), adm_last_receipt=tonumber(latest_received_time) \
| eval adm_retention_receipt=if(isnotnull(adm_first_receipt) AND isnotnull(adm_last_receipt) AND adm_first_receipt>=0 AND adm_last_receipt>=0,max(adm_first_receipt,adm_last_receipt),null()) \
| eval adm_keep=if(isnull(adm_retention_receipt) OR adm_retention_receipt>=now()-`adm_identity_retention`, 1, 0) \
| appendpipe [| where `adm_prune_maintenance`==1 AND adm_complete==1 AND adm_page>=1 AND adm_keep==1 | fields - adm_* | outputlookup override_if_empty=false adm_network_client_history | where false()] \
| stats max(adm_complete) AS complete count(eval(adm_page>=1)) AS rows_read count(eval(adm_page>=1 AND adm_keep==0)) AS rows_expired \
| eval rows_pruned=if(`adm_prune_maintenance`==1 AND complete==1 AND rows_expired<rows_read, rows_expired, 0), \
  warnings=if(complete==1, if(rows_read>0 AND rows_expired==rows_read, "Network client history contains only expired rows; empty-write safeguard retained them. Administrator cleanup is required.", null()), "Network client history could not be read completely; nothing was pruned.")
description = Maintenance-only, bounded-retention prune for the staged append-only network client collection. Expiry uses the later of earliest/latest retained indexed receipts; missing/malformed receipt extrema are retained. Requires the shared prune gate and complete paged read.

[adm_identity_prune]
definition = `adm_kv_read_all(adm_ip_identity_all)` \
| eval adm_keep=if(isnull(valid_end) OR valid_end>=now()-`adm_identity_retention`, 1, 0) \
| appendpipe [| where `adm_prune_maintenance`==1 AND adm_complete==1 AND adm_page>=1 AND adm_keep==1 | fields - adm_* | outputlookup override_if_empty=false adm_ip_identity | where false()] \
| stats max(adm_complete) AS complete count(eval(adm_page>=1)) AS rows_read count(eval(adm_page>=1 AND adm_keep==0)) AS rows_expired \
| eval rows_pruned=if(`adm_prune_maintenance`==1 AND complete==1 AND rows_expired<rows_read, rows_expired, 0), \
  warnings=if(complete==1, if(rows_read>0 AND rows_expired==rows_read, "adm_ip_identity contains only expired rows; the empty-write safeguard retained them. Administrator cleanup is required.", null()), "adm_ip_identity could not be read completely (over 200,000 rows or limits.conf max_rows_per_query below 10,000); nothing was pruned.") \
| eval warnings=if(`adm_prune_maintenance`!=1, mvappend("Maintenance mode is disabled; nothing was pruned. Pause all builders, drain active jobs and back up collections before enabling adm_prune_maintenance.", warnings), warnings)
description = Rewrites adm_ip_identity without rows whose validity ended before the retention period, only after a provably complete paged read.

[adm_service_binding_build]
definition = `adm_index_traces` `adm_traces_sourcetype` \
| rename "service.name" AS service, "deployment.environment.name" AS environment, "k8s.cluster.name" AS cluster, "k8s.namespace.name" AS namespace, "k8s.pod.uid" AS pod_uid, "k8s.pod.name" AS pod_name \
| eval environment=coalesce(environment, 'deployment.environment') \
| where isnotnull(service) AND isnotnull(pod_uid) \
| fillnull value="" environment cluster namespace \
| stats min(_time) AS first_seen max(_time) AS last_seen latest(pod_name) AS pod_name by service environment cluster namespace pod_uid \
| eval adm_k=sha256(service."|".environment."|".cluster."|".namespace."|".pod_uid) \
| lookup adm_service_workload _key AS adm_k OUTPUT first_seen AS adm_old_first last_seen AS adm_old_last \
| eval first_seen=min(first_seen, coalesce(adm_old_first, first_seen)), last_seen=max(last_seen, coalesce(adm_old_last, last_seen)), updated=now(), _key=adm_k \
| fields _key service environment cluster namespace pod_uid pod_name first_seen last_seen updated \
| outputlookup append=true key_field=_key override_if_empty=false adm_service_workload \
| stats count AS rows_written
description = Upserts OTel service (service.name, deployment.environment.name, k8s.cluster.name, k8s.namespace.name) to pod UID bindings.

[adm_scope_options]
definition = inputlookup adm_service_workload \
| fillnull value="" environment cluster namespace service \
| stats max(last_seen) AS last_seen dc(pod_uid) AS pods by environment cluster namespace service \
| fields environment cluster namespace service last_seen pods \
| sort 0 environment cluster namespace service
description = Returns grounded service scope options from adm_service_workload. Blank dimensions are retained so invalid or incomplete bindings remain visible to the caller.

[adm_service_binding_prune]
definition = `adm_kv_read_all(adm_service_workload)` \
| eval adm_keep=if(last_seen>=now()-`adm_identity_retention`, 1, 0) \
| appendpipe [| where `adm_prune_maintenance`==1 AND adm_complete==1 AND adm_page>=1 AND adm_keep==1 | fields - adm_* | outputlookup override_if_empty=false adm_service_workload | where false()] \
| stats max(adm_complete) AS complete count(eval(adm_page>=1)) AS rows_read count(eval(adm_page>=1 AND adm_keep==0)) AS rows_expired \
| eval rows_pruned=if(`adm_prune_maintenance`==1 AND complete==1 AND rows_expired<rows_read, rows_expired, 0), \
  warnings=if(complete==1, if(rows_read>0 AND rows_expired==rows_read, "adm_service_workload contains only expired rows; the empty-write safeguard retained them. Administrator cleanup is required.", null()), "adm_service_workload could not be read completely; nothing was pruned.") \
| eval warnings=if(`adm_prune_maintenance`!=1, mvappend("Maintenance mode is disabled; nothing was pruned. Pause all builders, drain active jobs and back up collections before enabling adm_prune_maintenance.", warnings), warnings)
description = Rewrites adm_service_workload without bindings last seen before the retention period, only after a provably complete paged read.

# Segment each child by consecutive parent snapshots before merging stored intervals.
# Late absences may split a stored interval; retain its later ready observation in a new interval.
[adm_k8s_service_build]
definition = `adm_index_k8s` (sourcetype="kube:object:endpointslices" OR sourcetype="kube:object:httproutes" OR sourcetype="kube:object:ingresses") \
| eval adm_type=coalesce(type, "SNAPSHOT"), cluster=coalesce('k8s.cluster.name', "unknown"), \
  namespace=coalesce('object.metadata.namespace', 'metadata.namespace'), adm_puid=coalesce('object.metadata.uid', 'metadata.uid'), \
  adm_pname=coalesce('object.metadata.name', 'metadata.name'), \
  adm_kind=if(sourcetype=="kube:object:endpointslices", "backend", "route"), \
  adm_rkind=case(sourcetype=="kube:object:httproutes", "HTTPRoute", sourcetype=="kube:object:ingresses", "Ingress"), \
  adm_svc=coalesce('object.metadata.labels.kubernetes.io/service-name', 'metadata.labels.kubernetes.io/service-name'), \
  adm_portsj=coalesce(spath(_raw, "object.ports{}"), spath(_raw, "ports{}")), \
  adm_hosts=mvjoin(coalesce('object.spec.hostnames{}', 'spec.hostnames{}'), ","), \
  adm_prefs=coalesce(spath(_raw, "object.spec.parentRefs{}"), spath(_raw, "spec.parentRefs{}")), \
  adm_imode=lower(coalesce('object.metadata.annotations.ingress.cilium.io/loadbalancer-mode', 'metadata.annotations.ingress.cilium.io/loadbalancer-mode', `adm_cilium_ingress_mode`)), \
  adm_items=coalesce(case(adm_kind=="backend", coalesce(spath(_raw, "object.endpoints{}"), spath(_raw, "endpoints{}")), \
    true(), coalesce(spath(_raw, "object.spec.rules{}"), spath(_raw, "spec.rules{}"))), "-") \
| where isnotnull(adm_puid) AND isnotnull(namespace) \
| eval adm_lkey=adm_kind."|".cluster."|".adm_puid \
| mvexpand adm_items \
| eval adm_ports=mvmap(adm_portsj, json_extract(adm_portsj, "port")."/".lower(coalesce(json_extract(adm_portsj, "protocol"), "TCP"))."/".coalesce(json_extract(adm_portsj, "name"), "")), \
  adm_refs=case(adm_rkind=="HTTPRoute", spath(adm_items, "backendRefs{}"), adm_rkind=="Ingress", spath(adm_items, "http.paths{}")), \
  adm_rpath=mvindex(spath(adm_items, "matches{}.path.value"), 0), adm_ihost=json_extract(adm_items, "host"), \
  adm_ep_uid=json_extract(adm_items, "targetRef.uid"), adm_ep_name=json_extract(adm_items, "targetRef.name"), \
  adm_ep_ip=mvindex(spath(adm_items, "addresses{}"), 0), adm_ep_node=json_extract(adm_items, "nodeName"), \
  adm_ep_ready=lower(coalesce(tostring(json_extract(adm_items, "conditions.ready")), "true")), \
  adm_parents=case(adm_rkind=="HTTPRoute", mvmap(adm_prefs, coalesce(json_extract(adm_prefs, "kind"), "Gateway")."/".coalesce(json_extract(adm_prefs, "namespace"), namespace)."/".json_extract(adm_prefs, "name")), \
    adm_rkind=="Ingress", if(adm_imode=="shared", "IngressShared", "Ingress")."/".namespace."/".adm_pname, true(), "-") \
| eval adm_children=case(adm_items=="-", "-", \
    adm_kind=="backend" AND isnotnull(adm_ep_uid) AND adm_ep_ready!="false", \
      mvmap(adm_ports, json_object("uid", adm_ep_uid, "name", adm_ep_name, "ip", adm_ep_ip, "node", adm_ep_node, \
        "port", tonumber(mvindex(split(adm_ports, "/"), 0)), "proto", mvindex(split(adm_ports, "/"), 1), "pn", mvindex(split(adm_ports, "/"), 2))), \
    adm_rkind=="HTTPRoute", mvmap(adm_refs, json_object("bsvc", json_extract(adm_refs, "name"), "bns", coalesce(json_extract(adm_refs, "namespace"), namespace), \
        "bport", tonumber(json_extract(adm_refs, "port")), "bkind", coalesce(json_extract(adm_refs, "kind"), "Service"), "host", adm_hosts, "path", adm_rpath)), \
    adm_rkind=="Ingress", mvmap(adm_refs, json_object("bsvc", json_extract(adm_refs, "backend.service.name"), "bns", namespace, \
        "bport", tonumber(json_extract(adm_refs, "backend.service.port.number")), "bpn", json_extract(adm_refs, "backend.service.port.name"), "bkind", "Service", \
        "host", adm_ihost, "path", json_extract(adm_refs, "path")))) \
| eval adm_children=coalesce(adm_children, "-") \
| mvexpand adm_children \
| mvexpand adm_parents \
| appendpipe [| stats values(_time) AS adm_parent_times latest(cluster) AS cluster latest(namespace) AS namespace by adm_kind adm_lkey adm_puid | eval adm_prow=1] \
| eventstats values(adm_parent_times) AS adm_ptimes by adm_lkey \
| where adm_prow==1 OR (adm_type!="DELETED" AND adm_children!="-" AND (adm_kind=="backend" OR json_extract(adm_children, "bkind")=="Service")) \
| eval adm_deleted=if(adm_type=="DELETED", _time, null()), \
  service=if(adm_kind=="backend", adm_svc, null()), pod_uid=json_extract(adm_children, "uid"), pod_name=json_extract(adm_children, "name"), \
  adm_bip=json_extract(adm_children, "ip"), node=json_extract(adm_children, "node"), target_port=tonumber(json_extract(adm_children, "port")), \
  protocol=json_extract(adm_children, "proto"), port_name=json_extract(adm_children, "pn"), \
  route_kind=adm_rkind, route_name=if(adm_kind=="route", adm_pname, null()), \
  parent_kind=if(adm_kind=="route", mvindex(split(adm_parents, "/"), 0), null()), parent_namespace=if(adm_kind=="route", mvindex(split(adm_parents, "/"), 1), null()), \
  parent_name=if(adm_kind=="route", mvindex(split(adm_parents, "/"), 2), null()), \
  host=json_extract(adm_children, "host"), path=json_extract(adm_children, "path"), \
  backend_service=json_extract(adm_children, "bsvc"), backend_namespace=json_extract(adm_children, "bns"), backend_port=tonumber(json_extract(adm_children, "bport")), backend_port_name=json_extract(adm_children, "bpn"), \
  ip=`adm_ip(adm_bip)`, \
  adm_ck=case(adm_prow==1, "P|".adm_lkey, adm_kind=="backend", "b|".cluster."|".namespace."|".adm_svc."|".adm_puid."|".pod_uid."|".target_port."|".protocol, \
    true(), "r|".cluster."|".namespace."|".adm_puid."|".parent_kind."|".parent_namespace."|".parent_name."|".backend_namespace."|".backend_service."|".if(isnotnull(backend_port), tostring(backend_port), "name:".backend_port_name)."|".coalesce(host, "")."|".coalesce(path, "")) \
| eventstats values(eval(if(adm_prow==1, null(), sha256(adm_ck)."@".tostring(_time)))) AS adm_present by adm_lkey \
| dedup adm_ck _time keepempty=true \
| eval adm_seq=coalesce(mvcount(mvmap(adm_ptimes, if(tonumber(adm_ptimes)<=_time, adm_ptimes, null()))), 0) \
| sort 0 adm_ck _time \
| streamstats current=f last(adm_seq) AS adm_prev_seq by adm_ck \
| eval adm_break=if(isnull(adm_prev_seq) OR adm_seq>adm_prev_seq+1, 1, 0) \
| streamstats sum(adm_break) AS adm_run by adm_ck \
| stats values(adm_present) AS adm_present min(_time) AS first_seen max(_time) AS last_seen max(adm_deleted) AS adm_deleted values(adm_parent_times) AS adm_parent_times max(adm_prow) AS adm_prow \
    latest(adm_lkey) AS adm_lkey latest(adm_puid) AS adm_puid latest(cluster) AS cluster latest(namespace) AS namespace latest(service) AS service latest(pod_uid) AS pod_uid \
    latest(pod_name) AS pod_name latest(ip) AS ip latest(node) AS node latest(target_port) AS target_port latest(protocol) AS protocol latest(port_name) AS port_name \
    latest(route_kind) AS route_kind latest(route_name) AS route_name latest(parent_kind) AS parent_kind latest(parent_namespace) AS parent_namespace latest(parent_name) AS parent_name \
    latest(host) AS host latest(path) AS path latest(backend_service) AS backend_service latest(backend_namespace) AS backend_namespace latest(backend_port) AS backend_port latest(backend_port_name) AS backend_port_name by adm_kind adm_ck adm_run \
| eventstats values(adm_parent_times) AS adm_ptimes values(adm_present) AS adm_present by adm_lkey \
| eval slice_uid=if(adm_kind=="backend", adm_puid, null()), route_uid=if(adm_kind=="route", adm_puid, null()) \
| lookup adm_service_backends slice_uid AS slice_uid cluster AS cluster OUTPUT desc AS adm_stored_b \
| lookup adm_service_routes route_uid AS route_uid cluster AS cluster OUTPUT desc AS adm_stored_r \
| eval adm_stored=coalesce(adm_stored_b, adm_stored_r), adm_stored_n=coalesce(mvcount(adm_stored), 0), adm_presence=mvmap(adm_present,sha256(adm_present)), \
  adm_next=mvindex(mvsort(mvmap(adm_ptimes, if(tonumber(adm_ptimes)>last_seen, adm_ptimes, null()))), 0), \
  adm_same=if(adm_prow==1, null(), mvmap(adm_stored, if(json_extract(adm_stored, "ck")==adm_ck, \
    substr("0000000000".tostring(floor(tonumber(json_extract(adm_stored, "vf")))), -10)."#".adm_stored, null()))), \
  adm_match=replace(mvindex(mvsort(mvmap(adm_same, if(tonumber(mvindex(split(adm_same, "#"), 0))<=last_seen, adm_same, null()))), -1), "^[^#]*#", ""), \
  adm_future=replace(mvindex(mvsort(mvmap(adm_same, if(tonumber(mvindex(split(adm_same, "#"), 0))>last_seen, adm_same, null()))), 0), "^[^#]*#", ""), \
  adm_fvf=tonumber(json_extract(adm_future, "vf")), \
  adm_future_block=coalesce(mvcount(mvmap(adm_same, if(tonumber(json_extract(replace(adm_same, "^[^#]*#", ""), "vt"))>first_seen \
    AND tonumber(json_extract(replace(adm_same, "^[^#]*#", ""), "vt"))<=adm_fvf, 1, null()))), 0) \
    + coalesce(mvcount(mvmap(adm_ptimes, if(tonumber(adm_ptimes)>=first_seen AND tonumber(adm_ptimes)<adm_fvf \
      AND NOT isnotnull(mvfind(adm_presence,"^".sha256(sha256(adm_ck)."@".tostring(adm_ptimes))."$")), 1, null()))), 0), \
  adm_use_future=if(isnotnull(adm_future) AND adm_future_block==0 AND (isnull(adm_match) OR tonumber(json_extract(adm_match, "vt"))<=first_seen), 1, 0), \
  adm_match=if(adm_use_future==1, adm_future, adm_match), \
  adm_mvf=tonumber(json_extract(adm_match, "vf")), adm_mvt=tonumber(json_extract(adm_match, "vt")), \
  adm_prior=mvcount(mvmap(adm_same, if(isnotnull(tonumber(json_extract(replace(adm_same, "^[^#]*#", ""), "vt"))) \
    AND tonumber(json_extract(replace(adm_same, "^[^#]*#", ""), "vt"))<=adm_mvf, "1", null()))), \
  adm_absent=mvmap(adm_ptimes, if(tonumber(adm_ptimes)<first_seen \
    AND NOT isnotnull(mvfind(adm_presence,"^".sha256(sha256(adm_ck)."@".tostring(adm_ptimes))."$")), adm_ptimes, null())), \
  adm_isnew=if(isnull(adm_match) OR (isnotnull(adm_mvt) AND adm_mvt<=first_seen) OR (mvcount(adm_absent)>0 AND adm_mvf<=tonumber(mvindex(mvsort(adm_absent), -1))), 1, 0), \
  adm_match_ls=tonumber(json_extract(adm_match, "ls")), adm_match=if(adm_isnew==1, null(), adm_match), \
  valid_to=case(isnotnull(adm_deleted), adm_deleted, isnotnull(adm_next) AND (isnull(adm_mvt) OR adm_isnew==1 OR tonumber(adm_next)<adm_mvt), tonumber(adm_next), isnotnull(adm_mvt) AND adm_isnew==0, adm_mvt), \
  valid_from=case(isnull(adm_match), first_seen, adm_use_future==1, min(first_seen, adm_mvf), coalesce(adm_prior, 0)>0, adm_mvf, true(), min(first_seen, adm_mvf)), \
  first_seen=if(isnull(adm_match), first_seen, max(valid_from, min(first_seen, tonumber(json_extract(adm_match, "fs"))))), \
  last_seen=max(last_seen, if(isnull(valid_to) OR adm_match_ls<valid_to, coalesce(adm_match_ls, last_seen), last_seen)), \
  _key=coalesce(json_extract(adm_match, "k"), sha256(adm_ck."|".tostring(floor(valid_from)))), adm_new=1 \
| appendpipe [| where adm_prow==1 AND adm_stored_n>0 \
    | mvexpand adm_stored \
    | eval adm_ck=json_extract(adm_stored, "ck"), adm_new=0, adm_sls=tonumber(json_extract(adm_stored, "ls")), adm_svf=tonumber(json_extract(adm_stored, "vf")), adm_svt=tonumber(json_extract(adm_stored, "vt")), \
      adm_close=mvindex(mvsort(mvmap(adm_ptimes, if(tonumber(adm_ptimes)>adm_svf AND NOT isnotnull(mvfind(adm_presence,"^".sha256(sha256(adm_ck)."@".tostring(adm_ptimes))."$")), adm_ptimes, null()))), 0) \
    | where isnotnull(adm_close) AND (isnull(adm_svt) OR adm_close<adm_svt) \
    | eval _key=json_extract(adm_stored, "k"), cluster=json_extract(adm_stored, "cluster"), namespace=json_extract(adm_stored, "ns"), service=json_extract(adm_stored, "svc"), \
      pod_uid=json_extract(adm_stored, "uid"), pod_name=json_extract(adm_stored, "name"), ip=json_extract(adm_stored, "ip"), node=json_extract(adm_stored, "node"), \
      target_port=tonumber(json_extract(adm_stored, "port")), protocol=json_extract(adm_stored, "proto"), port_name=json_extract(adm_stored, "pn"), \
      route_kind=json_extract(adm_stored, "rk"), route_name=json_extract(adm_stored, "rn"), parent_kind=json_extract(adm_stored, "pk"), \
      parent_namespace=json_extract(adm_stored, "pns"), parent_name=json_extract(adm_stored, "pn2"), host=json_extract(adm_stored, "host"), path=json_extract(adm_stored, "path"), \
      backend_service=json_extract(adm_stored, "bsvc"), backend_namespace=json_extract(adm_stored, "bns"), backend_port=tonumber(json_extract(adm_stored, "bport")), backend_port_name=json_extract(adm_stored, "bpn"), \
      first_seen=tonumber(json_extract(adm_stored, "fs")), last_seen=if(adm_sls<adm_close, adm_sls, tonumber(json_extract(adm_stored, "fs"))), valid_from=tonumber(json_extract(adm_stored, "vf")), valid_to=adm_close, adm_prow=0 \
    | eval adm_last_gap=mvindex(mvsort(mvmap(adm_ptimes, if(tonumber(adm_ptimes)<=adm_sls \
        AND NOT isnotnull(mvfind(adm_presence,"^".sha256(sha256(adm_ck)."@".tostring(adm_ptimes))."$")), adm_ptimes, null()))), -1), \
      adm_future_gap=mvindex(mvsort(mvmap(adm_ptimes, if(tonumber(adm_ptimes)>adm_sls \
        AND NOT isnotnull(mvfind(adm_presence,"^".sha256(sha256(adm_ck)."@".tostring(adm_ptimes))."$")), adm_ptimes, null()))), 0), \
      adm_reopen_times=mvmap(adm_present, if(mvindex(split(adm_present, "@"), 0)==sha256(adm_ck) \
        AND tonumber(mvindex(split(adm_present, "@"), 1))>tonumber(adm_last_gap) AND tonumber(mvindex(split(adm_present, "@"), 1))<=adm_sls, 1, null())) \
    | appendpipe [| where adm_sls>adm_close AND isnull(adm_reopen_times) \
        | eval valid_from=adm_sls, first_seen=adm_sls, last_seen=adm_sls, valid_to=if(isnotnull(adm_future_gap) AND (isnull(adm_svt) OR tonumber(adm_future_gap)<adm_svt), tonumber(adm_future_gap), adm_svt), _key=sha256(_key."|split|".adm_close."|".adm_sls)]] \
| where coalesce(adm_prow, 0)!=1 \
| sort 0 - adm_new \
| dedup _key \
| eval valid_end=case(isnotnull(valid_to), valid_to, `adm_k8s_object_staleness`>0, last_seen + `adm_k8s_object_staleness`), updated=now(), \
  desc=json_object("k", _key, "ck", adm_ck, "cluster", cluster, "ns", namespace, "svc", service, "uid", pod_uid, "name", pod_name, "ip", ip, "node", node, "port", target_port, \
    "proto", protocol, "pn", port_name, "rk", route_kind, "rn", route_name, "pk", parent_kind, "pns", parent_namespace, "pn2", parent_name, "host", host, "path", path, \
    "bsvc", backend_service, "bns", backend_namespace, "bport", backend_port, "bpn", backend_port_name, "fs", first_seen, "ls", last_seen, "vf", valid_from, "vt", valid_to, "ve", valid_end) \
| appendpipe [| where adm_kind=="backend" \
    | fields _key cluster namespace service slice_uid pod_uid pod_name ip node target_port protocol port_name valid_from valid_to first_seen last_seen updated desc \
    | outputlookup append=true key_field=_key override_if_empty=false adm_service_backends | where false()] \
| appendpipe [| where adm_kind=="route" \
    | fields _key cluster namespace route_uid route_kind route_name parent_kind parent_namespace parent_name host path backend_service backend_namespace backend_port backend_port_name valid_from valid_to first_seen last_seen updated desc \
    | outputlookup append=true key_field=_key override_if_empty=false adm_service_routes | where false()] \
| stats count(eval(adm_kind=="backend")) AS backends_written count(eval(adm_kind=="route")) AS routes_written count(eval(adm_new==0)) AS rows_closed \
    count(eval(cluster=="unknown")) AS rows_missing_cluster dc(eval(if(adm_stored_n>=1000, adm_lkey, null()))) AS capped_parents \
| eval warnings=mvappend(if(rows_missing_cluster>0, rows_missing_cluster." backend or route rows had no k8s.cluster.name; set clusterName in the Helm chart.", null()), \
    if(capped_parents>0, capped_parents." EndpointSlices or routes returned 1000 stored rows (lookup max_matches); some intervals may not have been merged or closed.", null()))
description = Upserts adm_service_backends (EndpointSlice endpoints per Service, pod, port and port name) and adm_service_routes (HTTPRoute rules: parent Gateway namespace/name to backend namespace/Service/port; Ingress rules) from watch events or pull snapshots. A child present in the run continues its stored open interval (same _key, earliest valid_from and first_seen kept); a child absent from a later listing of its EndpointSlice or route (also a listing with no ready endpoints) or from a DELETED event is closed at that listing; a child that reappears after being closed starts a new interval. Cilium's dummy endpoints without targetRef and endpoints with conditions.ready=false are not backends.

[adm_service_backends_prune]
definition = `adm_kv_read_all(adm_service_backends)` \
| eval adm_keep=if(isnull(valid_to) OR valid_to>=now()-`adm_identity_retention`, 1, 0) \
| appendpipe [| where `adm_prune_maintenance`==1 AND adm_complete==1 AND adm_page>=1 AND adm_keep==1 | fields - adm_* | outputlookup override_if_empty=false adm_service_backends | where false()] \
| stats max(adm_complete) AS complete count(eval(adm_page>=1)) AS rows_read count(eval(adm_page>=1 AND adm_keep==0)) AS rows_expired \
| eval rows_pruned=if(`adm_prune_maintenance`==1 AND complete==1 AND rows_expired<rows_read, rows_expired, 0), warnings=if(complete==1, if(rows_read>0 AND rows_expired==rows_read, "adm_service_backends contains only expired rows; the empty-write safeguard retained them. Administrator cleanup is required.", null()), "adm_service_backends could not be read completely; nothing was pruned.") \
| eval warnings=if(`adm_prune_maintenance`!=1, mvappend("Maintenance mode is disabled; nothing was pruned. Pause all builders, drain active jobs and back up collections before enabling adm_prune_maintenance.", warnings), warnings)
description = Rewrites adm_service_backends without rows whose validity ended before the retention period, only after a provably complete paged read.

[adm_service_routes_prune]
definition = `adm_kv_read_all(adm_service_routes)` \
| eval adm_keep=if(isnull(valid_to) OR valid_to>=now()-`adm_identity_retention`, 1, 0) \
| appendpipe [| where `adm_prune_maintenance`==1 AND adm_complete==1 AND adm_page>=1 AND adm_keep==1 | fields - adm_* | outputlookup override_if_empty=false adm_service_routes | where false()] \
| stats max(adm_complete) AS complete count(eval(adm_page>=1)) AS rows_read count(eval(adm_page>=1 AND adm_keep==0)) AS rows_expired \
| eval rows_pruned=if(`adm_prune_maintenance`==1 AND complete==1 AND rows_expired<rows_read, rows_expired, 0), warnings=if(complete==1, if(rows_read>0 AND rows_expired==rows_read, "adm_service_routes contains only expired rows; the empty-write safeguard retained them. Administrator cleanup is required.", null()), "adm_service_routes could not be read completely; nothing was pruned.") \
| eval warnings=if(`adm_prune_maintenance`!=1, mvappend("Maintenance mode is disabled; nothing was pruned. Pause all builders, drain active jobs and back up collections before enabling adm_prune_maintenance.", warnings), warnings)
description = Rewrites adm_service_routes without rows whose validity ended before the retention period, only after a provably complete paged read.

[adm_aci_policy_build]
definition = `adm_index_dcn` sourcetype="cisco:dc:aci:class" (component="l3extSubnet" OR component="l3extInstP" OR component="fvRsCons" OR component="fvRsProv" \
    OR component="vzBrCP" OR component="vzSubj" OR component="vzRsSubjFiltAtt" OR component="vzEntry" OR component="fvAEPg" OR component="fvEPg" OR component="fvCtx" \
    OR component="vzRsAnyToCons" OR component="vzRsAnyToProv" OR component="vzRsAnyToConsIf" OR component="vzInTerm" OR component="vzOutTerm" \
    OR component="vzTaboo" OR component="fvRsProtBy" OR component="fvESg" OR component="vzRsSubjGraphAtt") \
| rex field=_raw max_match=0 "(?i)(?:^|\\t)(?<adm_policy_action_token>action=[^\\t\\r\\n]*)(?=\\t|$)" \
| eval adm_raw_policy_valid=if(coalesce(mvcount(adm_policy_action_token),0)==1 AND match(mvindex(adm_policy_action_token,0),"(?i)^action=(?:\"(?:permit|deny)\"|\\\\\"(?:permit|deny)\\\\\")$"),1,0) \
| eval adm_raw_policy_action=if(adm_raw_policy_valid==1,replace(replace(lower(mvindex(adm_policy_action_token,0)),"^action=",""),"[^a-z]",""),"unknown") \
| eval object_kind=case(component=="l3extSubnet", "subnet", component=="l3extInstP", "instp", component=="fvRsCons", "cons", component=="fvRsProv", "prov", \
    component=="vzBrCP", "contract", component=="vzSubj", "subj", component=="vzRsSubjFiltAtt", "filtatt", component=="vzEntry", "entry", \
    component=="fvCtx", "ctx", component=="fvAEPg" OR component=="fvEPg", "epg", \
    component=="vzInTerm" OR component=="vzOutTerm", "term", true(), "unsupported"), \
  tenant=replace(dn, "^uni/tn-([^/]+)/.*$", "\1"), \
  class_dn=case(object_kind=="cons" OR object_kind=="prov", replace(dn, "/rs(cons|prov)-[^/]+$", ""), object_kind=="subnet", replace(dn, "/extsubnet-\[.*\]$", ""), \
    object_kind=="instp" OR object_kind=="epg", dn), \
  contract_dn=case(object_kind=="cons" OR object_kind=="prov", tDn, object_kind=="subj" OR object_kind=="filtatt" OR object_kind=="term", replace(dn, "^(uni/tn-[^/]+/brc-[^/]+)/.*$", "\1"), \
    object_kind=="contract", dn), \
  subject=case(object_kind=="subj", name, object_kind=="filtatt" OR object_kind=="term", replace(dn, "^uni/tn-[^/]+/brc-[^/]+/subj-([^/]+)/.*$", "\1")), \
  filter_dn=case(object_kind=="filtatt", tDn, object_kind=="entry", replace(dn, "/e-[^/]+$", "")), \
  action=if(object_kind=="filtatt", adm_raw_policy_action, null()), \
  action_verified=if(object_kind=="filtatt" AND adm_raw_policy_valid==1, 1, 0), directives=if(object_kind=="filtatt", directives, null()), \
  prot=if(object_kind=="entry", prot, null()), d_from=if(object_kind=="entry", dFromPort, null()), d_to=if(object_kind=="entry", dToPort, null()), \
  s_from=if(object_kind=="entry", sFromPort, null()), s_to=if(object_kind=="entry", sToPort, null()), tcp_rules=if(object_kind=="entry", tcpRules, null()), \
  ether_t=if(object_kind=="entry", etherT, null()), subnet=if(object_kind=="subnet", ip, null()), subnet_scope=if(object_kind=="subnet", scope, null()), \
  contract_scope=if(object_kind=="contract", scope, null()), enf_pref=if(object_kind=="ctx" OR object_kind=="epg", pcEnfPref, null()), \
  pref_group=if(object_kind=="instp" OR object_kind=="epg", prefGrMemb, null()), \
  name=case(object_kind=="contract" OR object_kind=="entry" OR object_kind=="ctx" OR object_kind=="unsupported", coalesce(name, component), \
    object_kind=="cons" OR object_kind=="prov", tnVzBrCPName, object_kind=="filtatt", tnVzFilterName, object_kind=="term", component) \
| stats min(_time) AS first_seen max(_time) AS last_seen latest(object_kind) AS object_kind latest(tenant) AS tenant latest(class_dn) AS class_dn \
    latest(contract_dn) AS contract_dn latest(subject) AS subject latest(filter_dn) AS filter_dn latest(action) AS action latest(action_verified) AS action_verified latest(directives) AS directives \
    latest(prot) AS prot latest(d_from) AS d_from latest(d_to) AS d_to latest(s_from) AS s_from latest(s_to) AS s_to latest(tcp_rules) AS tcp_rules \
    latest(ether_t) AS ether_t latest(subnet) AS subnet latest(subnet_scope) AS subnet_scope latest(contract_scope) AS contract_scope latest(enf_pref) AS enf_pref \
    latest(pref_group) AS pref_group latest(name) AS name by apic_host dn \
| eval updated=now(), _key=sha256(apic_host."|".dn) \
| lookup adm_aci_policy _key AS _key OUTPUT first_seen AS adm_old_first last_seen AS adm_old_last \
| where isnull(adm_old_last) OR last_seen>=adm_old_last \
| eval first_seen=min(first_seen, coalesce(adm_old_first, first_seen)) \
| fields _key apic_host dn object_kind tenant class_dn contract_dn subject filter_dn action action_verified directives prot d_from d_to s_from s_to tcp_rules ether_t subnet subnet_scope \
    contract_scope enf_pref pref_group name first_seen last_seen updated \
| outputlookup append=true key_field=_key override_if_empty=false adm_aci_policy \
| stats count AS rows_written
description = Upserts adm_aci_policy, one row per APIC object DN: contracts (vzBrCP, with scope), subjects (vzSubj), subject-filter relations (vzRsSubjFiltAtt: filter_dn, action, directives), filter entries (vzEntry: prot, d_from, d_to, s_from, s_to, tcp_rules, ether_t), consumer and provider relations (fvRsCons, fvRsProv), external EPG subnets (l3extSubnet), preferred-group membership and enforcement preference (l3extInstP, fvAEPg/fvEPg, fvCtx pcEnfPref), subject in/out terms (vzInTerm, vzOutTerm, object_kind term), and policy the graph does not evaluate (vzAny relations, taboos, ESGs, service graphs: object_kind unsupported).

[adm_aci_policy_prune]
definition = `adm_kv_read_all(adm_aci_policy)` \
| eval adm_keep=if(last_seen>=now()-`adm_identity_retention`, 1, 0) \
| appendpipe [| where `adm_prune_maintenance`==1 AND adm_complete==1 AND adm_page>=1 AND adm_keep==1 | fields - adm_* | outputlookup override_if_empty=false adm_aci_policy | where false()] \
| stats max(adm_complete) AS complete count(eval(adm_page>=1)) AS rows_read count(eval(adm_page>=1 AND adm_keep==0)) AS rows_expired \
| eval rows_pruned=if(`adm_prune_maintenance`==1 AND complete==1 AND rows_expired<rows_read, rows_expired, 0), warnings=if(complete==1, if(rows_read>0 AND rows_expired==rows_read, "adm_aci_policy contains only expired rows; the empty-write safeguard retained them. Administrator cleanup is required.", null()), "adm_aci_policy could not be read completely; nothing was pruned.") \
| eval warnings=if(`adm_prune_maintenance`!=1, mvappend("Maintenance mode is disabled; nothing was pruned. Pause all builders, drain active jobs and back up collections before enabling adm_prune_maintenance.", warnings), warnings)
description = Rewrites adm_aci_policy without objects last polled before the retention period, only after a provably complete paged read.

[adm_interfaces_build]
definition = `adm_index_dcn` sourcetype="cisco:dc:nexus9k" (component="nxneighbor" OR component="nxhostname") \
| eval device_ip=replace(device, ":\d+$", ""), adm_hostname=if(component=="nxhostname", mvindex('Row_info{}.hostname', 0), null()) \
| eventstats latest(adm_hostname) AS adm_device by device_ip \
| where component=="nxneighbor" AND isnotnull('Row_info.ifindex') \
| eval ifindex='Row_info.ifindex', interface='Row_info.intf_id', neighbor=replace('Row_info.device_id', "\([^)]*\)$", ""), neighbor_interface='Row_info.port_id', device=adm_device \
| stats latest(device) AS device latest(interface) AS interface latest(neighbor) AS neighbor latest(neighbor_interface) AS neighbor_interface max(_time) AS updated by device_ip ifindex \
| eval _key=device_ip."|".ifindex \
| outputlookup append=true key_field=_key override_if_empty=false adm_interfaces \
| stats count AS rows_written
description = Upserts NX-OS SNMP ifIndex to interface name mappings from CDP neighbor output (the only default NX-API command reporting ifIndex).

# ---- graph (on demand) ----

[adm_service_node(1)]
args = id
validation = match(id, "^[a-z_]+\z")
errormsg = adm_service_node expects a field name.
definition = json_object("id", $id$, "label", mvindex(split(replace($id$, "^service:", ""), "/"), 2), "kind", "service", \
  "namespace", nullif(mvindex(split(replace($id$, "^service:", ""), "/"), 1), ""), "cluster", nullif(mvindex(split(replace($id$, "^service:", ""), "/"), 0), ""), \
  "attr_environment", nullif(mvindex(split(replace($id$, "^service:", ""), "/"), 3), ""), \
  "reason", "OpenTelemetry service.name qualified by deployment.environment.name, k8s.cluster.name and k8s.namespace.name")
description = Graph node JSON for a service ID service:<cluster>/<namespace>/<service>/<environment>.

[adm_pick(2)]
args = side, key
validation = match(side, "^(c|s)\z") AND match(key, "^[a-z_]+\z")
errormsg = adm_pick expects side c or s and a desc key.
definition = if(adm_$side$_state=="resolved", mvindex(mvmap(adm_$side$_sorted, json_extract(replace(adm_$side$_sorted, "^[^#]*#[^#]*#[^#]*#", ""), "$key$").""), 0), null())
description = First non-empty value of a desc key across the covering identity candidates, best priority and ACI before Nexus Dashboard first.

[adm_network_resolve(1)]
args = side
validation = match(side, "^(c|s)\\z")
errormsg = adm_network_resolve expects c or s.
definition = streamstats count AS adm_nr_row \
| appendpipe [ \
    | where adm_$side$_state=="resolved" \
    | eval adm_nr_desc=mvmap(adm_$side$_sorted, replace(adm_$side$_sorted, "^[^#]*#[^#]*#[^#]*#", "")) \
    | mvexpand adm_nr_desc \
    | where json_extract(adm_nr_desc, "ek")==adm_$side$_bek AND (json_extract(adm_nr_desc, "source")=="aci" OR json_extract(adm_nr_desc, "source")=="nd_endpoints") \
        AND (adm_nr_desc==adm_$side$_best OR len(coalesce(json_extract(adm_nr_desc, "mac"), ""))>0) \
    | eval adm_nr_sample=coalesce(json_array_to_mv(json_extract(adm_nr_desc, "nh")), json_object("t", adm_bfs)), adm_nr_cap=json_extract(adm_nr_desc, "nhc"), adm_nr_source=json_extract(adm_nr_desc, "source") \
    | fields adm_nr_row adm_bfs adm_bls adm_nr_sample adm_nr_cap adm_nr_source \
    | mvexpand adm_nr_sample \
    | eval adm_nr_t=tonumber(json_extract(adm_nr_sample, "t")), adm_nr_te=coalesce(tonumber(json_extract(adm_nr_sample, "te")), tonumber(json_extract(adm_nr_sample, "t"))) \
    | eval adm_nr_tick=mvappend(tostring(adm_nr_t), tostring(adm_nr_te+2*`adm_poll_interval`)) \
    | mvexpand adm_nr_tick | eval adm_nr_tick=tonumber(adm_nr_tick) \
    | eval adm_nr_a=if(adm_nr_source=="aci" AND adm_nr_tick==adm_nr_t, adm_nr_sample, null()), \
        adm_nr_n=if(adm_nr_source=="nd_endpoints" AND adm_nr_tick==adm_nr_t, adm_nr_sample, null()) \
    | appendpipe [ | stats first(adm_bfs) AS adm_bfs first(adm_bls) AS adm_bls by adm_nr_row \
        | eval adm_nr_tick=mvappend(tostring(adm_bfs), tostring(adm_bls)) | mvexpand adm_nr_tick ] \
    | stats values(adm_nr_a) AS adm_nr_a values(adm_nr_n) AS adm_nr_n max(adm_nr_cap) AS adm_nr_cap first(adm_bfs) AS adm_bfs first(adm_bls) AS adm_bls by adm_nr_row adm_nr_tick \
    | eventstats max(adm_nr_cap) AS adm_nr_cap by adm_nr_row \
    | sort 0 adm_nr_row adm_nr_tick \
    | streamstats last(adm_nr_a) AS adm_nr_a last(adm_nr_n) AS adm_nr_n max(adm_nr_cap) AS adm_nr_cap by adm_nr_row \
    | where adm_nr_tick>=adm_bfs AND adm_nr_tick<=adm_bls \
    | eval adm_nr_a=if(coalesce(tonumber(json_extract(adm_nr_a, "te")), tonumber(json_extract(adm_nr_a, "t")))+2*`adm_poll_interval`>adm_nr_tick, adm_nr_a, null()), \
        adm_nr_n=if(coalesce(tonumber(json_extract(adm_nr_n, "te")), tonumber(json_extract(adm_nr_n, "t")))+2*`adm_poll_interval`>adm_nr_tick, adm_nr_n, null()) \
    | eval adm_nr_v=coalesce(json_extract(adm_nr_a, "v"), json_extract(adm_nr_n, "v")), \
        adm_nr_b=coalesce(json_extract(adm_nr_a, "b"), json_extract(adm_nr_n, "b")), \
        adm_nr_dn=json_extract(adm_nr_a, "bd_dn") \
    | stats values(adm_nr_v) AS adm_nr_v values(adm_nr_b) AS adm_nr_b values(adm_nr_dn) AS adm_nr_dn count(eval(isnull(adm_nr_v))) AS adm_nr_v_missing count(eval(isnull(adm_nr_b))) AS adm_nr_b_missing max(adm_nr_cap) AS adm_nr_cap by adm_nr_row \
    | eval adm_nr_result=json_object("v", if(mvcount(adm_nr_v)==1 AND adm_nr_v_missing==0, mvindex(adm_nr_v, 0), null()), \
        "b", if(mvcount(adm_nr_b)==1 AND coalesce(mvcount(adm_nr_dn), 0)<=1 AND adm_nr_b_missing==0, mvindex(adm_nr_b, 0), null()), \
        "vs", case(mvcount(adm_nr_v)>1, "varies", adm_nr_v_missing>0, "incomplete"), \
        "bs", case(mvcount(adm_nr_b)>1 OR mvcount(adm_nr_dn)>1, "varies", adm_nr_b_missing>0, "incomplete"), "cap", adm_nr_cap, "bd_key", if(mvcount(adm_nr_dn)==1, mvindex(adm_nr_dn, 0), null())), adm_nr_added=1 ] \
| eventstats values(adm_nr_result) AS adm_nr_result by adm_nr_row \
| where isnull(adm_nr_added) \
| eval adm_$side$_network_vlan=json_extract(adm_nr_result, "v"), adm_$side$_network_bd=json_extract(adm_nr_result, "b"), \
    adm_$side$_network_vlan_status=json_extract(adm_nr_result, "vs"), adm_$side$_network_bd_status=json_extract(adm_nr_result, "bs"), adm_$side$_network_capped=json_extract(adm_nr_result, "cap"), adm_$side$_network_bd_key=json_extract(adm_nr_result, "bd_key") \
| fields - adm_nr_*
description = Evaluate metadata at every observation, freshness expiry and conversation boundary. APIC has per-field priority; only the same resolved endpoint can supply ND fallback. Missing intervals suppress scalar attachment facts without changing identity or traffic rows.

[adm_resolve(2)]
args = side, ip
validation = match(side, "^(c|s)\z") AND match(ip, "^[a-z_]+\z")
errormsg = adm_resolve expects side c or s and an IP field name.
definition = eval adm_$side$_cand=mvmap(adm_$side$_desc, if(tonumber(json_extract(adm_$side$_desc, "vf"))<=adm_bfs AND (isnull(tonumber(json_extract(adm_$side$_desc, "ve"))) OR tonumber(json_extract(adm_$side$_desc, "ve"))>adm_bls) \
      AND json_extract(adm_$side$_desc, "kind")!="k8s_hostnet_pod" \
      AND (json_extract(adm_$side$_desc, "kind")!="k8s_service" OR ("$side$"=="s" AND tostring(json_extract(adm_$side$_desc, "port"))==tostring(server_port) AND json_extract(adm_$side$_desc, "tp")==transport)), \
    json_extract(adm_$side$_desc, "p")."#".case(json_extract(adm_$side$_desc, "source")=="aci", "1", json_extract(adm_$side$_desc, "source")=="nd_endpoints", "2", true(), "0")."#".json_extract(adm_$side$_desc, "ek")."#".adm_$side$_desc, null())) \
| eval adm_$side$_hn=if(isnotnull(mvmap(adm_$side$_desc, if(json_extract(adm_$side$_desc, "kind")=="k8s_hostnet_pod" AND tonumber(json_extract(adm_$side$_desc, "vf"))<=adm_bls \
      AND (isnull(tonumber(json_extract(adm_$side$_desc, "ve"))) OR tonumber(json_extract(adm_$side$_desc, "ve"))>=adm_bfs), 1, null()))), 1, 0), \
  adm_$side$_sorted=mvsort(adm_$side$_cand), adm_$side$_bp=mvindex(split(mvindex(adm_$side$_sorted, 0), "#"), 0), \
  adm_$side$_eks=mvdedup(mvmap(adm_$side$_sorted, if(mvindex(split(adm_$side$_sorted, "#"), 0)==adm_$side$_bp, mvindex(split(adm_$side$_sorted, "#"), 2), null()))), \
  adm_$side$_ekm=mvmap(adm_$side$_eks, if(match(adm_$side$_eks, "/\*$"), null(), adm_$side$_eks)), \
  adm_$side$_nent=if(mvcount(adm_$side$_ekm)>0, mvcount(adm_$side$_ekm), if(mvcount(adm_$side$_eks)>0, 1, 0)), \
  adm_$side$_bek=coalesce(mvindex(adm_$side$_ekm, 0), mvindex(adm_$side$_eks, 0)), \
  adm_$side$_state=case(adm_$side$_nent==0, "none", adm_$side$_nent==1, "resolved", true(), "ambiguous"), \
  adm_$side$_best=if(adm_$side$_state=="resolved", mvindex(mvmap(adm_$side$_sorted, if(mvindex(split(adm_$side$_sorted, "#"), 0)==adm_$side$_bp \
    AND (mvindex(split(adm_$side$_sorted, "#"), 2)==adm_$side$_bek OR match(mvindex(split(adm_$side$_sorted, "#"), 2), "/\*$")), \
    replace(adm_$side$_sorted, "^[^#]*#[^#]*#[^#]*#", ""), null())), 0), null()) \
| `adm_network_resolve($side$)` \
| eval adm_$side$_aciepg=mvindex(mvmap(adm_$side$_cand, if(json_extract(replace(adm_$side$_cand, "^[^#]*#[^#]*#[^#]*#", ""), "source")=="aci" \
      AND isnotnull(json_extract(replace(adm_$side$_cand, "^[^#]*#[^#]*#[^#]*#", ""), "epg")), "uni/tn-".json_extract(replace(adm_$side$_cand, "^[^#]*#[^#]*#[^#]*#", ""), "tenant") \
      ."/ap-".json_extract(replace(adm_$side$_cand, "^[^#]*#[^#]*#[^#]*#", ""), "ap")."/epg-".json_extract(replace(adm_$side$_cand, "^[^#]*#[^#]*#[^#]*#", ""), "epg"), null())), 0) \
| eval adm_$side$_kind=json_extract(adm_$side$_best, "kind"), adm_$side$_src=json_extract(adm_$side$_best, "source"), \
  adm_$side$_name=json_extract(adm_$side$_best, "name"), adm_$side$_uid=json_extract(adm_$side$_best, "id"), \
  adm_$side$_cluster=json_extract(adm_$side$_best, "cluster"), adm_$side$_ns=json_extract(adm_$side$_best, "ns"), \
  adm_$side$_host=case(adm_$side$_kind=="pod" OR adm_$side$_kind=="k8s_node_proxy", json_extract(adm_$side$_best, "node"), adm_$side$_kind=="k8s_node", adm_$side$_name), \
  adm_$side$_id=case(adm_$side$_kind=="pod", "pod:".adm_$side$_cluster."/".adm_$side$_uid, \
    adm_$side$_kind=="k8s_node", "node:".adm_$side$_uid, \
    adm_$side$_kind=="k8s_service", "k8s_service:".adm_$side$_cluster."/".adm_$side$_ns."/".adm_$side$_name."/".$ip$.":".server_port, \
    adm_$side$_kind=="k8s_node_proxy", "k8s_node_proxy:".adm_$side$_uid, \
    adm_$side$_kind=="vm" OR adm_$side$_kind=="endpoint", "vm:".scope."/".$ip$, true(), "ip:".scope."/".$ip$), \
  adm_$side$_ekind=case(adm_$side$_kind=="pod", null(), adm_$side$_kind=="k8s_node", "k8s_node", adm_$side$_kind=="k8s_service", "k8s_service", \
    adm_$side$_kind=="k8s_node_proxy", "k8s_node_proxy", adm_$side$_kind=="vm" OR adm_$side$_kind=="endpoint", "vm", \
    adm_$side$_state=="ambiguous", "ambiguous", `adm_is_private($ip$)`, "unresolved", true(), "external"), \
  adm_$side$_reason=case(adm_$side$_kind=="pod", "Kubernetes pod object owns this IP for the whole conversation", \
    adm_$side$_kind=="k8s_node", "Kubernetes node address (Node object or pod status.hostIP)", \
    adm_$side$_kind=="k8s_service", "Kubernetes Service frontend (LoadBalancer ingress IP, external IP or NodePort) for this port during the conversation", \
    adm_$side$_kind=="k8s_node_proxy", "Cilium ingress (Envoy) address of the node (network.cilium.io/ipv4-Ingress-ip)", \
    adm_$side$_src=="aci", "ACI endpoint (fvCEp) learned during the conversation", adm_$side$_src=="nd_endpoints", "Nexus Dashboard endpoint", \
    adm_$side$_state=="ambiguous", "Several identities claim this IP in scope ".scope." during the conversation", \
    adm_$side$_ekind=="external", "Public address with no identity record", true(), "No identity record covers this IP in scope ".scope." during the conversation") \
| eval adm_$side$_node=case(adm_$side$_kind=="k8s_service", json_object("id", adm_$side$_id, "label", adm_$side$_name." · ".$ip$.":".server_port, \
      "kind", "endpoint", "endpoint_kind", "k8s_service", "namespace", adm_$side$_ns, "cluster", adm_$side$_cluster, "addr", $ip$, \
      "attr_service", adm_$side$_name, "attr_frontend", $ip$.":".server_port, "attr_type", json_extract(adm_$side$_best, "svct"), \
      "attr_traffic_policy", json_extract(adm_$side$_best, "etp"), "attr_lb_mode", json_extract(adm_$side$_best, "lbm"), \
      "attr_controller", json_extract(adm_$side$_best, "ctl"), "attr_scope", scope, "reason", adm_$side$_reason), \
    adm_$side$_kind=="k8s_node_proxy", json_object("id", adm_$side$_id, "label", "Envoy on ".adm_$side$_host, "kind", "endpoint", "endpoint_kind", "k8s_node_proxy", \
      "cluster", adm_$side$_cluster, "addr", $ip$, "attr_node", adm_$side$_host, "attr_scope", scope, "reason", adm_$side$_reason), \
    true(), json_object("id", adm_$side$_id, "label", coalesce(adm_$side$_name, `adm_pick($side$, vm)`, $ip$), \
      "kind", if(adm_$side$_kind=="pod", "workload", "endpoint"), "endpoint_kind", adm_$side$_ekind, \
      "namespace", adm_$side$_ns, "cluster", adm_$side$_cluster, "addr", $ip$, \
      "attr_owner_kind", `adm_pick($side$, owner_kind)`, "attr_owner", `adm_pick($side$, owner)`, "attr_node", `adm_pick($side$, node)`, \
      "attr_tenant", `adm_pick($side$, tenant)`, "attr_app_profile", `adm_pick($side$, ap)`, "attr_epg", `adm_pick($side$, epg)`, \
      "attr_vm_name", `adm_pick($side$, vm)`, "attr_mac", `adm_pick($side$, mac)`, \
      "attr_attach_device", `adm_pick($side$, dev)`, "attr_attach_interface", `adm_pick($side$, if)`, \
      "attr_vlan", adm_$side$_network_vlan."", "attr_bridge_domain", adm_$side$_network_bd, \
      "attr_vlan_status", adm_$side$_network_vlan_status, "attr_bridge_domain_status", adm_$side$_network_bd_status, \
      "attr_network_history_capped", adm_$side$_network_capped."", "network_bd_key", adm_$side$_network_bd_key, \
      "attr_scope", scope, "reason", adm_$side$_reason))
description = Resolves one conversation side (hostNetwork pod markers never resolve; adm_<side>_hn=1 when one covers the address during the conversation): covering rows have valid_from <= first_seen and last_seen < valid_end. Service frontend rows cover only the server side and only for their own port and transport. Rows with the same entity key (ACI and Nexus Dashboard describing one endpoint) count as one entity; several entities at the best priority are ambiguous.

[adm_boundary_filter(1)]
args = namespace
validation = match(namespace, "^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?\z")
errormsg = adm_boundary_filter expects a Kubernetes namespace name.
definition = addinfo \
| where isnull(entity_kind) OR (valid_from<info_max_time AND (isnull(valid_end) OR valid_end>info_min_time)) \
| eval adm_rparent=if(parent_kind=="Gateway", parent_namespace."/".parent_name, null()), adm_gkey=if(entity_kind=="k8s_service", namespace."/".owner_ref_name, null()) \
| eventstats values(adm_rparent) AS adm_rparents values(eval(if(entity_kind=="pod" AND namespace=="$namespace$", node, null()))) AS adm_bn \
| eval adm_fe=if(entity_kind=="k8s_service" AND (namespace=="$namespace$" OR (owner_ref_kind=="Gateway" AND `adm_mv_has(adm_rparents, adm_gkey)`)), 1, 0), \
  adm_bip=case(entity_kind=="pod" AND namespace=="$namespace$", ip, entity_kind=="k8s_node" AND `adm_mv_has(adm_bn, entity_name)`, ip, adm_fe==1 AND NOT like(ip, "nodeport:%"), ip), \
  adm_npp=if(adm_fe==1 AND like(ip, "nodeport:%"), replace(ip, "^.*:(\d+)/[a-z0-9-]+$", "\1"), null()), \
  adm_nip=if(entity_kind=="k8s_node", ip, null()) \
| eval adm_bip=if(match(adm_bip, "^[0-9a-f:.]{2,45}\z"), adm_bip, null()), adm_nip=if(match(adm_nip, "^[0-9a-f:.]{2,45}\z"), adm_nip, null()), \
  adm_npp=if(match(adm_npp, "^\d{1,5}\z"), adm_npp, null())
description = Shared body of the boundary filters, over adm_ip_identity and adm_service_routes rows: boundary addresses (pods of the namespace, nodes hosting them, LoadBalancer frontends of the namespace's Services and of Gateways its HTTPRoutes attach to), the namespace's NodePort ports and the cluster's node addresses. Only IP literals and port numbers survive.

[adm_graph_scope_core(2)]
args = cluster, namespace
validation = match(cluster, "^[A-Za-z0-9][A-Za-z0-9._-]{0,252}\z") AND match(namespace, "^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?\z")
errormsg = adm_graph_scope_filter expects a cluster name and a Kubernetes namespace name.
definition = `adm_index_summary` source="adm:conversation" adm_record="conversation" \
    [| inputlookup adm_ip_identity where (entity_kind="pod" AND cluster="$cluster$" AND namespace="$namespace$") OR ((entity_kind="k8s_node" OR entity_kind="k8s_service") AND cluster="$cluster$") \
      | inputlookup append=true adm_service_routes where cluster="$cluster$" AND namespace="$namespace$" \
      | `adm_boundary_filter("$namespace$")` \
      | stats values(adm_bip) AS adm_ips values(adm_npp) AS adm_nps values(adm_nip) AS adm_nodes \
      | eval search=case(isnull(adm_ips) AND isnull(adm_nps), "adm_record=adm_no_boundary_ip", \
          true(), "(".if(isnull(adm_ips), "adm_record=adm_no_boundary_ip", "client_ip IN (\"".mvjoin(adm_ips, "\",\"")."\") OR server_ip IN (\"".mvjoin(adm_ips, "\",\"")."\")") \
            .if(isnotnull(adm_nps) AND isnotnull(adm_nodes), " OR (server_ip IN (\"".mvjoin(adm_nodes, "\",\"")."\") AND server_port IN (\"".mvjoin(adm_nps, "\",\"")."\"))", "").")") \
      | fields search] \
| fields client_ip server_ip server_port \
| inputlookup append=true adm_ip_identity where (entity_kind="pod" AND cluster="$cluster$" AND namespace="$namespace$") OR ((entity_kind="k8s_node" OR entity_kind="k8s_service" OR entity_kind="k8s_node_proxy") AND cluster="$cluster$") \
| inputlookup append=true adm_service_routes where cluster="$cluster$" AND namespace="$namespace$" \
| `adm_boundary_filter("$namespace$")` \
| eventstats values(adm_bip) AS adm_bips values(adm_npp) AS adm_npps values(adm_nip) AS adm_nips values(eval(if(entity_kind=="k8s_node_proxy", ip, null()))) AS adm_infras \
| where isnull(entity_kind) AND isnull(route_uid) \
| eval adm_np=if(`adm_mv_has(adm_nips, server_ip)` AND `adm_mv_has(adm_npps, server_port)`, 1, 0), \
  adm_cb=if(`adm_mv_has(adm_bips, client_ip)`, 1, 0), adm_sb=if(`adm_mv_has(adm_bips, server_ip)` OR adm_np==1, 1, 0), \
  adm_pc=if(adm_sb==1 AND adm_cb==0 AND NOT `adm_mv_has(adm_infras, client_ip)` AND NOT `adm_mv_has(adm_nips, client_ip)` AND match(client_ip, "^[0-9a-f:.]{2,45}\z"), client_ip, null()), \
  adm_pd=if(adm_cb==1 AND adm_sb==0 AND match(server_ip, "^[0-9a-f:.]{2,45}\z"), server_ip, null()) \
| stats values(adm_bips) AS adm_bips values(adm_npps) AS adm_npps values(adm_nips) AS adm_nips values(adm_pc) AS adm_pc values(adm_pd) AS adm_pd \
| eval adm_scope_capped=if(mvcount(adm_pc)>`adm_scope_peer_limit` OR mvcount(adm_pd)>`adm_scope_peer_limit`, 1, 0), \
  adm_pc=mvindex(adm_pc, 0, `adm_scope_peer_limit`-1), adm_pd=mvindex(adm_pd, 0, `adm_scope_peer_limit`-1)
description = Shared body of adm_graph_scope_filter and adm_graph_scope_info: boundary addresses, NodePort conversations to any node of the cluster on a NodePort of the namespace, and the boundary's clients and dependencies (at most adm_scope_peer_limit each).

[adm_scope_peer_limit]
definition = 500
description = Maximum number of boundary clients and of boundary dependencies whose direct conversations (bypassing the application) are included. More are reported by a graph warning.

[adm_graph_scope_filter(2)]
args = cluster, namespace
validation = match(cluster, "^[A-Za-z0-9][A-Za-z0-9._-]{0,252}\z") AND match(namespace, "^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?\z")
errormsg = adm_graph_scope_filter expects a cluster name and a Kubernetes namespace name.
definition = `adm_graph_scope_core("$cluster$", "$namespace$")` \
| eval adm_b="\"".mvjoin(adm_bips, "\",\"")."\"", \
  adm_npc=if(isnotnull(adm_npps) AND isnotnull(adm_nips), " OR (server_ip IN (\"".mvjoin(adm_nips, "\",\"")."\") AND server_port IN (\"".mvjoin(adm_npps, "\",\"")."\"))", ""), \
  adm_peer=if(mvcount(adm_pc)>0 AND mvcount(adm_pd)>0, " OR (client_ip IN (\"".mvjoin(adm_pc, "\",\"")."\") AND server_ip IN (\"".mvjoin(adm_pd, "\",\"")."\"))", ""), \
  search=if(isnull(adm_bips) AND adm_npc=="", "adm_record=adm_no_boundary_ip", \
    "(".if(isnull(adm_bips), "adm_record=adm_no_boundary_ip", "client_ip IN (".adm_b.") OR server_ip IN (".adm_b.")").adm_npc.adm_peer.")") \
| fields search
description = Subsearch body (call as [search `adm_graph_scope_filter(cluster, namespace)`]): filter for summary rows of the boundary, NodePort conversations of the namespace on any node, and the boundary's clients (other than nodes and Envoy addresses) talking directly to its dependencies. Only IP literals and port numbers are inserted.

[adm_graph_scope_info(2)]
args = cluster, namespace
validation = match(cluster, "^[A-Za-z0-9][A-Za-z0-9._-]{0,252}\z") AND match(namespace, "^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?\z")
errormsg = adm_graph_scope_filter expects a cluster name and a Kubernetes namespace name.
definition = `adm_graph_scope_core("$cluster$", "$namespace$")` | eval adm_row="scopeinfo" | fields adm_row adm_scope_capped
description = One row (adm_row scopeinfo) telling whether the scope filter capped the boundary's clients or dependencies.

[adm_graph_inputs(4)]
args = service, environment, cluster, namespace
validation = match(service, "^[A-Za-z0-9][A-Za-z0-9._:/@-]{0,254}\z") AND match(environment, "^[A-Za-z0-9][A-Za-z0-9._-]{0,127}\z") AND match(cluster, "^[A-Za-z0-9][A-Za-z0-9._-]{0,252}\z") AND match(namespace, "^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?\z")
errormsg = Invalid graph arguments: service may contain letters, numbers and . _ : / @ - (max 255); environment letters, numbers and . _ - (max 128); cluster letters, numbers and . _ - (max 253); namespace must be a Kubernetes namespace name.
definition = (`adm_index_summary` source="adm:conversation" (adm_record="conversation" OR adm_record="hubble_xlate" OR adm_record="hubble_l7") \
    [search `adm_graph_scope_filter("$cluster$", "$namespace$")`]) \
  OR (`adm_index_traces` `adm_traces_sourcetype` ((k8s.cluster.name::$cluster$ k8s.namespace.name::$namespace$) \
    OR [search `adm_index_traces` `adm_traces_sourcetype` k8s.cluster.name::$cluster$ k8s.namespace.name::$namespace$ | dedup trace_id | head `adm_trace_limit` | fields trace_id \
        | appendpipe [| stats count | where count==0 | eval trace_id="adm-no-boundary-trace" | fields trace_id]])) \
| eval rollup_id=if(source=="adm:conversation", rollup_id, null()) \
| `adm_summary_dedup` \
| eval adm_row=case(adm_record=="conversation", "conv", adm_record=="hubble_xlate", "xlate", adm_record=="hubble_l7", "l7", true(), "span") \
| addinfo \
| eval adm_unprotected=if(adm_row!="span" AND isnull(rollup_id), 1, 0) \
| eval adm_svc_name='service.name', adm_env=coalesce('deployment.environment.name', 'deployment.environment', ""), \
  adm_cl=coalesce('k8s.cluster.name', ""), adm_ns=coalesce('k8s.namespace.name', ""), \
  adm_svc_id=if(adm_row=="span", "service:".adm_cl."/".adm_ns."/".adm_svc_name."/".adm_env, null()), \
  adm_st=tonumber(start_time)/1000000000, adm_et=tonumber(end_time)/1000000000, \
  adm_no_cluster_span=if(adm_row=="span" AND isnull('k8s.cluster.name'), 1, 0) \
| where adm_row!="span" OR (isnotnull(adm_svc_name) AND adm_et>=info_min_time AND adm_st<info_max_time) \
| eval adm_span_ref=if(adm_row=="span", span_id."~".adm_svc_id, null()) \
| eventstats values(adm_span_ref) AS adm_trace_spans by trace_id \
| eval adm_psvc=if(adm_row=="span" AND parent_span_id!="", mvindex(mvmap(adm_trace_spans, if(mvindex(split(adm_trace_spans, "~"), 0)==parent_span_id, mvindex(split(adm_trace_spans, "~"), 1), null())), 0), null()), \
  adm_bprefix="service:$cluster$/$namespace$/", \
  adm_inb=if(adm_cl=="$cluster$" AND adm_ns=="$namespace$" AND adm_env=="$environment$", 1, 0), \
  adm_pinb=if(isnotnull(adm_psvc) AND substr(adm_psvc, 1, len(adm_bprefix))==adm_bprefix AND mvindex(split(adm_psvc, "/"), -1)=="$environment$", 1, 0), \
  adm_span=if(adm_row=="span", json_object("svc", adm_svc_id, "psvc", adm_psvc, "kind", kind, "sid", span_id, "tid", trace_id, \
    "uid", 'k8s.pod.uid', "peer", `adm_ip('attributes.network.peer.address')`, "port", tonumber('attributes.server.port'), \
    "st", adm_st, "et", adm_et, "inb", adm_inb, "pinb", adm_pinb, \
    "mp", if(parent_span_id!="" AND isnull(adm_psvc), 1, 0), "root", if(adm_inb==1 AND adm_svc_name=="$service$", 1, 0)), null()), \
  adm_btrace=if(adm_row=="span" AND adm_cl=="$cluster$" AND adm_ns=="$namespace$", trace_id, null()), \
  adm_bucket=if(adm_row!="span", _time, null()), \
  adm_gk=if(adm_row=="span", "s|".trace_id."|".span_id, adm_row."|".scope."|".client_ip."|".server_ip."|".server_port."|".transport."|".adm_bucket.if(adm_row=="l7", "|".xff, "")."|".observer), \
  adm_obs=if(adm_row!="span", split(observations, "|"), null()), adm_conn_mv=if(adm_row!="span", split(conns, "|"), null()) \
| spath input=vlan_observations output=adm_vlan_contexts path={} \
| spath input=nat_observations output=adm_nat_contexts path={} \
| `adm_nat_filter_window` \
| stats sum(bytes_c2s) AS bytes_c2s sum(bytes_s2c) AS bytes_s2c sum(packets) AS packets sum(records) AS records sum(acl_permits) AS acl_permits sum(acl_drops) AS acl_drops \
    min(first_seen) AS first_seen max(last_seen) AS last_seen values(adm_obs) AS adm_observers values(flow_source) AS flow_source \
    values(direction_basis) AS adm_bases values(encapsulation) AS encapsulation values(adm_span) AS adm_span \
    values(scope) AS scope values(client_ip) AS client_ip values(server_ip) AS server_ip values(server_port) AS server_port values(transport) AS transport \
    values(observer) AS observer values(adm_btrace) AS adm_btrace max(adm_no_cluster_span) AS adm_no_cluster_span max(adm_unprotected) AS adm_unprotected \
    values(adm_conn_mv) AS adm_conns values(xlate_ip) AS xlate_ip values(xff) AS adm_xff values(adm_vlan_contexts) AS adm_vlan_contexts max(vlan_observations_truncated) AS vlan_observations_truncated \
    values(adm_nat_contexts) AS adm_nat_contexts max(nat_observations_truncated) AS adm_nat_truncated max(sampled) AS sampled max(conns_capped) AS conns_capped \
    by adm_gk adm_row \
| eval adm_ck=if(adm_row!="span", replace(adm_gk, "\|[^|]*$", ""), null()) \
| eventstats min(first_seen) AS adm_bfs max(last_seen) AS adm_bls by adm_ck \
| inputlookup append=true adm_ip_identity where entity_kind="pod" AND cluster="$cluster$" AND namespace="$namespace$" \
| eval adm_row=coalesce(adm_row, "pod") \
| inputlookup append=true adm_service_workload where cluster="$cluster$" AND namespace="$namespace$" AND environment="$environment$" \
| eval adm_row=coalesce(adm_row, "binding") \
| inputlookup append=true adm_service_backends where cluster="$cluster$" AND namespace="$namespace$" \
| eval adm_row=coalesce(adm_row, "backend") \
| inputlookup append=true adm_service_routes where cluster="$cluster$" AND namespace="$namespace$" \
| eval adm_row=coalesce(adm_row, "route") \
| append [search `adm_graph_scope_info("$cluster$", "$namespace$")`] \
| addinfo \
| eval adm_ws=floor(info_min_time), adm_we=floor(info_max_time), \
  valid_end=if(adm_row=="backend" OR adm_row=="route", coalesce(valid_to, tonumber(json_extract(desc, "ve"))), valid_end)
description = Graph stage 1: summary rows of the boundary (Hubble L7 rows kept per X-Forwarded-For client) (conversations and Hubble hand-off evidence) summed per (conversation, bucket, observer) across rollup runs; spans of traces touching the boundary with their parent's service; boundary pods; service bindings; Service backends and routes of the namespace.

[adm_graph_scope_core_v2(2)]
args = cluster, namespace
validation = match(cluster, "^[A-Za-z0-9][A-Za-z0-9._-]{0,252}\z") AND match(namespace, "^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?\z")
errormsg = adm_graph_scope_filter_v2 expects a cluster name and a Kubernetes namespace name.
definition = `adm_index_summary_v2` source="adm:conversation" adm_record="conversation" \
    [| inputlookup adm_ip_identity where (entity_kind="pod" AND cluster="$cluster$" AND namespace="$namespace$") OR ((entity_kind="k8s_node" OR entity_kind="k8s_service") AND cluster="$cluster$") \
      | inputlookup append=true adm_service_routes where cluster="$cluster$" AND namespace="$namespace$" \
      | `adm_boundary_filter("$namespace$")` \
      | stats values(adm_bip) AS adm_ips values(adm_npp) AS adm_nps values(adm_nip) AS adm_nodes \
      | eval search=case(isnull(adm_ips) AND isnull(adm_nps), "adm_record=adm_no_boundary_ip", \
          true(), "(".if(isnull(adm_ips), "adm_record=adm_no_boundary_ip", "client_ip IN (\"".mvjoin(adm_ips, "\",\"")."\") OR server_ip IN (\"".mvjoin(adm_ips, "\",\"")."\")") \
            .if(isnotnull(adm_nps) AND isnotnull(adm_nodes), " OR (server_ip IN (\"".mvjoin(adm_nodes, "\",\"")."\") AND server_port IN (\"".mvjoin(adm_nps, "\",\"")."\"))", "").")") \
      | fields search] \
| fields client_ip server_ip server_port \
| inputlookup append=true adm_ip_identity where (entity_kind="pod" AND cluster="$cluster$" AND namespace="$namespace$") OR ((entity_kind="k8s_node" OR entity_kind="k8s_service" OR entity_kind="k8s_node_proxy") AND cluster="$cluster$") \
| inputlookup append=true adm_service_routes where cluster="$cluster$" AND namespace="$namespace$" \
| `adm_boundary_filter("$namespace$")` \
| eventstats values(adm_bip) AS adm_bips values(adm_npp) AS adm_npps values(adm_nip) AS adm_nips values(eval(if(entity_kind=="k8s_node_proxy", ip, null()))) AS adm_infras \
| where isnull(entity_kind) AND isnull(route_uid) \
| eval adm_np=if(`adm_mv_has(adm_nips, server_ip)` AND `adm_mv_has(adm_npps, server_port)`, 1, 0), \
  adm_cb=if(`adm_mv_has(adm_bips, client_ip)`, 1, 0), adm_sb=if(`adm_mv_has(adm_bips, server_ip)` OR adm_np==1, 1, 0), \
  adm_pc=if(adm_sb==1 AND adm_cb==0 AND NOT `adm_mv_has(adm_infras, client_ip)` AND NOT `adm_mv_has(adm_nips, client_ip)` AND match(client_ip, "^[0-9a-f:.]{2,45}\z"), client_ip, null()), \
  adm_pd=if(adm_cb==1 AND adm_sb==0 AND match(server_ip, "^[0-9a-f:.]{2,45}\z"), server_ip, null()) \
| stats values(adm_bips) AS adm_bips values(adm_npps) AS adm_npps values(adm_nips) AS adm_nips values(adm_pc) AS adm_pc values(adm_pd) AS adm_pd \
| eval adm_scope_capped=if(mvcount(adm_pc)>`adm_scope_peer_limit` OR mvcount(adm_pd)>`adm_scope_peer_limit`, 1, 0), \
  adm_pc=mvindex(adm_pc, 0, `adm_scope_peer_limit`-1), adm_pd=mvindex(adm_pd, 0, `adm_scope_peer_limit`-1)
description = Shared body of adm_graph_scope_filter_v2 and adm_graph_scope_info: boundary addresses, NodePort conversations to any node of the cluster on a NodePort of the namespace, and the boundary's clients and dependencies (at most adm_scope_peer_limit each).

[adm_graph_scope_filter_v2(2)]
args = cluster, namespace
validation = match(cluster, "^[A-Za-z0-9][A-Za-z0-9._-]{0,252}\z") AND match(namespace, "^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?\z")
errormsg = adm_graph_scope_filter_v2 expects a cluster name and a Kubernetes namespace name.
definition = `adm_graph_scope_core_v2("$cluster$", "$namespace$")` \
| eval adm_b="\"".mvjoin(adm_bips, "\",\"")."\"", \
  adm_npc=if(isnotnull(adm_npps) AND isnotnull(adm_nips), " OR (server_ip IN (\"".mvjoin(adm_nips, "\",\"")."\") AND server_port IN (\"".mvjoin(adm_npps, "\",\"")."\"))", ""), \
  adm_peer=if(mvcount(adm_pc)>0 AND mvcount(adm_pd)>0, " OR (client_ip IN (\"".mvjoin(adm_pc, "\",\"")."\") AND server_ip IN (\"".mvjoin(adm_pd, "\",\"")."\"))", ""), \
  search=if(isnull(adm_bips) AND adm_npc=="", "adm_record=adm_no_boundary_ip", \
    "(".if(isnull(adm_bips), "adm_record=adm_no_boundary_ip", "client_ip IN (".adm_b.") OR server_ip IN (".adm_b.")").adm_npc.adm_peer.")") \
| fields search
description = Subsearch body (call as [search `adm_graph_scope_filter(cluster, namespace)`]): filter for summary rows of the boundary, NodePort conversations of the namespace on any node, and the boundary's clients (other than nodes and Envoy addresses) talking directly to its dependencies. Only IP literals and port numbers are inserted.

[adm_graph_scope_info_v2(2)]
args = cluster, namespace
validation = match(cluster, "^[A-Za-z0-9][A-Za-z0-9._-]{0,252}\z") AND match(namespace, "^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?\z")
errormsg = adm_graph_scope_info_v2 expects a cluster name and a Kubernetes namespace name.
definition = `adm_graph_scope_core_v2("$cluster$", "$namespace$")` | eval adm_row="scopeinfo" | fields adm_row adm_scope_capped
description = One row (adm_row scopeinfo) telling whether the scope filter capped the boundary's clients or dependencies.

[adm_graph_inputs_v2(4)]
args = service, environment, cluster, namespace
validation = match(service, "^[A-Za-z0-9][A-Za-z0-9._:/@-]{0,254}\z") AND match(environment, "^[A-Za-z0-9][A-Za-z0-9._-]{0,127}\z") AND match(cluster, "^[A-Za-z0-9][A-Za-z0-9._-]{0,252}\z") AND match(namespace, "^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?\z")
errormsg = Invalid graph arguments: service may contain letters, numbers and . _ : / @ - (max 255); environment letters, numbers and . _ - (max 128); cluster letters, numbers and . _ - (max 253); namespace must be a Kubernetes namespace name.
definition = (`adm_index_summary_v2` source="adm:conversation" (adm_record="conversation" OR adm_record="hubble_xlate" OR adm_record="hubble_l7") \
    [search `adm_graph_scope_filter_v2("$cluster$", "$namespace$")`]) \
  OR (`adm_index_traces` `adm_traces_sourcetype` ((k8s.cluster.name::$cluster$ k8s.namespace.name::$namespace$) \
    OR [search `adm_index_traces` `adm_traces_sourcetype` k8s.cluster.name::$cluster$ k8s.namespace.name::$namespace$ | dedup trace_id | head `adm_trace_limit` | fields trace_id \
        | appendpipe [| stats count | where count==0 | eval trace_id="adm-no-boundary-trace" | fields trace_id]])) \
| eval rollup_id=if(source=="adm:conversation", rollup_id, null()) \
| `adm_summary_dedup` \
| eval adm_row=case(adm_record=="conversation", "conv", adm_record=="hubble_xlate", "xlate", adm_record=="hubble_l7", "l7", true(), "span") \
| addinfo \
| eval adm_unprotected=if(adm_row!="span" AND isnull(rollup_id), 1, 0) \
| eval adm_svc_name='service.name', adm_env=coalesce('deployment.environment.name', 'deployment.environment', ""), \
  adm_cl=coalesce('k8s.cluster.name', ""), adm_ns=coalesce('k8s.namespace.name', ""), \
  adm_svc_id=if(adm_row=="span", "service:".adm_cl."/".adm_ns."/".adm_svc_name."/".adm_env, null()), \
  adm_st=tonumber(start_time)/1000000000, adm_et=tonumber(end_time)/1000000000, \
  adm_no_cluster_span=if(adm_row=="span" AND isnull('k8s.cluster.name'), 1, 0) \
| where adm_row!="span" OR (isnotnull(adm_svc_name) AND adm_et>=info_min_time AND adm_st<info_max_time) \
| eval adm_span_ref=if(adm_row=="span", span_id."~".adm_svc_id, null()) \
| eventstats values(adm_span_ref) AS adm_trace_spans by trace_id \
| eval adm_psvc=if(adm_row=="span" AND parent_span_id!="", mvindex(mvmap(adm_trace_spans, if(mvindex(split(adm_trace_spans, "~"), 0)==parent_span_id, mvindex(split(adm_trace_spans, "~"), 1), null())), 0), null()), \
  adm_bprefix="service:$cluster$/$namespace$/", \
  adm_inb=if(adm_cl=="$cluster$" AND adm_ns=="$namespace$" AND adm_env=="$environment$", 1, 0), \
  adm_pinb=if(isnotnull(adm_psvc) AND substr(adm_psvc, 1, len(adm_bprefix))==adm_bprefix AND mvindex(split(adm_psvc, "/"), -1)=="$environment$", 1, 0), \
  adm_span=if(adm_row=="span", json_object("svc", adm_svc_id, "psvc", adm_psvc, "kind", kind, "sid", span_id, "tid", trace_id, \
    "uid", 'k8s.pod.uid', "peer", `adm_ip('attributes.network.peer.address')`, "port", tonumber('attributes.server.port'), \
    "st", adm_st, "et", adm_et, "inb", adm_inb, "pinb", adm_pinb, \
    "mp", if(parent_span_id!="" AND isnull(adm_psvc), 1, 0), "root", if(adm_inb==1 AND adm_svc_name=="$service$", 1, 0)), null()), \
  adm_btrace=if(adm_row=="span" AND adm_cl=="$cluster$" AND adm_ns=="$namespace$", trace_id, null()), \
  adm_bucket=if(adm_row!="span", _time, null()), \
  adm_gk=if(adm_row=="span", "s|".trace_id."|".span_id, adm_row."|".scope."|".client_ip."|".server_ip."|".server_port."|".transport."|".adm_bucket.if(adm_row=="l7", "|".xff, "")."|".observer), \
  adm_obs=if(adm_row!="span", split(observations, "|"), null()), adm_conn_mv=if(adm_row!="span", split(conns, "|"), null()) \
| spath input=vlan_observations output=adm_vlan_contexts path={} \
| stats sum(bytes_c2s) AS bytes_c2s sum(bytes_s2c) AS bytes_s2c sum(packets) AS packets sum(records) AS records sum(acl_permits) AS acl_permits sum(acl_drops) AS acl_drops \
    min(first_seen) AS first_seen max(last_seen) AS last_seen values(adm_obs) AS adm_observers values(flow_source) AS flow_source \
    values(direction_basis) AS adm_bases values(encapsulation) AS encapsulation values(adm_span) AS adm_span \
    values(scope) AS scope values(client_ip) AS client_ip values(server_ip) AS server_ip values(server_port) AS server_port values(transport) AS transport \
    values(observer) AS observer values(adm_btrace) AS adm_btrace max(adm_no_cluster_span) AS adm_no_cluster_span max(adm_unprotected) AS adm_unprotected \
    values(adm_conn_mv) AS adm_conns values(xlate_ip) AS xlate_ip values(xff) AS adm_xff values(adm_vlan_contexts) AS adm_vlan_contexts max(vlan_observations_truncated) AS vlan_observations_truncated max(sampled) AS sampled max(conns_capped) AS conns_capped \
    by adm_gk adm_row \
| eval adm_ck=if(adm_row!="span", replace(adm_gk, "\|[^|]*$", ""), null()) \
| eventstats min(first_seen) AS adm_bfs max(last_seen) AS adm_bls by adm_ck \
| inputlookup append=true adm_ip_identity where entity_kind="pod" AND cluster="$cluster$" AND namespace="$namespace$" \
| eval adm_row=coalesce(adm_row, "pod") \
| inputlookup append=true adm_service_workload where cluster="$cluster$" AND namespace="$namespace$" AND environment="$environment$" \
| eval adm_row=coalesce(adm_row, "binding") \
| inputlookup append=true adm_service_backends where cluster="$cluster$" AND namespace="$namespace$" \
| eval adm_row=coalesce(adm_row, "backend") \
| inputlookup append=true adm_service_routes where cluster="$cluster$" AND namespace="$namespace$" \
| eval adm_row=coalesce(adm_row, "route") \
| append [search `adm_graph_scope_info_v2("$cluster$", "$namespace$")`] \
| addinfo \
| eval adm_ws=floor(info_min_time), adm_we=floor(info_max_time), \
  valid_end=if(adm_row=="backend" OR adm_row=="route", coalesce(valid_to, tonumber(json_extract(desc, "ve"))), valid_end)
description = Version-2 graph stage 1: summary rows of the boundary (Hubble L7 rows kept per X-Forwarded-For client) (conversations and Hubble hand-off evidence) summed per (conversation, bucket, observer) across rollup runs; spans of traces touching the boundary with their parent's service; boundary pods; service bindings; Service backends and routes of the namespace.

[adm_graph_resolve(4)]
args = service, environment, cluster, namespace
validation = match(service, "^[A-Za-z0-9][A-Za-z0-9._:/@-]{0,254}\z") AND match(environment, "^[A-Za-z0-9][A-Za-z0-9._-]{0,127}\z") AND match(cluster, "^[A-Za-z0-9][A-Za-z0-9._-]{0,252}\z") AND match(namespace, "^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?\z")
errormsg = Invalid graph arguments: service may contain letters, numbers and . _ : / @ - (max 255); environment letters, numbers and . _ - (max 128); cluster letters, numbers and . _ - (max 253); namespace must be a Kubernetes namespace name.
definition = lookup adm_ip_identity ip AS client_ip scope AS scope OUTPUT desc AS adm_c_desc \
| lookup adm_ip_identity ip AS server_ip scope AS scope OUTPUT desc AS adm_s_desc \
| eval adm_np_nodes=mvdedup(mvmap(adm_s_desc, if(json_extract(adm_s_desc, "kind")=="k8s_node" \
    AND tonumber(json_extract(adm_s_desc, "vf"))<=adm_bfs AND (isnull(tonumber(json_extract(adm_s_desc, "ve"))) OR tonumber(json_extract(adm_s_desc, "ve"))>adm_bls), \
    json_object("cluster", json_extract(adm_s_desc, "cluster"), "name", json_extract(adm_s_desc, "name")), null()))) \
| eval adm_np_cl=if(mvcount(adm_np_nodes)==1, json_extract(mvindex(adm_np_nodes, 0), "cluster"), null()), \
  adm_s_np_node=if(mvcount(adm_np_nodes)==1, json_extract(mvindex(adm_np_nodes, 0), "name"), null()), \
  adm_np_key=if(isnotnull(adm_np_cl) AND isnotnull(tonumber(server_port)), "nodeport:".adm_np_cl.":".server_port."/".transport, null()) \
| lookup adm_ip_identity ip AS adm_np_key scope AS scope OUTPUT desc AS adm_np_desc \
| eval adm_s_desc=mvappend(adm_s_desc, adm_np_desc), \
  adm_capped=if(coalesce(mvcount(adm_c_desc), 0)>=`adm_identity_max_matches` OR coalesce(mvcount(adm_s_desc), 0)>=`adm_identity_max_matches`, 1, 0) \
| `adm_resolve(c, client_ip)` \
| `adm_resolve(s, server_ip)` \
| eval adm_pod_node=if(adm_row=="pod" AND valid_from<adm_we AND (isnull(valid_end) OR valid_end>adm_ws), node, null()), \
  adm_rparent=if(adm_row=="route" AND parent_kind=="Gateway", parent_namespace."/".parent_name, null()), \
  adm_s_gkey=if(adm_s_kind=="k8s_service" AND json_extract(adm_s_best, "ownk")=="Gateway", adm_s_ns."/".json_extract(adm_s_best, "ownn"), null()) \
| eventstats values(adm_pod_node) AS adm_bnodes values(adm_rparent) AS adm_rparents \
| eval adm_c_inb=if(adm_c_kind=="pod" AND adm_c_cluster=="$cluster$" AND adm_c_ns=="$namespace$", 1, 0), \
  adm_s_inb=if(adm_s_kind=="pod" AND adm_s_cluster=="$cluster$" AND adm_s_ns=="$namespace$", 1, 0), \
  adm_s_fe_inb=if(adm_s_kind=="k8s_service" AND adm_s_cluster=="$cluster$" AND (adm_s_ns=="$namespace$" OR `adm_mv_has(adm_rparents, adm_s_gkey)`), 1, 0), \
  adm_tunnel_in=if(isnotnull(encapsulation) AND adm_c_kind=="k8s_node" AND adm_s_kind=="k8s_node" \
    AND `adm_mv_has(adm_bnodes, adm_c_name)` AND `adm_mv_has(adm_bnodes, adm_s_name)`, 1, 0), \
  adm_keep=if(adm_row=="conv" AND (adm_c_inb==1 OR adm_s_inb==1 OR adm_s_fe_inb==1 OR adm_tunnel_in==1), 1, 0), \
  adm_peer_c=if(adm_keep==1 AND (adm_s_inb==1 OR adm_s_fe_inb==1) AND adm_c_inb!=1 AND coalesce(adm_c_kind, "")!="k8s_node" AND coalesce(adm_c_kind, "")!="k8s_node_proxy", adm_c_id, null()), \
  adm_peer_s=if(adm_keep==1 AND adm_c_inb==1 AND adm_s_inb!=1 AND adm_s_fe_inb!=1, adm_s_id, null()) \
| eventstats values(adm_peer_c) AS adm_peer_cs values(adm_peer_s) AS adm_peer_ss \
| eval adm_peer=if(adm_row=="conv" AND adm_keep==0 AND `adm_mv_has(adm_peer_cs, adm_c_id)` AND `adm_mv_has(adm_peer_ss, adm_s_id)`, 1, 0), \
  adm_keep=if(adm_peer==1, 1, adm_keep), \
  adm_pkey=case(adm_row=="conv" AND adm_c_kind=="pod", "p|".adm_c_uid."|".server_ip."|".server_port, \
    adm_row=="span" AND json_extract(adm_span, "kind")=="SPAN_KIND_CLIENT" AND isnotnull(json_extract(adm_span, "peer")), \
    "p|".json_extract(adm_span, "uid")."|".json_extract(adm_span, "peer")."|".json_extract(adm_span, "port")), \
  adm_peer_span=if(adm_row=="span", json_extract(adm_span, "sid")."@".json_extract(adm_span, "st")."@".json_extract(adm_span, "et"), null()) \
| eventstats values(adm_peer_span) AS adm_peer_spans by adm_pkey \
| eval span_ids=if(adm_row=="conv", mvmap(adm_peer_spans, if(tonumber(mvindex(split(adm_peer_spans, "@"), 1))<=last_seen+1 AND tonumber(mvindex(split(adm_peer_spans, "@"), 2))>=first_seen-1, mvindex(split(adm_peer_spans, "@"), 0), null())), null())
description = Graph stage 2: resolves both sides of every (conversation, bucket, observer) row over that bucket's interval (Service frontends by IP, port and transport, NodePorts through nodeport:<cluster>:<port>/<transport>; frontends of the namespace and of Gateways its HTTPRoutes attach to are in the boundary), applies the namespace boundary (tunnel conversations only between nodes hosting boundary pods; conversations from boundary clients to boundary dependencies) and associates CLIENT spans by network.peer.address and server.port with conversations from the same pod.

[adm_handoff_dedupe]
definition = eval adm_cport=mvindex(split(adm_conns, "@"), 0), adm_cst=tonumber(mvindex(split(adm_conns, "@"), 1)), \
  adm_cen=coalesce(tonumber(mvindex(split(adm_conns, "@"), 2)), adm_cst) \
| sort 0 adm_dk adm_cport adm_cst \
| streamstats current=f max(adm_cen) AS adm_prev_en by adm_dk adm_cport \
| eval adm_newc=if(isnull(adm_prev_en) OR adm_cst>adm_prev_en+`adm_conn_gap`, 1, 0) \
| streamstats sum(adm_newc) AS adm_cidx by adm_dk adm_cport \
| eval adm_cid=adm_dk."|".adm_cport."|".adm_cidx
description = Connection dedupe over expanded adm_conns (client_port@start@end) grouped by adm_dk: records of one client port whose start is within adm_conn_gap seconds of the previous record's end are one connection (adm_cid).

# Consumption is matched to a time-qualified connection group, then applied to its original records.
# This retains re-exports while keeping later source-port reuse and different transports independent.
[adm_graph_handoffs(4)]
args = service, environment, cluster, namespace
validation = match(service, "^[A-Za-z0-9][A-Za-z0-9._:/@-]{0,254}\z") AND match(environment, "^[A-Za-z0-9][A-Za-z0-9._-]{0,127}\z") AND match(cluster, "^[A-Za-z0-9][A-Za-z0-9._-]{0,252}\z") AND match(namespace, "^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?\z")
errormsg = Invalid graph arguments: service may contain letters, numbers and . _ : / @ - (max 255); environment letters, numbers and . _ - (max 128); cluster letters, numbers and . _ - (max 253); namespace must be a Kubernetes namespace name.
definition = eval adm_route_d=if(adm_row=="route" AND valid_from<adm_we AND (isnull(valid_end) OR valid_end>adm_ws), \
    parent_kind."/".parent_namespace."/".parent_name."|".backend_namespace."/".backend_service."|".if(isnotnull(backend_port), tostring(backend_port), "name:".backend_port_name)."|".coalesce(host, "*")."|".coalesce(path, "/"), null()), \
  adm_be_d=if(adm_row=="backend" AND valid_from<adm_we AND (isnull(valid_end) OR valid_end>adm_ws), \
    namespace."/".service."|".pod_uid."|".ip."|".target_port."|".node."|".valid_from."|".coalesce(valid_end, "-")."|".coalesce(port_name, "")."|".coalesce(protocol, ""), null()), \
  adm_tun_d=if(adm_row=="conv" AND adm_c_kind=="k8s_node" AND adm_s_kind=="k8s_node" AND isnotnull(encapsulation), adm_c_name."|".adm_s_name."|".first_seen."|".last_seen, null()) \
| eventstats values(adm_route_d) AS adm_routes values(adm_be_d) AS adm_bes \
