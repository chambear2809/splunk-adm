[adm_health_network_profile_rows]
definition = inputlookup strict=true adm_network_source_scope \
| eventstats count AS adm_profile_key_rows BY mapping_key \
| eval adm_profile_record=1, adm_profile_family=case(source=="catalyst_client_snapshot" AND profile=="catalyst_client_snapshot","Catalyst source scope profiles",source=="meraki_association" AND profile=="meraki_association","Meraki source scope profiles",source=="stream_ipfix" AND profile IN ("standard_netflow","catalyst_campus_fnf","meraki_ms390_ipfix"),"Stream source scope profiles",source=="stream_ipfix" AND profile=="catalyst_sdwan_ipfix","SD-WAN source scope profiles") \
| eval name=mvappend("Version 2 source scope profiles",adm_profile_family) \
| mvexpand name \
| append [| makeresults | eval name=split("Version 2 source scope profiles,Catalyst source scope profiles,Meraki source scope profiles,Stream source scope profiles,SD-WAN source scope profiles",","), adm_profile_record=0 | mvexpand name] \
| stats sum(adm_profile_record) AS records dc(eval(if(adm_profile_record==1,mapping_key,null()))) AS mapping_keys count(eval(adm_profile_record==1 AND isnotnull(adm_profile_family) AND mapping_status=="mapped" AND tonumber(duplicate_count)==1 AND adm_profile_key_rows==1 AND len(trim(coalesce(scope,"")))>0 AND isnotnull(cluster) AND len(trim(coalesce(profile,"")))>0 AND (source!="stream_ipfix" OR source_authority==lower(trim(source_authority))))) AS mapped_records count(eval(adm_profile_record==1 AND (mapping_status=="ambiguous" OR tonumber(duplicate_count)>1 OR adm_profile_key_rows>1))) AS ambiguous_records count(eval(adm_profile_record==1 AND (mapping_status=="unmapped" OR isnull(mapping_status)))) AS unmapped_records count(eval(adm_profile_record==1 AND (mapping_status=="unsupported" OR isnull(adm_profile_family)))) AS unsupported_records BY name \
| eval kind="source", source_seen=1, incomplete_records=records-mapped_records, status=case(records==0,"no_visible_records",records!=mapping_keys OR ambiguous_records>0,"ambiguous",mapped_records!=records,"incomplete",true(),"visible"), latest_event=null(), latest_indexed=null()
description = Read-only exact-source/profile family diagnostics plus a global review row. Missing families emit zero records. Global/unclassifiable mappings do not contaminate another family's counts; conflicting rows for the same mapping key remain ambiguous in every affected family. Explicit empty cluster remains valid standalone configuration evidence, not Kubernetes correlation authority. A stream_ipfix row whose exporter authority is not lowercase and trimmed cannot match normalized IPFIX events, so it counts as incomplete until ADM - Normalize IPFIX source scope authority rewrites it.

[adm_health_sources_v2]
definition = `adm_health_sources_v1_impl` \
| append [| `adm_health_source_summary_v2`] \
| append [| `adm_health_source_traffic_v2`] \
| append [| `adm_health_source_sdwan`] \
| append [| `adm_health_network_profile_rows`] \
| eval probe_lookback_seconds=604800 \
| fields kind name status source_seen records latest_event latest_indexed max_ingest_lag contract_version probe_lookback_seconds mapping_keys mapped_records incomplete_records ambiguous_records unmapped_records unsupported_records
description = Read-only V2 source and summary-index health. The legacy source rows keep their version-one fields and status values (ok, no_visible_records, unavailable) including max_ingest_lag, because the UI reads them after cutover; V2 conversation, traffic-observation and explicitly profiled Catalyst SD-WAN rows use a seven-day indexed-receipt window. Profile rows report mapped, incomplete, ambiguous, unmapped and unsupported counts; mixed profiles never report healthy. Source/API permission, collection and checkpoint coverage remain unknown.

[adm_health_jobs]
definition = rest /servicesNS/-/splunk_adm/saved/searches splunk_server=local count=0 \
    | where match(title, "^ADM - ") \
    | rename title AS name \
    | eval kind="job", disabled=tonumber(disabled), is_scheduled=case(in(lower(tostring(is_scheduled)),"1","true"),1,in(lower(tostring(is_scheduled)),"0","false"),0,in(lower(tostring(enableSched)),"1","true"),1,in(lower(tostring(enableSched)),"0","false"),0,true(),null()), scheduler_seen=0, last_run=null(), last_success=null(), last_status=null(), failures=null(), skips=null() \
    | fields kind name disabled is_scheduled scheduler_seen last_run last_success last_status failures skips \
    | append [ search index=_internal source=*scheduler.log* app="splunk_adm" savedsearch_name="ADM -*" \
        | eval kind="job", name=savedsearch_name, scheduler_seen=1, adm_status=lower(coalesce(status, "")), last_run=_time, last_success=if(adm_status=="success", _time, null()), failures=if(match(adm_status, "^(failed|failure|error)$"), 1, 0), skips=if(adm_status=="skipped", 1, 0) \
        | stats latest(last_run) AS last_run max(last_success) AS last_success latest(adm_status) AS last_status sum(failures) AS failures sum(skips) AS skips max(scheduler_seen) AS scheduler_seen BY kind name ] \
    | stats max(disabled) AS disabled max(is_scheduled) AS is_scheduled max(scheduler_seen) AS scheduler_seen max(last_run) AS last_run max(last_success) AS last_success values(last_status) AS last_status sum(failures) AS failures sum(skips) AS skips BY kind name \
    | eval disabled=if(isnull(disabled), null(), tonumber(disabled)), status=case(isnull(disabled), "unavailable", disabled==1, "disabled", is_scheduled==0,"unscheduled", scheduler_seen!=1 OR isnull(last_run), "no_recent_run", last_status=="success", "ok", last_status=="skipped", "skipped", match(coalesce(last_status, ""), "^(failed|failure|error)$"), "failed", true(), "unknown") \
    | fields kind name disabled is_scheduled last_run last_success last_status failures skips status
description = Read-only health rows for app-scoped ADM saved searches and their scheduler activity in the caller's time range. no_recent_run is explicit when no scheduler record is visible; REST permission or job-message errors remain visible to the caller rather than being treated as healthy.

