[capability::adm_investigate]
# Dedicated investigation capability. REST handlers still recheck it per request.

[role_adm_viewer]
# Assignable Atlas reader role. metadata/default.meta grants app, view, lookup
# and KV collection read to this role instead of everyone. It grants no
# capability and imports no role or index; combine it with an existing role
# that grants search and the source/derived indexes the viewer is entitled to.
# Explicitly disable Splunk's implicit new-role defaults (collect/mcollect).
edit_own_objects = disabled
list_all_objects = disabled
run_collect = disabled
run_mcollect = disabled
schedule_rtsearch = disabled

[role_adm_investigate]
# Assignable investigator role. It grants this capability and inherits only
# adm_viewer object read; it does not import search, admin, or index rights.
# Combine it with an existing role when a non-admin investigator also needs
# source access.
# Explicitly disable Splunk's implicit new-role defaults (collect/mcollect).
importRoles = adm_viewer
adm_investigate = enabled
edit_own_objects = disabled
list_all_objects = disabled
run_collect = disabled
run_mcollect = disabled
schedule_rtsearch = disabled

[role_admin]
# Packaged overlay: every admin principal receives the capability on install.
# Splunk merges this with the built-in admin role; it does not replace it.
adm_investigate = enabled

[role_sc_admin]
# Cloud equivalent of admin. Required so sc_admin can reach the same handlers.
adm_investigate = enabled
