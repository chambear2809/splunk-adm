[capability::adm_investigate]
# Dedicated investigation capability. REST handlers still recheck it per request.

[role_adm_investigate]
# Assignable investigator role. It grants this capability only; it does not
# import search, admin, or index rights. Combine it with an existing role when
# a non-admin investigator also needs source access.
# Explicitly disable Splunk's implicit new-role defaults (collect/mcollect).
adm_investigate = enabled
edit_own_objects = disabled
list_all_objects = disabled
run_collect = disabled
run_mcollect = disabled
schedule_rtsearch = disabled

[role_admin]
# Packaged overlay: every admin principal receives the capability on install.
# Splunk merges this with the built-in admin role; it does not replace it.
adm_investigate = enabled

[role_sc_admin]
# Cloud equivalent of admin. Required so sc_admin can reach the same handlers.
adm_investigate = enabled
