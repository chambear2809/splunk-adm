[adm_ip_identity]
external_type = kvstore
collection = adm_ip_identity
fields_list = _key, ip, scope, scope_mapping_verified, entity_kind, entity_id, entity_name, cluster, namespace, owner_kind, owner_name, node, tenant, app_profile, epg, attach_device, attach_interface, mac, vm_name, valid_from, valid_to, valid_end, first_seen, last_seen, priority, source, ek, updated, desc, port, transport, service, service_uid, svc_type, traffic_policy, lb_mode, lb_mode_source, controller, owner_ref_kind, owner_ref_name, target_port, port_name, attr_vlan, attr_bridge_domain, attr_vlan_status, attr_bridge_domain_status, attr_network_history_capped, network_history
# Keep adm_identity_max_matches (macros.conf) equal to this value.
max_matches = 1000
filter = (scope!="default") OR (scope_mapping_verified=1)

