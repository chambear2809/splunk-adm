[adm_ip_identity]
external_type = kvstore
collection = adm_ip_identity
fields_list = _key, ip, scope, entity_kind, entity_id, entity_name, cluster, namespace, owner_kind, owner_name, node, tenant, app_profile, epg, attach_device, attach_interface, mac, vm_name, valid_from, valid_to, valid_end, first_seen, last_seen, priority, source, ek, updated, desc, port, transport, service, svc_type, traffic_policy, lb_mode, controller, owner_ref_kind, owner_ref_name, target_port, port_name
# Keep adm_identity_max_matches (macros.conf) equal to this value.
max_matches = 1000

[adm_service_workload]
external_type = kvstore
collection = adm_service_workload
fields_list = _key, service, environment, cluster, namespace, pod_uid, pod_name, first_seen, last_seen, updated

[adm_interfaces]
external_type = kvstore
collection = adm_interfaces
fields_list = _key, device_ip, device, ifindex, interface, neighbor, neighbor_interface, updated

[adm_service_backends]
external_type = kvstore
collection = adm_service_backends
fields_list = _key, cluster, namespace, service, slice_uid, pod_uid, pod_name, ip, node, target_port, protocol, port_name, valid_from, valid_to, first_seen, last_seen, updated, desc
max_matches = 1000

[adm_service_routes]
external_type = kvstore
collection = adm_service_routes
fields_list = _key, cluster, namespace, route_uid, route_kind, route_name, parent_kind, parent_namespace, parent_name, host, path, backend_service, backend_namespace, backend_port, valid_from, valid_to, first_seen, last_seen, updated, desc
max_matches = 1000

[adm_aci_policy]
external_type = kvstore
collection = adm_aci_policy
fields_list = _key, apic_host, dn, object_kind, tenant, class_dn, contract_dn, subject, filter_dn, action, directives, prot, d_from, d_to, s_from, s_to, tcp_rules, ether_t, subnet, subnet_scope, contract_scope, enf_pref, pref_group, name, first_seen, last_seen, updated

[adm_observer_scope]
filename = adm_observer_scope.csv
case_sensitive_match = false
