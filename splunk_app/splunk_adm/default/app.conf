[id]
name = splunk_adm
version = 0.3.0
[ui]
is_visible = 1
label = Application Atlas
supported_themes = light, dark
[launcher]
author = Splunk ADM contributors
description = Network-perspective application dependency mapping pilot built from Splunk Stream NetFlow/IPFIX, Cisco ACI and Nexus, Kubernetes and OpenTelemetry, Cilium/Hubble, Isovalent, Cisco FMC/FTD, and optional Catalyst Center and Meraki evidence.
version = 0.3.0
[package]
id = splunk_adm
check_for_updates = false
[triggers]
# The recovery action reads configuration on each invocation; no restart needed.
reload.adm_recovery = simple
# The settings endpoint reads effective configuration on every request.
reload.adm_settings = simple
