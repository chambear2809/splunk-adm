[atlas:proxy:envoy_access]
SHOULD_LINEMERGE = false
TIME_PREFIX = "start_time"\s*:\s*"
TIME_FORMAT = %s.%3N
MAX_TIMESTAMP_LOOKAHEAD = 20
TRUNCATE = 1048576

[aws:vpcflow:v5]
SHOULD_LINEMERGE = false
TIME_PREFIX = ^(?:\S+\s+){6}
TIME_FORMAT = %s
MAX_TIMESTAMP_LOOKAHEAD = 10
TRUNCATE = 10000

[adm:asset_history]
SHOULD_LINEMERGE = false
KV_MODE = json
TRUNCATE = 65536

[atlas:o11y_health]
SHOULD_LINEMERGE = false
KV_MODE = json
TRUNCATE = 65536

[atlas:o11y_detector_event]
SHOULD_LINEMERGE = false
KV_MODE = json
TRUNCATE = 65536

[adm:appdynamics_inventory]
SHOULD_LINEMERGE = false
KV_MODE = json
TRUNCATE = 65536

[atlas:thousandeyes:path]
SHOULD_LINEMERGE = false
KV_MODE = json
TRUNCATE = 65536

[adm:path:evidence:v1]
SHOULD_LINEMERGE = false
KV_MODE = json
TRUNCATE = 262144

[atlas:nxos:multicast:v1]
# One HEC JSON event per attested route/adjacency cohort. HEC envelope supplies event time.
SHOULD_LINEMERGE = false
TRUNCATE = 65536
KV_MODE = none

# Operator log written by bin/adm_log_lib to $SPLUNK_HOME/var/log/splunk and
# indexed into _internal by the platform's own monitor input.
[source::...splunk_adm.log*]
sourcetype = adm:operator

[adm:operator]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TIME_PREFIX = ^
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%3NZ
TZ = UTC
MAX_TIMESTAMP_LOOKAHEAD = 25
TRUNCATE = 4096
KV_MODE = auto
