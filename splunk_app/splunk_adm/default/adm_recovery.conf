[recovery]
# Phase 2 is deliberately disabled until an administrator opts in.
enabled = 0
# Empty means the platform CA bundle is used.  Lab or private PKI deployments
# must set an explicit CA file; certificate verification is never disabled.
management_uri = https://localhost:8089
ca_file =
initial_backlog_limit = 4
total_slot_limit = 8
slot_timeout_seconds = 120
pause_cap_seconds = 1080
action_deadline_seconds = 1260
lease_seconds = 1800
preflight_seconds = 60
cleanup_seconds = 120
manifest_count_limit = 10000

