<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Application Atlas browser test harness</title>
  </head>
  <body>
    <div id="adm-root"></div>
    <script>
      if (new URLSearchParams(location.search).has("host_simulator")) {
        document.body.className = "locale-en";
        const style = document.createElement("style");
        style.textContent = `body.locale-en { min-width: 960px; margin: 0; }
          .mock-host { display: flex; min-width: 0; }
          .mock-sidebar { flex: 0 0 136px; }
          .mock-dashboard { flex: 1; min-width: 0; }
          #atlas-root { min-width: 0; }`;
        document.head.append(style);
        const host = document.createElement("div");
        host.className = "mock-host";
        host.innerHTML =
          '<aside class="mock-sidebar"></aside><div class="mock-dashboard"><div id="atlas-root"></div></div>';
        document.body.append(host);
        host
          .querySelector("#atlas-root")
          .append(document.getElementById("adm-root"));
      }
    </script>
    <script type="module" src="/tests/browser/harness.tsx"></script>
  </body>
</html>
